# Release: publish the custosa package to npm when a version tag (v1.2.3) is pushed.
#
# - The whole CI workflow (tests, audit, OSV, pack check and the 6-way smoke matrix) runs first for
#   the tagged commit, through workflow_call; publish needs it.
# - What is published is the custosa-tarball artifact that CI built and smoke-tested in this same run, byte for byte
#   (npm publish <tgz>); nothing is installed or rebuilt in the publish job.
# - npm trusted publishing (OIDC): no NPM_TOKEN exists anywhere. The publish job alone gets id-token: write, and npm
#   exchanges the GitHub OIDC token for a short-lived publish credential tied to this repository, this workflow file
#   and the "npm" environment.
# - Provenance: the publish passes --provenance, so npm records a signed statement of the repository, commit and
#   workflow that built the tarball, shown on the package page.
# - Before publishing: the tagged commit must be on origin/main; the tag must equal "v" + package.json version,
#   which must equal npm-shrinkwrap.json's top-level version, lib/shared.json's inspectorVersion (the version the setup
#   page pins) and the tarball's own package.json version; the version must not already be on npm; and the pack check,
#   check-ruleset --self and the tarball's file list must pass.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: npm
      url: https://www.npmjs.com/package/custosa
    permissions:
      contents: read
      id-token: write
    env:
      NPM_CONFIG_FUND: "false"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tagged commit is on main
        # fetch-depth: 0 already fetched origin/main.
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on origin/main; releases are cut from main only"
            exit 1
          fi
          echo "$GITHUB_SHA is on origin/main"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: npm with trusted publishing support (11.5.1 or later)
        run: |
          npm install --global --ignore-scripts --no-audit npm@11.6.2
          npm --version
      - name: The tag matches package.json, npm-shrinkwrap.json and shared.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          wrap="$(node -p "require('./npm-shrinkwrap.json').version")"
          wrap_root="$(node -p "require('./npm-shrinkwrap.json').packages[''].version")"
          pinned="$(node -p "require('./lib/shared.json').inspectorVersion")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match package.json version $version (expected v$version)"
            exit 1
          fi
          if [ "$wrap" != "$version" ] || [ "$wrap_root" != "$version" ]; then
            echo "::error::npm-shrinkwrap.json version ($wrap, packages[\"\"] $wrap_root) does not match package.json $version"
            exit 1
          fi
          if [ "$pinned" != "$version" ]; then
            echo "::error::lib/shared.json inspectorVersion ($pinned) does not match package.json $version"
            exit 1
          fi
          echo "tag $TAG matches package.json, npm-shrinkwrap.json and shared.json ($version)"
      - name: The version is not already on npm
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::error::$name@$version is already published"
            exit 1
          fi
      - name: Pack check
        run: npm run check-pack
      - name: Rule set verifies against its own manifest
        run: npm run check-ruleset -- --self
      - name: Download the tarball CI smoke-tested
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: custosa-tarball
          path: ${{ runner.temp }}/release
      - name: The tarball is this version and holds exactly the expected files
        id: tarball
        env:
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          tgzs=("$RUNNER_TEMP"/release/*.tgz)
          if [ "${#tgzs[@]}" -ne 1 ]; then
            echo "::error::expected one tarball in the custosa-tarball artifact, found ${#tgzs[@]}"
            exit 1
          fi
          tgz="${tgzs[0]}"
          meta="$(tar -xzOf "$tgz" package/package.json)"
          name="$(node -e 'const p=JSON.parse(process.argv[1]);process.stdout.write(p.name)' "$meta")"
          version="$(node -e 'const p=JSON.parse(process.argv[1]);process.stdout.write(p.version)' "$meta")"
          if [ "$name" != "custosa" ] || [ "$TAG" != "v$version" ]; then
            echo "::error::the tarball is $name@$version, not custosa@${TAG#v}"
            exit 1
          fi
          tar -tzf "$tgz" | sed 's#^package/##' | grep -v '/$' | sort > "$RUNNER_TEMP/tar-files.txt"
          grep -v '^#' .github/pack-expected-files.txt | sed '/^$/d' | sort > "$RUNNER_TEMP/want-files.txt"
          if ! diff -u "$RUNNER_TEMP/want-files.txt" "$RUNNER_TEMP/tar-files.txt"; then
            echo "::error::the tarball's files differ from .github/pack-expected-files.txt"
            exit 1
          fi
          sha256sum "$tgz"
          echo "path=$tgz" >> "$GITHUB_OUTPUT"
      - name: Publish the tested tarball (trusted publishing, with provenance)
        # Publishing a tarball runs no package scripts; check-ruleset --self ran above instead of prepublishOnly.
        # There is deliberately no NODE_AUTH_TOKEN or NPM_TOKEN.
        env:
          TGZ: ${{ steps.tarball.outputs.path }}
        run: npm publish "$TGZ" --access public --provenance
