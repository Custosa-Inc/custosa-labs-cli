version: 2
updates:
  # The custosa package (npm-shrinkwrap.json). Exact pins stay exact; a cooldown keeps brand-new releases out.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      ast-grep:
        patterns:
          - "@ast-grep/*"

  # The workflows' actions, pinned to commit SHAs; Dependabot updates the SHA and the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
