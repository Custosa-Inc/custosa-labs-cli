# Provider secret rules (rule_bundle.md section 6). Each regex is the custosa inspector's own default pattern for that
# provider (custosa-website cli/lib/inspector/secret-patterns.mjs), source for source: a test on the website side
# checks they stay equal. Only the providers whose pattern is a plain regex with the g flag are here; the inspector's
# context-checked rules (AWS secret keys, database passwords and URLs, PEM keys, framework secrets, Supabase JWTs, the
# generic fallback) need a check this format can't carry and stay in the inspector. secret_group 1 is the pattern's
# named group `secret`.
version: 1
rules:
  - id: secrets.aws-access-key-id
    regex: '(?<![A-Z0-9])(?<secret>(?:AKIA|ASIA|ABIA|ACCA)[A-Z0-9]{16})(?![A-Z0-9])'
    secret_group: 1
    keywords: [AKIA, ASIA, ABIA, ACCA]
  - id: secrets.stripe-secret-key
    regex: '(?<![A-Za-z0-9_])(?<secret>(?:sk|rk)_live_[A-Za-z0-9]{24,247})(?![A-Za-z0-9_])'
    secret_group: 1
    keywords: [sk_live_, rk_live_]
  - id: secrets.stripe-webhook-secret
    regex: '(?<![A-Za-z0-9_])(?<secret>whsec_[A-Za-z0-9+/=]{24,128})(?![A-Za-z0-9+/=])'
    secret_group: 1
    keywords: [whsec_]
  - id: secrets.github-token
    regex: '(?<![A-Za-z0-9_])(?<secret>gh[pousr]_[A-Za-z0-9]{36,251}|github_pat_[A-Za-z0-9_]{80,244})(?![A-Za-z0-9_])'
    secret_group: 1
    keywords: [ghp_, gho_, ghu_, ghs_, ghr_, github_pat_]
  - id: secrets.gitlab-token
    regex: '(?<![A-Za-z0-9_-])(?<secret>glpat-[A-Za-z0-9_-]{20,64})(?![A-Za-z0-9_-])'
    secret_group: 1
    keywords: [glpat-]
  - id: secrets.supabase-secret-key
    regex: '(?<![A-Za-z0-9_])(?<secret>sb_secret_[A-Za-z0-9_-]{20,200})(?![A-Za-z0-9_-])'
    secret_group: 1
    keywords: [sb_secret_]
  - id: secrets.openai-api-key
    regex: '(?<![A-Za-z0-9_-])(?<secret>sk-(?:proj|svcacct|admin)-[A-Za-z0-9_-]{40,300}|sk-[A-Za-z0-9]{48})(?![A-Za-z0-9_-])'
    secret_group: 1
    keywords: [sk-]
  - id: secrets.anthropic-api-key
    regex: '(?<![A-Za-z0-9_-])(?<secret>sk-ant-[A-Za-z0-9_-]{32,300})(?![A-Za-z0-9_-])'
    secret_group: 1
    keywords: [sk-ant-]
  - id: secrets.slack-token
    regex: '(?<![A-Za-z0-9_.-])(?<secret>xox[baprs]-[0-9]{6,20}-[A-Za-z0-9-]{10,200}|xapp-[0-9]-[A-Z0-9]{8,20}-[0-9]{6,20}-[A-Za-z0-9]{20,200}|xoxe(?:\.xox[bp])?-[0-9]-[A-Za-z0-9-]{20,300})(?![A-Za-z0-9_-])'
    secret_group: 1
    keywords: [xox, xapp-]
  - id: secrets.slack-webhook-url
    regex: '(?<secret>hooks\.slack\.com\/(?:services|workflows|triggers)\/T[A-Z0-9]{6,20}\/[AB][A-Z0-9]{6,20}\/[A-Za-z0-9]{20,64})(?![A-Za-z0-9])'
    secret_group: 1
    keywords: [hooks.slack.com/]
  - id: secrets.google-api-key
    regex: '(?<![A-Za-z0-9_-])(?<secret>AIza[0-9A-Za-z_-]{35})(?![A-Za-z0-9_-])'
    secret_group: 1
    keywords: [AIza]
  - id: secrets.sendgrid-api-key
    regex: '(?<![A-Za-z0-9_-])(?<secret>SG\.[A-Za-z0-9_-]{22}\.[A-Za-z0-9_-]{43})(?![A-Za-z0-9_-])'
    secret_group: 1
    keywords: [SG.]
