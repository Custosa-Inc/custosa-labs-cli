      kind: arguments
      has:
        kind: string
        regex: ^['"`]/
  - has:
      field: arguments
      kind: arguments
      regex: ',\s*[A-Za-z_$][\w$.]*\s*,?\s*\)$'
control:
  has:
    field: arguments
    kind: arguments
    regex: (?i)[(,]\s*(no_?cache|no_?store)\w*\s*(\(\s*\))?\s*,
