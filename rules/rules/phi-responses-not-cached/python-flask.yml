# violation-shared: a data handler in a file that holds, anywhere, a literal Cache-Control with public, s-maxage or
# stale-while-revalidate, or the framework's shared-cache form (Django: also never_cache,
# cache_control(no_store=True), patch_cache_control or add_never_cache_headers; cache_page and
# cache_control(public=True) or s_maxage are shared): a shared cache may keep it, whatever middleware sends
# (T23-P1-C142). Fail.
id: phi-responses-not-cached.python-flask.violation-shared
practice_id: phi-responses-not-cached
language: python
frameworks:
- flask
kind: violation
rule:
  all:
  - kind: function_definition
    inside:
      kind: decorated_definition
      has:
        kind: decorator
        regex: ^@\w+\.(route|get|post|put|patch|delete)\(
  - any:
    - kind: function_definition
      regex: (\b(db|session|cursor|cur|conn|connection|engine)(\s*\.\s*\w+)*\s*\.\s*(execute|executemany|add|add_all|query|merge|delete|insert\w*|update\w*|scalars?|get|fetch\w*)\s*\(|\b[A-Z]\w*\.objects\b|\bget_object_or_404\s*\(|\b\w*(_service|Service|_repo|Repository|_dao|Dao|crud)\s*\.\s*\w+\s*\()
  - any:
    - inside:
        stopBy: end
        kind: module
        regex: (?is)['"]cache-control['"]\s*(\]\s*=|[,:])\s*[rbuf]*['"][^'"]*(public|s-maxage|stale-while-revalidate)
    - inside:
        stopBy: end
        kind: module
        regex: '@(\w+\.)*(method_decorator\(\s*(\w+\.)*)?cache_page\(|\b(patch_)?cache_control\([^)]*\b(public\s*=\s*True|s_maxage\s*=)|\.cache_control\s*\.\s*(public\s*=\s*True|s_maxage\s*=)'
min_engine: 0.39.0
