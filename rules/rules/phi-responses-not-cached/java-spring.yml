# violation-shared: a data handler in a file that holds, anywhere, a literal Cache-Control with public, s-maxage or
# stale-while-revalidate, or the framework's shared-cache form (also cacheControl(CacheControl.noStore());
# CacheControl...cachePublic() or sMaxAge() are shared): a shared cache may keep it, whatever middleware sends
# (T23-P1-C142). Fail.
id: phi-responses-not-cached.java-spring.violation-shared
practice_id: phi-responses-not-cached
language: java
frameworks:
- spring
kind: violation
rule:
  all:
  - kind: method_declaration
    has:
      kind: modifiers
      has:
        any:
        - kind: annotation
          regex: ^@(Get|Post|Put|Patch|Delete|Request)Mapping\b
        - kind: marker_annotation
          regex: ^@(Get|Post|Put|Patch|Delete|Request)Mapping\b
  - any:
    - kind: method_declaration
      regex: (\b(\w*[Rr]epository|\w*[Rr]epo|jdbcTemplate|jdbc|entityManager|em|dsl|jooq)\s*\.\s*(save\w*|find\w*|insert\w*|update\w*|delete\w*|query\w*|persist|merge|execute\w*|batchUpdate|select\w*)\s*\(|\b\w*(Service|Dao|Mapper)\s*\.\s*\w+\s*\()
  - any:
    - inside:
        stopBy: end
        kind: program
        regex: (?is)("cache-control"|CACHE_CONTROL)\s*,\s*"[^"]*(public|s-maxage|stale-while-revalidate)
    - inside:
        stopBy: end
        kind: program
        regex: \bCacheControl\s*\.[^;\n]*\.\s*(cachePublic|sMaxAge)\s*\(
min_engine: 0.39.0
---
# violation-writer-off: Spring Security's header writer turned off (headers().disable(), headers(h -> h.disable()),
# cacheControl(...) disabled): it removes the default no-store from every response. Fail, at the config file.
id: phi-responses-not-cached.java-spring.violation-writer-off
practice_id: phi-responses-not-cached
language: java
frameworks:
- spring
kind: violation
rule:
  any:
  - kind: method_invocation
    regex: (?s)\.\s*(headers|cacheControl)\s*\(\s*\)\s*\.\s*disable\s*\(\s*\)$
  - kind: method_invocation
    regex: (?s)\b(headers|cacheControl)\s*\(\s*(\w+\s*->\s*\w+\s*\.\s*disable\s*\(\s*\)|[\w.]+::disable)\s*\)$
min_engine: 0.39.0
