# phi-responses-not-cached (T23 B34, design v3 2.2.6, docs/b34-plan.md). Written by scripts/gen_nocache_rules.py:
# edit that script, never this file. The rule id's last part is the form (items-handler, unobserved-header,
# violation-shared, static-page). unobserved-header matches the items-handler node itself, so judge holds that item
# at its own path and line.

# items-handler: a route handler whose body makes a data call. The control is a literal Cache-Control value holding
# no-store (on Node, or private: T29-P1-C9) (also cacheControl(CacheControl.noStore()); CacheControl...cachePublic()
# or sMaxAge() are shared). No control: fail, unless unobserved-header holds it. On Next.js only a GET or HEAD route
# handler and getServerSideProps are one: a POST, PUT, PATCH or DELETE reply, a Server Action's included, isn't stored
# by a shared cache by default (T29-P1-C9). The header counts only in a response write (setHeader or addHeader on the
# response, header on a ResponseEntity builder), never in RestTemplate HttpHeaders, WebClient or OkHttp, nor in a
# comment. A no-store literal no write placed holds the item, never a fail.
id: phi-responses-not-cached.kotlin-spring.items-handler
practice_id: phi-responses-not-cached
language: kotlin
frameworks:
- spring
kind: items
rule:
  all:
  - kind: function_declaration
    has:
      kind: modifiers
      has:
        kind: annotation
        regex: ^@(Get|Post|Put|Patch|Delete|Request)Mapping\b
  - any:
    - kind: function_declaration
      regex: (\b(\w*[Rr]epository|\w*[Rr]epo|jdbcTemplate|jdbc|entityManager|em|dsl|jooq)\s*\.\s*(save\w*|find\w*|insert\w*|update\w*|delete\w*|query\w*|persist|merge|execute\w*|batchUpdate|select\w*)\s*\(|\b\w*(Service|Dao|Mapper)\s*\.\s*\w+\s*\()
control:
  any:
  - has:
      stopBy: end
      any:
      - kind: call_expression
        all:
        - has:
            kind: navigation_expression
            regex: ^(\w*[Rr]esponse|res|resp)\s*\.\s*(setHeader|addHeader)$
        - has:
            kind: call_suffix
            regex: (?is)("cache-control"|CACHE_CONTROL)\s*,\s*"[^"]*no-store
      - kind: call_expression
        all:
        - has:
            kind: navigation_expression
            regex: ^ResponseEntity\b[\s\S]*\.\s*headers?$
        - has:
            kind: call_suffix
            regex: (?is)("cache-control"|CACHE_CONTROL)\s*,\s*"[^"]*no-store
  - has:
      stopBy: end
      kind: call_expression
      regex: ^CacheControl\s*\.\s*noStore\s*\(
min_engine: 0.39.0
