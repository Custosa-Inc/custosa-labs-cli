# unobserved-header: the same handler when it writes no literal Cache-Control (also
# cacheControl(CacheControl.noStore()); CacheControl...cachePublic() or sMaxAge() are shared). The header may be set
# by middleware, a framework default or a CDN rule elsewhere, so the item is held for a person. The header counts only
# in a response write (setHeader or addHeader on the response, header on a ResponseEntity builder), never in
# RestTemplate HttpHeaders, WebClient or OkHttp, nor in a comment. A no-store literal no write placed holds the item,
# never a fail.
id: phi-responses-not-cached.kotlin-spring.unobserved-header
practice_id: phi-responses-not-cached
language: kotlin
frameworks:
- spring
kind: evidence
rule:
