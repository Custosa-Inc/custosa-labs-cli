id: ai-agent-tools-least-privilege.tsx-generic.llm-request-shape
practice_id: ai-agent-tools-least-privilege
language: tsx
frameworks:
- generic
kind: evidence
rule:
  all:
  - kind: call_expression
  - has:
      field: function
      any:
      - kind: identifier
        regex: '^(fetch|axios|\$fetch|ofetch)$'
      - kind: member_expression
        regex: '(\.post|^axios\.request)$'
  - has:
      field: arguments
      kind: arguments
      has:
        stopBy: end
        kind: object
        all:
        - has:
            any:
            - kind: shorthand_property_identifier
              regex: '^messages$'
            - kind: pair
              has:
                field: key
                any:
                - kind: property_identifier
                  regex: '^(messages)$'
                - kind: string
                  regex: '^["''](messages)["'']$'
        - has:
            any:
            - kind: shorthand_property_identifier
              regex: '^(model|tools)$'
            - kind: pair
              has:
                field: key
                any:
                - kind: property_identifier
                  regex: '^(model|tools)$'
                - kind: string
                  regex: '^["''](model|tools)["'']$'
min_engine: 0.45.3
