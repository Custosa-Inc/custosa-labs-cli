id: ai-agent-tools-least-privilege.tsx-generic.ai-provider-host
practice_id: ai-agent-tools-least-privilege
language: tsx
frameworks:
- generic
kind: evidence
rule:
  any:
  - kind: string
    regex: &id011 '(?i)(api\.openai\.com|api\.anthropic\.com|generativelanguage\.googleapis\.com|aiplatform\.googleapis\.com|\.openai\.azure\.com|bedrock-runtime\.[a-z0-9-]+\.amazonaws\.com|api\.mistral\.ai|api\.groq\.com|api\.together\.xyz|api\.cohere\.(com|ai)|api\.deepseek\.com|api\.x\.ai|api\.perplexity\.ai|api\.fireworks\.ai|openrouter\.ai/api|api-inference\.huggingface\.co|api\.replicate\.com|(localhost|127\.0\.0\.1):(11434|1234)\b|ollama[\w.-]*(:\d+)?/api/(chat|generate|embed)|https?://[\w.-]+(:\d+)?(/[\w.-]+)*/v1/(chat/completions|completions|messages|embeddings)\b)'
  - kind: template_string
    regex: *id011
min_engine: 0.45.3
---
id: ai-agent-tools-least-privilege.tsx-generic.llm-base-url
practice_id: ai-agent-tools-least-privilege
language: tsx
frameworks:
- generic
kind: evidence
rule:
  any:
  - all:
    - any:
      - kind: new_expression
        has:
          field: constructor
          kind: identifier
          regex: &id010 '^(OpenAI|AzureOpenAI|Anthropic|ChatOpenAI|ChatAnthropic|createOpenAI|createAnthropic|createOpenAICompatible|Groq|Mistral|Ollama)$'
      - kind: call_expression
        has:
          field: function
          kind: identifier
          regex: *id010
    - has:
        field: arguments
        kind: arguments
        has:
          stopBy: end
          any:
          - kind: shorthand_property_identifier
            regex: '^(baseURL|baseUrl|basePath)$'
          - kind: pair
            all:
            - has:
                field: key
                any:
                - kind: property_identifier
                  regex: '^(baseURL|baseUrl|basePath)$'
                - kind: string
                  regex: '^["''](baseURL|baseUrl|basePath)["'']$'
            - has:
                field: value
                not:
                  any:
                  - kind: string
                  - all:
                    - kind: template_string
                    - not:
                        has:
                          kind: template_substitution
  - all:
    - kind: new_expression
    - has:
        field: constructor
        kind: identifier
        regex: '^AzureOpenAI$'
    - has:
        field: arguments
        kind: arguments
        has:
          stopBy: end
          any:
          - kind: shorthand_property_identifier
            regex: '^endpoint$'
          - kind: pair
            all:
            - has:
                field: key
                any:
                - kind: property_identifier
                  regex: '^(endpoint)$'
                - kind: string
                  regex: '^["''](endpoint)["'']$'
            - has:
                field: value
                not:
                  any:
                  - kind: string
                  - all:
                    - kind: template_string
                    - not:
                        has:
                          kind: template_substitution
  - kind: member_expression
    regex: '(^|\.)env\.(OPENAI_BASE_URL|OPENAI_API_BASE|ANTHROPIC_BASE_URL|OLLAMA_HOST|AZURE_OPENAI_ENDPOINT)$'
  - kind: subscript_expression
    regex: '(^|\.)env\[\s*["''](OPENAI_BASE_URL|OPENAI_API_BASE|ANTHROPIC_BASE_URL|OLLAMA_HOST|AZURE_OPENAI_ENDPOINT)["'']\s*\]$'
min_engine: 0.45.3
