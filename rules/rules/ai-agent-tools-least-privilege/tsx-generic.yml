id: ai-agent-tools-least-privilege.tsx-generic.tool-definition
practice_id: ai-agent-tools-least-privilege
language: tsx
frameworks:
- generic
kind: items
rule:
  any:
  - all:
    - kind: call_expression
    - has:
        field: function
        kind: identifier
        regex: '^(tool|createTool|dynamicTool)$'
    - has:
        field: arguments
        kind: arguments
        has:
          kind: object
          has:
            any:
            - kind: pair
              all:
              - has:
                  field: key
                  kind: property_identifier
                  regex: '^execute$'
              - has:
                  field: value
                  any:
                  - &id001
                    kind: arrow_function
                  - &id002
                    kind: function_expression
            - kind: method_definition
              has:
                field: name
                kind: property_identifier
                regex: '^execute$'
  - all:
    - kind: call_expression
    - has:
        field: function
        kind: member_expression
        regex: '^(server|mcp|mcpServer|this\.server)\.(tool|registerTool)$'
    - has:
        field: arguments
        kind: arguments
        has:
          any:
          - *id001
          - *id002
  - all:
    - kind: new_expression
    - has:
        field: constructor
        kind: identifier
        regex: '^(DynamicStructuredTool|DynamicTool)$'
control:
  all:
  - any:
    - kind: call_expression
    - kind: new_expression
  - not:
      has:
        stopBy: end
        any:
        - kind: member_expression
          regex: '(SUPABASE_SERVICE_ROLE_KEY|SERVICE_ROLE_KEY|SUPABASE_SECRET_KEY)$'
        - kind: identifier
          regex: '^(supabaseAdmin|adminClient|serviceClient|serviceRoleClient|adminDb|supabaseService)$'
        - kind: call_expression
          has:
            field: function
            kind: identifier
            regex: '^(createAdminClient|createServiceClient|createServiceRoleClient|getAdminClient|eval|exec|execSync|spawn)$'
        - kind: call_expression
          has:
            field: function
            kind: member_expression
            regex: '\.(\$queryRawUnsafe|\$executeRawUnsafe|exec|execSync)$'
  - not:
      all:
      - inside:
          stopBy: end
          any:
          - kind: program
          - kind: statement_block
          has:
            any:
            - kind: lexical_declaration
            - kind: variable_declaration
            has:
              kind: variable_declarator
              all:
              - pattern:
                  context: 'const $ADMIN = $ADMINVALUE'
                  selector: variable_declarator
              - has:
                  field: value
                  any:
                  - kind: identifier
                    regex: '^(supabaseAdmin|adminClient|serviceClient|serviceRoleClient|adminDb|supabaseService)$'
                  - kind: call_expression
                    regex: '(SUPABASE_SERVICE_ROLE_KEY|SERVICE_ROLE_KEY|SUPABASE_SECRET_KEY)|^(createAdminClient|createServiceClient|createServiceRoleClient|getAdminClient)\('
                  - kind: member_expression
                    regex: '(SUPABASE_SERVICE_ROLE_KEY|SERVICE_ROLE_KEY|SUPABASE_SECRET_KEY)$'
      - has:
          stopBy: end
          pattern: '$ADMIN.$OP($$$OPARGS)'
  - any:
    - not:
        has:
          stopBy: end
          kind: call_expression
          has:
            field: function
            kind: member_expression
            regex: '\.(delete|insert|update|upsert|remove|destroy|post|put|patch|create|createMany|deleteMany|updateMany|executeRaw|\$executeRaw)$'
    - has:
        stopBy: end
        kind: pair
        all:
        - has:
            field: key
            kind: property_identifier
            regex: '^needsApproval$'
        - has:
            field: value
            kind: 'true'
min_engine: 0.45.3
---
id: ai-agent-tools-least-privilege.tsx-generic.elevated-in-tool
practice_id: ai-agent-tools-least-privilege
language: tsx
frameworks:
- generic
kind: violation
rule:
  all:
  - any:
    - kind: member_expression
      regex: '(SUPABASE_SERVICE_ROLE_KEY|SERVICE_ROLE_KEY|SUPABASE_SECRET_KEY)$'
    - kind: identifier
      regex: '^(supabaseAdmin|adminClient|serviceClient|serviceRoleClient|adminDb|supabaseService)$'
    - kind: call_expression
      has:
        field: function
        kind: identifier
        regex: '^(createAdminClient|createServiceClient|createServiceRoleClient|getAdminClient|eval|exec|execSync|spawn)$'
    - kind: call_expression
      has:
        field: function
        kind: member_expression
        regex: '\.(\$queryRawUnsafe|\$executeRawUnsafe)$'
  - not:
      inside:
        kind: member_expression
  - inside:
      stopBy: end
      any:
      - all:
        - kind: call_expression
        - has:
            field: function
            kind: identifier
            regex: '^(tool|createTool|dynamicTool)$'
      - all:
        - kind: call_expression
        - has:
            field: function
            kind: member_expression
            regex: '^(server|mcp|mcpServer|this\.server)\.(tool|registerTool)$'
      - all:
        - kind: new_expression
        - has:
            field: constructor
            kind: identifier
            regex: '^(DynamicStructuredTool|DynamicTool)$'
min_engine: 0.45.3
