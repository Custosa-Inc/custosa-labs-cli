id: ai-agent-tools-least-privilege.python-generic.llm-base-url
practice_id: ai-agent-tools-least-privilege
language: python
frameworks:
- generic
kind: evidence
rule:
  any:
  - all:
    - kind: call
    - has:
        field: function
        any:
        - kind: identifier
          regex: '^(OpenAI|AsyncOpenAI|AzureOpenAI|AsyncAzureOpenAI|Anthropic|AsyncAnthropic|ChatOpenAI|ChatAnthropic|ChatOllama)$'
        - kind: attribute
          regex: '\.(OpenAI|AsyncOpenAI|AzureOpenAI|AsyncAzureOpenAI|Anthropic|AsyncAnthropic|ChatOpenAI|ChatAnthropic|ChatOllama)$'
    - has:
        field: arguments
        kind: argument_list
        has:
          kind: keyword_argument
          all:
          - has:
              field: name
              kind: identifier
              regex: '^(base_url|api_base|openai_api_base|azure_endpoint)$'
          - has:
              field: value
              not:
                any:
                - all:
                  - kind: string
                  - not:
                      has:
                        kind: interpolation
                - kind: concatenated_string
  - all:
    - kind: assignment
    - has:
        field: left
        kind: attribute
        regex: '^openai\.(base_url|api_base)$'
  - all:
    - kind: call
    - has:
        field: function
        any:
        - kind: attribute
          regex: '^(os\.environ\.get|os\.getenv|environ\.get)$'
        - kind: identifier
          regex: '^getenv$'
    - has:
        field: arguments
        kind: argument_list
        has:
          kind: string
          regex: &id012 '^["''](OPENAI_BASE_URL|OPENAI_API_BASE|ANTHROPIC_BASE_URL|OLLAMA_HOST|AZURE_OPENAI_ENDPOINT)["'']$'
  - all:
    - kind: subscript
    - has:
        field: value
        any:
        - kind: attribute
          regex: '^os\.environ$'
        - kind: identifier
          regex: '^environ$'
    - has:
        field: subscript
        kind: string
        regex: *id012
min_engine: 0.45.3
---
id: ai-agent-tools-least-privilege.python-generic.llm-request-shape
practice_id: ai-agent-tools-least-privilege
language: python
frameworks:
- generic
kind: evidence
rule:
  all:
  - kind: call
  - has:
      field: function
      any:
      - kind: attribute
        regex: '(\.post|^urllib\.request\.Request)$'
      - kind: identifier
        regex: '^Request$'
  - has:
      field: arguments
      kind: argument_list
      has:
        stopBy: end
        kind: dictionary
        all:
        - has:
            kind: pair
            has:
              field: key
              kind: string
              regex: '^["'']messages["'']$'
        - has:
            kind: pair
            has:
              field: key
              kind: string
              regex: '^["''](model|tools)["'']$'
min_engine: 0.45.3
