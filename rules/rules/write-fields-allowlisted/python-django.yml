id: write-fields-allowlisted.python-django.listed-fields
practice_id: write-fields-allowlisted
language: python
frameworks:
- django
kind: evidence
rule:
  all:
  - kind: assignment
  - has:
      field: left
      kind: identifier
      regex: ^fields$
  - has:
      field: right
      any:
      - kind: list
      - kind: tuple
  - inside:
      stopBy: end
      kind: class_definition
      has:
        field: name
        kind: identifier
        regex: ^Meta$
