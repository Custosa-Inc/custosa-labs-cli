---
# A Go HTTP handler (gin, echo, fiber, net/http) that takes a request body (a bind, a decode, a form or file
# read) or is named for a write (Create..., Update..., Add..., Save..., Upload...): one item each, the entry
# point of a write. Go has no canonical allowlist shape in a handler (a bound struct names fields, but the
# write is elsewhere), so the control never matches here and the twin holds the item for a person. A
# handler with an ORM or SQL write in view (Create, Save, Updates, Exec) is no entry: the violations judge it.
# Violations (a bind into a model, Updates with a map) still fail.
id: write-fields-allowlisted.go-generic.entry
practice_id: write-fields-allowlisted
language: go
frameworks:
- generic
kind: items
rule:
  any:
  - kind: function_declaration
  - kind: method_declaration
  all:
  - has:
      kind: parameter_list
      regex: '\*gin\.Context|echo\.Context|\*fiber\.Ctx|http\.ResponseWriter'
  - any:
    - has:
        stopBy: end
        kind: call_expression
        regex: '^(\w+\.(ShouldBind|ShouldBindJSON|ShouldBindWith|ShouldBindBodyWith|Bind|BindJSON|BodyParser|FormFile|MultipartForm|PostForm|GetRawData)\(|json\.NewDecoder\(\s*\w+\.Body\s*\)\.Decode\()'
    - has:
        field: name
        any:
        - kind: identifier
          regex: '^(Create|Update|Add|Set|Patch|Upsert|Save|Import|Upload|Replace)[A-Z]'
        - kind: field_identifier
          regex: '^(Create|Update|Add|Set|Patch|Upsert|Save|Import|Upload|Replace)[A-Z]'
  - not:
      has:
        stopBy: end
        kind: call_expression
        regex: '^[\w.]*\.(Create|CreateInBatches|Save|Updates|Update|UpdateColumns|Insert|InsertOne|Exec|ExecContext)\('
control:
  kind: function_declaration
  regex: '^$'
min_engine: 0.39.0
