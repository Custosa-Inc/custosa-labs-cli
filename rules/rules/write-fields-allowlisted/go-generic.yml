      - kind: selector_expression
        regex: ^(c\.(GetString|MustGet|Get|GetInt|GetUint)\(|ctx\.Value\(|r\.Context\(\)\.Value\(|claims\.|currentUser\.|user\.(ID|Id)$|session\.|auth\.|middleware\.)
      - kind: type_assertion_expression
        regex: ^(c\.(GetString|MustGet|Get|GetInt|GetUint)\(|ctx\.Value\(|r\.Context\(\)\.Value\(|claims\.|currentUser\.|user\.(ID|Id)$|session\.|auth\.|middleware\.)
