id: write-fields-allowlisted.go-generic.denylist
practice_id: write-fields-allowlisted
language: go
frameworks:
- generic
kind: violation
rule:
  any:
  - all:
    - kind: call_expression
    - has:
        field: function
        kind: selector_expression
        regex: \.Omit$
  - all:
    - kind: call_expression
    - has:
        field: function
        kind: identifier
        regex: ^delete$
    - has:
        field: arguments
        has:
          kind: identifier
          regex: (?i)^(data|body|input|payload|values|updates|changes|fields|attrs|m)$
    - has:
        field: arguments
        has:
          kind: interpreted_string_literal
