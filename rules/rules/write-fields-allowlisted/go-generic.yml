id: write-fields-allowlisted.go-generic.bind-into-model
practice_id: write-fields-allowlisted
language: go
frameworks:
- generic
kind: violation
rule:
  all:
  - kind: call_expression
  - has:
      field: function
      kind: selector_expression
      regex: \.(ShouldBindJSON|BindJSON|ShouldBind|Bind|ShouldBindWith|BindWith|ShouldBindBodyWith|Decode)$
  - has:
      field: arguments
      has:
        pattern:
          context: func f() { g(&$V) }
          selector: unary_expression
        inside:
          stopBy: end
          any:
          - kind: function_declaration
          - kind: method_declaration
          - kind: func_literal
          has:
            stopBy: end
            any:
            - all:
              - pattern: var $V $P.$T
              - has:
                  stopBy: end
                  kind: qualified_type
                  regex: ^(models?|entit(y|ies)|domain|schema|db)\.
            - all:
              - pattern: $V := $P.$T{}
              - has:
                  stopBy: end
                  kind: qualified_type
                  regex: ^(models?|entit(y|ies)|domain|schema|db)\.
            - all:
              - pattern: $V := &$P.$T{}
              - has:
                  stopBy: end
                  kind: qualified_type
                  regex: ^(models?|entit(y|ies)|domain|schema|db)\.
  - has:
      field: arguments
      has:
        pattern:
          context: func f() { g(&$V) }
          selector: unary_expression
        inside:
          stopBy: end
          any:
          - kind: function_declaration
          - kind: method_declaration
          - kind: func_literal
          has:
            stopBy: end
            kind: call_expression
            all:
            - has:
                field: function
                kind: selector_expression
                regex: \.(Create|Save|Update|Updates|Upsert|Insert|Add|Register)\w*$
            - has:
                field: arguments
                has:
                  pattern:
                    context: func f() { g(&$V) }
                    selector: unary_expression
min_engine: 0.39.0
