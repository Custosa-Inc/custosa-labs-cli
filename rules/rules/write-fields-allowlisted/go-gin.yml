id: write-fields-allowlisted.go-gin.identity-field
practice_id: write-fields-allowlisted
language: go
frameworks:
- gin
kind: items
rule:
  all:
  - kind: keyed_element
  - has:
      kind: literal_element
      regex: ^(UserID|UserId|OwnerID|OwnerId|TenantID|TenantId|OrgID|OrganizationID|AccountID|ClinicID|ProviderID|CreatedBy|UpdatedBy|AuthorID|Role|Roles|RoleID|IsAdmin|IsStaff|Permissions)$
  - inside:
      stopBy: end
      kind: composite_literal
      has:
        field: type
        any:
        - kind: qualified_type
          regex: ^(models?|entit(y|ies)|domain|schema|db)\.
        - kind: type_identifier
control:
  has:
    kind: literal_element
    has:
      any:
      - kind: call_expression
        regex: ^(c\.(GetString|MustGet|Get|GetInt|GetUint)\(|ctx\.Value\(|r\.Context\(\)\.Value\(|claims\.|currentUser\.|user\.(ID|Id)$|session\.|auth\.|middleware\.)
      - kind: selector_expression
        regex: ^(c\.(GetString|MustGet|Get|GetInt|GetUint)\(|ctx\.Value\(|r\.Context\(\)\.Value\(|claims\.|currentUser\.|user\.(ID|Id)$|session\.|auth\.|middleware\.)
      - kind: type_assertion_expression
        regex: ^(c\.(GetString|MustGet|Get|GetInt|GetUint)\(|ctx\.Value\(|r\.Context\(\)\.Value\(|claims\.|currentUser\.|user\.(ID|Id)$|session\.|auth\.|middleware\.)
min_engine: 0.39.0
