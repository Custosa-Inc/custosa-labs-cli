id: write-fields-allowlisted.go-gin.identity-from-request
practice_id: write-fields-allowlisted
language: go
frameworks:
- gin
kind: violation
rule:
  all:
  - kind: keyed_element
  - has:
      kind: literal_element
      regex: ^(UserID|UserId|OwnerID|OwnerId|TenantID|TenantId|OrgID|OrganizationID|AccountID|ClinicID|ProviderID|CreatedBy|UpdatedBy|AuthorID|Role|Roles|RoleID|IsAdmin|IsStaff|Permissions)$
  - has:
      kind: literal_element
      has:
        kind: selector_expression
        regex: ^(req|request|body|input|payload|params|form|dto|data)\.\w+$
min_engine: 0.39.0
