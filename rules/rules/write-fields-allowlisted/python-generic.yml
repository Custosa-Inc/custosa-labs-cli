  all:
  - kind: assignment
  - has:
      field: right
      kind: call
      regex: ^fields\.Many2One\(\s*['\"](res\.user|gnuhealth\.healthprofessional|company\.employee)['\"]
  - inside:
      stopBy: end
      kind: class_definition
      has:
        field: superclasses
        kind: argument_list
        regex: \bModelSQL\b
