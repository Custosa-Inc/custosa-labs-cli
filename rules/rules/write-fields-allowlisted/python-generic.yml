id: write-fields-allowlisted.python-generic.denylist
practice_id: write-fields-allowlisted
language: python
frameworks:
- generic
kind: violation
rule:
  any:
  - all:
    - kind: call
    - has:
        field: function
        kind: attribute
        all:
        - has:
            field: attribute
            kind: identifier
            regex: ^pop$
        - has:
            field: object
            any:
            - kind: identifier
              regex: (?i)^(vals|values|vlist|data|payload|body|params|fields|attrs|validated_data|cleaned_data|update|updates|changes|record|row|item|input|form|form_data|json_data|request_data|\w+_data|\w+_vals|\w+_values|\w+_payload)$
            - kind: attribute
              regex: ^(self\.)?request\.(data|POST|json|form)$
            - kind: subscript
              regex: ^(vals|values|vlist|data)\[
    - has:
        field: arguments
        has:
          kind: string
  - all:
    - kind: delete_statement
    - has:
        kind: subscript
        all:
        - has:
            field: value
            any:
            - kind: identifier
              regex: (?i)^(vals|values|vlist|data|payload|body|params|fields|attrs|validated_data|cleaned_data|update|updates|changes|record|row|item|input|form|form_data|json_data|request_data|\w+_data|\w+_vals|\w+_values|\w+_payload)$
            - kind: subscript
              regex: ^(vals|values|vlist|data)\[
        - has:
            field: subscript
            kind: string
  - kind: dictionary_comprehension
    regex: (?s)for\s+\w+\s*,\s*\w+\s+in\s+.*\.items\(\).*\bif\s+\w+\s+not\s+in\b
min_engine: 0.39.0
