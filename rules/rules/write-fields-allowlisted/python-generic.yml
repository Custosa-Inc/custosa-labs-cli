  inside:
    stopBy: end
    kind: class_definition
    has:
      stopBy: end
      kind: function_definition
      all:
      - has:
          field: name
          kind: identifier
          regex: ^create$
      - has:
          stopBy: end
          kind: assignment
          all:
          - has:
              field: left
              kind: subscript
          - has:
              field: right
              kind: call
              regex: get_health_professional\(\)|Transaction\(\)\.user|^int\(\s*Transaction\(\)\.user
