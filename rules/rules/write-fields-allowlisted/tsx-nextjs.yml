# Next.js handlers that write to the database (a route handler, a Server Action, a pages/api handler), one item each.
# The control is a write whose data is the result of a schema parse in the same handler (zod or valibot parse or
# safeParse, used as the data, its .data, or spread into the data), where the schema keeps only its fields (no
# .passthrough(), z.any, z.record, z.unknown, catchall or .strict(false)); or a write whose data is an object literal
# naming its fields and carrying the request's values. A parse whose result is dropped, or a literal of constants (an
# audit row), is not the control. A write of the whole request body (req.body, await req.json(), Object.fromEntries of
# a form, JSON.parse of the body, or a variable holding one, directly or through a second variable, as the data or
# spread into it) is a violation. Dropping named keys (delete body.role, const { role, ...rest } = body) is a
# denylist, never the control. Whether identity fields come from the session is dataflow (needs_review).
id: write-fields-allowlisted.tsx-nextjs.write
practice_id: write-fields-allowlisted
language: tsx
frameworks: [nextjs]
kind: items
rule:
  all:
  - any:
    - kind: function_declaration
      all:
      - has:
          field: name
          kind: identifier
          regex: '^(GET|POST|PUT|PATCH|DELETE)$'
      - inside: {kind: export_statement}
    - kind: variable_declarator
      all:
      - has:
          field: name
          kind: identifier
          regex: '^(GET|POST|PUT|PATCH|DELETE)$'
      - has: {field: value, kind: arrow_function}
      - inside:
          kind: lexical_declaration
          inside: {kind: export_statement}
    - kind: function_declaration
      regex: '^async\b'
      all:
      - inside:
          kind: export_statement
          inside:
            kind: program
            has:
              kind: expression_statement
              regex: '^[''"]use server[''"]'
    - kind: function_declaration
      regex: '^async\b'
      all:
      - has:
          field: body
          kind: statement_block
          has:
            kind: expression_statement
            regex: '^[''"]use server[''"]'
    - kind: function_declaration
      all:
      - inside:
          kind: export_statement
          regex: '^export\s+default\b'
      - has:
          field: parameters
          kind: formal_parameters
          regex: '^\(\s*req\b[^,]*,\s*res\b'
  - has:
      stopBy: end
      any:
      - kind: call_expression
        pattern: '$P.$M.$OP({ $$$, data: $X })'
        has:
          field: function
          kind: member_expression
          has:
            field: property
            kind: property_identifier
            regex: '^(create|update|upsert|createMany|updateMany)$'
      - kind: call_expression
        pattern: '$P.$M.$OP({ data: $X, $$$ })'
        has:
          field: function
          kind: member_expression
          has:
            field: property
            kind: property_identifier
            regex: '^(create|update|upsert|createMany|updateMany)$'
      - pattern: '$C.from($T).insert($X)'
      - pattern: '$C.from($T).update($X)'
      - pattern: '$C.from($T).upsert($X)'
      - pattern: '$DB.insert($T).values($X)'
      - pattern: '$DB.update($T).set($X)'
      - kind: call_expression
        pattern: '$P.$M.$OP({ $$$, data })'
        has:
          field: function
          kind: member_expression
          has:
            field: property
            kind: property_identifier
            regex: '^(create|update|upsert|createMany|updateMany)$'
      - kind: call_expression
        pattern: '$P.$M.$OP({ data, $$$ })'
        has:
          field: function
          kind: member_expression
          has:
            field: property
            kind: property_identifier
            regex: '^(create|update|upsert|createMany|updateMany)$'
