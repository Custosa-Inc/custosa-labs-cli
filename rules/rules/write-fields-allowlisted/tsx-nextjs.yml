---
# A route handler taking the request body (await request.json(), request.formData()), one item each: the
# entry point of a write. The control is a strict schema parse in the handler (zod parse, safeParse,
# parseAsync). Whether the parsed fields alone reach the write, and identity from the session, is dataflow.
id: write-fields-allowlisted.tsx-nextjs.entry
practice_id: write-fields-allowlisted
language: tsx
frameworks:
- nextjs
kind: items
rule:
  all:
  - any:
    - kind: function_declaration
      all:
      - has:
          field: name
          kind: identifier
          regex: '^(GET|POST|PUT|PATCH|DELETE)$'
      - inside:
          kind: export_statement
    - kind: variable_declarator
      all:
      - has:
          field: name
          kind: identifier
          regex: '^(GET|POST|PUT|PATCH|DELETE)$'
      - has:
          field: value
          kind: arrow_function
      - inside:
          kind: lexical_declaration
          inside:
            kind: export_statement
  - has:
      stopBy: end
      kind: call_expression
      regex: '^(req|request)\.(json|formData)\(\)$'
  - not:
      has:
        stopBy: end
        any:
        - kind: call_expression
          pattern: '$P.$M.$OP({ $$$, data: $X })'
          has:
            field: function
            kind: member_expression
            has:
              field: property
              kind: property_identifier
              regex: '^(create|update|upsert|createMany|updateMany)$'
        - kind: call_expression
          pattern: '$P.$M.$OP({ data: $X, $$$ })'
          has:
            field: function
            kind: member_expression
            has:
              field: property
              kind: property_identifier
              regex: '^(create|update|upsert|createMany|updateMany)$'
        - pattern: '$C.from($T).insert($X)'
        - pattern: '$C.from($T).update($X)'
        - pattern: '$C.from($T).upsert($X)'
        - pattern: '$DB.insert($T).values($X)'
        - pattern: '$DB.update($T).set($X)'
        - kind: call_expression
          pattern: '$P.$M.$OP({ $$$, data })'
          has:
            field: function
            kind: member_expression
            has:
              field: property
              kind: property_identifier
              regex: '^(create|update|upsert|createMany|updateMany)$'
        - kind: call_expression
          pattern: '$P.$M.$OP({ data, $$$ })'
          has:
            field: function
            kind: member_expression
            has:
              field: property
              kind: property_identifier
              regex: '^(create|update|upsert|createMany|updateMany)$'
control:
  has:
    stopBy: end
    any:
    - kind: call_expression
      pattern: '$S.parse($$$)'
      not:
        kind: call_expression
        regex: '^JSON\.'
    - kind: call_expression
      pattern: '$S.parseAsync($$$)'
      not:
        kind: call_expression
        regex: '^JSON\.'
    - kind: call_expression
      pattern: '$S.safeParse($$$)'
      not:
        kind: call_expression
        regex: '^JSON\.'
    - kind: call_expression
      pattern: '$S.safeParseAsync($$$)'
      not:
        kind: call_expression
        regex: '^JSON\.'
min_engine: 0.39.0
