id: write-fields-allowlisted.php-generic.body-into-write
practice_id: write-fields-allowlisted
language: php
frameworks:
- generic
kind: violation
rule:
  any:
  - all:
    - &id001
      any:
      - kind: member_call_expression
        has:
          field: name
          kind: name
          regex: ^(insert|update|create|save|store|post|put|patch|replace|upsert|sqlInsert|buildInsertColumns|buildUpdateColumns|fill|forceFill|forceCreate|updateOrCreate|firstOrCreate)$
      - kind: scoped_call_expression
        has:
          field: name
          kind: name
          regex: ^(insert|update|create|save|store|post|put|patch|replace|upsert|sqlInsert|buildInsertColumns|buildUpdateColumns|fill|forceFill|forceCreate|updateOrCreate|firstOrCreate)$
      - kind: function_call_expression
        has:
          field: function
          kind: name
          regex: ^(insert|update|create|save|store|post|put|patch|replace|upsert|sqlInsert|buildInsertColumns|buildUpdateColumns|fill|forceFill|forceCreate|updateOrCreate|firstOrCreate)$
    - has:
        field: arguments
        has:
          kind: argument
          has:
            any:
            - kind: variable_name
              regex: ^\$_(POST|REQUEST|GET)$
            - kind: function_call_expression
              regex: php://input
            - kind: cast_expression
              regex: php://input|\$_(POST|REQUEST)
            - kind: member_call_expression
              regex: ^\$(request|req)->(all|input|post|json|getParsedBody|toArray)\(\)$
  - all:
    - *id001
    - has:
        field: arguments
        has:
          kind: argument
          has:
            pattern:
              context: <?php f($D);
              selector: variable_name
            inside:
              stopBy: end
              any:
              - kind: function_definition
              - kind: method_declaration
              - kind: anonymous_function
              - kind: arrow_function
              has:
                stopBy: end
                all:
                - pattern:
                    context: <?php $D = $X;
                    selector: assignment_expression
                - has:
                    field: right
                    any:
                    - kind: cast_expression
                      regex: php://input|\$_(POST|REQUEST)
                    - kind: function_call_expression
                      regex: php://input|\$_(POST|REQUEST)
                    - kind: variable_name
                      regex: ^\$_(POST|REQUEST)$
                    - kind: member_call_expression
                      regex: ^\$(request|req)->(all|input|post|json|getParsedBody|toArray)\(\)$
min_engine: 0.39.0
