id: write-fields-allowlisted.php-generic.denylist
practice_id: write-fields-allowlisted
language: php
frameworks:
- generic
kind: violation
rule:
  any:
  - all:
    - kind: unset_statement
    - has:
        kind: subscript_expression
        all:
        - has:
            kind: string
        - has:
            kind: variable_name
            regex: (?i)^\$(data|body|input|vals|values|fields|post|payload|attributes|attrs|record|row|update|updates|changes|patient|params_to_save|_POST|_REQUEST)$
  - all:
    - kind: member_call_expression
      regex: ^\$(request|req|input)->except\(
  - all:
    - kind: function_call_expression
      regex: ^(array_diff_key|Arr::except)\(
  - all:
    - kind: scoped_call_expression
      regex: ^Arr::except\(
min_engine: 0.39.0
