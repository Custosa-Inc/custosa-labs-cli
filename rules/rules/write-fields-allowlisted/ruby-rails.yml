id: write-fields-allowlisted.ruby-rails.strong-params
practice_id: write-fields-allowlisted
language: ruby
frameworks:
- rails
kind: evidence
rule:
  all:
  - kind: call
    regex: ^params\.require\(:\w+\)\.permit\(
  - not:
      has:
        field: arguments
        has:
          kind: simple_symbol
          regex: ^:(user|user_id|owner|owner_id|tenant|tenant_id|org_id|organization_id|account_id|clinic_id|provider_id|created_by|updated_by|author_id|role|roles|role_id|admin|is_admin|staff)$
min_engine: 0.39.0
