rule:
  any:
  - kind: call
    regex: ^params(\.require\([^)]*\))?(\.permit(!|\([^)]*\)))?\.except\(
  - kind: call
    regex: '^(params\[[^\]]+\]|\w+_params)\.delete\(:'
