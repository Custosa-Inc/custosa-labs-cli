---
# A POST, PUT or PATCH route registration (path string or array; handler inline, wrapped or by name), one
# item each: the entry point of a write. The control is a strict schema check of req.body in the inline or
# wrapped handler (zod parse or safeParse, Joi validate). A handler by name has its body elsewhere.
id: write-fields-allowlisted.typescript-express.entry
practice_id: write-fields-allowlisted
language: typescript
frameworks:
- express
kind: items
rule:
  kind: call_expression
  all:
  - has:
      field: function
      kind: member_expression
      has:
        field: property
        kind: property_identifier
        regex: '^(post|put|patch)$'
  - has:
      field: arguments
      kind: arguments
      has:
        any:
        - kind: string
          regex: '^[''\"`]/'
        - kind: array
          has:
            kind: string
            regex: '^[''\"`]/'
  - not:
      has:
        stopBy: end
        kind: call_expression
        not:
          inside:
            kind: member_expression
            field: object
            regex: '\.(values|set)$'
        has:
          field: function
          kind: member_expression
          all:
          - any:
            - has:
                field: property
                kind: property_identifier
                regex: '^(create|createMany|update|updateMany|upsert|insert|insertMany|values|save|findByIdAndUpdate|findOneAndUpdate|updateOne|bulkCreate|replaceOne)$'
            - all:  # Drizzle: db.update(t).set(data) (T27-P1-C60 F3.3)
              - has:
                  field: property
                  kind: property_identifier
                  regex: '^set$'
              - has:
                  field: object
                  kind: call_expression
                  has:
                    field: function
                    kind: member_expression
                    has:
                      field: property
                      kind: property_identifier
                      regex: '^update$'
          - not:
              has:
                field: object
                kind: identifier
                regex: '^(Object|crypto|hash|hmac|cipher|decipher|md|sha|digest|Reflect|JSON|Math|Array|Promise|pdf|doc|jsPDF|workbook|wb|zip|canvas|ctx|image|img|localStorage|sessionStorage|cache|history|editor)$'
          - not:
              has:
                field: object
                stopBy: end
                kind: call_expression
                has:
                  field: function
                  any:
                  - kind: identifier
                    regex: '(createHash|createHmac|createCipheriv|createDecipheriv|createSign|createVerify)$'
                  - kind: member_expression
                    regex: '(createHash|createHmac|createCipheriv|createDecipheriv|createSign|createVerify)$'
control:
  has:
    field: arguments
    kind: arguments
    has:
      any:
      - any:
        - kind: arrow_function
        - kind: function_expression
        has:
          stopBy: end
          any:
          - pattern: '$S.parse(req.body)'
          - pattern: '$S.parse(request.body)'
          - pattern: '$S.parseAsync(req.body)'
          - pattern: '$S.parseAsync(request.body)'
          - pattern: '$S.safeParse(req.body)'
          - pattern: '$S.safeParse(request.body)'
          - pattern: '$S.safeParseAsync(req.body)'
          - pattern: '$S.safeParseAsync(request.body)'
          - pattern: '$S.validate(req.body)'
          - pattern: '$S.validate(request.body)'
          - pattern: '$S.validateAsync(req.body)'
          - pattern: '$S.validateAsync(request.body)'
      - kind: call_expression
        has:
          field: arguments
          kind: arguments
          has:
            any:
            - kind: arrow_function
            - kind: function_expression
            has:
              stopBy: end
              any:
              - pattern: '$S.parse(req.body)'
              - pattern: '$S.parse(request.body)'
              - pattern: '$S.parseAsync(req.body)'
              - pattern: '$S.parseAsync(request.body)'
              - pattern: '$S.safeParse(req.body)'
              - pattern: '$S.safeParse(request.body)'
              - pattern: '$S.safeParseAsync(req.body)'
              - pattern: '$S.safeParseAsync(request.body)'
              - pattern: '$S.validate(req.body)'
              - pattern: '$S.validate(request.body)'
              - pattern: '$S.validateAsync(req.body)'
              - pattern: '$S.validateAsync(request.body)'
min_engine: 0.39.0
