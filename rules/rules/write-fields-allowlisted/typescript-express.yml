id: write-fields-allowlisted.typescript-express.write
practice_id: write-fields-allowlisted
language: typescript
frameworks:
- express
kind: items
rule:
  kind: call_expression
  not:
    inside:
      kind: member_expression
      field: object
      regex: \.(values|set)$
  has:
    field: function
    kind: member_expression
    all:
    - any:
      - has:
          field: property
          kind: property_identifier
          regex: ^(create|createMany|update|updateMany|upsert|insert|insertMany|values|save|findByIdAndUpdate|findOneAndUpdate|updateOne|bulkCreate|replaceOne)$
      - all:  # Drizzle: db.update(t).set(data) (T27-P1-C60 F3.3)
        - has:
            field: property
            kind: property_identifier
            regex: ^set$
        - has:
            field: object
            kind: call_expression
            has:
              field: function
              kind: member_expression
              has:
                field: property
                kind: property_identifier
                regex: ^update$
    - not:
        has:
          field: object
          kind: identifier
          regex: ^(Object|crypto|hash|hmac|cipher|decipher|md|sha|digest|Reflect|JSON|Math|Array|Promise|pdf|doc|jsPDF|workbook|wb|zip|canvas|ctx|image|img|localStorage|sessionStorage|cache|history|editor)$
    - not:
        has:
          field: object
          stopBy: end
          kind: call_expression
          has:
            field: function
            any:
            - kind: identifier
              regex: (createHash|createHmac|createCipheriv|createDecipheriv|createSign|createVerify)$
            - kind: member_expression
              regex: (createHash|createHmac|createCipheriv|createDecipheriv|createSign|createVerify)$
control:
  any:
  - all:
    - has:
        field: arguments
        has:
          stopBy: end
          kind: object
    - not:
        has:
          field: arguments
          has:
            stopBy: end
            kind: shorthand_property_identifier
            regex: ^(data|values|set|update|create|attributes)$
    - not:
        has:
          field: arguments
          has:
            stopBy: end
            kind: spread_element
            not:
              has: &id001
                any:
                - pattern: $SCHEMA.parse($$$)
                - pattern: $SCHEMA.parseAsync($$$)
    - not:
        has:
          field: arguments
          has:
            any:
            - all:
              - kind: identifier
              - not:
                  kind: identifier
                  regex: ^(id|ID|uuid|[A-Za-z0-9]*(Id|ID|_id|_ID)|where|filter|query|opts|options)$
            - all:
              - kind: member_expression
              - not:
                  kind: member_expression
                  regex: \.(id|ID|uuid|[A-Za-z0-9]*(Id|ID|_id|_ID))$
            - kind: call_expression
            - kind: await_expression
            - kind: as_expression
            - kind: satisfies_expression
            - kind: non_null_expression
            - kind: array
              has:
                any:
                - kind: identifier
                - kind: member_expression
                - kind: subscript_expression
                - kind: call_expression
                - kind: await_expression
                - kind: spread_element
                - kind: parenthesized_expression
                - kind: ternary_expression
                - kind: binary_expression
                - kind: new_expression
                - kind: array
                - kind: as_expression
                - kind: satisfies_expression
                - kind: non_null_expression
    - not:
        has:
          field: arguments
          has:
            stopBy: end
            kind: pair
            all:
            - has:
                field: key
                any:
                - kind: property_identifier
                  regex: ^['\"]?(data|values|set|update|\$set|create|attributes)['\"]?$
                - kind: string
                  regex: ^['\"]?(data|values|set|update|\$set|create|attributes)['\"]?$
            - not:
                has:
                  field: value
                  any:
                  - kind: object
                  - all:
                    - kind: array
                    - not:
                        has:
                          any:
                          - kind: identifier
                          - kind: member_expression
                          - kind: subscript_expression
                          - kind: call_expression
                          - kind: await_expression
                          - kind: spread_element
                          - kind: parenthesized_expression
                          - kind: ternary_expression
                          - kind: binary_expression
                          - kind: new_expression
                          - kind: array
                          - kind: as_expression
                          - kind: satisfies_expression
                          - kind: non_null_expression
                  - *id001
  - has:
      field: arguments
      has: *id001
  - all:
    - pattern: '$M.$W({ $$$A, data: $D })'
    - inside:
        stopBy: end
        any: &id002
        - kind: arrow_function
        - kind: function_declaration
        - kind: function_expression
        - kind: method_definition
        has:
          stopBy: end
          all:
          - any:
            - pattern: const $D = $S.parse($$$P)
            - pattern: const $D = await $S.parseAsync($$$P)
            - pattern: const $D = $S.safeParse($$$P).data
            - pattern: const $D = $S.validateSync($$$P)
          - not:
              kind: lexical_declaration
              regex: passthrough\(|catchall\(|unknown\(\s*true|(?-u:\b)any\(\)|z\.record\(
  - all:
    - pattern: '$M.$W({ $$$A, data: $D, $$$B })'
    - inside:
        stopBy: end
        any: *id002
        has:
          stopBy: end
          all:
          - any:
            - pattern: const $D = $S.parse($$$P)
            - pattern: const $D = await $S.parseAsync($$$P)
            - pattern: const $D = $S.safeParse($$$P).data
            - pattern: const $D = $S.validateSync($$$P)
          - not:
              kind: lexical_declaration
              regex: passthrough\(|catchall\(|unknown\(\s*true|(?-u:\b)any\(\)|z\.record\(
  - all:
    - pattern: $M.$W($D)
    - inside:
        stopBy: end
        any: *id002
        has:
          stopBy: end
          all:
          - any:
            - pattern: const $D = $S.parse($$$P)
            - pattern: const $D = await $S.parseAsync($$$P)
            - pattern: const $D = $S.safeParse($$$P).data
            - pattern: const $D = $S.validateSync($$$P)
          - not:
              kind: lexical_declaration
              regex: passthrough\(|catchall\(|unknown\(\s*true|(?-u:\b)any\(\)|z\.record\(
  - all:
    - pattern: $M.$W($ID, $D)
    - inside:
        stopBy: end
        any: *id002
        has:
          stopBy: end
          all:
          - any:
            - pattern: const $D = $S.parse($$$P)
            - pattern: const $D = await $S.parseAsync($$$P)
            - pattern: const $D = $S.safeParse($$$P).data
            - pattern: const $D = $S.validateSync($$$P)
          - not:
              kind: lexical_declaration
              regex: passthrough\(|catchall\(|unknown\(\s*true|(?-u:\b)any\(\)|z\.record\(
