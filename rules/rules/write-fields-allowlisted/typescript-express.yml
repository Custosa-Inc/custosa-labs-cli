id: write-fields-allowlisted.typescript-express.denylist
practice_id: write-fields-allowlisted
language: typescript
frameworks:
- express
kind: violation
rule:
  any:
  - all:
    - kind: unary_expression
      regex: ^delete\s
    - has:
        any:
        - kind: member_expression
          regex: ^((req|request)\.body|(body|raw|form|post|data|input|payload|values|vals|fields|updates|changes|dto|attrs|params|patch|update|json|formData))(\.[0-9A-Za-z_]+|\[)
        - kind: subscript_expression
          regex: ^((req|request)\.body|(body|raw|form|post|data|input|payload|values|vals|fields|updates|changes|dto|attrs|params|patch|update|json|formData))\[
        - kind: parenthesized_expression
          regex: ^\(\s*((req|request)\.body|(body|raw|form|post|data|input|payload|values|vals|fields|updates|changes|dto|attrs|params|patch|update|json|formData))
  - pattern: Reflect.deleteProperty($OBJ, $$$)
  - pattern: omit($OBJ, $$$)
  - pattern: _.omit($OBJ, $$$)
  - pattern: lodash.omit($OBJ, $$$)
  - pattern: $SCHEMA.omit($$$)
  - all:
    - kind: variable_declarator
    - has:
        field: name
        kind: object_pattern
        has:
          kind: rest_pattern
    - has:
        field: value
        any:
        - kind: member_expression
          regex: ^(req|request)\.(body|query)$
        - kind: await_expression
          regex: ^await\s+(req|request)\.(json|formData)\(\)
        - kind: identifier
          regex: ^(body|raw|form|post|data|input|payload|values|vals|fields|updates|changes|dto|attrs|params|patch|update|json|formData)$
min_engine: 0.39.0
