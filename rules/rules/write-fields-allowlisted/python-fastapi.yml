id: write-fields-allowlisted.python-fastapi.body-into-write
practice_id: write-fields-allowlisted
language: python
frameworks:
- fastapi
kind: violation
rule:
  any:
  - all:
    - pattern: $M(**$D)
    - inside:
        stopBy: end
        kind: function_definition
        has:
          stopBy: end
          any:
          - pattern: $D = await request.json()
          - pattern: $D = await request.form()
  - all:
    - pattern: $M.create(**$D)
    - inside:
        stopBy: end
        kind: function_definition
        has:
          stopBy: end
          any:
          - pattern: $D = await request.json()
          - pattern: $D = await request.form()
  - all:
    - pattern: $M.objects.create(**$D)
    - inside:
        stopBy: end
        kind: function_definition
        has:
          stopBy: end
          any:
          - pattern: $D = await request.json()
          - pattern: $D = await request.form()
  - all:
    - pattern: $M.update(**$D)
    - inside:
        stopBy: end
        kind: function_definition
        has:
          stopBy: end
          any:
          - pattern: $D = await request.json()
          - pattern: $D = await request.form()
  - all:
    - pattern: $M.query.filter_by($$$).update($D)
    - inside:
        stopBy: end
        kind: function_definition
        has:
          stopBy: end
          any:
          - pattern: $D = await request.json()
          - pattern: $D = await request.form()
min_engine: 0.39.0
