id: write-fields-allowlisted.python-fastapi.extra-allowed
practice_id: write-fields-allowlisted
language: python
frameworks:
- fastapi
kind: violation
rule:
  any:
  - all:
    - kind: keyword_argument
    - has:
        field: name
        kind: identifier
        regex: ^extra$
    - has:
        field: value
        any:
        - kind: string
          regex: ^['\"]allow['\"]$
        - kind: attribute
          regex: ^Extra\.allow$
  - all:
    - kind: assignment
    - has:
        field: left
        kind: identifier
        regex: ^extra$
    - has:
        field: right
        any:
        - kind: string
          regex: ^['\"]allow['\"]$
        - kind: attribute
          regex: ^Extra\.allow$
min_engine: 0.39.0
