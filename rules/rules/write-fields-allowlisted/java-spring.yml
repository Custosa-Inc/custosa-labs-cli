id: write-fields-allowlisted.java-spring.copy-all
practice_id: write-fields-allowlisted
language: java
frameworks:
- spring
kind: violation
rule:
  any:
  - pattern: BeanUtils.copyProperties($SRC, $DST)
  - pattern: BeanUtils.copyProperties($SRC, $DST, $$$IGNORED)
  - pattern: $MAPPER.readerForUpdating($E)
  - pattern: $BINDER.setDisallowedFields($$$)
min_engine: 0.39.0
---
id: write-fields-allowlisted.java-spring.allowed-fields
practice_id: write-fields-allowlisted
language: java
frameworks:
- spring
kind: evidence
rule:
  pattern: $BINDER.setAllowedFields($$$)
min_engine: 0.39.0
