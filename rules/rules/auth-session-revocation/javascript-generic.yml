id: auth-session-revocation.javascript-generic.signout-server
practice_id: auth-session-revocation
language: javascript
frameworks:
- generic
kind: evidence
rule:
  all:
  - not:
      regex: ^(await\s+)?(this\.)?(?i:mock|fake|stub|spy)\w*\.
      kind: call_expression
  - any:
    - all:
      - pattern: $SB.auth.signOut($$$)
      - regex: ^(\(\s*await\s+)?(this\.)?([A-Za-z0-9_]*[sS]upabase[A-Za-z0-9_]*|sb|create[A-Za-z]*Client\([^)]*\))\)?\.auth\.signOut\(
    - all:
      - pattern: $REQ.session.destroy($$$)
      - regex: ^(req|request|ctx\.req|ctx)\.session\.destroy\(
    - all:
      - pattern: $REQ.logout($$$)
      - regex: ^(req|request|ctx\.req)\.logout\(
    - all:
      - kind: call_expression
      - has:
          field: function
          kind: member_expression
          regex: \.(session|sessions|Session|userSession|refreshToken|refreshTokens|token|tokens)\.delete$
      - has:
          field: arguments
          kind: arguments
          regex: '^\(\s*\{\s*where\s*:'
    - all:
      - kind: call_expression
      - has:
          field: function
          kind: member_expression
          regex: \.(session|sessions|Session|userSession|refreshToken|refreshTokens)\.deleteMany$
      - has:
          field: arguments
          kind: arguments
          regex: \b(id|sessionId|session_id|token|tokenHash|jti)\s*[:,}]
    - all:
      - kind: call_expression
      - has:
          field: function
          any:
          - kind: member_expression
            regex: \.(revokeToken|revokeRefreshToken|revokeSession|invalidateSession|destroySession)$
          - kind: identifier
            regex: ^(revokeToken|revokeRefreshToken|revokeSession|invalidateSession|destroySession)$
min_engine: 0.39.0
