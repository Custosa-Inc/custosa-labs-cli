id: auth-session-revocation.php-generic.signout-server
practice_id: auth-session-revocation
language: php
frameworks:
- generic
kind: evidence
rule:
  any:
  - kind: member_call_expression
    regex: ^(Auth::logout\(\)|auth\(\)->logout\(\)|\$request->session\(\)->invalidate\(\)|session_destroy\(\)|\$\w+->currentAccessToken\(\)->delete\(\)|SessionUtil::\w*(destroy|logout)\w*\()
  - kind: scoped_call_expression
    regex: ^(Auth::logout\(\)|auth\(\)->logout\(\)|\$request->session\(\)->invalidate\(\)|session_destroy\(\)|\$\w+->currentAccessToken\(\)->delete\(\)|SessionUtil::\w*(destroy|logout)\w*\()
  - kind: function_call_expression
    regex: ^(Auth::logout\(\)|auth\(\)->logout\(\)|\$request->session\(\)->invalidate\(\)|session_destroy\(\)|\$\w+->currentAccessToken\(\)->delete\(\)|SessionUtil::\w*(destroy|logout)\w*\()
