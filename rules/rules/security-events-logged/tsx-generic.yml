      field: arguments
      kind: arguments
      has:
        stopBy: end
        kind: pair
        has:
          field: key
          kind: property_identifier
          regex: '^(role|roles|role_?[iI]ds?|is_?admin|isAdmin|permissions|is_?staff)$'
        # T29-P1-C405: a role key the call reads back or filters on (select, include, where) is not a write
        not:
          inside:
            stopBy:
              kind: arguments
            kind: pair
            has:
              field: key
              kind: property_identifier
              regex: '^(select|include|where|orderBy|omit|_count)$'
