id: security-events-logged.go-generic.denial
practice_id: security-events-logged
language: go
frameworks:
- generic
kind: items
rule:
  all:
  - any:
    - kind: expression_statement
    - kind: return_statement
  - has:
      stopBy:
        any:
        - kind: block
        - kind: func_literal
      kind: call_expression
      regex: '(?-u)(StatusUnauthorized|StatusForbidden|\b401\b|\b403\b)'
control:
  all:
  - any:
    - kind: expression_statement
    - kind: return_statement
  - any:
    - follows: &id001
        kind: expression_statement
        regex: '^[\w.]*(?i)(audit|security_?events?|log_?security|record_?security|log_?denied|record_?denied|log_?access_?denied)\w*\s*\('
        not:
          any:
          - kind: expression_statement
            regex: '^[\w.:@>$-]*(?i)(skip|disable|without|bypass|noaudit|no_audit)'
          - kind: expression_statement
            regex: '^(?:await\s+)?[\w.$>:@-]*[.>:](find\w*|count\w*|aggregate|is\w+|set\w*|clear|remove\w*|disable\w*|toString|get\w*|exists\??)\s*[(\s]'
    - follows:
        any:
        - &id002
          kind: expression_statement
        - &id003
          kind: comment
        - &id004
          kind: if_statement
        - &id005
          kind: short_var_declaration
        - &id006
          kind: assignment_statement
        follows: *id001
    - follows:
        any:
        - *id002
        - *id003
        - *id004
        - *id005
        - *id006
        follows:
          any:
          - *id002
          - *id003
          - *id004
          - *id005
          - *id006
          follows: *id001
min_engine: 0.45.3
