id: security-events-logged.python-generic.denial
practice_id: security-events-logged
language: python
frameworks:
- generic
kind: items
rule:
  all:
  - any:
    - kind: raise_statement
    - kind: return_statement
    - kind: expression_statement
  - has:
      stopBy:
        any:
        - kind: block
        - kind: lambda
      any:
      - kind: call
        regex: '(?-u)^(HttpResponseForbidden|PermissionDenied|Forbidden|Unauthorized|NotAuthenticated)\b'
      # T29-P1-C295 cause 2: an HTTPException is a denial unless its status is an error that is no access decision
      # (400, 402, 405, 409, 413, 415, 422 or 5xx). 401, 403, a 404 that hides a record, and a status the rule
      # can't read stay denials. HttpResponseNotAllowed (405) is a wrong method, not a denial.
      # T29-P1-C310 items 8 to 10: the status is read as a whole node (the first positional argument, or the value of
      # status_code=), and only a plain literal of such a status exempts the call; a conditional, a name or text in the
      # detail does not. A call whose text names an access decision stays a denial whatever its status.
      - kind: call
        regex: '(?-u)^HTTPException\b'
        not:
          all:
          - has:
              field: arguments
              has:
                any:
                - any:
                  - kind: integer
                    regex: '^(5\d\d|40[0259]|41[35]|422)$'
                  - kind: attribute
                    regex: '^status\.HTTP_(5\d\d|40[0259]|41[35]|422)_\w*$'
                  - kind: identifier
                    regex: '^HTTP_(5\d\d|40[0259]|41[35]|422)_\w*$'
                  follows:
                    stopBy: neighbor
                    not:
                      follows:
                        stopBy: neighbor
                        any:
                        - kind: comment
                        - not:
                            kind: comment
                - kind: keyword_argument
                  all:
                  - has:
                      field: name
                      kind: identifier
                      regex: '^status_code$'
                  - has:
                      field: value
                      any:
                      - kind: integer
                        regex: '^(5\d\d|40[0259]|41[35]|422)$'
                      - kind: attribute
                        regex: '^status\.HTTP_(5\d\d|40[0259]|41[35]|422)_\w*$'
                      - kind: identifier
                        regex: '^HTTP_(5\d\d|40[0259]|41[35]|422)_\w*$'
          - not:
              kind: call
              regex: '(?i)permission|privilege|forbidden|not (allowed|authori[sz]ed|permitted)|unauthori[sz]ed|access denied|\bdenied\b'
      - kind: call
        regex: '(?-u)^(abort|flask\.abort)\(\s*(401|403)\b'
      - kind: identifier
        regex: '^(PermissionDenied|HttpResponseForbidden|NotAuthenticated)$'
      - kind: keyword_argument
        regex: '(?-u)^(status_code|status)\s*=\s*(401|403|status\.HTTP_40[13]_\w+)$'
control:
  all:
  - any:
    - kind: raise_statement
    - kind: return_statement
    - kind: expression_statement
  - any:
    - follows: &id001
        kind: expression_statement
        regex: '^(await\s+)?(self\.)?[\w.]*(?i)(audit|security_?events?|log_?security|record_?security|log_?denied|record_?denied|log_?access_?denied)\w*\s*[.(]'
        not:
          any:
          - kind: expression_statement
            regex: '^[\w.:@>$-]*(?i)(skip|disable|without|bypass|noaudit|no_audit)'
          - kind: expression_statement
            regex: '^(?:await\s+)?[\w.$>:@-]*[.>:](find\w*|count\w*|aggregate|is\w+|set\w*|clear|remove\w*|disable\w*|toString|get\w*|exists\??)\s*[(\s]'
    - follows:
        any:
        - &id002
          kind: expression_statement
        - &id003
          kind: comment
        - &id004
          kind: if_statement
        follows: *id001
    - follows:
        any:
        - *id002
        - *id003
        - *id004
        follows:
          any:
          - *id002
          - *id003
          - *id004
          follows: *id001
min_engine: 0.45.3
