id: security-events-logged.python-generic.denial
practice_id: security-events-logged
language: python
frameworks:
- generic
kind: items
rule:
  all:
  - any:
    - kind: raise_statement
    - kind: return_statement
    - kind: expression_statement
  - has:
      stopBy:
        any:
        - kind: block
        - kind: lambda
      any:
      - kind: call
        regex: '(?-u)^(HttpResponseForbidden|PermissionDenied|Forbidden|Unauthorized|NotAuthenticated)\b'
      # T29-P1-C295 cause 2: an HTTPException is a denial unless its status is an error that is no access decision
      # (400, 402, 405, 409, 413, 415, 422 or 5xx). 401, 403, a 404 that hides a record, and a status the rule
      # can't read stay denials. HttpResponseNotAllowed (405) is a wrong method, not a denial.
      # T29-P1-C310 items 8 to 10: the status is read as a whole node (the first positional argument, or the value of
      # status_code=), and only a plain literal of such a status exempts the call; a conditional, a name or text in the
      # detail does not. A call whose text names an access decision stays a denial whatever its status.
      - kind: call
        regex: '(?-u)^HTTPException\b'
        not:
          all:
          - has:
              field: arguments
              has:
                any:
                - any:
                  - kind: integer
                    regex: '^(5\d\d|40[0259]|41[35]|422)$'
                  - kind: attribute
                    regex: '^status\.HTTP_(5\d\d|40[0259]|41[35]|422)_\w*$'
                  - kind: identifier
                    regex: '^HTTP_(5\d\d|40[0259]|41[35]|422)_\w*$'
                  follows:
                    stopBy: neighbor
                    not:
                      follows:
                        stopBy: neighbor
                        any:
                        - kind: comment
                        - not:
                            kind: comment
                - kind: keyword_argument
                  all:
                  - has:
                      field: name
                      kind: identifier
                      regex: '^status_code$'
                  - has:
                      field: value
                      any:
                      - kind: integer
                        regex: '^(5\d\d|40[0259]|41[35]|422)$'
                      - kind: attribute
                        regex: '^status\.HTTP_(5\d\d|40[0259]|41[35]|422)_\w*$'
                      - kind: identifier
                        regex: '^HTTP_(5\d\d|40[0259]|41[35]|422)_\w*$'
          - not:
              kind: call
              regex: '(?i)permission|privilege|forbidden|not (allowed|authori[sz]ed|permitted)|unauthori[sz]ed|access denied|\bdenied\b'
      - kind: call
        regex: '(?-u)^(abort|flask\.abort)\(\s*(401|403)\b'
      - kind: identifier
        regex: '^(PermissionDenied|HttpResponseForbidden|NotAuthenticated)$'
      - kind: keyword_argument
        regex: '(?-u)^(status_code|status)\s*=\s*(401|403|status\.HTTP_40[13]_\w+)$'
control:
  all:
  - any:
    - kind: raise_statement
    - kind: return_statement
    - kind: expression_statement
  - any:
    - follows: &id001
        kind: expression_statement
        regex: '^(await\s+)?(self\.)?[\w.]*(?i)(audit|security_?events?|log_?security|record_?security|log_?denied|record_?denied|log_?access_?denied)\w*\s*[.(]'
        not:
          any:
          - kind: expression_statement
            regex: '^[\w.:@>$-]*(?i)(skip|disable|without|bypass|noaudit|no_audit)'
          - kind: expression_statement
            regex: '^(?:await\s+)?[\w.$>:@-]*[.>:](find\w*|count\w*|aggregate|is\w+|set\w*|clear|remove\w*|disable\w*|toString|get\w*|exists\??)\s*[(\s]'
    - follows:
        any:
        - &id002
          kind: expression_statement
        - &id003
          kind: comment
        - &id004
          kind: if_statement
        follows: *id001
    - follows:
        any:
        - *id002
        - *id003
        - *id004
        follows:
          any:
          - *id002
          - *id003
          - *id004
          follows: *id001
min_engine: 0.45.3
---
# T29 (T29-P1-C441, security events slice 3, group D): a failed sign-in kept only in memory or in a plain log is an
# item. The item is a function that records a failed sign-in, by its name (a verb such as record, register, log, track,
# increment, count or handle joined to failed, failure, bad or invalid and to login, signin, logon, attempt, auth or
# password: _record_failed_attempt, register_failed_login), or form_invalid on a class whose base names a LoginView
# (Django's LoginView answers a wrong password through it). Its line is the def. The control is a security event or
# audit write anywhere in its body (security_events.emit(...), AuditLog.objects.create(...)). A plain logger call or a
# counter is no control. A name with no sign-in word (record_failure) is no item. Its fails hold
# (evaluate.CODE_READ_HOLD_RULES): a Django user_login_failed receiver in another file can write the event.
# T29-P1-C449 (security events slice 4, P2 C508 lows): the sign-in word may also come first (record_login_failure),
# and a trailing _attempt or _attempts may follow (log_failed_login_attempt). The control is a call that writes: a
# write verb (create, log, emit, record, write, add, save, insert, send, publish, track) in the called name after the
# audit or security event word (AuditLog.objects.create, audit.record), or log, record, emit, write, create or add
# joined before it (log_security_event, record_audit_event). audit_counter.increment() is no control.
id: security-events-logged.python-generic.failed-sign-in
practice_id: security-events-logged
language: python
frameworks:
- generic
kind: items
rule:
  kind: function_definition
  any:
  - has:
      field: name
      kind: identifier
      regex: '(?i)^_*(record|register|log|track|increment|inc|note|count|add|bump|handle|on)_?((failed|failure|bad|invalid)_?(login|log_in|signin|sign_in|logon|attempt|auth|authentication|password)s?|(login|log_in|signin|sign_in|logon|auth|authentication|password)_?(failed|failures?|bad|invalid))(_?attempts?)?$'
  - all:
    - has:
        field: name
        kind: identifier
        regex: ^form_invalid$
    - inside:
        stopBy: end
        kind: class_definition
        has:
          field: superclasses
          kind: argument_list
          regex: '(?-u)\b\w*Login(View|FormView)\b'
control:
  has:
    field: body
    kind: block
    has:
      stopBy: end
      kind: call
      regex: '^(await\s+)?(self\.)?[\w.]*(?i)((audit|security_?events?)([\w.]*[._])?(create|log|emit|record|write|add|save|insert|send|publish|track)\w*|(log|record|emit|write|create|add)_?(audit|security)(_?(log|event|entry|trail|record)s?)?)\s*\('
      # T29 (P2 C535 low): a called name whose last part starts with a read verb (getAuditLogs, get_audit_logs,
      # exportAuditLogs) reads the audit log; "Log" in it is no write verb.
      not:
        any:
        - kind: call
          regex: '^(await\s+)?(self\.)?(\w+\.)*(?i:get|fetch|list|find|read|load|query|search|export|count|select|retrieve|download)\w*\s*\('
        # T29 (T29-P1-C467, P2 C574 F7; T29-P1-C470, P2 C587 L5): an audit counter, metric, gauge, count, total or stats
        # writes no event, whatever its verb
        - kind: call
          regex: '^(await\s+)?(self\.)?[\w.]*(?i)(audit|security_?events?)\w*((counter|metric|gauge|histogram|meter)s?|(_c|(?-i:C))ounts?|(_t|(?-i:T))otals?|(_s|(?-i:S))tats?)\b'
        # T29 (T29-P1-C470, P2 C587 L5): a called name ending in Report builds a report (auditReportService.createReport), no event
        - kind: call
          regex: '^(await\s+)?(self\.)?[\w.]*(?i)reports?\s*\('
min_engine: 0.45.3
