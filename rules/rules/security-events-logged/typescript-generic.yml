id: security-events-logged.typescript-generic.denial
practice_id: security-events-logged
language: typescript
frameworks:
- generic
kind: items
rule:
  all:
  - any:
    - kind: return_statement
    - kind: throw_statement
    - kind: expression_statement
  - has:
      stopBy:
        any:
        - kind: statement_block
        - kind: arrow_function
        - kind: function_expression
      any:
      - kind: call_expression
        regex: '^[\w.]*\.(sendStatus|status|writeHead)\(\s*(401|403|[\w.]*(FORBIDDEN|UNAUTHORIZED|Forbidden|Unauthorized)\w*)\s*[,)]'
      - kind: new_expression
        regex: '(?-u)^new\s+(ForbiddenException|UnauthorizedException|ForbiddenError|UnauthorizedError|AuthorizationError)\b'
      - kind: pair
        regex: '^status\s*:\s*(401|403|[\w.]*(FORBIDDEN|UNAUTHORIZED|Forbidden|Unauthorized)\w*)$'
control:
  all:
  - any:
    - kind: return_statement
    - kind: throw_statement
    - kind: expression_statement
  - any:
    - follows: &id001
        kind: expression_statement
        regex: '(?-u)^(await\s+)?(this\.)?[\w.]*(?i-u)(audit|security_?events?|log_?security|record_?security|log_?denied|record_?denied|log_?access_?denied)\w*\s*[.(]'
        not:
          any:
          - kind: expression_statement
            regex: '^(await\s+)?(this\.)?[\w.]*(?i-u)(skip|disable|without|bypass|noaudit|no_audit)'
          - kind: expression_statement
            regex: '(?-u)\.(find\w*|count\w*|aggregate|groupBy|is\w+|set\w*|clear|remove\w*|disable\w*|toString|get\w*|list\w*)\s*\('
    - follows:
        any:
        - &id002
          kind: expression_statement
        - &id003
          kind: lexical_declaration
        - &id004
          kind: variable_declaration
        - &id005
          kind: comment
        - &id006
          kind: if_statement
        follows: *id001
    - follows:
        any:
        - *id002
        - *id003
        - *id004
        - *id005
        - *id006
        follows:
          any:
          - *id002
          - *id003
          - *id004
          - *id005
          - *id006
          follows: *id001
    - follows:
        any:
        - *id002
        - *id003
        - *id004
        - *id005
        - *id006
        follows:
          any:
          - *id002
          - *id003
          - *id004
          - *id005
          - *id006
          follows:
            any:
            - *id002
            - *id003
            - *id004
            - *id005
            - *id006
            follows: *id001
min_engine: 0.45.3
