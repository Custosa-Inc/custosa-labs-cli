id: security-events-logged.java-generic.denial
practice_id: security-events-logged
language: java
frameworks:
- generic
kind: items
rule:
  all:
  - any:
    - kind: throw_statement
    - kind: return_statement
    - kind: expression_statement
  - has:
      stopBy:
        any:
        - kind: block
        - kind: lambda_expression
      any:
      - kind: object_creation_expression
        regex: '^new\s+(AccessDeniedException|ForbiddenException|NotAuthorizedException|AuthorizationDeniedException|ResponseStatusException\s*\(\s*HttpStatus\.(FORBIDDEN|UNAUTHORIZED))'
      - kind: method_invocation
        regex: '(?-u)(HttpStatus\.(FORBIDDEN|UNAUTHORIZED)|SC_FORBIDDEN|SC_UNAUTHORIZED|sendError\s*\(\s*40[13]\b|status\s*\(\s*40[13]\b)'
control:
  all:
  - any:
    - kind: throw_statement
    - kind: return_statement
    - kind: expression_statement
  - any:
    - follows: &id001
        kind: expression_statement
        regex: '^(this\.)?[\w.]*(?i)(audit|security_?events?|log_?security|record_?security|log_?denied|record_?denied|log_?access_?denied)\w*\s*[.(]'
        not:
          any:
          - kind: expression_statement
            regex: '^[\w.:@>$-]*(?i)(skip|disable|without|bypass|noaudit|no_audit)'
          - kind: expression_statement
            regex: '^(?:await\s+)?[\w.$>:@-]*[.>:](find\w*|count\w*|aggregate|is\w+|set\w*|clear|remove\w*|disable\w*|toString|get\w*|exists\??)\s*[(\s]'
    - follows:
        any:
        - &id002
          kind: expression_statement
        - &id003
          kind: line_comment
        - &id004
          kind: block_comment
        - &id005
          kind: local_variable_declaration
        - &id006
          kind: if_statement
        follows: *id001
    - follows:
        any:
        - *id002
        - *id003
        - *id004
        - *id005
        - *id006
        follows:
          any:
          - *id002
          - *id003
          - *id004
          - *id005
          - *id006
          follows: *id001
min_engine: 0.45.3
---
# T29-P1-C449 (security events slice 4, group C): a route that exports data is an item: a method whose
# @GetMapping, @PostMapping or @RequestMapping path holds export (/export/csv, /patients/exportAll). Its line is the
# method's first annotation. The control is an @...Audit... annotation on it, or a call in its body that writes a
# security event or audit (auditService.logExport, auditLogRepository.save, securityEventPublisher.publishEvent). A
# class-level mapping is not read. Its fails hold (evaluate.CODE_READ_HOLD_RULES): the service it calls can write it.
id: security-events-logged.java-generic.data-export
practice_id: security-events-logged
language: java
frameworks:
- generic
kind: items
rule:
  kind: method_declaration
  has:
    kind: modifiers
    regex: '@(Get|Post|Request)Mapping\s*\([^)]*"[^"]*\b(?i:export)'
control:
  any:
  # T29 (T29-P1-C467, P2 C574 F6): an opt-out annotation (@NotAudited, @SkipAudit, @AuditDisabled) is no audit
  - has:
      kind: modifiers
      has:
        any:
        - kind: marker_annotation
          regex: '(?-u)^@\w*(?i:audit)\w*\b'
          not:
            kind: marker_annotation
            regex: '(?i)^@((not|no|skip|without|disable|exclude|ignore)_?audit|\w*audit\w*(disabled?|skip|ignored?|excluded?)\b)'
        - kind: annotation
          regex: '(?-u)^@\w*(?i:audit)\w*\b'
          not:
            kind: annotation
            regex: '(?i)^@((not|no|skip|without|disable|exclude|ignore)_?audit|\w*audit\w*(disabled?|skip|ignored?|excluded?)\b)'
  - has:
      field: body
      has:
        stopBy: end
        kind: method_invocation
        regex: '^(this\.)?[\w.]*(?i)((audit|security_?events?)([\w.]*[._])?(create|log|emit|record|write|add|save|insert|send|publish|track)\w*|(log|record|emit|write|create|add|publish)_?(audit|security)(_?(log|event|entry|trail|record)s?)?)\s*\('
        # T29 (P2 C535 low): a called name whose last part starts with a read verb (getAuditLogs, get_audit_logs,
        # exportAuditLogs) reads the audit log; "Log" in it is no write verb.
        not:
          any:
          - kind: method_invocation
            regex: '^(this\.)?(\w+\.)*(?i:get|fetch|list|find|read|load|query|search|export|count|select|retrieve|download)\w*\s*\('
          # T29 (T29-P1-C467, P2 C574 F7): an audit counter, metric or gauge writes no event, whatever its verb
          - kind: method_invocation
            regex: '^(this\.)?[\w.]*(?i)(audit|security_?events?)\w*(counter|metric|gauge|histogram|meter)s?\b'
min_engine: 0.45.3
