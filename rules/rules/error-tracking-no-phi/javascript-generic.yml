id: error-tracking-no-phi.javascript-generic.sentry-init
practice_id: error-tracking-no-phi
language: javascript
frameworks:
- generic
kind: items
rule:
  any:
  - all:
    - kind: call_expression
    - has:
        field: function
        kind: member_expression
        regex: '^Sentry\.init$'
  - all:
    - kind: call_expression
    - has:
        field: function
        kind: identifier
        regex: '^init$'
    - inside:
        stopBy: end
        kind: program
        has:
          kind: import_statement
          regex: '\binit\b[\s\S]*from\s+[''\x22]@sentry/'
control:
  all:
  - kind: call_expression
  - has:
      field: arguments
      kind: arguments
      has:
        kind: object
        all:
        - has:
            any:
            - kind: pair
              all:
              - has:
                  field: key
                  kind: property_identifier
                  regex: '^beforeSend$'
              - has:
                  field: value
                  any:
                  - kind: arrow_function
                  - kind: function_expression
                  - kind: identifier
                  - kind: member_expression
                  not:
                    any:
                    - pattern: '($E1) => $E1'
                    - pattern: '$E2 => $E2'
                    - pattern: '($E3, $H3) => $E3'
                    - pattern: 'function ($E4) { return $E4; }'
                    - pattern: 'function ($E5, $H5) { return $E5; }'
            - kind: method_definition
              has:
                field: name
                kind: property_identifier
                regex: '^beforeSend$'
            - kind: shorthand_property_identifier
              regex: '^beforeSend$'
        - not:
            has:
              kind: spread_element
  - not:
      has:
        stopBy: end
        kind: pair
        any:
        - all:
          - has:
              field: key
              kind: property_identifier
              regex: '^(sendDefaultPii|includeLocalVariables)$'
          - has:
              field: value
              any:
              - &id001
                kind: 'true'
              - &id002
                kind: unary_expression
                regex: '(?-u)^!\s*(false|0)$'
        - all:
          - has:
              field: key
              kind: property_identifier
              regex: '^(maskAllText|maskAllInputs|blockAllMedia)$'
          - has:
              field: value
              any:
              - kind: 'false'
              - kind: unary_expression
                regex: '(?-u)^!\s*(true|1)$'
        - all:
          - has:
              field: key
              kind: property_identifier
              regex: '^(unmask|unblock)$'
          - has:
              field: value
              kind: array
              has:
                kind: string
        - all:
          - has:
              field: key
              kind: property_identifier
              regex: '^(userInfo|cookies|urlQueryParams|databaseQueryData|stackFrameVariables|genAIInputs|genAIOutputs|inputs|outputs|headers)$'
          - has:
              field: value
              any:
              - *id001
              - *id002
          - inside:
              kind: object
              inside:
                kind: pair
                has:
                  field: key
                  kind: property_identifier
                  regex: '^(dataCollection|genAI)$'
        - all:
          - has:
              field: key
              kind: property_identifier
              regex: '^httpBodies$'
          - has:
              field: value
              kind: array
              has:
                kind: string
          - inside:
              kind: object
              inside:
                kind: pair
                has:
                  field: key
                  kind: property_identifier
                  regex: '^dataCollection$'
min_engine: 0.45.3
