id: error-tracking-no-phi.javascript-generic.rum-privacy
practice_id: error-tracking-no-phi
language: javascript
frameworks:
- generic
kind: violation
rule:
  all:
  - kind: pair
  - has:
      field: key
      kind: property_identifier
      regex: '^defaultPrivacyLevel$'
  - has:
      field: value
      kind: string
