# scripts/gen_notification_rules.py: don't edit. The practice is capped at needs_review.
id: notification-content-minimal.tsx-generic.send
practice_id: notification-content-minimal
language: tsx
frameworks:
- generic
kind: evidence
rule:
  kind: call_expression
  any:
  - has:
      field: function
      any:
      - kind: identifier
        regex: ^(Notifications\s*\.\s*)?scheduleNotificationAsync$|(^|\.)\s*messaging\s*\(\s*\)\s*\.\s*(send|sendEach|sendMulticast|sendEachForMulticast)$|^[\w$]+\s*\.\s*emails\s*\.\s*send$|^(sgMail|sendgrid|mail)\s*\.\s*(send|sendMultiple)$|^[\w$]*(postmark|Postmark)[\w$]*\s*\.\s*sendEmail(WithTemplate)?$|^[\w$]*[tT]wilio[\w$]*\s*\.\s*messages\s*\.\s*create$|^[\w$]*(transport|transporter|mailer|Transport|Transporter|Mailer)\s*\.\s*sendMail$|(^|\.)\s*getMessaging\s*\([^)]*\)\s*\.\s*(send|sendEach|sendMulticast|sendEachForMulticast)$
      - kind: member_expression
        regex: ^(Notifications\s*\.\s*)?scheduleNotificationAsync$|(^|\.)\s*messaging\s*\(\s*\)\s*\.\s*(send|sendEach|sendMulticast|sendEachForMulticast)$|^[\w$]+\s*\.\s*emails\s*\.\s*send$|^(sgMail|sendgrid|mail)\s*\.\s*(send|sendMultiple)$|^[\w$]*(postmark|Postmark)[\w$]*\s*\.\s*sendEmail(WithTemplate)?$|^[\w$]*[tT]wilio[\w$]*\s*\.\s*messages\s*\.\s*create$|^[\w$]*(transport|transporter|mailer|Transport|Transporter|Mailer)\s*\.\s*sendMail$|(^|\.)\s*getMessaging\s*\([^)]*\)\s*\.\s*(send|sendEach|sendMulticast|sendEachForMulticast)$
  - all:
    - has:
        field: function
        kind: member_expression
        regex: \.\s*messages\s*\.\s*create$
    - inside:
        stopBy: end
        kind: program
        has:
          stopBy: end
          any:
          - kind: import_statement
            has:
              field: source
              kind: string
              regex: ^[\"']twilio(/[\w./-]+)?[\"']$
          - kind: call_expression
            regex: ^require\s*\(\s*[\"']twilio(/[\w./-]+)?[\"']\s*\)$
  - all:
    - has:
        field: function
        kind: member_expression
        regex: ^[\w$]*[mM]essaging[\w$]*\s*\.\s*(send|sendEach|sendMulticast|sendEachForMulticast)$
    - inside:
        stopBy: end
        kind: program
        has:
          stopBy: end
          any:
          - kind: import_statement
            has:
              field: source
              kind: string
              regex: ^[\"']firebase-admin(/[\w./-]+)?[\"']$
          - kind: call_expression
            regex: ^require\s*\(\s*[\"']firebase-admin(/[\w./-]+)?[\"']\s*\)$
  - all:
    - has:
        field: function
        kind: member_expression
        regex: \.\s*sendMail$
    - inside:
        stopBy: end
        kind: program
        has:
          stopBy: end
          any:
          - kind: import_statement
            has:
              field: source
              kind: string
              regex: ^[\"']nodemailer(/[\w./-]+)?[\"']$
          - kind: call_expression
            regex: ^require\s*\(\s*[\"']nodemailer(/[\w./-]+)?[\"']\s*\)$
  - all:
    - has:
        field: function
        kind: member_expression
        pattern: $M.$SEND
        regex: ^[\w$]+\s*\.\s*(send|sendEach|sendMulticast|sendEachForMulticast)$
    - inside:
        stopBy: end
        kind: program
        has:
          stopBy: end
          any:
          - pattern: const $M = getMessaging($$$)
          - pattern: const $M = admin.messaging($$$)
          - pattern: const $M = firebase.messaging($$$)
          - pattern: let $M = getMessaging($$$)
          - pattern: let $M = admin.messaging($$$)
          - pattern: let $M = firebase.messaging($$$)
          - pattern: var $M = getMessaging($$$)
          - pattern: var $M = admin.messaging($$$)
          - pattern: var $M = firebase.messaging($$$)
