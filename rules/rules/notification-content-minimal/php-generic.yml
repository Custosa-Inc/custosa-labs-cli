    - kind: encapsed_string
      has:
        stopBy: end
        kind: name
        regex: ^(?i:\w*(diagnos|condition|medication|prescription|dosage|lab_?results?|test_?results?|results?_?value|reason_?for_?visit|appointment_?reason|visit_?reason|procedure|medical_?record_?number|date_?of_?birth)\w*|(get_?)?(mrn|dob|ssn))$
    - kind: binary_expression
      regex: \.
      all:
      - has:
          any:
          - kind: encapsed_string
          - kind: string
      - has:
          stopBy: end
          kind: name
          regex: ^(?i:\w*(diagnos|condition|medication|prescription|dosage|lab_?results?|test_?results?|results?_?value|reason_?for_?visit|appointment_?reason|visit_?reason|procedure|medical_?record_?number|date_?of_?birth)\w*|(get_?)?(mrn|dob|ssn))$
    - kind: function_call_expression
      all:
      - has:
          field: function
          kind: name
          regex: ^v?sprintf$
      - has:
          field: arguments
          has:
            stopBy: end
            kind: name
            regex: ^(?i:\w*(diagnos|condition|medication|prescription|dosage|lab_?results?|test_?results?|results?_?value|reason_?for_?visit|appointment_?reason|visit_?reason|procedure|medical_?record_?number|date_?of_?birth)\w*|(get_?)?(mrn|dob|ssn))$
    inside:
      stopBy: end
      any:
      - kind: arguments
        inside: &id001
          any:
          - kind: member_call_expression
            has:
              field: name
              kind: name
              regex: ^(subject|line|greeting|salutation|introLines|outroLines)$
          - kind: function_call_expression
            has:
              field: function
              kind: name
              regex: ^mail$
      - &id002
        kind: array_element_initializer
        has:
          any:
          - kind: string
            regex: ^['\"](?i:body)['\"]$
          - kind: encapsed_string
            regex: ^['\"](?i:body)['\"]$
        inside:
          stopBy: end
          kind: arguments
          inside:
            kind: member_call_expression
            all:
            - has:
                field: name
                kind: name
                regex: ^create$
            - has:
                field: object
                kind: member_access_expression
                regex: ->\s*messages$
            - inside:
                stopBy: end
                kind: program
                has:
                  kind: namespace_use_declaration
                  regex: \bTwilio\\
  - kind: member_access_expression
    has:
      field: name
      kind: name
      regex: ^(?i:\w*(diagnos|condition|medication|prescription|dosage|lab_?results?|test_?results?|results?_?value|reason_?for_?visit|appointment_?reason|visit_?reason|procedure|medical_?record_?number|date_?of_?birth)\w*|(get_?)?(mrn|dob|ssn))$
    inside:
      any:
      - kind: argument
        inside:
          kind: arguments
          inside: *id001
      - *id002
min_engine: 0.39.0
