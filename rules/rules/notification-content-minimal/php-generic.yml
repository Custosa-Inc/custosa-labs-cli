# Patient values in push, email and SMS content (T23 B56d). Written by
# scripts/gen_notification_rules.py: don't edit. The practice is capped at needs_review.
id: notification-content-minimal.php-generic.send
practice_id: notification-content-minimal
language: php
frameworks:
- generic
kind: evidence
rule:
  any:
  - kind: member_call_expression
    all:
    - has:
        field: name
        kind: name
        regex: ^create$
    - has:
        field: object
        kind: member_access_expression
        regex: ->\s*messages$
    - inside:
        stopBy: end
        kind: program
        has:
          kind: namespace_use_declaration
          regex: \bTwilio\\
  - kind: scoped_call_expression
    regex: ^Mail\s*::\s*(to|send|raw|queue|later)\b
  - kind: object_creation_expression
    has:
      kind: name
      regex: ^(MailMessage|Email)$
  - kind: method_declaration
    has:
      field: name
      kind: name
      regex: ^to(Mail|Sms|Vonage|Twilio)$
  - kind: function_call_expression
    has:
      field: function
      kind: name
      regex: ^mail$
min_engine: 0.39.0
