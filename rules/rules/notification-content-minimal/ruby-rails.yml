# Patient values in push, email and SMS content (T23 B56d). Written by
# scripts/gen_notification_rules.py: don't edit. The practice is capped at needs_review.
id: notification-content-minimal.ruby-rails.send
practice_id: notification-content-minimal
language: ruby
frameworks:
- rails
kind: evidence
rule:
  kind: call
  any:
  - all:
    - has:
        field: method
        kind: identifier
        regex: ^mail$
    - kind: call
      regex: ^mail\b
    - inside:
        stopBy: end
        kind: class
        has:
          field: superclass
          kind: superclass
          regex: Mailer$
  - all:
    - has:
        field: method
        kind: identifier
        regex: ^create$
    - has:
        field: receiver
        kind: call
        regex: ^(?i:@?(\w*twilio\w*|client))\s*\.\s*messages$
min_engine: 0.39.0
