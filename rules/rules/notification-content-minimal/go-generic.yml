# Patient values in push, email and SMS content (T23 B56d). Written by
# scripts/gen_notification_rules.py: don't edit. The practice is capped at needs_review.
id: notification-content-minimal.go-generic.send
practice_id: notification-content-minimal
language: go
frameworks:
- generic
kind: evidence
rule:
  any:
  - kind: composite_literal
    has:
      field: type
      kind: qualified_type
      regex: ^messaging\s*\.\s*(Message|MulticastMessage|Notification|AndroidNotification|WebpushNotification)$
  - kind: call_expression
    has:
      field: function
      kind: selector_expression
      regex: \.\s*(CreateMessage|SetBody|SetSubject|SetHTMLContent|SetPlainTextContent)$|^(mail\s*\.\s*(NewSingleEmail|NewContent)|smtp\s*\.\s*SendMail)$
min_engine: 0.39.0
