# Patient values in push, email and SMS content (T23 B56d). Written by
# scripts/gen_notification_rules.py: don't edit. The practice is capped at needs_review.
id: notification-content-minimal.java-generic.send
practice_id: notification-content-minimal
language: java
frameworks:
- generic
kind: evidence
rule:
  any:
  - kind: method_invocation
    any:
    - all:
      - has:
          field: name
          kind: identifier
          regex: ^(setText|setSubject)$
      - has:
          field: object
          any:
          - kind: identifier
            regex: (?i)(helper|message|mail|msg|email)\w*$
          - kind: field_access
            regex: (?i)(helper|message|mail|msg|email)\w*$
    - all:
      - has:
          field: name
          kind: identifier
          regex: ^(setTitle|setBody)$
      - has:
          field: object
          kind: method_invocation
          regex: Notification\s*\.\s*builder\s*\(\s*\)
    - has:
        field: name
        kind: identifier
        regex: ^(setContentTitle|setContentText)$
    - all:
      - has:
          field: name
          kind: identifier
          regex: ^creator$
      - has:
          field: object
          kind: identifier
          regex: ^Message$
    - all:
      - has:
          field: name
          kind: identifier
          regex: ^(setText|setSubject)$
      - inside:
          stopBy: end
          kind: method_declaration
          has:
            stopBy: end
            kind: type_identifier
            regex: ^SimpleMailMessage$
  - kind: method_invocation
    all:
    - has:
        field: name
        kind: identifier
        regex: ^(send|sendEach|sendMulticast|sendAsync)$
    - has:
        field: object
        kind: method_invocation
        regex: FirebaseMessaging\s*\.\s*getInstance\b
  - kind: method_invocation
    all:
    - has:
        field: name
        kind: identifier
        regex: ^send$
    - has:
        field: object
        any:
        - kind: identifier
          regex: (?i)mail_?sender$
        - kind: field_access
          regex: (?i)mail_?sender$
min_engine: 0.39.0
