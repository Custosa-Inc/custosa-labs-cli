# Patient values in push, email and SMS content (T23 B56d). Written by
# scripts/gen_notification_rules.py: don't edit. The practice is capped at needs_review.
id: notification-content-minimal.python-generic.send
practice_id: notification-content-minimal
language: python
frameworks:
- generic
kind: evidence
rule:
  kind: call
  any:
  - has:
      field: function
      any:
      - kind: identifier
        regex: ^(\w+\.)*(send_mail|send_mass_mail|mail_admins|EmailMessage|EmailMultiAlternatives)$|^(\w+\.)*messaging\s*\.\s*(Message|MulticastMessage|Notification|send|send_each)$|^(?i:[\w.]*twilio[\w.]*)\s*\.\s*messages\s*\.\s*create$
      - kind: attribute
        regex: ^(\w+\.)*(send_mail|send_mass_mail|mail_admins|EmailMessage|EmailMultiAlternatives)$|^(\w+\.)*messaging\s*\.\s*(Message|MulticastMessage|Notification|send|send_each)$|^(?i:[\w.]*twilio[\w.]*)\s*\.\s*messages\s*\.\s*create$
  - all:
    - has:
        field: function
        kind: attribute
        regex: \.\s*messages\s*\.\s*create$
    - inside:
        stopBy: end
        kind: module
        has:
          any:
          - kind: import_from_statement
            regex: ^from\s+twilio\b
          - kind: import_statement
            regex: ^import\s+twilio\b
  - all:
    - has:
        field: function
        any:
        - kind: identifier
          regex: ^Mail$
        - kind: attribute
          regex: \.\s*Mail$
    - inside:
        stopBy: end
        kind: module
        has:
          any:
          - kind: import_from_statement
            regex: ^from\s+sendgrid\b
          - kind: import_statement
            regex: ^import\s+sendgrid\b
min_engine: 0.39.0
