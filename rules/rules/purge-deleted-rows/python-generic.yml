id: purge-deleted-rows.python-generic.soft-delete
practice_id: purge-deleted-rows
language: python
frameworks:
- generic
kind: items
rule:
  any:
  - kind: call
    regex: \.update\([^)]*\b(deleted_at|is_deleted|deleted)\s*=\s*(timezone\.now\(\)|datetime\.\w+\(\)|now\(\)|func\.now\(\)|True)
  - kind: assignment
    regex: ^\w+\.(deleted_at|is_deleted|deleted)\s*=\s*(timezone\.now\(\)|datetime\.\w+\(\)|now\(\)|func\.now\(\)|True)$
control:
  inside:
    stopBy: end
    kind: class_definition
    regex: \.filter\([^)]*deleted_at__(lt|lte)\s*=\s*[A-Za-z_][^)]*\)\.delete\(\)
min_engine: 0.39.0
