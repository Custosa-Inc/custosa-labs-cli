id: purge-deleted-rows.python-generic.purge-soft-deleted
practice_id: purge-deleted-rows
language: python
frameworks:
- generic
kind: evidence
rule:
  all:
  - kind: call
    regex: \.filter\([^)]*deleted_at__(lt|lte)\s*=\s*[A-Za-z_][^)]*\)\.delete\(\)$
  - not:
      kind: call
      regex: (?i)audit
min_engine: 0.39.0
