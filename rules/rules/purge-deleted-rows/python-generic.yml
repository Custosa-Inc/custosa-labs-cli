id: purge-deleted-rows.python-generic.purge-history
practice_id: purge-deleted-rows
language: python
frameworks:
- generic
kind: evidence
rule:
  all:
  - kind: call
    regex: ^(Historical\w+|\w*(History|Version)\w*)\.objects\.filter\([^)]+\)\.delete\(\)$
  - not:
      kind: call
      regex: (?i)audit
  - not:
      kind: call
      regex: \.filter\(\s*(id|pk)\s*=\s*[^,()]+\)
min_engine: 0.39.0
