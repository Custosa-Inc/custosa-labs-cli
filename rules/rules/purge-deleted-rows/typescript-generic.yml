id: purge-deleted-rows.typescript-generic.purge-history
practice_id: purge-deleted-rows
language: typescript
frameworks:
- generic
kind: evidence
rule:
  any:
  - all:
    - kind: call_expression
      regex: '^(await\s+)?[\w.]*\.\w*(History|Histories|Version|Versions|history|versions)\w*\.deleteMany\(\s*\{\s*where\s*:'
    - not:
        kind: call_expression
        regex: (?i)audit
    - not:
        kind: call_expression
        regex: where\s*:\s*\{\s*id\s*(:\s*[^,{}]+)?\s*\}
  - all:
    - kind: string
      regex: (?i)delete\s+from\s+[\w.\"]*(_history|_versions?|_revisions|history_\w+)\b\s+where\b
    - not:
        kind: string
        regex: (?i)delete\s+from\s+[\w.\"]*audit
    - not:
        kind: string
        regex: (?i)(?-u:\b)where\s+[\w.\"]*(?-u:\b)id\"?\s*=\s*[^\s\'\"`]+\s*[\'\"`]$
  - all:
    - kind: template_string
      regex: (?i)delete\s+from\s+[\w.\"]*(_history|_versions?|_revisions|history_\w+)\b\s+where\b
    - not:
        kind: template_string
        regex: (?i)delete\s+from\s+[\w.\"]*audit
    - not:
        kind: template_string
        regex: (?i)(?-u:\b)where\s+[\w.\"]*(?-u:\b)id\"?\s*=\s*[^\s\'\"`]+\s*[\'\"`]$
min_engine: 0.39.0
