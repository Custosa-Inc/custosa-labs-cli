id: purge-deleted-rows.typescript-generic.soft-delete
practice_id: purge-deleted-rows
language: typescript
frameworks:
- generic
kind: items
rule:
  any:
  - all:
    - pattern: $P.$TABLE.update($$$ARGS)
    - has:
        field: arguments
        kind: arguments
        regex: \bdata\s*:\s*\{[^}]*\b(deleted_?[aA]t|is_?[dD]eleted|deleted|isDeleted|deletedAt|discarded_?[aA]t|archived_?[aA]t)\s*:\s*(new Date|Date\.now|true|now\(|sql`now|new Date\(\))
  - all:
    - pattern: $P.$TABLE.updateMany($$$ARGS)
    - has:
        field: arguments
        kind: arguments
        regex: \bdata\s*:\s*\{[^}]*\b(deleted_?[aA]t|is_?[dD]eleted|deleted|isDeleted|deletedAt|discarded_?[aA]t|archived_?[aA]t)\s*:\s*(new Date|Date\.now|true|now\()
  - all:
    - pattern: $DB.update($TABLE).set($VALUES)
    - has:
        field: arguments
        kind: arguments
        regex: \b(deleted_?[aA]t|is_?[dD]eleted|deleted|isDeleted|deletedAt|discarded_?[aA]t|archived_?[aA]t)\s*:\s*(new Date|Date\.now|true|sql`now)
  - all:
    - pattern: $C.from($TABLE).update($VALUES)
    - has:
        field: arguments
        kind: arguments
        regex: \b['\"]?(deleted_?[aA]t|is_?[dD]eleted|deleted|isDeleted|deletedAt|discarded_?[aA]t|archived_?[aA]t)['\"]?\s*:\s*(new Date|Date\.now|true)
control:
  all:
  - any:
    - pattern: $Q.$T.update($$$A)
    - pattern: $Q.$T.updateMany($$$A)
  - inside:
      stopBy: end
      kind: program
      has:
        stopBy: end
        all:
        - pattern: $R.$T.deleteMany($$$B)
        - kind: call_expression
          regex: '\.deleteMany\(\s*\{\s*where\s*:\s*\{[^{}]*\b(deleted_?[aA]t|deletedAt)\s*:\s*\{\s*(lt|lte)\s*:'
        - not:
            kind: call_expression
            regex: new Date\(\s*0?\s*\)|new Date\(\s*['\"`]\d{4}|['\"`]\d{4}-\d\d-\d\d
table:
  metavariable: $TABLE
  access: write
min_engine: 0.39.0
