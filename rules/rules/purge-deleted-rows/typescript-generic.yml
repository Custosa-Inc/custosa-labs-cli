id: purge-deleted-rows.typescript-generic.purge-soft-deleted-sql
practice_id: purge-deleted-rows
language: typescript
frameworks:
- generic
kind: evidence
rule:
  any:
  - all:
    - kind: string
      regex: (?i)delete\s+from\s+[\w.\"]+\s+where\s+[\w.\"]*deleted_?at\s*(<|<=)\s*(now\(\)|current_(date|timestamp)|\$\d|\?|:\w+)
    - not:
        kind: string
        regex: (?i)delete\s+from\s+[\w.\"]*audit
  - all:
    - kind: template_string
      regex: (?i)delete\s+from\s+[\w.\"]+\s+where\s+[\w.\"]*deleted_?at\s*(<|<=)\s*(now\(\)|current_(date|timestamp)|\$\d|\?|:\w+)
    - not:
        kind: template_string
        regex: (?i)delete\s+from\s+[\w.\"]*audit
  - kind: call_expression
    regex: \.delete\(\)[\s\S]*\.(lt|lte)\(\s*['\"]deleted_at['\"]\s*,\s*[A-Za-z_]
min_engine: 0.39.0
