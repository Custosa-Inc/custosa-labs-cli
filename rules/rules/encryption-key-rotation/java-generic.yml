id: encryption-key-rotation.java-generic.kms-client
practice_id: encryption-key-rotation
language: java
frameworks:
- generic
kind: evidence
rule:
  any:
  - kind: method_invocation
    regex: \.(generateDataKey|encrypt)\(\s*GenerateDataKeyRequest|KeyManagementServiceClient\.create\(|KeysetHandle\.generateNew\(
  - kind: object_creation_expression
    regex: ^new\s+(GenerateDataKeyRequest|KmsMasterKeyProvider)\b
