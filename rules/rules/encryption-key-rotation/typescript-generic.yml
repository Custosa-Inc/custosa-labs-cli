id: encryption-key-rotation.typescript-generic.hardcoded-key
practice_id: encryption-key-rotation
language: typescript
frameworks:
- generic
kind: violation
rule:
  all:
  - kind: call_expression
    regex: ^(crypto\.)?create(De)?[Cc]ipheriv\(
  - has:
      field: arguments
      kind: arguments
      regex: ^\(\s*[^,]+,\s*(['\"`][^'\"`]{8,}['\"`]|Buffer\.from\(\s*['\"`][^'\"`]{8,}['\"`])
min_engine: 0.39.0
