id: encryption-key-rotation.typescript-generic.kms-client
practice_id: encryption-key-rotation
language: typescript
frameworks:
- generic
kind: evidence
rule:
  any:
  - kind: new_expression
    regex: ^new\s+(GenerateDataKeyCommand|EncryptCommand|DecryptCommand|KeyManagementServiceClient|KmsKeyringNode|AwsKmsMrkAwareSymmetricKeyringNode)\(
  - kind: call_expression
    regex: ^(\w+\.)*(encryptSymmetric|generateDataKey|buildClient)\(
min_engine: 0.39.0
