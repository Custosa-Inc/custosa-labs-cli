# replay-dedupe: an items-sdk handler (the same match, so the same path and line) that rejects a repeated event: a
# data call inserting the event id with ON CONFLICT, INSERT IGNORE, ON DUPLICATE KEY or the like, whose row count
# (RowsAffected) is tested by an if that returns when it is 0. Go has no catch, so a unique-violation check after the
# insert doesn't count. No data call may come before it. A table name or a log line alone never counts. Evidence: with
# the SDK control, it allows the pass once Q6 is ruled.
id: inbound-webhooks-verified.go-generic.replay-dedupe
practice_id: inbound-webhooks-verified
language: go
frameworks:
- generic
kind: evidence
rule:
  all:
  - any:
    - kind: function_declaration
      has:
        kind: parameter_list
        regex: \*gin\.Context|echo\.Context|\*fiber\.Ctx|http\.ResponseWriter
    - kind: method_declaration
      has:
        kind: parameter_list
        regex: \*gin\.Context|echo\.Context|\*fiber\.Ctx|http\.ResponseWriter
    - kind: func_literal
      has:
        kind: parameter_list
        regex: \*gin\.Context|echo\.Context|\*fiber\.Ctx|http\.ResponseWriter
  - any:
    - has:
        stopBy: end
        any:
        - kind: interpreted_string_literal
          regex: (?i)^["`](stripe-signature|x-twilio-signature|svix-signature|x-hub-signature-256|x-hub-signature|webhook-signature)["`]$
        - kind: raw_string_literal
          regex: (?i)^["`](stripe-signature|x-twilio-signature|svix-signature|x-hub-signature-256|x-hub-signature|webhook-signature)["`]$
    - has:
        stopBy: end
        any:
        - kind: call_expression
          has:
            field: function
            kind: selector_expression
            regex: (^|\.)(ConstructEvent|ConstructEventWithOptions|ValidatePayload)$
  - not:
      has:
        stopBy: end
        kind: call_expression
        regex: ^hmac\.New\(
  - has:
      stopBy: end
      any:
      - all:
        - kind: call_expression
          regex: (?i)(\bON\s+CONFLICT\b|\bINSERT\s+IGNORE\b|\bON\s+DUPLICATE\s+KEY\b|\bon_?conflict|\bupsert|\binsert_?or_?ignore|\bignore_?duplicates|\bskip_?duplicates|\bunique_by\b)
        - kind: call_expression
          regex: (?i)(\b(event|evt)\s*(\?\.|\.|->)\s*(id\b|getId\(\))|\b(event|evt)\s*\[\s*:?['\"]?id['\"]?\s*\]|\bevent_?id\b)
        - kind: call_expression
          has:
            field: function
            any:
            - kind: identifier
              regex: (?i)(^|\.)(insert|create|save|add|put|persist|exec|execute|query|update|upsert|run|raw|sql|on_?conflict|ignore|merge)\w*[!?]?$
            - kind: selector_expression
              regex: (?i)(^|\.)(insert|create|save|add|put|persist|exec|execute|query|update|upsert|run|raw|sql|on_?conflict|ignore|merge)\w*[!?]?$
  - not:
      any:
      - kind: function_declaration
        regex: (?s)\b(db|tx|conn|pool|gdb|gormDB|database|DB|repo|store)\s*\.\s*(Exec|Query|QueryRow|Create|Save|First|Find|Where|Update|Delete|Insert|Select|Model|Table)\w*\s*\(.*\b(db|tx|conn|pool|gdb|gormDB|database|DB|repo|store)\s*\.\s*(Exec|Query|QueryRow|Create|Save|First|Find|Where|Update|Delete|Insert|Select|Model|Table)\w*\s*\(.{0,400}?((\bON\s+CONFLICT\b|\bINSERT\s+IGNORE\b|\bON\s+DUPLICATE\s+KEY\b|\bon_?conflict|\bupsert|\binsert_?or_?ignore|\bignore_?duplicates|\bskip_?duplicates|\bunique_by\b))
      - kind: method_declaration
        regex: (?s)\b(db|tx|conn|pool|gdb|gormDB|database|DB|repo|store)\s*\.\s*(Exec|Query|QueryRow|Create|Save|First|Find|Where|Update|Delete|Insert|Select|Model|Table)\w*\s*\(.*\b(db|tx|conn|pool|gdb|gormDB|database|DB|repo|store)\s*\.\s*(Exec|Query|QueryRow|Create|Save|First|Find|Where|Update|Delete|Insert|Select|Model|Table)\w*\s*\(.{0,400}?((\bON\s+CONFLICT\b|\bINSERT\s+IGNORE\b|\bON\s+DUPLICATE\s+KEY\b|\bon_?conflict|\bupsert|\binsert_?or_?ignore|\bignore_?duplicates|\bskip_?duplicates|\bunique_by\b))
      - kind: func_literal
        regex: (?s)\b(db|tx|conn|pool|gdb|gormDB|database|DB|repo|store)\s*\.\s*(Exec|Query|QueryRow|Create|Save|First|Find|Where|Update|Delete|Insert|Select|Model|Table)\w*\s*\(.*\b(db|tx|conn|pool|gdb|gormDB|database|DB|repo|store)\s*\.\s*(Exec|Query|QueryRow|Create|Save|First|Find|Where|Update|Delete|Insert|Select|Model|Table)\w*\s*\(.{0,400}?((\bON\s+CONFLICT\b|\bINSERT\s+IGNORE\b|\bON\s+DUPLICATE\s+KEY\b|\bon_?conflict|\bupsert|\binsert_?or_?ignore|\bignore_?duplicates|\bskip_?duplicates|\bunique_by\b))
  - any:
    - kind: function_declaration
      regex: (?s)(\bif\b[^{]*\bRowsAffected\b|\bRowsAffected\b.{0,160}?\bif\b)[^{]*==\s*0\s*\{[^}]*\breturn\b
    - kind: method_declaration
      regex: (?s)(\bif\b[^{]*\bRowsAffected\b|\bRowsAffected\b.{0,160}?\bif\b)[^{]*==\s*0\s*\{[^}]*\breturn\b
    - kind: func_literal
      regex: (?s)(\bif\b[^{]*\bRowsAffected\b|\bRowsAffected\b.{0,160}?\bif\b)[^{]*==\s*0\s*\{[^}]*\breturn\b
min_engine: 0.39.0
