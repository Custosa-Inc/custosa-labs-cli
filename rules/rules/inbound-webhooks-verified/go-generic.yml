# items-hmac: a handler that reads a provider signature header and computes an HMAC itself (hmac.New). The control is
# a constant-time compare (hmac.Equal, subtle.ConstantTimeCompare). With it, needs_review; without, fail.
id: inbound-webhooks-verified.go-generic.items-hmac
practice_id: inbound-webhooks-verified
language: go
frameworks:
- generic
kind: items
rule:
  all:
  - any:
    - kind: function_declaration
      has:
        kind: parameter_list
        regex: \*gin\.Context|echo\.Context|\*fiber\.Ctx|http\.ResponseWriter
    - kind: method_declaration
      has:
        kind: parameter_list
        regex: \*gin\.Context|echo\.Context|\*fiber\.Ctx|http\.ResponseWriter
    - kind: func_literal
      has:
        kind: parameter_list
        regex: \*gin\.Context|echo\.Context|\*fiber\.Ctx|http\.ResponseWriter
  - has:
      stopBy: end
      any:
      - kind: interpreted_string_literal
        regex: (?i)^["`](stripe-signature|x-twilio-signature|svix-signature|x-hub-signature-256|x-hub-signature|webhook-signature)["`]$
      - kind: raw_string_literal
        regex: (?i)^["`](stripe-signature|x-twilio-signature|svix-signature|x-hub-signature-256|x-hub-signature|webhook-signature)["`]$
  - has:
      stopBy: end
      kind: call_expression
      regex: ^hmac\.New\(
control:
  has:
    stopBy: end
    kind: call_expression
    regex: ^(hmac\.Equal|subtle\.ConstantTimeCompare)\(
min_engine: 0.39.0
