# webhook-route: a function literal registered on a path that names a webhook, hook, callback or notify endpoint, or a
# handler named for one, that reads no provider signature. Evidence: needs_review naming it.
id: inbound-webhooks-verified.go-generic.webhook-route
practice_id: inbound-webhooks-verified
language: go
frameworks:
- generic
kind: evidence
rule:
  all:
  - any:
    - kind: func_literal
      has:
        kind: parameter_list
        regex: \*gin\.Context|echo\.Context|\*fiber\.Ctx|http\.ResponseWriter
      inside:
        kind: argument_list
        inside:
          kind: call_expression
          has:
            field: arguments
            kind: argument_list
            has:
              any:
              - kind: interpreted_string_literal
                regex: (?i)^[\"`]/?([^\"`]*[/_-])?(webhooks?|hooks?|callbacks?|notify)([/_.-][^\"`]*)?[\"`]$
              - kind: raw_string_literal
                regex: (?i)^[\"`]/?([^\"`]*[/_-])?(webhooks?|hooks?|callbacks?|notify)([/_.-][^\"`]*)?[\"`]$
    - any:
      - kind: function_declaration
        all:
        - has:
            kind: parameter_list
            regex: \*gin\.Context|echo\.Context|\*fiber\.Ctx|http\.ResponseWriter
        - has:
            field: name
            kind: identifier
            regex: (?i)(webhooks?|hooks?|callbacks?|notify)
      - kind: method_declaration
        all:
        - has:
            kind: parameter_list
            regex: \*gin\.Context|echo\.Context|\*fiber\.Ctx|http\.ResponseWriter
        - has:
            field: name
            kind: field_identifier
            regex: (?i)(webhooks?|hooks?|callbacks?|notify)
  - not:
      any:
      - has:
          stopBy: end
          any:
          - kind: interpreted_string_literal
            regex: (?i)^["`](stripe-signature|x-twilio-signature|svix-signature|x-hub-signature-256|x-hub-signature|webhook-signature)["`]$
          - kind: raw_string_literal
            regex: (?i)^["`](stripe-signature|x-twilio-signature|svix-signature|x-hub-signature-256|x-hub-signature|webhook-signature)["`]$
      - has:
          stopBy: end
          any:
          - kind: call_expression
            has:
              field: function
              kind: selector_expression
              regex: (^|\.)(ConstructEvent|ConstructEventWithOptions|ValidatePayload)$
min_engine: 0.39.0
---
# entry: an entry point that can take a request body (B32p E): a POST, PUT, PATCH, Any, Match or Handle route (gin), a
# Post, Put, Patch or Method route (chi), or Handle or HandleFunc (gorilla, chi, net/http) unless its pattern names
# GET, HEAD, DELETE or OPTIONS; and any handler that reads the query, a path parameter, a form, a bind or the body.
# Evidence for the pass, which needs every entry verified or user-gated; never an object of its own.
id: inbound-webhooks-verified.go-generic.entry
practice_id: inbound-webhooks-verified
language: go
frameworks:
- generic
kind: evidence
rule:
  any:
  - kind: call_expression
    all:
    - has:
        field: function
        kind: selector_expression
        regex: \.(POST|PUT|PATCH|Any|Match|Handle|Post|Put|Patch|Method|MethodFunc|HandleFunc)$
        not:
          kind: selector_expression
          regex: ^(http\.(Post|PostForm|Get|Head)$|(?i:\w*client\w*\.|resty\.))
    - has:
        field: arguments
        kind: argument_list
        regex: (?s)^\(\s*[^,]+,
        not:
          kind: argument_list
          regex: ^\(\s*[\"`](GET|HEAD|DELETE|OPTIONS)\s
  - kind: function_declaration
    has:
      kind: parameter_list
      regex: \*gin\.Context|echo\.Context|\*fiber\.Ctx|http\.ResponseWriter
    regex: (\b\w+\.(Query|DefaultQuery|QueryArray|QueryMap|GetQuery|Param|Params|PostForm|DefaultPostForm|PostFormArray|PostFormMap|FormFile|MultipartForm|Bind|BindJSON|BindQuery|BindUri|ShouldBind\w*|GetRawData|FormValue|PostFormValue|ParseForm|ParseMultipartForm|PathValue)\(|\.URL\s*\.\s*(Query\s*\(|RawQuery\b)|\.Body\b|\bchi\.URLParam\w*\(|\bmux\.Vars\()
  - kind: method_declaration
    has:
      kind: parameter_list
      regex: \*gin\.Context|echo\.Context|\*fiber\.Ctx|http\.ResponseWriter
    regex: (\b\w+\.(Query|DefaultQuery|QueryArray|QueryMap|GetQuery|Param|Params|PostForm|DefaultPostForm|PostFormArray|PostFormMap|FormFile|MultipartForm|Bind|BindJSON|BindQuery|BindUri|ShouldBind\w*|GetRawData|FormValue|PostFormValue|ParseForm|ParseMultipartForm|PathValue)\(|\.URL\s*\.\s*(Query\s*\(|RawQuery\b)|\.Body\b|\bchi\.URLParam\w*\(|\bmux\.Vars\()
  - kind: func_literal
    has:
      kind: parameter_list
      regex: \*gin\.Context|echo\.Context|\*fiber\.Ctx|http\.ResponseWriter
    regex: (\b\w+\.(Query|DefaultQuery|QueryArray|QueryMap|GetQuery|Param|Params|PostForm|DefaultPostForm|PostFormArray|PostFormMap|FormFile|MultipartForm|Bind|BindJSON|BindQuery|BindUri|ShouldBind\w*|GetRawData|FormValue|PostFormValue|ParseForm|ParseMultipartForm|PathValue)\(|\.URL\s*\.\s*(Query\s*\(|RawQuery\b)|\.Body\b|\bchi\.URLParam\w*\(|\bmux\.Vars\()
min_engine: 0.39.0
---
# route-unread: a route registration the inventory can't place (B32p C2): a path that is no literal (a name, a call, a
# concatenation), a group or mount (Group, Route, Mount, PathPrefix, Subrouter), or Handle given a mux or router.
# Evidence: no pass while it is seen; never an object of its own.
id: inbound-webhooks-verified.go-generic.route-unread
practice_id: inbound-webhooks-verified
language: go
frameworks:
- generic
kind: evidence
rule:
  kind: call_expression
  any:
  - all:
    - has:
        field: function
        kind: selector_expression
        regex: (?i)^([a-z]|rt|router|mux|v\d+|api|app|engine|srv|server|group|rg|\w*router|\w*mux|\w*group|\w*api|http)\.(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS|Any|Get|Post|Put|Patch|Delete|Head|Options|Handle|HandleFunc)$
        not:
          kind: selector_expression
          regex: ^(http\.(Post|PostForm|Get|Head)$|(?i:\w*client\w*\.|resty\.))
    - has:
        field: arguments
        kind: argument_list
        regex: (?s)^\(\s*([A-Za-z_][\w.]*\s*(\(|[,+])|[\"`][^\"`]*[\"`]\s*\+)
        not:
          kind: argument_list
          regex: ^\(\s*http\.Method\w+\s*,
  - has:
      field: function
      kind: selector_expression
      regex: \.(Group|Route|Mount|PathPrefix|Subrouter|NewRoute|Host)$
  - has:
      field: function
      kind: selector_expression
      regex: (?i)^([a-z]|rt|router|mux|v\d+|api|app|engine|srv|server|group|rg|\w*router|\w*mux|\w*group|\w*api|http)\.Handle$
    all:
    - has:
        field: arguments
        kind: argument_list
        regex: (?is)^\(\s*[^,]+,\s*(\w*(mux|router)|r|api|srv|server|http\.StripPrefix)\b
min_engine: 0.39.0
