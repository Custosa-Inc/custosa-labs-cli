# inbound-webhooks-verified (T23 B32, design v3 2.2.2). Written by scripts/gen_webhook_rules.py: edit that script,
# never this file. The rule id's last part is the form (items-sdk, items-hmac, violation, webhook-route,
# replay-dedupe), which the practice function reads, since a match carries only one has_control. replay-dedupe matches
# the items-sdk handler itself, so the function joins the two on path and line.

# items-sdk: a Spring mapping method that reads a provider signature header (@RequestHeader or getHeader) or calls a
# provider SDK's verifying parse (Webhook.constructEvent), and computes no HMAC itself. The control is the SDK's
# verify call with the raw body (a @RequestBody String or byte array, or the request's stream), or a call the provider
# signs without it (Twilio's form check). No control: fail. The control holds only when no data call (a data-layer
# receiver or ORM model) comes before the verify call in the handler's text.
id: inbound-webhooks-verified.kotlin-spring.items-sdk
practice_id: inbound-webhooks-verified
language: kotlin
frameworks:
- spring
kind: items
rule:
  all:
  - kind: function_declaration
    has:
      kind: modifiers
      has:
        kind: annotation
        regex: ^@(Get|Post|Put|Patch|Delete|Request)Mapping\b
  - any:
    - has:
        stopBy: end
        kind: string_literal
        regex: (?i)^"(stripe-signature|x-twilio-signature|svix-signature|x-hub-signature-256|x-hub-signature|webhook-signature)"$
    - has:
        stopBy: end
        any:
        - kind: call_expression
          regex: ^([\w.]+\.)?(constructEvent)\s*\(
  - not:
      has:
        stopBy: end
        kind: call_expression
        regex: ^Mac\.getInstance\(
control:
  all:
  - any:
    - all:
      - has:
          stopBy: end
          any:
          - all:
            - all:
              - any:
                - any:
                  - kind: call_expression
                    regex: ^([\w.]+\.)?(constructEvent)\s*\(
                - all:
                  - any:
                    - kind: call_expression
                      regex: (?i)^\w*(wh|webhooks?|svix|hook|validator)\w*\.(verify)\s*\(
                  - inside:
                      stopBy: end
                      kind: source_file
                      has:
                        stopBy: end
                        kind: import_header
                        regex: ^import\s+(static\s+)?(com\.svix|com\.svix)\.
              - not:
                  any:
                  - inside:
                      stopBy: end
                      kind: statements
                      inside:
                        kind: try_expression
                        has:
                          kind: catch_block
                          not:
                            has:
                              kind: statements
                              has:
                                any:
                                - kind: jump_expression
                                  regex: ^(throw\b|return($|[^@\w]))
                  - inside:
                      stopBy: end
                      kind: call_expression
                      regex: ^([\w.]+\.)?runCatching\s*\{
            - not:
                inside:
                  stopBy: end
                  any:
                  - kind: anonymous_function
                  - kind: lambda_literal
                    not:
                      inside:
                        kind: annotated_lambda
                        inside:
                          kind: call_suffix
                          inside:
                            kind: call_expression
                            has:
                              any:
                              - kind: navigation_expression
                                regex: ^([^?]*\.\s*(let|also|apply|use)|this\s*\.\s*run)$
                              - kind: simple_identifier
                                regex: ^(run|with)$
                  - kind: function_declaration
                    inside:
                      stopBy: end
                      kind: function_declaration
      - has:
          stopBy: end
          any:
          - kind: function_value_parameters
            regex: '@RequestBody\s+\w+\s*:\s*(String|ByteArray)\b'
          - kind: call_expression
            regex: \.(getInputStream|getReader)\(\)
    - has:
        stopBy: end
        any:
        - all:
          - all:
            - any:
              - all:
                - any:
                  - kind: call_expression
                    regex: (?i)^\w*(wh|webhooks?|svix|hook|validator)\w*\.(validate)\s*\(
                - inside:
                    stopBy: end
                    kind: source_file
                    has:
                      stopBy: end
                      kind: import_header
                      regex: ^import\s+(static\s+)?(com\.twilio)\.
            - any:
              - inside:
                  stopBy: end
                  kind: prefix_expression
                  regex: ^!
                  inside:
                    kind: if_expression
                    has:
                      kind: control_structure_body
                      any:
                      - has:
                          any:
                          - kind: jump_expression
                            regex: ^(throw\b|return($|[^@\w]))
                      - has:
                          kind: statements
                          has:
                            any:
                            - kind: jump_expression
                              regex: ^(throw\b|return($|[^@\w]))
              - all:
                - inside:
                    any:
                    - kind: property_declaration
                    - kind: assignment
                - any:
                  - inside:
                      stopBy: end
                      kind: property_declaration
                      pattern: val $OK = $V
                      precedes:
                        kind: if_expression
                        has:
                          kind: control_structure_body
                          any:
                          - has:
                              any:
                              - kind: jump_expression
                                regex: ^(throw\b|return($|[^@\w]))
                          - has:
                              kind: statements
                              has:
                                any:
                                - kind: jump_expression
                                  regex: ^(throw\b|return($|[^@\w]))
                        all:
                        - has:
                            kind: prefix_expression
                            pattern: '!$OK'
                  - inside:
                      stopBy: end
                      kind: property_declaration
                      pattern: var $OK = $V
                      precedes:
                        kind: if_expression
                        has:
                          kind: control_structure_body
                          any:
                          - has:
                              any:
                              - kind: jump_expression
                                regex: ^(throw\b|return($|[^@\w]))
                          - has:
                              kind: statements
                              has:
                                any:
                                - kind: jump_expression
                                  regex: ^(throw\b|return($|[^@\w]))
                        all:
                        - has:
                            kind: prefix_expression
                            pattern: '!$OK'
                  - inside:
                      stopBy: end
                      kind: assignment
                      pattern: $OK = $V
                      precedes:
                        kind: if_expression
                        has:
                          kind: control_structure_body
                          any:
                          - has:
                              any:
                              - kind: jump_expression
                                regex: ^(throw\b|return($|[^@\w]))
                          - has:
                              kind: statements
                              has:
                                any:
                                - kind: jump_expression
                                  regex: ^(throw\b|return($|[^@\w]))
                        all:
                        - has:
                            kind: prefix_expression
                            pattern: '!$OK'
          - not:
              inside:
                stopBy: end
                any:
                - kind: anonymous_function
                - kind: lambda_literal
                  not:
                    inside:
                      kind: annotated_lambda
                      inside:
                        kind: call_suffix
                        inside:
                          kind: call_expression
                          has:
                            any:
                            - kind: navigation_expression
                              regex: ^([^?]*\.\s*(let|also|apply|use)|this\s*\.\s*run)$
                            - kind: simple_identifier
                              regex: ^(run|with)$
                - kind: function_declaration
                  inside:
                    stopBy: end
                    kind: function_declaration
  - not:
      any:
      - kind: function_declaration
        regex: (?s)\b(\w*[Rr]epository|\w*[Rr]epo|jdbcTemplate|jdbc|entityManager|em|dsl|jooq)\s*\.\s*(save\w*|find\w*|insert\w*|update\w*|delete\w*|query\w*|persist|merge|execute\w*|batchUpdate|select\w*)\s*\(.*\b(constructEvent|validate|verify)\b
min_engine: 0.39.0
