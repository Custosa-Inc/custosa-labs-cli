# violation: in a signature-reading method: a signature compared with ==, != or equals, or constructEvent given a
# tolerance. Fail.
id: inbound-webhooks-verified.kotlin-spring.violation
practice_id: inbound-webhooks-verified
language: kotlin
frameworks:
- spring
kind: violation
rule:
  any:
  - all:
    - kind: equality_expression
      regex: (?i)sig
    - kind: equality_expression
      regex: '[!=]='
    inside:
      stopBy: end
      all:
      - kind: function_declaration
        has:
          kind: modifiers
          has:
            kind: annotation
            regex: ^@(Get|Post|Put|Patch|Delete|Request)Mapping\b
      - any:
        - has:
            stopBy: end
            kind: string_literal
            regex: (?i)^"(stripe-signature|x-twilio-signature|svix-signature|x-hub-signature-256|x-hub-signature|webhook-signature)"$
        - has:
            stopBy: end
            any:
            - kind: call_expression
              regex: ^([\w.]+\.)?(constructEvent)\s*\(
  - all:
    - kind: call_expression
      regex: (?i)sig
    - kind: call_expression
      regex: \.(equals|equalsIgnoreCase|contentEquals)\(
    inside:
      stopBy: end
      all:
      - kind: function_declaration
        has:
          kind: modifiers
          has:
            kind: annotation
            regex: ^@(Get|Post|Put|Patch|Delete|Request)Mapping\b
      - any:
        - has:
            stopBy: end
            kind: string_literal
            regex: (?i)^"(stripe-signature|x-twilio-signature|svix-signature|x-hub-signature-256|x-hub-signature|webhook-signature)"$
        - has:
            stopBy: end
            any:
            - kind: call_expression
              regex: ^([\w.]+\.)?(constructEvent)\s*\(
  - kind: call_expression
    regex: ^([\w.]+\.)?(constructEvent)\s*\(
    has:
      kind: call_suffix
      has:
        kind: value_arguments
        regex: ^\((?:[^,()]|\((?:[^()]|\([^()]*\))*\))*,(?:[^,()]|\((?:[^()]|\([^()]*\))*\))*,(?:[^,()]|\((?:[^()]|\([^()]*\))*\))*,
    inside:
      stopBy: end
      all:
      - kind: function_declaration
        has:
          kind: modifiers
          has:
            kind: annotation
            regex: ^@(Get|Post|Put|Patch|Delete|Request)Mapping\b
      - any:
        - has:
            stopBy: end
            kind: string_literal
            regex: (?i)^"(stripe-signature|x-twilio-signature|svix-signature|x-hub-signature-256|x-hub-signature|webhook-signature)"$
        - has:
            stopBy: end
            any:
            - kind: call_expression
              regex: ^([\w.]+\.)?(constructEvent)\s*\(
min_engine: 0.39.0
