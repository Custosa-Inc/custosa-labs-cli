# entry: an entry point that can take a request body (B32p E): a method under @PostMapping, @PutMapping or
# @PatchMapping, or @RequestMapping with no method or naming POST, PUT or PATCH, and a @GetMapping method with a
# parameter Spring can bind from the request. Evidence for the pass, which needs every entry verified or user-gated;
# never an object of its own.
id: inbound-webhooks-verified.kotlin-spring.entry
practice_id: inbound-webhooks-verified
language: kotlin
frameworks:
- spring
kind: evidence
rule:
  kind: function_declaration
  any:
  - has:
      kind: modifiers
      has:
        any:
        - kind: annotation
          regex: (?s)^@((Post|Put|Patch)Mapping\b|RequestMapping\b.*\bmethod\s*=.*\b(POST|PUT|PATCH)\b)
  - has:
      kind: modifiers
      has:
        any:
        - kind: annotation
          regex: ^@RequestMapping\b
          not:
            kind: annotation
            regex: \bmethod\s*=
  - all:
    - has:
        kind: modifiers
        has:
          any:
          - kind: annotation
            regex: (?s)^@(GetMapping\b|RequestMapping\b.*\bmethod\s*=)
    - has:
        kind: function_value_parameters
        not:
          kind: function_value_parameters
          regex: ^\(\s*(\w+\s*:\s*(Model|ModelMap|Principal|Authentication|HttpServletResponse|ServerHttpResponse|HttpSession|Locale)\??\s*,?\s*)*\)$
min_engine: 0.39.0
