practice_id: inbound-webhooks-verified
language: java
frameworks:
- spring
kind: items
rule:
  all:
  - kind: method_declaration
    has:
      kind: modifiers
      has:
        any:
        - kind: annotation
          regex: ^@(Get|Post|Put|Patch|Delete|Request)Mapping\b
        - kind: marker_annotation
          regex: ^@(Get|Post|Put|Patch|Delete|Request)Mapping\b
  - has:
      stopBy: end
      kind: string_literal
      regex: (?i)^"(stripe-signature|x-twilio-signature|svix-signature|x-hub-signature-256|x-hub-signature|webhook-signature)"$
  - has:
      stopBy: end
      kind: method_invocation
      regex: ^Mac\.getInstance\(
control:
  has:
    stopBy: end
    kind: method_invocation
    regex: ^MessageDigest\.isEqual\(
min_engine: 0.39.0
