# violation: in a signature-reading method: a signature compared with ==, != or equals, or constructEvent given a
# tolerance. Fail.
id: inbound-webhooks-verified.java-spring.violation
practice_id: inbound-webhooks-verified
language: java
frameworks:
- spring
kind: violation
rule:
  any:
  - all:
    - kind: binary_expression
      regex: (?i)sig
    - kind: binary_expression
      regex: '[!=]='
    inside:
      stopBy: end
      all:
      - kind: method_declaration
        has:
          kind: modifiers
          has:
            any:
            - kind: annotation
              regex: ^@(Get|Post|Put|Patch|Delete|Request)Mapping\b
            - kind: marker_annotation
              regex: ^@(Get|Post|Put|Patch|Delete|Request)Mapping\b
      - any:
        - has:
            stopBy: end
            kind: string_literal
            regex: (?i)^"(stripe-signature|x-twilio-signature|svix-signature|x-hub-signature-256|x-hub-signature|webhook-signature)"$
        - has:
            stopBy: end
            any:
            - kind: method_invocation
              has:
                field: name
                kind: identifier
                regex: ^(constructEvent)$
  - all:
    - kind: method_invocation
      regex: (?i)sig
    - kind: method_invocation
      regex: \.(equals|equalsIgnoreCase|contentEquals)\(
    inside:
      stopBy: end
      all:
      - kind: method_declaration
        has:
          kind: modifiers
          has:
            any:
            - kind: annotation
              regex: ^@(Get|Post|Put|Patch|Delete|Request)Mapping\b
            - kind: marker_annotation
              regex: ^@(Get|Post|Put|Patch|Delete|Request)Mapping\b
      - any:
        - has:
            stopBy: end
            kind: string_literal
            regex: (?i)^"(stripe-signature|x-twilio-signature|svix-signature|x-hub-signature-256|x-hub-signature|webhook-signature)"$
        - has:
            stopBy: end
            any:
            - kind: method_invocation
              has:
                field: name
                kind: identifier
                regex: ^(constructEvent)$
  - kind: method_invocation
    all:
    - has:
        field: name
        kind: identifier
        regex: ^(constructEvent)$
    - has:
        field: arguments
        kind: argument_list
        regex: ^\((?:[^,()]|\((?:[^()]|\([^()]*\))*\))*,(?:[^,()]|\((?:[^()]|\([^()]*\))*\))*,(?:[^,()]|\((?:[^()]|\([^()]*\))*\))*,
    inside:
      stopBy: end
      all:
      - kind: method_declaration
        has:
          kind: modifiers
          has:
            any:
            - kind: annotation
              regex: ^@(Get|Post|Put|Patch|Delete|Request)Mapping\b
            - kind: marker_annotation
              regex: ^@(Get|Post|Put|Patch|Delete|Request)Mapping\b
      - any:
        - has:
            stopBy: end
            kind: string_literal
            regex: (?i)^"(stripe-signature|x-twilio-signature|svix-signature|x-hub-signature-256|x-hub-signature|webhook-signature)"$
        - has:
            stopBy: end
            any:
            - kind: method_invocation
              has:
                field: name
                kind: identifier
                regex: ^(constructEvent)$
