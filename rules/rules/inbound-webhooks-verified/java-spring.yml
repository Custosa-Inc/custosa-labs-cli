# inbound-webhooks-verified (T23 B32, design v3 2.2.2). Written by scripts/gen_webhook_rules.py: edit that script,
# never this file. The rule id's last part is the form (items-sdk, items-hmac, violation, webhook-route,
# replay-dedupe), which the practice function reads, since a match carries only one has_control. replay-dedupe matches
# the items-sdk handler itself, so the function joins the two on path and line.

# items-sdk: a Spring mapping method that reads a provider signature header (@RequestHeader or getHeader) or calls a
# provider SDK's verifying parse (Webhook.constructEvent), and computes no HMAC itself. The control is the SDK's
# verify call with the raw body (a @RequestBody String or byte array, or the request's stream), or a call the provider
# signs without it (Twilio's form check). No control: fail. The control holds only when no data call (a data-layer
# receiver or ORM model) comes before the verify call in the handler's text.
id: inbound-webhooks-verified.java-spring.items-sdk
practice_id: inbound-webhooks-verified
language: java
frameworks:
- spring
kind: items
rule:
  all:
  - kind: method_declaration
    has:
      kind: modifiers
      has:
        any:
        - kind: annotation
          regex: ^@(Get|Post|Put|Patch|Delete|Request)Mapping\b
        - kind: marker_annotation
          regex: ^@(Get|Post|Put|Patch|Delete|Request)Mapping\b
  - any:
    - has:
        stopBy: end
        kind: string_literal
        regex: (?i)^"(stripe-signature|x-twilio-signature|svix-signature|x-hub-signature-256|x-hub-signature|webhook-signature)"$
    - has:
        stopBy: end
        any:
        - kind: method_invocation
          has:
            field: name
            kind: identifier
            regex: ^(constructEvent)$
  - not:
      has:
        stopBy: end
        kind: method_invocation
        regex: ^Mac\.getInstance\(
control:
  all:
  - any:
    - all:
      - has:
          stopBy: end
          any:
          - all:
            - all:
              - any:
                - any:
                  - kind: method_invocation
                    has:
                      field: name
                      kind: identifier
                      regex: ^(constructEvent)$
                - all:
                  - any:
                    - kind: method_invocation
                      all:
                      - has:
                          field: object
                          kind: identifier
                          regex: (?i)^\w*(wh|webhooks?|svix|hook|validator)\w*$
                      - has:
                          field: name
                          kind: identifier
                          regex: ^(verify)$
                  - inside:
                      stopBy: end
                      kind: program
                      has:
                        stopBy: end
                        kind: import_declaration
                        regex: ^import\s+(static\s+)?(com\.svix|com\.svix)\.
              - not:
                  any:
                  - inside:
                      stopBy: end
                      kind: block
                      inside:
                        kind: try_statement
                        has:
                          kind: catch_clause
                          not:
                            has:
                              kind: block
                              has:
                                any:
                                - kind: return_statement
                                - kind: throw_statement
            - not:
                inside:
                  stopBy: end
                  any:
                  - kind: lambda_expression
                  - kind: method_declaration
                    inside:
                      stopBy: end
                      kind: method_declaration
      - has:
          stopBy: end
          any:
          - kind: formal_parameters
            regex: '@RequestBody\s+(final\s+)?(String|byte\[\])\s+\w+'
          - kind: method_invocation
            regex: \.(getInputStream|getReader)\(\)
    - has:
        stopBy: end
        any:
        - all:
          - all:
            - any:
              - all:
                - any:
                  - kind: method_invocation
                    all:
                    - has:
                        field: object
                        kind: identifier
                        regex: (?i)^\w*(wh|webhooks?|svix|hook|validator)\w*$
                    - has:
                        field: name
                        kind: identifier
                        regex: ^(validate)$
                - inside:
                    stopBy: end
                    kind: program
                    has:
                      stopBy: end
                      kind: import_declaration
                      regex: ^import\s+(static\s+)?(com\.twilio|com\.twilio)\.
            - any:
              - inside:
                  stopBy: end
                  kind: unary_expression
                  regex: ^!
                  inside:
                    kind: parenthesized_expression
                    inside:
                      kind: if_statement
                      has:
                        field: consequence
                        any:
                        - kind: return_statement
                        - kind: throw_statement
                        - kind: block
                          has:
                            any:
                            - kind: return_statement
                            - kind: throw_statement
              - all:
                - inside:
                    any:
                    - kind: variable_declarator
                    - kind: assignment_expression
                - any:
                  - inside:
                      stopBy: end
                      kind: local_variable_declaration
                      has:
                        kind: variable_declarator
                        pattern:
                          context: class A { void f() { boolean $OK = $V; } }
                          selector: variable_declarator
                      precedes:
                        kind: if_statement
                        has:
                          field: consequence
                          any:
                          - kind: return_statement
                          - kind: throw_statement
                          - kind: block
                            has:
                              any:
                              - kind: return_statement
                              - kind: throw_statement
                        all:
                        - has:
                            field: condition
                            has:
                              kind: unary_expression
                              pattern:
                                context: class A { void f() { if (!$OK) {} } }
                                selector: unary_expression
                  - inside:
                      stopBy: end
                      kind: expression_statement
                      has:
                        kind: assignment_expression
                        pattern:
                          context: class A { void f() { $OK = $V; } }
                          selector: assignment_expression
                      precedes:
                        kind: if_statement
                        has:
                          field: consequence
                          any:
                          - kind: return_statement
                          - kind: throw_statement
                          - kind: block
                            has:
                              any:
                              - kind: return_statement
                              - kind: throw_statement
                        all:
                        - has:
                            field: condition
                            has:
                              kind: unary_expression
                              pattern:
                                context: class A { void f() { if (!$OK) {} } }
                                selector: unary_expression
          - not:
              inside:
                stopBy: end
                any:
                - kind: lambda_expression
                - kind: method_declaration
                  inside:
                    stopBy: end
                    kind: method_declaration
  - not:
      any:
      - kind: method_declaration
        regex: (?s)\b(\w*[Rr]epository|\w*[Rr]epo|jdbcTemplate|jdbc|entityManager|em|dsl|jooq)\s*\.\s*(save\w*|find\w*|insert\w*|update\w*|delete\w*|query\w*|persist|merge|execute\w*|batchUpdate|select\w*)\s*\(.*\b(constructEvent|validate|verify)\b
min_engine: 0.39.0
