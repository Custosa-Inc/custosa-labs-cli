# replay-dedupe: an items-sdk handler (the same match, so the same path and line) that rejects a repeated event: a
# data call inserting the event id with ON CONFLICT, INSERT IGNORE, ON DUPLICATE KEY, upsert, onConflict or the like,
# whose result is tested right after (or in the condition) by an if that returns or throws; or a try around an insert
# of the event id whose catch names a unique violation (23505, 1062, P2002, IntegrityError, RecordNotUnique,
# DuplicateKey) and returns. No data call may come before it. A table name or a log line alone never counts. Evidence:
# with the SDK control, it allows the pass once Q6 is ruled.
id: inbound-webhooks-verified.java-spring.replay-dedupe
practice_id: inbound-webhooks-verified
language: java
frameworks:
- spring
kind: evidence
rule:
  all:
  - kind: method_declaration
    has:
      kind: modifiers
      has:
        any:
        - kind: annotation
          regex: ^@(Get|Post|Put|Patch|Delete|Request)Mapping\b
        - kind: marker_annotation
          regex: ^@(Get|Post|Put|Patch|Delete|Request)Mapping\b
  - any:
    - has:
        stopBy: end
        kind: string_literal
        regex: (?i)^"(stripe-signature|x-twilio-signature|svix-signature|x-hub-signature-256|x-hub-signature|webhook-signature)"$
    - has:
        stopBy: end
        any:
        - kind: method_invocation
          has:
            field: name
            kind: identifier
            regex: ^(constructEvent)$
  - not:
      has:
        stopBy: end
        kind: method_invocation
        regex: ^Mac\.getInstance\(
  - has:
      stopBy: end
      any:
      - all:
        - any:
          - all:
            - kind: method_invocation
              regex: (?i)(\bON\s+CONFLICT\b|\bINSERT\s+IGNORE\b|\bON\s+DUPLICATE\s+KEY\b|\bon_?conflict|\bupsert|\binsert_?or_?ignore|\bignore_?duplicates|\bskip_?duplicates|\bunique_by\b)
            - kind: method_invocation
              regex: (?i)(\b(event|evt)\s*(\?\.|\.|->)\s*(id\b|getId\(\))|\b(event|evt)\s*\[\s*:?['\"]?id['\"]?\s*\]|\bevent_?id\b)
            - kind: method_invocation
              has:
                field: name
                kind: identifier
                regex: (?i)(^|\.)(insert|create|save|add|put|persist|exec|execute|query|update|upsert|run|raw|sql|on_?conflict|ignore|merge)\w*[!?]?$
        - any:
          - inside:
              stopBy: end
              any:
              - kind: local_variable_declaration
              - kind: expression_statement
              precedes:
                kind: if_statement
                has:
                  field: consequence
                  any:
                  - kind: return_statement
                  - kind: throw_statement
                  - kind: block
                    has:
                      any:
                      - kind: return_statement
                      - kind: throw_statement
          - inside:
              stopBy: end
              any:
              - kind: parenthesized_expression
              inside:
                kind: if_statement
                has:
                  field: consequence
                  any:
                  - kind: return_statement
                  - kind: throw_statement
                  - kind: block
                    has:
                      any:
                      - kind: return_statement
                      - kind: throw_statement
      - kind: try_statement
        all:
        - has:
            kind: catch_clause
            regex: (?is)(\b23505\b|\b1062\b|ER_DUP_ENTRY|\bP2002\b|unique_?violation|UniqueConstraintViolation|IntegrityError|RecordNotUnique|DuplicateKey|SQLIntegrityConstraintViolation|duplicate key).{0,160}?\breturn\b
        - has:
            stopBy: end
            any:
            - all:
              - kind: method_invocation
                regex: (?i)\b(insert|create|save|add|put|persist|exec|execute|query|update)\w*\s*[!?]?\s*\(
              - kind: method_invocation
                regex: (?i)(\b(event|evt)\s*(\?\.|\.|->)\s*(id\b|getId\(\))|\b(event|evt)\s*\[\s*:?['\"]?id['\"]?\s*\]|\bevent_?id\b)
            not:
              inside:
                stopBy: end
                kind: catch_clause
  - not:
      any:
      - kind: method_declaration
        regex: (?s)\b(\w*[Rr]epository|\w*[Rr]epo|jdbcTemplate|jdbc|entityManager|em|dsl|jooq)\s*\.\s*(save\w*|find\w*|insert\w*|update\w*|delete\w*|query\w*|persist|merge|execute\w*|batchUpdate|select\w*)\s*\(.*\b(\w*[Rr]epository|\w*[Rr]epo|jdbcTemplate|jdbc|entityManager|em|dsl|jooq)\s*\.\s*(save\w*|find\w*|insert\w*|update\w*|delete\w*|query\w*|persist|merge|execute\w*|batchUpdate|select\w*)\s*\(.{0,400}?((\bON\s+CONFLICT\b|\bINSERT\s+IGNORE\b|\bON\s+DUPLICATE\s+KEY\b|\bon_?conflict|\bupsert|\binsert_?or_?ignore|\bignore_?duplicates|\bskip_?duplicates|\bunique_by\b))
min_engine: 0.39.0
