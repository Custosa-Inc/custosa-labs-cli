# entry: an entry point that can take a request body (B32p E): in the routes block, a post, put, patch or match route,
# or resources or resource; and any controller action that reads params or the request's input. Evidence for the pass,
# which needs every entry verified or user-gated; never an object of its own.
id: inbound-webhooks-verified.ruby-rails.entry
practice_id: inbound-webhooks-verified
language: ruby
frameworks:
- rails
kind: evidence
rule:
  any:
  - kind: call
    regex: ^(post|put|patch|match|resources|resource)\b
    inside:
      stopBy: end
      kind: call
      regex: ^Rails\s*\.\s*application\s*\.\s*routes\s*\.\s*draw\b
    has:
      field: method
      kind: identifier
      regex: ^(post|put|patch|match|resources|resource)$
  - kind: method
    inside:
      kind: class
      stopBy: end
      has:
        field: name
        kind: constant
        regex: Controller$
    regex: (\bparams\b|\brequest\s*\.\s*(body|raw_post|params|parameters|query_parameters|request_parameters|POST|GET|query_string)\b)
min_engine: 0.39.0
