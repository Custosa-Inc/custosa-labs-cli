# violation: in a signature-reading action: a signature compared with == or !=, or construct_event given a tolerance.
# Fail.
id: inbound-webhooks-verified.ruby-rails.violation
practice_id: inbound-webhooks-verified
language: ruby
frameworks:
- rails
kind: violation
rule:
  any:
  - all:
    - kind: binary
      regex: (?i)sig
    - kind: binary
      regex: '[!=]='
    inside:
      stopBy: end
      all:
      - kind: method
        inside:
          kind: class
          stopBy: end
          has:
            field: name
            kind: constant
            regex: Controller$
      - any:
        - has:
            stopBy: end
            kind: string
            regex: (?i)^['"](stripe-signature|x-twilio-signature|svix-signature|x-hub-signature-256|x-hub-signature|webhook-signature|HTTP_STRIPE_SIGNATURE|HTTP_X_TWILIO_SIGNATURE|HTTP_SVIX_SIGNATURE|HTTP_X_HUB_SIGNATURE_256|HTTP_X_HUB_SIGNATURE|HTTP_WEBHOOK_SIGNATURE)['"]$
        - has:
            stopBy: end
            any:
            - kind: call
              has:
                field: method
                kind: identifier
                regex: ^(construct_event)$
  - kind: call
    inside:
      stopBy: end
      all:
      - kind: method
        inside:
          kind: class
          stopBy: end
          has:
            field: name
            kind: constant
            regex: Controller$
      - any:
        - has:
            stopBy: end
            kind: string
            regex: (?i)^['"](stripe-signature|x-twilio-signature|svix-signature|x-hub-signature-256|x-hub-signature|webhook-signature|HTTP_STRIPE_SIGNATURE|HTTP_X_TWILIO_SIGNATURE|HTTP_SVIX_SIGNATURE|HTTP_X_HUB_SIGNATURE_256|HTTP_X_HUB_SIGNATURE|HTTP_WEBHOOK_SIGNATURE)['"]$
        - has:
            stopBy: end
            any:
            - kind: call
              has:
                field: method
                kind: identifier
                regex: ^(construct_event)$
    all:
    - has:
        field: method
        kind: identifier
        regex: ^(construct_event)$
    - has:
        field: arguments
        kind: argument_list
        any:
        - kind: argument_list
          regex: '\btolerance:'
        - kind: argument_list
          regex: ^\((?:[^,()]|\((?:[^()]|\([^()]*\))*\))*,(?:[^,()]|\((?:[^()]|\([^()]*\))*\))*,(?:[^,()]|\((?:[^()]|\([^()]*\))*\))*,
min_engine: 0.39.0
