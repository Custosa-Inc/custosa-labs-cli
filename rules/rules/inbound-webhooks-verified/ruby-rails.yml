# items-hmac: an action that reads a provider signature header and computes an HMAC itself (OpenSSL::HMAC). The
# control is a constant-time compare (secure_compare). With it, needs_review; without, fail.
id: inbound-webhooks-verified.ruby-rails.items-hmac
practice_id: inbound-webhooks-verified
language: ruby
frameworks:
- rails
kind: items
rule:
  all:
  - kind: method
    inside:
      kind: class
      stopBy: end
      has:
        field: name
        kind: constant
        regex: Controller$
  - has:
      stopBy: end
      kind: string
      regex: (?i)^['"](stripe-signature|x-twilio-signature|svix-signature|x-hub-signature-256|x-hub-signature|webhook-signature|HTTP_STRIPE_SIGNATURE|HTTP_X_TWILIO_SIGNATURE|HTTP_SVIX_SIGNATURE|HTTP_X_HUB_SIGNATURE_256|HTTP_X_HUB_SIGNATURE|HTTP_WEBHOOK_SIGNATURE)['"]$
  - has:
      stopBy: end
      kind: call
      regex: ^OpenSSL::HMAC\.(hexdigest|digest|base64digest)\b
control:
  has:
    stopBy: end
    kind: call
    has:
      field: method
      kind: identifier
      regex: ^(secure_compare|fixed_length_secure_compare)$
min_engine: 0.39.0
