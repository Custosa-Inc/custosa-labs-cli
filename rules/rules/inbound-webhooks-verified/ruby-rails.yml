# inbound-webhooks-verified (T23 B32, design v3 2.2.2). Written by scripts/gen_webhook_rules.py: edit that script,
# never this file. The rule id's last part is the form (items-sdk, items-hmac, violation, webhook-route,
# replay-dedupe), which the practice function reads, since a match carries only one has_control. replay-dedupe matches
# the items-sdk handler itself, so the function joins the two on path and line.

# items-sdk: a controller action that reads a provider signature header (by name or through request.env) or calls a
# provider SDK's verifying parse (Stripe::Webhook.construct_event), and computes no HMAC itself. The control is the
# SDK's verify call with the raw body read (request.body.read or raw_post), or a call the provider signs without it
# (Twilio's form check). No control: fail. The control holds only when no data call (a data-layer receiver or ORM
# model) comes before the verify call in the handler's text.
id: inbound-webhooks-verified.ruby-rails.items-sdk
practice_id: inbound-webhooks-verified
language: ruby
frameworks:
- rails
kind: items
rule:
  all:
  - kind: method
    inside:
      kind: class
      stopBy: end
      has:
        field: name
        kind: constant
        regex: Controller$
  - any:
    - has:
        stopBy: end
        kind: string
        regex: (?i)^['"](stripe-signature|x-twilio-signature|svix-signature|x-hub-signature-256|x-hub-signature|webhook-signature|HTTP_STRIPE_SIGNATURE|HTTP_X_TWILIO_SIGNATURE|HTTP_SVIX_SIGNATURE|HTTP_X_HUB_SIGNATURE_256|HTTP_X_HUB_SIGNATURE|HTTP_WEBHOOK_SIGNATURE)['"]$
    - has:
        stopBy: end
        any:
        - kind: call
          has:
            field: method
            kind: identifier
            regex: ^(construct_event)$
  - not:
      has:
        stopBy: end
        kind: call
        regex: ^OpenSSL::HMAC\.(hexdigest|digest|base64digest)\b
control:
  all:
  - any:
    - all:
      - has:
          stopBy: end
          any:
          - all:
            - all:
              - any:
                - any:
                  - kind: call
                    has:
                      field: method
                      kind: identifier
                      regex: ^(construct_event)$
                - all:
                  - any:
                    - kind: call
                      all:
                      - has:
                          field: receiver
                          kind: identifier
                          regex: (?i)^\w*(wh|webhooks?|svix|hook|validator)\w*$
                      - has:
                          field: method
                          kind: identifier
                          regex: ^(verify)$
                  - inside:
                      stopBy: end
                      kind: program
                      has:
                        stopBy: end
                        any:
                        - kind: scope_resolution
                          regex: '^(Svix)::'
                        - kind: call
                          regex: (?i)^require\s*\(?\s*['\"](svix)
              - not:
                  any:
                  - inside:
                      stopBy: end
                      kind: begin
                      has:
                        kind: rescue
                        not:
                          has:
                            kind: then
                            has:
                              any:
                              - kind: return
                              - kind: call
                                regex: ^raise\b
                              - kind: identifier
                                regex: ^raise$
                              - kind: binary
                                regex: ^(head|render|redirect_to)\b
                                has:
                                  kind: return
                  - inside:
                      stopBy: end
                      kind: rescue_modifier
            - not:
                inside:
                  stopBy: end
                  any:
                  - kind: lambda
                  - any:
                    - kind: block
                    - kind: do_block
                    inside:
                      kind: call
                      regex: ^(lambda|proc|Proc\s*\.\s*new|(Thread|Fiber)\s*\.\s*(new|start|fork)|([\w:.]+\s*\.\s*)?define_(singleton_)?method)\b
      - has:
          stopBy: end
          kind: call
          regex: \b(body\.read|raw_post)$
    - has:
        stopBy: end
        any:
        - all:
          - all:
            - any:
              - all:
                - any:
                  - kind: call
                    all:
                    - has:
                        field: receiver
                        kind: identifier
                        regex: (?i)^\w*(wh|webhooks?|svix|hook|validator)\w*$
                    - has:
                        field: method
                        kind: identifier
                        regex: ^(validate)$
                - inside:
                    stopBy: end
                    kind: program
                    has:
                      stopBy: end
                      any:
                      - kind: scope_resolution
                        regex: '^(Twilio)::'
                      - kind: call
                        regex: (?i)^require\s*\(?\s*['\"](twilio)
            - any:
              - inside:
                  field: condition
                  any:
                  - kind: unless
                    has:
                      kind: then
                      has:
                        any:
                        - kind: return
                        - kind: call
                          regex: ^raise\b
                        - kind: identifier
                          regex: ^raise$
                        - kind: binary
                          regex: ^(head|render|redirect_to)\b
                          has:
                            kind: return
                  - kind: unless_modifier
                    has:
                      field: body
                      any:
                      - kind: return
                      - kind: call
                        regex: ^raise\b
                      - kind: identifier
                        regex: ^raise$
                      - kind: binary
                        regex: ^(head|render|redirect_to)\b
                        has:
                          kind: return
              - inside:
                  kind: unary
                  regex: ^(!|not\b)
                  inside:
                    field: condition
                    any:
                    - kind: if
                      has:
                        kind: then
                        has:
                          any:
                          - kind: return
                          - kind: call
                            regex: ^raise\b
                          - kind: identifier
                            regex: ^raise$
                          - kind: binary
                            regex: ^(head|render|redirect_to)\b
                            has:
                              kind: return
                    - kind: if_modifier
                      has:
                        field: body
                        any:
                        - kind: return
                        - kind: call
                          regex: ^raise\b
                        - kind: identifier
                          regex: ^raise$
                        - kind: binary
                          regex: ^(head|render|redirect_to)\b
                          has:
                            kind: return
              - all:
                - inside:
                    kind: assignment
                - any:
                  - inside:
                      stopBy: end
                      kind: assignment
                      pattern: $OK = $V
                      precedes:
                        kind: unless
                        has:
                          kind: then
                          has:
                            any:
                            - kind: return
                            - kind: call
                              regex: ^raise\b
                            - kind: identifier
                              regex: ^raise$
                            - kind: binary
                              regex: ^(head|render|redirect_to)\b
                              has:
                                kind: return
                        pattern: 'unless $OK

                          $$$B

                          end'
                  - inside:
                      stopBy: end
                      kind: assignment
                      pattern: $OK = $V
                      precedes:
                        kind: unless_modifier
                        has:
                          field: body
                          any:
                          - kind: return
                          - kind: call
                            regex: ^raise\b
                          - kind: identifier
                            regex: ^raise$
                          - kind: binary
                            regex: ^(head|render|redirect_to)\b
                            has:
                              kind: return
                        pattern: $B unless $OK
                  - inside:
                      stopBy: end
                      kind: assignment
                      pattern: $OK = $V
                      precedes:
                        kind: if
                        has:
                          kind: then
                          has:
                            any:
                            - kind: return
                            - kind: call
                              regex: ^raise\b
                            - kind: identifier
                              regex: ^raise$
                            - kind: binary
                              regex: ^(head|render|redirect_to)\b
                              has:
                                kind: return
                        all:
                        - has:
                            field: condition
                            kind: unary
                            pattern: '!$OK'
                  - inside:
                      stopBy: end
                      kind: assignment
                      pattern: $OK = $V
                      precedes:
                        kind: if
                        has:
                          kind: then
                          has:
                            any:
                            - kind: return
                            - kind: call
                              regex: ^raise\b
                            - kind: identifier
                              regex: ^raise$
                            - kind: binary
                              regex: ^(head|render|redirect_to)\b
                              has:
                                kind: return
                        all:
                        - has:
                            field: condition
                            kind: unary
                            pattern: not $OK
                  - inside:
                      stopBy: end
                      kind: assignment
                      pattern: $OK = $V
                      precedes:
                        kind: if_modifier
                        has:
                          field: body
                          any:
                          - kind: return
                          - kind: call
                            regex: ^raise\b
                          - kind: identifier
                            regex: ^raise$
                          - kind: binary
                            regex: ^(head|render|redirect_to)\b
                            has:
                              kind: return
                        pattern: $B if !$OK
                  - inside:
                      stopBy: end
                      kind: assignment
                      pattern: $OK = $V
                      precedes:
                        kind: if_modifier
                        has:
                          field: body
                          any:
                          - kind: return
                          - kind: call
                            regex: ^raise\b
                          - kind: identifier
                            regex: ^raise$
                          - kind: binary
                            regex: ^(head|render|redirect_to)\b
                            has:
                              kind: return
                        pattern: $B if not $OK
          - not:
              inside:
                stopBy: end
                any:
                - kind: lambda
                - any:
                  - kind: block
                  - kind: do_block
                  inside:
                    kind: call
                    regex: ^(lambda|proc|Proc\s*\.\s*new|(Thread|Fiber)\s*\.\s*(new|start|fork)|([\w:.]+\s*\.\s*)?define_(singleton_)?method)\b
  - not:
      any:
      - kind: method
        regex: (?s)\b[A-Z]\w*\.(create|find|find_by|find_or_create_by|where|update|update_all|insert|insert_all|upsert|upsert_all|destroy|destroy_all|delete|delete_all)\b.*\b(construct_event|validate|verify)\b
min_engine: 0.39.0
