# session-gate: an entry handler whose first statement (or the one right after a first declaration of the lookup) is
# an if that negates a user-session lookup from a known auth library alone and returns or throws (B32p 9.2). Evidence:
# the entry is user-gated for the pass; never an object of its own.
id: inbound-webhooks-verified.ruby-rails.session-gate
practice_id: inbound-webhooks-verified
language: ruby
frameworks:
- rails
kind: evidence
rule:
  all:
  - any:
    - kind: call
      regex: ^authenticate_[a-z_]+!$
    - kind: unless_modifier
      has:
        field: body
        any:
        - kind: return
        - kind: call
          regex: ^raise\b
        - kind: identifier
          regex: ^raise$
        - kind: binary
          regex: ^(head|render|redirect_to)\b
          has:
            kind: return
      regex: \bunless\s+(user_signed_in\?|current_user)\s*$
  - inside:
      kind: body_statement
      inside:
        kind: method
  - any:
    - not:
        follows:
          stopBy: neighbor
          any:
          - any:
            - kind: comment
          - not:
              any:
              - kind: comment
    - follows:
        stopBy: neighbor
        all:
        - any:
          - kind: comment
        - any:
          - not:
              follows:
                stopBy: neighbor
                any:
                - any:
                  - kind: comment
                - not:
                    any:
                    - kind: comment
          - follows:
              stopBy: neighbor
              all:
              - any:
                - kind: comment
              - any:
                - not:
                    follows:
                      stopBy: neighbor
                      any:
                      - any:
                        - kind: comment
                      - not:
                          any:
                          - kind: comment
                - follows:
                    stopBy: neighbor
                    all:
                    - any:
                      - kind: comment
                    - not:
                        follows:
                          stopBy: neighbor
                          any:
                          - any:
                            - kind: comment
                          - not:
                              any:
                              - kind: comment
min_engine: 0.39.0
