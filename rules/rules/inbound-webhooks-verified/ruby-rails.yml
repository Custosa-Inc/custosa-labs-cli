# header-unread: a request header read by a name that is no literal: a variable, a member or a constant (B32p C6), so
# it can't be checked against the providers' signature headers. Evidence: no pass while it is seen; never an object of
# its own.
id: inbound-webhooks-verified.ruby-rails.header-unread
practice_id: inbound-webhooks-verified
language: ruby
frameworks:
- rails
kind: evidence
rule:
  any:
  - kind: element_reference
    regex: ^request\s*\.\s*(headers|env)\s*\[\s*[A-Za-z_@]
  - kind: call
    regex: ^request\s*\.\s*headers\s*\.\s*fetch\s*\(\s*[A-Za-z_@]
min_engine: 0.39.0
