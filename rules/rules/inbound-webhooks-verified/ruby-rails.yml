# payload-before-verify: an items-sdk handler (the same match, so the same path and line) whose text has a helper (a
# bare call, or one on self, this or $this) given the body, event or payload, then later a verify call (B32p 5.2).
# Evidence: no pass while it is seen, until the stem reads what the helper does; never an object of its own.
id: inbound-webhooks-verified.ruby-rails.payload-before-verify
practice_id: inbound-webhooks-verified
language: ruby
frameworks:
- rails
kind: evidence
rule:
  all:
  - all:
    - kind: method
      inside:
        kind: class
        stopBy: end
        has:
          field: name
          kind: constant
          regex: Controller$
    - any:
      - has:
          stopBy: end
          kind: string
          regex: (?i)^['"](stripe-signature|x-twilio-signature|svix-signature|x-hub-signature-256|x-hub-signature|webhook-signature|HTTP_STRIPE_SIGNATURE|HTTP_X_TWILIO_SIGNATURE|HTTP_SVIX_SIGNATURE|HTTP_X_HUB_SIGNATURE_256|HTTP_X_HUB_SIGNATURE|HTTP_WEBHOOK_SIGNATURE)['"]$
      - has:
          stopBy: end
          any:
          - kind: call
            has:
              field: method
              kind: identifier
              regex: ^(construct_event)$
    - not:
        has:
          stopBy: end
          kind: call
          regex: ^OpenSSL::HMAC\.(hexdigest|digest|base64digest)\b
  - any:
    - kind: method
      regex: (?s)(\n[ \t]*|=\s*|[(,]\s*|\b(return|await|yield|go|defer)\s+)(self\s*\.\s*)?[a-z_]\w*[!?]?\s*\(\s*((body|event|evt|payload|data|params|request\s*\.\s*(body|raw_post))\b).*\b(construct_event|validate|verify)\b
min_engine: 0.39.0
