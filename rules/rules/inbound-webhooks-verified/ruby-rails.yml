# replay-dedupe: an items-sdk handler (the same match, so the same path and line) that rejects a repeated event: a
# data call inserting the event id with ON CONFLICT, INSERT IGNORE, ON DUPLICATE KEY, upsert, onConflict or the like,
# whose result is tested right after (or in the condition) by an if that returns or throws; or a try around an insert
# of the event id whose catch names a unique violation (23505, 1062, P2002, IntegrityError, RecordNotUnique,
# DuplicateKey) and returns. No data call may come before it. A table name or a log line alone never counts. Evidence:
# with the SDK control, it allows the pass once Q6 is ruled.
id: inbound-webhooks-verified.ruby-rails.replay-dedupe
practice_id: inbound-webhooks-verified
language: ruby
frameworks:
- rails
kind: evidence
rule:
  all:
  - kind: method
    inside:
      kind: class
      stopBy: end
      has:
        field: name
        kind: constant
        regex: Controller$
  - any:
    - has:
        stopBy: end
        kind: string
        regex: (?i)^['"](stripe-signature|x-twilio-signature|svix-signature|x-hub-signature-256|x-hub-signature|webhook-signature|HTTP_STRIPE_SIGNATURE|HTTP_X_TWILIO_SIGNATURE|HTTP_SVIX_SIGNATURE|HTTP_X_HUB_SIGNATURE_256|HTTP_X_HUB_SIGNATURE|HTTP_WEBHOOK_SIGNATURE)['"]$
    - has:
        stopBy: end
        any:
        - kind: call
          has:
            field: method
            kind: identifier
            regex: ^(construct_event)$
  - not:
      has:
        stopBy: end
        kind: call
        regex: ^OpenSSL::HMAC\.(hexdigest|digest|base64digest)\b
  - has:
      stopBy: end
      any:
      - all:
        - any:
          - all:
            - kind: call
              regex: (?i)(\bON\s+CONFLICT\b|\bINSERT\s+IGNORE\b|\bON\s+DUPLICATE\s+KEY\b|\bon_?conflict|\bupsert|\binsert_?or_?ignore|\bignore_?duplicates|\bskip_?duplicates|\bunique_by\b)
            - kind: call
              regex: (?i)(\b(event|evt)\s*(\?\.|\.|->)\s*(id\b|getId\(\))|\b(event|evt)\s*\[\s*:?['\"]?id['\"]?\s*\]|\bevent_?id\b)
            - kind: call
              has:
                field: method
                kind: identifier
                regex: (?i)(^|\.)(insert|create|save|add|put|persist|exec|execute|query|update|upsert|run|raw|sql|on_?conflict|ignore|merge)\w*[!?]?$
        - any:
          - inside:
              stopBy: end
              any:
              - kind: assignment
              precedes:
                any:
                - kind: unless
                  has:
                    kind: then
                    has:
                      any:
                      - kind: return
                      - kind: call
                        regex: ^raise\b
                      - kind: identifier
                        regex: ^raise$
                      - kind: binary
                        regex: ^(head|render|redirect_to)\b
                        has:
                          kind: return
                - kind: if
                  has:
                    kind: then
                    has:
                      any:
                      - kind: return
                      - kind: call
                        regex: ^raise\b
                      - kind: identifier
                        regex: ^raise$
                      - kind: binary
                        regex: ^(head|render|redirect_to)\b
                        has:
                          kind: return
                - kind: unless_modifier
                  has:
                    field: body
                    any:
                    - kind: return
                    - kind: call
                      regex: ^raise\b
                    - kind: identifier
                      regex: ^raise$
                    - kind: binary
                      regex: ^(head|render|redirect_to)\b
                      has:
                        kind: return
                - kind: if_modifier
                  has:
                    field: body
                    any:
                    - kind: return
                    - kind: call
                      regex: ^raise\b
                    - kind: identifier
                      regex: ^raise$
                    - kind: binary
                      regex: ^(head|render|redirect_to)\b
                      has:
                        kind: return
      - kind: begin
        all:
        - has:
            kind: rescue
            regex: (?is)(\b23505\b|\b1062\b|ER_DUP_ENTRY|\bP2002\b|unique_?violation|UniqueConstraintViolation|IntegrityError|RecordNotUnique|DuplicateKey|SQLIntegrityConstraintViolation|duplicate key).{0,160}?\breturn\b
        - has:
            stopBy: end
            any:
            - all:
              - kind: call
                regex: (?i)\b(insert|create|save|add|put|persist|exec|execute|query|update)\w*\s*[!?]?\s*\(
              - kind: call
                regex: (?i)(\b(event|evt)\s*(\?\.|\.|->)\s*(id\b|getId\(\))|\b(event|evt)\s*\[\s*:?['\"]?id['\"]?\s*\]|\bevent_?id\b)
            not:
              inside:
                stopBy: end
                kind: rescue
      - kind: body_statement
        inside:
          kind: method
        all:
        - has:
            kind: rescue
            regex: (?i)(\b23505\b|\b1062\b|ER_DUP_ENTRY|\bP2002\b|unique_?violation|UniqueConstraintViolation|IntegrityError|RecordNotUnique|DuplicateKey|SQLIntegrityConstraintViolation|duplicate key)
        - has:
            stopBy: end
            any:
            - all:
              - kind: call
                regex: (?i)\b(insert|create|save|add|put|persist|exec|execute|query|update)\w*\s*[!?]?\s*\(
              - kind: call
                regex: (?i)(\b(event|evt)\s*(\?\.|\.|->)\s*(id\b|getId\(\))|\b(event|evt)\s*\[\s*:?['\"]?id['\"]?\s*\]|\bevent_?id\b)
            not:
              inside:
                stopBy: end
                kind: rescue
  - not:
      any:
      - kind: method
        regex: (?s)\b[A-Z]\w*\.(create|find|find_by|find_or_create_by|where|update|update_all|insert|insert_all|upsert|upsert_all|destroy|destroy_all|delete|delete_all)\b.*\b[A-Z]\w*\.(create|find|find_by|find_or_create_by|where|update|update_all|insert|insert_all|upsert|upsert_all|destroy|destroy_all|delete|delete_all)\b.{0,400}?((\bON\s+CONFLICT\b|\bINSERT\s+IGNORE\b|\bON\s+DUPLICATE\s+KEY\b|\bon_?conflict|\bupsert|\binsert_?or_?ignore|\bignore_?duplicates|\bskip_?duplicates|\bunique_by\b))
