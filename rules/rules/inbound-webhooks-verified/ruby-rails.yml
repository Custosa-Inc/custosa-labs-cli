# webhook-route: a route whose path names a webhook, hook, callback or notify endpoint, or a handler (or its class,
# controller or module) named for one, that reads no provider signature. Evidence: needs_review naming it.
id: inbound-webhooks-verified.ruby-rails.webhook-route
practice_id: inbound-webhooks-verified
language: ruby
frameworks:
- rails
kind: evidence
rule:
  all:
  - kind: method
    inside:
      kind: class
      stopBy: end
      has:
        field: name
        kind: constant
        regex: Controller$
  - any:
    - has:
        field: name
        kind: identifier
        regex: (?i)(webhooks?|hooks?|callbacks?|notify)
    - all:
      - any:
        - inside:
            stopBy: end
            kind: class
            has:
              field: name
              any:
              - kind: constant
                regex: (?i)(webhooks?|hooks?|callbacks?|notify)
              - kind: scope_resolution
                regex: (?i)(webhooks?|hooks?|callbacks?|notify)
        - inside:
            stopBy: end
            kind: module
            has:
              field: name
              any:
              - kind: constant
                regex: (?i)(webhooks?|hooks?|callbacks?|notify)
              - kind: scope_resolution
                regex: (?i)(webhooks?|hooks?|callbacks?|notify)
      - not:
          has:
            field: name
            kind: identifier
            regex: ^(index|show|new|edit)$
  - not:
      any:
      - has:
          stopBy: end
          kind: string
          regex: (?i)^['"](stripe-signature|x-twilio-signature|svix-signature|x-hub-signature-256|x-hub-signature|webhook-signature|HTTP_STRIPE_SIGNATURE|HTTP_X_TWILIO_SIGNATURE|HTTP_SVIX_SIGNATURE|HTTP_X_HUB_SIGNATURE_256|HTTP_X_HUB_SIGNATURE|HTTP_WEBHOOK_SIGNATURE)['"]$
      - has:
          stopBy: end
          any:
          - kind: call
            has:
              field: method
              kind: identifier
              regex: ^(construct_event)$
min_engine: 0.39.0
