# route-unread: a route registration the inventory can't place (B32p C2): in the routes block, a path that is no
# literal (a name, a constant, an interpolated string), or a mount, draw, namespace or scope. Evidence: no pass while
# it is seen; never an object of its own.
id: inbound-webhooks-verified.ruby-rails.route-unread
practice_id: inbound-webhooks-verified
language: ruby
frameworks:
- rails
kind: evidence
rule:
  any:
  - all:
    - kind: call
      regex: ^(get|post|put|patch|delete|match)\b
      inside:
        stopBy: end
        kind: call
        regex: ^Rails\s*\.\s*application\s*\.\s*routes\s*\.\s*draw\b
      has:
        field: method
        kind: identifier
        regex: ^(get|post|put|patch|delete|match)$
    - has:
        field: arguments
        kind: argument_list
        regex: (?s)^\(?\s*([a-z_]\w*\s*(,|$)|[A-Z]\w*(::\w+)*\s*(,|$)|\"[^\"]*#\{)
  - kind: call
    regex: ^(mount|draw|namespace|scope)\b
    inside:
      stopBy: end
      kind: call
      regex: ^Rails\s*\.\s*application\s*\.\s*routes\s*\.\s*draw\b
    has:
      field: method
      kind: identifier
      regex: ^(mount|draw|namespace|scope)$
min_engine: 0.39.0
