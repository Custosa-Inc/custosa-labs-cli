# items-hmac: a view that reads a provider signature header and computes an HMAC itself (hmac.new, hmac.digest). The
# control is a constant-time compare (compare_digest). With it, needs_review; without, fail.
id: inbound-webhooks-verified.python-fastapi.items-hmac
practice_id: inbound-webhooks-verified
language: python
frameworks:
- fastapi
kind: items
rule:
  all:
  - kind: function_definition
    inside:
      kind: decorated_definition
      has:
        kind: decorator
        regex: ^@\w+\.(get|post|put|patch|delete|api_route)\(
  - has:
      stopBy: end
      kind: string
      regex: (?i)^[rbu]*['"](stripe-signature|x-twilio-signature|svix-signature|x-hub-signature-256|x-hub-signature|webhook-signature|HTTP_STRIPE_SIGNATURE|HTTP_X_TWILIO_SIGNATURE|HTTP_SVIX_SIGNATURE|HTTP_X_HUB_SIGNATURE_256|HTTP_X_HUB_SIGNATURE|HTTP_WEBHOOK_SIGNATURE)['"]$
  - has:
      stopBy: end
      kind: call
      has:
        field: function
        kind: attribute
        regex: ^hmac\.(new|digest)$
control:
  has:
    stopBy:
      kind: decorated_definition
      has:
        kind: decorator
        regex: (?i)^@((app|api|server|routes?|bp|blueprint|\w*router|\w*app|\w*_bp)\.(route|get|post|put|patch|delete|api_route)\(|\w+\.(route|get|post|put|patch|delete|api_route)\(\s*[rbuf]*['\"]/)
    kind: call
    has:
      field: function
      any:
      - kind: identifier
        regex: (^|\.)compare_digest$
      - kind: attribute
        regex: (^|\.)compare_digest$
min_engine: 0.39.0
