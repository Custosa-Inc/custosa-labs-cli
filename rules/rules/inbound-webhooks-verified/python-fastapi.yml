# replay-dedupe: an items-sdk handler (the same match, so the same path and line) that rejects a repeated event: a
# data call inserting the event id with ON CONFLICT, INSERT IGNORE, ON DUPLICATE KEY, upsert, onConflict or the like,
# whose result is tested right after (or in the condition) by an if that returns or throws; or a try around an insert
# of the event id whose catch names a unique violation (23505, 1062, P2002, IntegrityError, RecordNotUnique,
# DuplicateKey) and returns. No data call may come before it. A table name or a log line alone never counts. Evidence:
# with the SDK control, it allows the pass once Q6 is ruled.
id: inbound-webhooks-verified.python-fastapi.replay-dedupe
practice_id: inbound-webhooks-verified
language: python
frameworks:
- fastapi
kind: evidence
rule:
  all:
  - kind: function_definition
    inside:
      kind: decorated_definition
      has:
        kind: decorator
        regex: ^@\w+\.(get|post|put|patch|delete|api_route)\(
  - any:
    - has:
        stopBy: end
        kind: string
        regex: (?i)^[rbu]*['"](stripe-signature|x-twilio-signature|svix-signature|x-hub-signature-256|x-hub-signature|webhook-signature|HTTP_STRIPE_SIGNATURE|HTTP_X_TWILIO_SIGNATURE|HTTP_SVIX_SIGNATURE|HTTP_X_HUB_SIGNATURE_256|HTTP_X_HUB_SIGNATURE|HTTP_WEBHOOK_SIGNATURE)['"]$
    - has:
        stopBy: end
        any:
        - kind: call
          has:
            field: function
            any:
            - kind: identifier
              regex: (^|\.)(construct_event)$
            - kind: attribute
              regex: (^|\.)(construct_event)$
  - not:
      has:
        stopBy: end
        kind: call
        has:
          field: function
          kind: attribute
          regex: ^hmac\.(new|digest)$
  - has:
      stopBy: end
      any:
      - all:
        - any:
          - all:
            - kind: call
              regex: (?i)(\bON\s+CONFLICT\b|\bINSERT\s+IGNORE\b|\bON\s+DUPLICATE\s+KEY\b|\bon_?conflict|\bupsert|\binsert_?or_?ignore|\bignore_?duplicates|\bskip_?duplicates|\bunique_by\b)
            - kind: call
              regex: (?i)(\b(event|evt)\s*(\?\.|\.|->)\s*(id\b|getId\(\))|\b(event|evt)\s*\[\s*:?['\"]?id['\"]?\s*\]|\bevent_?id\b)
            - kind: call
              has:
                field: function
                any:
                - kind: identifier
                  regex: (?i)(^|\.)(insert|create|save|add|put|persist|exec|execute|query|update|upsert|run|raw|sql|on_?conflict|ignore|merge)\w*[!?]?$
                - kind: attribute
                  regex: (?i)(^|\.)(insert|create|save|add|put|persist|exec|execute|query|update|upsert|run|raw|sql|on_?conflict|ignore|merge)\w*[!?]?$
        - any:
          - inside:
              stopBy: end
              any:
              - kind: expression_statement
              precedes:
                kind: if_statement
                has:
                  field: consequence
                  kind: block
                  has:
                    any:
                    - kind: return_statement
                    - kind: raise_statement
                    - kind: expression_statement
                      regex: ^abort\s*\(
          - inside:
              stopBy: end
              any:
              - kind: comparison_operator
              - kind: not_operator
              - kind: boolean_operator
              inside:
                kind: if_statement
                has:
                  field: consequence
                  kind: block
                  has:
                    any:
                    - kind: return_statement
                    - kind: raise_statement
                    - kind: expression_statement
                      regex: ^abort\s*\(
      - kind: try_statement
        all:
        - has:
            kind: except_clause
            regex: (?is)(\b23505\b|\b1062\b|ER_DUP_ENTRY|\bP2002\b|unique_?violation|UniqueConstraintViolation|IntegrityError|RecordNotUnique|DuplicateKey|SQLIntegrityConstraintViolation|duplicate key).{0,160}?\breturn\b
        - has:
            stopBy: end
            any:
            - all:
              - kind: call
                regex: (?i)\b(insert|create|save|add|put|persist|exec|execute|query|update)\w*\s*[!?]?\s*\(
              - kind: call
                regex: (?i)(\b(event|evt)\s*(\?\.|\.|->)\s*(id\b|getId\(\))|\b(event|evt)\s*\[\s*:?['\"]?id['\"]?\s*\]|\bevent_?id\b)
            not:
              inside:
                stopBy: end
                kind: except_clause
  - not:
      any:
      - kind: function_definition
        regex: (?s)(\b(db|session|cursor|cur|conn|connection|engine)(\s*\.\s*\w+)*\s*\.\s*(execute|executemany|add|add_all|query|merge|delete|insert\w*|update\w*|scalars?)\s*\(|\b[A-Z]\w*\.objects\b).*(\b(db|session|cursor|cur|conn|connection|engine)(\s*\.\s*\w+)*\s*\.\s*(execute|executemany|add|add_all|query|merge|delete|insert\w*|update\w*|scalars?)\s*\(|\b[A-Z]\w*\.objects\b).{0,400}?((\bON\s+CONFLICT\b|\bINSERT\s+IGNORE\b|\bON\s+DUPLICATE\s+KEY\b|\bon_?conflict|\bupsert|\binsert_?or_?ignore|\bignore_?duplicates|\bskip_?duplicates|\bunique_by\b))
min_engine: 0.39.0
