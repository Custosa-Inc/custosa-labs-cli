# webhook-route: a route whose path names a webhook, hook, callback or notify endpoint, or a handler (or its class,
# controller or module) named for one, that reads no provider signature. Evidence: needs_review naming it.
id: inbound-webhooks-verified.python-fastapi.webhook-route
practice_id: inbound-webhooks-verified
language: python
frameworks:
- fastapi
kind: evidence
rule:
  all:
  - any:
    - kind: function_definition
      inside:
        kind: decorated_definition
        has:
          kind: decorator
          regex: (?i)^@\w+\.\w+\(\s*[rbuf]*['\"]/([^'\"]*[/_-])?(webhooks?|hooks?|callbacks?|notify)([/_.-][^'\"]*)?['\"]
    - all:
      - kind: function_definition
        inside:
          kind: decorated_definition
          has:
            kind: decorator
            regex: ^@\w+\.(get|post|put|patch|delete|api_route)\(
      - has:
          field: name
          kind: identifier
          regex: (?i)(webhooks?|hooks?|callbacks?|notify)
  - not:
      any:
      - has:
          stopBy: end
          kind: string
          regex: (?i)^[rbu]*['"](stripe-signature|x-twilio-signature|svix-signature|x-hub-signature-256|x-hub-signature|webhook-signature|HTTP_STRIPE_SIGNATURE|HTTP_X_TWILIO_SIGNATURE|HTTP_SVIX_SIGNATURE|HTTP_X_HUB_SIGNATURE_256|HTTP_X_HUB_SIGNATURE|HTTP_WEBHOOK_SIGNATURE)['"]$
      - has:
          stopBy: end
          any:
          - kind: call
            has:
              field: function
              any:
              - kind: identifier
                regex: (^|\.)(construct_event)$
              - kind: attribute
                regex: (^|\.)(construct_event)$
min_engine: 0.39.0
