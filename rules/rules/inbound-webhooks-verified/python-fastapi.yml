# entry: an entry point that can take a request body (B32p E): a post, put, patch or all route's handler, a get or
# head handler that reads the query or params, a function given to use, or such a route with its handler passed by
# name. Evidence for the pass, which needs every entry verified or user-gated; never an object of its own.
id: inbound-webhooks-verified.python-fastapi.entry
practice_id: inbound-webhooks-verified
language: python
frameworks:
- fastapi
kind: evidence
rule:
  kind: function_definition
  any:
  - inside:
      kind: decorated_definition
      has:
        kind: decorator
        regex: (?i)^@(app|api|server|routes?|bp|blueprint|\w*router|\w*app|\w*_bp)\.(post|put|patch|api_route)\(
  - inside:
      kind: decorated_definition
      has:
        kind: decorator
        regex: (?is)^@(app|api|server|routes?|bp|blueprint|\w*router|\w*app|\w*_bp)\.route\(.*\bmethods\s*=.*\b(POST|PUT|PATCH)\b
  - all:
    - inside:
        kind: decorated_definition
        has:
          kind: decorator
          regex: (?i)^@(app|api|server|routes?|bp|blueprint|\w*router|\w*app|\w*_bp)\.(get|head|route)\(
    - any:
      - kind: function_definition
        regex: \brequest\s*\.\s*(args|values|query_params|path_params|view_args|GET)\b
      - has:
          field: parameters
          kind: parameters
          not:
            kind: parameters
            regex: ^\(\s*(request\s*(:\s*\w+)?\s*,?\s*)?\)$
min_engine: 0.39.0
