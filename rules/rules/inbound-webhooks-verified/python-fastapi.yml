# violation: in a signature-reading view: a signature compared with == or !=, construct_event given a tolerance, or
# the body parsed as JSON (request.json, get_json()) in a view that verifies with an SDK. Fail.
id: inbound-webhooks-verified.python-fastapi.violation
practice_id: inbound-webhooks-verified
language: python
frameworks:
- fastapi
kind: violation
rule:
  any:
  - all:
    - kind: comparison_operator
      regex: (?i)sig
    - kind: comparison_operator
      regex: '[!=]='
    inside:
      stopBy: end
      all:
      - kind: function_definition
        inside:
          kind: decorated_definition
          has:
            kind: decorator
            regex: ^@\w+\.(get|post|put|patch|delete|api_route)\(
      - any:
        - has:
            stopBy: end
            kind: string
            regex: (?i)^[rbu]*['"](stripe-signature|x-twilio-signature|svix-signature|x-hub-signature-256|x-hub-signature|webhook-signature|HTTP_STRIPE_SIGNATURE|HTTP_X_TWILIO_SIGNATURE|HTTP_SVIX_SIGNATURE|HTTP_X_HUB_SIGNATURE_256|HTTP_X_HUB_SIGNATURE|HTTP_WEBHOOK_SIGNATURE)['"]$
        - has:
            stopBy: end
            any:
            - kind: call
              has:
                field: function
                any:
                - kind: identifier
                  regex: (^|\.)(construct_event)$
                - kind: attribute
                  regex: (^|\.)(construct_event)$
  - kind: call
    has:
      field: function
      any:
      - kind: identifier
        regex: (^|\.)(construct_event)$
      - kind: attribute
        regex: (^|\.)(construct_event)$
    inside:
      stopBy: end
      all:
      - kind: function_definition
        inside:
          kind: decorated_definition
          has:
            kind: decorator
            regex: ^@\w+\.(get|post|put|patch|delete|api_route)\(
      - any:
        - has:
            stopBy: end
            kind: string
            regex: (?i)^[rbu]*['"](stripe-signature|x-twilio-signature|svix-signature|x-hub-signature-256|x-hub-signature|webhook-signature|HTTP_STRIPE_SIGNATURE|HTTP_X_TWILIO_SIGNATURE|HTTP_SVIX_SIGNATURE|HTTP_X_HUB_SIGNATURE_256|HTTP_X_HUB_SIGNATURE|HTTP_WEBHOOK_SIGNATURE)['"]$
        - has:
            stopBy: end
            any:
            - kind: call
              has:
                field: function
                any:
                - kind: identifier
                  regex: (^|\.)(construct_event)$
                - kind: attribute
                  regex: (^|\.)(construct_event)$
    all:
    - has:
        field: arguments
        kind: argument_list
        any:
        - kind: argument_list
          regex: \btolerance\s*=
        - kind: argument_list
          regex: ^\((?:[^,()]|\((?:[^()]|\([^()]*\))*\))*,(?:[^,()]|\((?:[^()]|\([^()]*\))*\))*,(?:[^,()]|\((?:[^()]|\([^()]*\))*\))*,
  - kind: attribute
    regex: ^request\.(json|get_json)$
    inside:
      stopBy: end
      all:
      - kind: function_definition
        inside:
          kind: decorated_definition
          has:
            kind: decorator
            regex: ^@\w+\.(get|post|put|patch|delete|api_route)\(
      - any:
        - has:
            stopBy: end
            kind: string
            regex: (?i)^[rbu]*['"](stripe-signature|x-twilio-signature|svix-signature|x-hub-signature-256|x-hub-signature|webhook-signature|HTTP_STRIPE_SIGNATURE|HTTP_X_TWILIO_SIGNATURE|HTTP_SVIX_SIGNATURE|HTTP_X_HUB_SIGNATURE_256|HTTP_X_HUB_SIGNATURE|HTTP_WEBHOOK_SIGNATURE)['"]$
        - has:
            stopBy: end
            any:
            - kind: call
              has:
                field: function
                any:
                - kind: identifier
                  regex: (^|\.)(construct_event)$
                - kind: attribute
                  regex: (^|\.)(construct_event)$
      - has:
          stopBy: end
          any:
          - kind: call
            has:
              field: function
              any:
              - kind: identifier
                regex: (^|\.)(construct_event)$
              - kind: attribute
                regex: (^|\.)(construct_event)$
          - kind: call
            has:
              field: function
              kind: attribute
              regex: (?i)^[A-Za-z_]?\w*(wh|webhooks?|svix|hook|validator)\w*\.(validate|verify)$
min_engine: 0.39.0
