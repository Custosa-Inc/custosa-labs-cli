# route-unread: a route registration the inventory can't place (B32p C2): a path that is no literal, a mount, or a
# .route() chain. Evidence: no pass while it is seen; never an object of its own.
id: inbound-webhooks-verified.python-fastapi.route-unread
practice_id: inbound-webhooks-verified
language: python
frameworks:
- fastapi
kind: evidence
rule:
  any:
  - kind: decorator
    regex: (?s)^@\w+\.(route|get|post|put|patch|delete|head|api_route)\(\s*([A-Za-z_][\w.]*\s*[,)+]|[fF][rR]?['\"]|['\"][^'\"]*['\"]\s*\+)
  - kind: call
    all:
    - has:
        field: function
        any:
        - kind: identifier
          regex: ^(include_router|register_blueprint|mount|add_api_route|add_route|add_url_rule|include)$
        - kind: attribute
          regex: \.(include_router|register_blueprint|mount|add_api_route|add_route|add_url_rule|include)$
    - has:
        field: arguments
        kind: argument_list
        regex: ^\(
  - kind: call
    all:
    - has:
        field: function
        any:
        - kind: identifier
          regex: ^(path|re_path|url)$
        - kind: attribute
          regex: \.(path|re_path|url)$
    - has:
        field: arguments
        kind: argument_list
        regex: (?s)^\(\s*([A-Za-z_][\w.]*\s*[,)+]|[fF][rR]?['\"]|['\"][^'\"]*['\"]\s*\+)
min_engine: 0.39.0
