# inbound-webhooks-verified (T23 B32, design v3 2.2.2). Written by scripts/gen_webhook_rules.py: edit that script,
# never this file. The rule id's last part is the form (items-sdk, items-hmac, violation, webhook-route,
# replay-dedupe), which the practice function reads, since a match carries only one has_control. replay-dedupe matches
# the items-sdk handler itself, so the function joins the two on path and line.

# items-sdk: a view that reads a provider signature header (by name or through request.META) or calls a provider SDK's
# verifying parse by name (construct_event), and computes no HMAC itself. The control is the SDK's verify call with
# the raw body read (request.body, request.data, get_data()), or a call the provider signs without it (Twilio's form
# check). No control: fail. The control holds only when no data call (a data-layer receiver or ORM model) comes before
# the verify call in the handler's text.
id: inbound-webhooks-verified.python-fastapi.items-sdk
practice_id: inbound-webhooks-verified
language: python
frameworks:
- fastapi
kind: items
rule:
  all:
  - kind: function_definition
    inside:
      kind: decorated_definition
      has:
        kind: decorator
        regex: ^@\w+\.(get|post|put|patch|delete|api_route)\(
  - any:
    - has:
        stopBy: end
        kind: string
        regex: (?i)^[rbu]*['"](stripe-signature|x-twilio-signature|svix-signature|x-hub-signature-256|x-hub-signature|webhook-signature|HTTP_STRIPE_SIGNATURE|HTTP_X_TWILIO_SIGNATURE|HTTP_SVIX_SIGNATURE|HTTP_X_HUB_SIGNATURE_256|HTTP_X_HUB_SIGNATURE|HTTP_WEBHOOK_SIGNATURE)['"]$
    - has:
        stopBy: end
        any:
        - kind: call
          has:
            field: function
            any:
            - kind: identifier
              regex: (^|\.)(construct_event)$
            - kind: attribute
              regex: (^|\.)(construct_event)$
  - not:
      has:
        stopBy: end
        kind: call
        has:
          field: function
          kind: attribute
          regex: ^hmac\.(new|digest)$
control:
  all:
  - any:
    - all:
      - has:
          stopBy:
            kind: decorated_definition
            has:
              kind: decorator
              regex: (?i)^@((app|api|server|routes?|bp|blueprint|\w*router|\w*app|\w*_bp)\.(route|get|post|put|patch|delete|api_route)\(|\w+\.(route|get|post|put|patch|delete|api_route)\(\s*[rbuf]*['\"]/)
          any:
          - all:
            - all:
              - any:
                - any:
                  - kind: call
                    has:
                      field: function
                      any:
                      - kind: identifier
                        regex: (^|\.)(construct_event)$
                      - kind: attribute
                        regex: (^|\.)(construct_event)$
                - all:
                  - any:
                    - kind: call
                      has:
                        field: function
                        kind: attribute
                        regex: (?i)^[A-Za-z_]?\w*(wh|webhooks?|svix|hook|validator)\w*\.(verify)$
                  - inside:
                      stopBy: end
                      kind: module
                      has:
                        stopBy: end
                        any:
                        - kind: import_statement
                          regex: ^import\s+(svix|svix)(\.|\s|,|$)
                        - kind: import_from_statement
                          regex: ^from\s+(svix|svix)(\.|\s)
              - not:
                  any:
                  - inside:
                      stopBy: end
                      kind: block
                      inside:
                        kind: try_statement
                        has:
                          kind: except_clause
                          not:
                            has:
                              kind: block
                              has:
                                any:
                                - kind: return_statement
                                - kind: raise_statement
                                - kind: expression_statement
                                  regex: ^abort\s*\(
                  - inside:
                      stopBy: end
                      kind: with_statement
                      has:
                        kind: with_clause
                        has:
                          stopBy: end
                          kind: call
                          regex: ^(contextlib\s*\.\s*)?suppress\s*\(
            - not:
                inside:
                  stopBy: end
                  any:
                  - kind: lambda
                  - kind: function_definition
                    not:
                      inside:
                        kind: decorated_definition
                        has:
                          kind: decorator
                          regex: (?i)^@((app|api|server|routes?|bp|blueprint|\w*router|\w*app|\w*_bp)\.(route|get|post|put|patch|delete|api_route)\(|\w+\.(route|get|post|put|patch|delete|api_route)\(\s*[rbuf]*['\"]/)
                    inside:
                      stopBy: end
                      kind: function_definition
      - has:
          stopBy:
            kind: decorated_definition
            has:
              kind: decorator
              regex: (?i)^@((app|api|server|routes?|bp|blueprint|\w*router|\w*app|\w*_bp)\.(route|get|post|put|patch|delete|api_route)\(|\w+\.(route|get|post|put|patch|delete|api_route)\(\s*[rbuf]*['\"]/)
          kind: attribute
          regex: ^\w+\.(data|body|get_data)$
    - has:
        stopBy:
          kind: decorated_definition
          has:
            kind: decorator
            regex: (?i)^@((app|api|server|routes?|bp|blueprint|\w*router|\w*app|\w*_bp)\.(route|get|post|put|patch|delete|api_route)\(|\w+\.(route|get|post|put|patch|delete|api_route)\(\s*[rbuf]*['\"]/)
        any:
        - all:
          - all:
            - any:
              - all:
                - any:
                  - kind: call
                    has:
                      field: function
                      kind: attribute
                      regex: (?i)^[A-Za-z_]?\w*(wh|webhooks?|svix|hook|validator)\w*\.(validate)$
                - inside:
                    stopBy: end
                    kind: module
                    has:
                      stopBy: end
                      any:
                      - kind: import_statement
                        regex: ^import\s+(twilio|twilio)(\.|\s|,|$)
                      - kind: import_from_statement
                        regex: ^from\s+(twilio|twilio)(\.|\s)
            - any:
              - inside:
                  stopBy: end
                  kind: not_operator
                  inside:
                    kind: if_statement
                    has:
                      field: consequence
                      kind: block
                      has:
                        any:
                        - kind: return_statement
                        - kind: raise_statement
                        - kind: expression_statement
                          regex: ^abort\s*\(
              - all:
                - inside:
                    any:
                    - kind: assignment
                    - kind: await
                      inside:
                        kind: assignment
                - any:
                  - inside:
                      stopBy: end
                      kind: expression_statement
                      has:
                        kind: assignment
                        pattern: $OK = $V
                      precedes:
                        kind: if_statement
                        has:
                          field: consequence
                          kind: block
                          has:
                            any:
                            - kind: return_statement
                            - kind: raise_statement
                            - kind: expression_statement
                              regex: ^abort\s*\(
                        all:
                        - has:
                            field: condition
                            kind: not_operator
                            pattern: not $OK
          - not:
              inside:
                stopBy: end
                any:
                - kind: lambda
                - kind: function_definition
                  not:
                    inside:
                      kind: decorated_definition
                      has:
                        kind: decorator
                        regex: (?i)^@((app|api|server|routes?|bp|blueprint|\w*router|\w*app|\w*_bp)\.(route|get|post|put|patch|delete|api_route)\(|\w+\.(route|get|post|put|patch|delete|api_route)\(\s*[rbuf]*['\"]/)
                  inside:
                    stopBy: end
                    kind: function_definition
  - not:
      any:
      - kind: function_definition
        regex: (?s)(\b(db|session|cursor|cur|conn|connection|engine)(\s*\.\s*\w+)*\s*\.\s*(execute|executemany|add|add_all|query|merge|delete|insert\w*|update\w*|scalars?)\s*\(|\b[A-Z]\w*\.objects\b).*\b(construct_event|validate|verify)\b
min_engine: 0.39.0
