# inbound-webhooks-verified (T23 B32, design v3 2.2.2). Written by scripts/gen_webhook_rules.py: edit that script,
# never this file. The rule id's last part is the form (items-sdk, items-hmac, violation, webhook-route,
# replay-dedupe), which the practice function reads, since a match carries only one has_control. replay-dedupe matches
# the items-sdk handler itself, so the function joins the two on path and line.

# items-sdk: a handler that reads a provider signature header (by name or through $_SERVER) or calls a provider SDK's
# verifying parse (\Stripe\Webhook::constructEvent), and computes no HMAC itself. The control is the SDK's verify call
# with the raw body read (file_get_contents('php://input') or $request->getContent()), or a call the provider signs
# without it (Twilio's form check). No control: fail. The control holds only when no data call (a data-layer receiver
# or ORM model) comes before the verify call in the handler's text.
id: inbound-webhooks-verified.php-generic.items-sdk
practice_id: inbound-webhooks-verified
language: php
frameworks:
- generic
kind: items
rule:
  all:
  - any:
    - kind: function_definition
    - kind: method_declaration
    - kind: anonymous_function
    - kind: arrow_function
    - kind: program
      has:
        stopBy: end
        any:
        - kind: string
          regex: (?i)^['"](stripe-signature|x-twilio-signature|svix-signature|x-hub-signature-256|x-hub-signature|webhook-signature|HTTP_STRIPE_SIGNATURE|HTTP_X_TWILIO_SIGNATURE|HTTP_SVIX_SIGNATURE|HTTP_X_HUB_SIGNATURE_256|HTTP_X_HUB_SIGNATURE|HTTP_WEBHOOK_SIGNATURE)['"]$
        - kind: encapsed_string
          regex: (?i)^['"](stripe-signature|x-twilio-signature|svix-signature|x-hub-signature-256|x-hub-signature|webhook-signature|HTTP_STRIPE_SIGNATURE|HTTP_X_TWILIO_SIGNATURE|HTTP_SVIX_SIGNATURE|HTTP_X_HUB_SIGNATURE_256|HTTP_X_HUB_SIGNATURE|HTTP_WEBHOOK_SIGNATURE)['"]$
        not:
          inside:
            stopBy: end
            any:
            - kind: function_definition
            - kind: method_declaration
            - kind: anonymous_function
            - kind: arrow_function
  - any:
    - has:
        stopBy: end
        any:
        - kind: string
          regex: (?i)^['"](stripe-signature|x-twilio-signature|svix-signature|x-hub-signature-256|x-hub-signature|webhook-signature|HTTP_STRIPE_SIGNATURE|HTTP_X_TWILIO_SIGNATURE|HTTP_SVIX_SIGNATURE|HTTP_X_HUB_SIGNATURE_256|HTTP_X_HUB_SIGNATURE|HTTP_WEBHOOK_SIGNATURE)['"]$
        - kind: encapsed_string
          regex: (?i)^['"](stripe-signature|x-twilio-signature|svix-signature|x-hub-signature-256|x-hub-signature|webhook-signature|HTTP_STRIPE_SIGNATURE|HTTP_X_TWILIO_SIGNATURE|HTTP_SVIX_SIGNATURE|HTTP_X_HUB_SIGNATURE_256|HTTP_X_HUB_SIGNATURE|HTTP_WEBHOOK_SIGNATURE)['"]$
    - has:
        stopBy: end
        any:
        - kind: scoped_call_expression
          has:
            field: name
            kind: name
            regex: ^(constructEvent)$
  - not:
      has:
        stopBy: end
        kind: function_call_expression
        has:
          field: function
          kind: name
          regex: ^hash_hmac$
control:
  all:
  - any:
    - all:
      - has:
          stopBy:
            any:
            - kind: anonymous_function
            - kind: arrow_function
            inside:
              kind: argument
              inside:
                kind: arguments
                inside:
                  kind: scoped_call_expression
                  all:
                  - has:
                      field: scope
                      kind: name
                      regex: ^Route$
                  - has:
                      field: name
                      kind: name
                      regex: ^(get|post|put|patch|delete|any|match)$
          any:
          - all:
            - all:
              - any:
                - any:
                  - kind: scoped_call_expression
                    has:
                      field: name
                      kind: name
                      regex: ^(constructEvent)$
                - all:
                  - any:
                    - kind: member_call_expression
                      all:
                      - has:
                          field: object
                          kind: variable_name
                          regex: (?i)^\$\w*(wh|webhooks?|svix|hook|validator)\w*$
                      - has:
                          field: name
                          kind: name
                          regex: ^(verify)$
                  - inside:
                      stopBy: end
                      kind: program
                      has:
                        stopBy: end
                        any:
                        - kind: namespace_use_declaration
                          regex: (?i)^use\s+\\?(Svix|Svix)\\
                        - kind: qualified_name
                          regex: (?i)^\\?(Svix|Svix)\\
              - not:
                  any:
                  - inside:
                      stopBy: end
                      kind: compound_statement
                      inside:
                        kind: try_statement
                        has:
                          kind: catch_clause
                          not:
                            has:
                              kind: compound_statement
                              has:
                                any:
                                - kind: return_statement
                                - kind: exit_statement
                                - kind: expression_statement
                                  regex: ^(throw|abort|die)\b
            - not:
                inside:
                  stopBy: end
                  any:
                  - kind: anonymous_function
                  - kind: arrow_function
                  not:
                    inside:
                      kind: argument
                      inside:
                        kind: arguments
                        inside:
                          kind: scoped_call_expression
                          all:
                          - has:
                              field: scope
                              kind: name
                              regex: ^Route$
                          - has:
                              field: name
                              kind: name
                              regex: ^(get|post|put|patch|delete|any|match)$
                  inside:
                    stopBy: end
                    any:
                    - kind: function_definition
                    - kind: method_declaration
                    - kind: anonymous_function
                    - kind: arrow_function
      - has:
          stopBy:
            any:
            - kind: anonymous_function
            - kind: arrow_function
            inside:
              kind: argument
              inside:
                kind: arguments
                inside:
                  kind: scoped_call_expression
                  all:
                  - has:
                      field: scope
                      kind: name
                      regex: ^Route$
                  - has:
                      field: name
                      kind: name
                      regex: ^(get|post|put|patch|delete|any|match)$
          any:
          - kind: function_call_expression
            regex: ^file_get_contents\(\s*['\"]php://input['\"]
          - kind: member_call_expression
            has:
              field: name
              kind: name
              regex: ^getContent$
    - has:
        stopBy:
          any:
          - kind: anonymous_function
          - kind: arrow_function
          inside:
            kind: argument
            inside:
              kind: arguments
              inside:
                kind: scoped_call_expression
                all:
                - has:
                    field: scope
                    kind: name
                    regex: ^Route$
                - has:
                    field: name
                    kind: name
                    regex: ^(get|post|put|patch|delete|any|match)$
        any:
        - all:
          - all:
            - any:
              - all:
                - any:
                  - kind: member_call_expression
                    all:
                    - has:
                        field: object
                        kind: variable_name
                        regex: (?i)^\$\w*(wh|webhooks?|svix|hook|validator)\w*$
                    - has:
                        field: name
                        kind: name
                        regex: ^(validate)$
                - inside:
                    stopBy: end
                    kind: program
                    has:
                      stopBy: end
                      any:
                      - kind: namespace_use_declaration
                        regex: (?i)^use\s+\\?(Twilio|Twilio)\\
                      - kind: qualified_name
                        regex: (?i)^\\?(Twilio|Twilio)\\
            - any:
              - inside:
                  stopBy: end
                  kind: unary_op_expression
                  regex: ^!
                  inside:
                    kind: parenthesized_expression
                    inside:
                      kind: if_statement
                      has:
                        any:
                        - kind: return_statement
                        - kind: exit_statement
                        - kind: expression_statement
                          regex: ^(throw|abort|die)\b
                        - kind: compound_statement
                          has:
                            any:
                            - kind: return_statement
                            - kind: exit_statement
                            - kind: expression_statement
                              regex: ^(throw|abort|die)\b
              - all:
                - inside:
                    kind: assignment_expression
                - any:
                  - inside:
                      stopBy: end
                      kind: expression_statement
                      has:
                        kind: assignment_expression
                        pattern:
                          context: <?php $OK = $V;
                          selector: assignment_expression
                      precedes:
                        kind: if_statement
                        has:
                          any:
                          - kind: return_statement
                          - kind: exit_statement
                          - kind: expression_statement
                            regex: ^(throw|abort|die)\b
                          - kind: compound_statement
                            has:
                              any:
                              - kind: return_statement
                              - kind: exit_statement
                              - kind: expression_statement
                                regex: ^(throw|abort|die)\b
                        all:
                        - has:
                            kind: parenthesized_expression
                            has:
                              kind: unary_op_expression
                              pattern:
                                context: <?php !$OK;
                                selector: unary_op_expression
          - not:
              inside:
                stopBy: end
                any:
                - kind: anonymous_function
                - kind: arrow_function
                not:
                  inside:
                    kind: argument
                    inside:
                      kind: arguments
                      inside:
                        kind: scoped_call_expression
                        all:
                        - has:
                            field: scope
                            kind: name
                            regex: ^Route$
                        - has:
                            field: name
                            kind: name
                            regex: ^(get|post|put|patch|delete|any|match)$
                inside:
                  stopBy: end
                  any:
                  - kind: function_definition
                  - kind: method_declaration
                  - kind: anonymous_function
                  - kind: arrow_function
  - not:
      any:
      - kind: function_definition
        regex: (?s)(\$(pdo|db|conn|connection|mysqli|wpdb|dbh|database)\s*->\s*\w+\s*\(|\bDB::\w+\s*\(|\b(mysqli|pg|sqlite)_\w+\s*\(|\b[A-Z]\w*::(create|insert\w*|update\w*|upsert|where\w*|find\w*|firstOrCreate|updateOrCreate|query)\s*\().*\b(constructEvent|validate|verify)\b
      - kind: method_declaration
        regex: (?s)(\$(pdo|db|conn|connection|mysqli|wpdb|dbh|database)\s*->\s*\w+\s*\(|\bDB::\w+\s*\(|\b(mysqli|pg|sqlite)_\w+\s*\(|\b[A-Z]\w*::(create|insert\w*|update\w*|upsert|where\w*|find\w*|firstOrCreate|updateOrCreate|query)\s*\().*\b(constructEvent|validate|verify)\b
      - kind: anonymous_function
        regex: (?s)(\$(pdo|db|conn|connection|mysqli|wpdb|dbh|database)\s*->\s*\w+\s*\(|\bDB::\w+\s*\(|\b(mysqli|pg|sqlite)_\w+\s*\(|\b[A-Z]\w*::(create|insert\w*|update\w*|upsert|where\w*|find\w*|firstOrCreate|updateOrCreate|query)\s*\().*\b(constructEvent|validate|verify)\b
      - kind: arrow_function
        regex: (?s)(\$(pdo|db|conn|connection|mysqli|wpdb|dbh|database)\s*->\s*\w+\s*\(|\bDB::\w+\s*\(|\b(mysqli|pg|sqlite)_\w+\s*\(|\b[A-Z]\w*::(create|insert\w*|update\w*|upsert|where\w*|find\w*|firstOrCreate|updateOrCreate|query)\s*\().*\b(constructEvent|validate|verify)\b
      - kind: program
        regex: (?s)(\$(pdo|db|conn|connection|mysqli|wpdb|dbh|database)\s*->\s*\w+\s*\(|\bDB::\w+\s*\(|\b(mysqli|pg|sqlite)_\w+\s*\(|\b[A-Z]\w*::(create|insert\w*|update\w*|upsert|where\w*|find\w*|firstOrCreate|updateOrCreate|query)\s*\().*\b(constructEvent|validate|verify)\b
min_engine: 0.45.3
