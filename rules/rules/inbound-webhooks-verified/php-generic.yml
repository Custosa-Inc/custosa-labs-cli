# items-hmac: a handler that reads a provider signature header and computes an HMAC itself (hash_hmac). The control is
# a constant-time compare (hash_equals). With it, needs_review; without, fail.
id: inbound-webhooks-verified.php-generic.items-hmac
practice_id: inbound-webhooks-verified
language: php
frameworks:
- generic
kind: items
rule:
  all:
  - any:
    - kind: function_definition
    - kind: method_declaration
    - kind: anonymous_function
    - kind: arrow_function
    - kind: program
      has:
        stopBy: end
        any:
        - kind: string
          regex: (?i)^['"](stripe-signature|x-twilio-signature|svix-signature|x-hub-signature-256|x-hub-signature|webhook-signature|HTTP_STRIPE_SIGNATURE|HTTP_X_TWILIO_SIGNATURE|HTTP_SVIX_SIGNATURE|HTTP_X_HUB_SIGNATURE_256|HTTP_X_HUB_SIGNATURE|HTTP_WEBHOOK_SIGNATURE)['"]$
        - kind: encapsed_string
          regex: (?i)^['"](stripe-signature|x-twilio-signature|svix-signature|x-hub-signature-256|x-hub-signature|webhook-signature|HTTP_STRIPE_SIGNATURE|HTTP_X_TWILIO_SIGNATURE|HTTP_SVIX_SIGNATURE|HTTP_X_HUB_SIGNATURE_256|HTTP_X_HUB_SIGNATURE|HTTP_WEBHOOK_SIGNATURE)['"]$
        not:
          inside:
            stopBy: end
            any:
            - kind: function_definition
            - kind: method_declaration
            - kind: anonymous_function
            - kind: arrow_function
  - has:
      stopBy: end
      any:
      - kind: string
        regex: (?i)^['"](stripe-signature|x-twilio-signature|svix-signature|x-hub-signature-256|x-hub-signature|webhook-signature|HTTP_STRIPE_SIGNATURE|HTTP_X_TWILIO_SIGNATURE|HTTP_SVIX_SIGNATURE|HTTP_X_HUB_SIGNATURE_256|HTTP_X_HUB_SIGNATURE|HTTP_WEBHOOK_SIGNATURE)['"]$
      - kind: encapsed_string
        regex: (?i)^['"](stripe-signature|x-twilio-signature|svix-signature|x-hub-signature-256|x-hub-signature|webhook-signature|HTTP_STRIPE_SIGNATURE|HTTP_X_TWILIO_SIGNATURE|HTTP_SVIX_SIGNATURE|HTTP_X_HUB_SIGNATURE_256|HTTP_X_HUB_SIGNATURE|HTTP_WEBHOOK_SIGNATURE)['"]$
  - has:
      stopBy: end
      kind: function_call_expression
      has:
        field: function
        kind: name
        regex: ^hash_hmac$
control:
  has:
    stopBy:
      any:
      - kind: anonymous_function
      - kind: arrow_function
      inside:
        kind: argument
        inside:
          kind: arguments
          inside:
            kind: scoped_call_expression
            all:
            - has:
                field: scope
                kind: name
                regex: ^Route$
            - has:
                field: name
                kind: name
                regex: ^(get|post|put|patch|delete|any|match)$
    kind: function_call_expression
    has:
      field: function
      kind: name
      regex: ^hash_equals$
min_engine: 0.45.3
