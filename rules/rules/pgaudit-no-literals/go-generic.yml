      regex: \.\s*(Query|QueryRow|QueryContext|QueryRowContext|Exec|ExecContext|Raw|Select|Get|Where|Or|Not|Having|Joins)$
  - has:
      field: arguments
      has:
        any:
        - kind: call_expression
          regex: (?is)((((=|<|>|\bI?LIKE\b|\bIN\b|\bANY\b|\bALL\b|\bBETWEEN\b|\bBETWEEN\s+\S+\s+AND\b|\bIS\b|\bTHEN\b|\bELSE\b|\bVALUES\b|\|\||&&|@>|<@|@@|~\*?|\bSIMILAR\s+TO\b|\bDISTINCT\s+FROM\b|\$\w*\$|\b(btrim|ltrim|rtrim|nullif|greatest|least|cast|concat|concat_ws|md5|digest|hmac|crypt|encode|decode|to_char|to_date|to_timestamp|to_number|date_trunc|date_part|extract|position|substr|substring|replace|strpos|left|right|lpad|rpad|format|similarity|word_similarity|strict_word_similarity|levenshtein|soundex|metaphone|pgp_sym_encrypt|pgp_sym_decrypt|to_tsquery|plainto_tsquery|phraseto_tsquery|websearch_to_tsquery|json_build_object|jsonb_build_object)\s*\(|\b(lower|upper|trim|coalesce)\s*\(([^(),]|\([^()]*\))*,)|\b(WHERE|AND|OR|NOT|ON|HAVING|WHEN|SET)\s*(\(|\[|\bARRAY\s*\[|\bROW\s*\(|[\w.]*\w\s*\(|E?'))(\s|\(|\[|,|::\w+|\bARRAY\s*\[|\bROW\s*\(|[\w.]*\w\s*\(|[\w.]+\s*,|'[^']*'\s*,|\b(year|month|day|hour|minute|second|epoch|dow|doy|week|quarter|isodow|isoyear|century|decade|millennium|milliseconds|microseconds|timezone)\s+FROM\s+)*(E'[^']*)?|\bVALUES\s*\([^)]*|\bINSERT\s+INTO\b[^;]*\bSELECT\s+([^;]*,)?|(=|<|>|\(|,|\|\||\w\s)\s*'[^']*|')\s*'?\s*%[sdvq]|(\b(lower|upper|trim|coalesce)\s*\(\s*)+%[sdvq])
          all:
          - has:
              field: function
              kind: selector_expression
              regex: ^fmt\s*\.\s*Sprintf$
          - has:
              field: arguments
              has:
                stopBy: end
                any: &id001
                - kind: identifier
                  not:
                    regex: ^[A-Z][A-Z0-9_]*$
                    kind: identifier
                - kind: field_identifier
                  not:
                    regex: ^[A-Z][A-Z0-9_]*$
                    kind: field_identifier
          not:
            kind: call_expression
            regex: (?is)^[\w.$]*\(?\s*[fFrRbBuU]*[\"'`]{1,3}\s*(CREATE|ALTER|DROP|COMMENT|GRANT|REVOKE|REINDEX|VACUUM|ANALYZE|TRUNCATE|REFRESH|CLUSTER)\b
            not:
              kind: call_expression
              regex: (?is)\bAS\s*\(?\s*(SELECT|WITH|VALUES)\b|;\s*(INSERT|UPDATE|DELETE|SELECT|WITH|MERGE)\b|\bINSERT\s+INTO\b|\bDELETE\s+FROM\b|\bUPDATE\s+\S+\s+SET\b
        - kind: binary_expression
          regex: (?is)((((=|<|>|\bI?LIKE\b|\bIN\b|\bANY\b|\bALL\b|\bBETWEEN\b|\bBETWEEN\s+\S+\s+AND\b|\bIS\b|\bTHEN\b|\bELSE\b|\bVALUES\b|\|\||&&|@>|<@|@@|~\*?|\bSIMILAR\s+TO\b|\bDISTINCT\s+FROM\b|\$\w*\$|\b(btrim|ltrim|rtrim|nullif|greatest|least|cast|concat|concat_ws|md5|digest|hmac|crypt|encode|decode|to_char|to_date|to_timestamp|to_number|date_trunc|date_part|extract|position|substr|substring|replace|strpos|left|right|lpad|rpad|format|similarity|word_similarity|strict_word_similarity|levenshtein|soundex|metaphone|pgp_sym_encrypt|pgp_sym_decrypt|to_tsquery|plainto_tsquery|phraseto_tsquery|websearch_to_tsquery|json_build_object|jsonb_build_object)\s*\(|\b(lower|upper|trim|coalesce)\s*\(([^(),]|\([^()]*\))*,)|\b(WHERE|AND|OR|NOT|ON|HAVING|WHEN|SET)\s*(\(|\[|\bARRAY\s*\[|\bROW\s*\(|[\w.]*\w\s*\(|E?'))(\s|\(|\[|,|::\w+|\bARRAY\s*\[|\bROW\s*\(|[\w.]*\w\s*\(|[\w.]+\s*,|'[^']*'\s*,|\b(year|month|day|hour|minute|second|epoch|dow|doy|week|quarter|isodow|isoyear|century|decade|millennium|milliseconds|microseconds|timezone)\s+FROM\s+)*(E'[^']*)?|\bVALUES\s*\([^)]*|\bINSERT\s+INTO\b[^;]*\bSELECT\s+([^;]*,)?|(=|<|>|\(|,|\|\||\w\s)\s*'[^']*|')\s*'?\s*[\"`]\s*\+|(\b(lower|upper|trim|coalesce)\s*\(\s*)+[\"`]\s*\+\s*(\b(\w*[^\WlLnNdD]|d|\w*[^\WlL]d|ld|\w*[^\WeE]ld|eld|\w*[^\WiI]eld|ield|\w*[^\WfF]ield|\w+field|l|\w*[^\WoO]l|ol|\w*[^\WcC]ol|\w*[^\W_]col|n|\w*[^\WmM]n|mn|\w*[^\WuU]mn|umn|\w*[^\WlL]umn|lumn|\w*[^\WoO]lumn|olumn|\w*[^\WcC]olumn|\w*[^\W_]column)\b|\w+\s*[.(\[]|[^\w\s]))
          all:
          - has:
              any:
              - kind: interpreted_string_literal
              - kind: raw_string_literal
          - has:
              stopBy: end
              any: *id001
          not:
            kind: binary_expression
            regex: (?is)^[\w.$]*\(?\s*[fFrRbBuU]*[\"'`]{1,3}\s*(CREATE|ALTER|DROP|COMMENT|GRANT|REVOKE|REINDEX|VACUUM|ANALYZE|TRUNCATE|REFRESH|CLUSTER)\b
            not:
              kind: binary_expression
              regex: (?is)\bAS\s*\(?\s*(SELECT|WITH|VALUES)\b|;\s*(INSERT|UPDATE|DELETE|SELECT|WITH|MERGE)\b|\bINSERT\s+INTO\b|\bDELETE\s+FROM\b|\bUPDATE\s+\S+\s+SET\b
min_engine: 0.39.0
