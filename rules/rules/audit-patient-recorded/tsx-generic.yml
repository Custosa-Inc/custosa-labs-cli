id: audit-patient-recorded.tsx-generic.request-handler
practice_id: audit-patient-recorded
language: tsx
frameworks:
- generic
kind: evidence
rule:
  all:
  - any:
    - all:
      - kind: function_declaration
      - has:
          field: name
          kind: identifier
          regex: '^(GET|POST|PUT|PATCH|DELETE)$'
      - inside:
          kind: export_statement
    - all:
      - kind: arrow_function
      - inside:
          kind: variable_declarator
          has:
            field: name
            kind: identifier
            regex: '^(GET|POST|PUT|PATCH|DELETE)$'
          inside:
            kind: lexical_declaration
            inside:
              kind: export_statement
    - all:
      - any:
        - all:
          - kind: function_declaration
          - inside:
              kind: export_statement
        - all:
          - kind: arrow_function
          - inside:
              kind: variable_declarator
              inside:
                kind: lexical_declaration
                inside:
                  kind: export_statement
      - inside:
          stopBy: end
          kind: program
          has:
            kind: expression_statement
            regex: '^[''"]use server[''"];?$'
    - all:
      - any:
        - kind: function_declaration
        - kind: arrow_function
        - kind: function_expression
      - has:
          field: body
          has:
            kind: expression_statement
            regex: '^[''"]use server[''"];?$'
    - all:
      - kind: method_definition
      - any:
        - follows: &route
            kind: decorator
            regex: '^@(Get|Post|Put|Patch|Delete|All)\('
        - follows:
            any: &between
            - kind: decorator
            - kind: comment
            follows: *route
        - follows:
            any: *between
            follows:
              any: *between
              follows: *route
        - follows:
            any: *between
            follows:
              any: *between
              follows:
                any: *between
                follows: *route
        - follows:
            any: *between
            follows:
              any: *between
              follows:
                any: *between
                follows:
                  any: *between
                  follows: *route
      - inside:
          stopBy: end
          kind: class_declaration
          any:
          - has:
              kind: decorator
              regex: '^@Controller\b'
          - inside:
              kind: export_statement
              has:
                kind: decorator
                regex: '^@Controller\b'
min_engine: 0.45.3
