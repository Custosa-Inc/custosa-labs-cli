# Supabase queries in Expo or React Native code (files importing react-native, expo or React Navigation: all of it
# runs on the device), one item each: a select() on a from(...) chain or a variable holding one, with no argument or a
# literal column list. The control is a literal that names columns; select() and any list with * are a violation. A
# column list held in a variable, and data hooks in files with no such import, are left out.
id: minimal-columns-to-client.javascript-expo.client-select
practice_id: minimal-columns-to-client
language: javascript
frameworks:
- expo
- react_native
kind: items
rule:
  all:
  - kind: call_expression
    has:
      field: function
      kind: member_expression
      has:
        field: property
        kind: property_identifier
        regex: '^select$'
  - any:
    - has:
        field: function
        kind: member_expression
        has:
          field: object
          stopBy: end
          pattern: '$C.from($T)'
    - all:
      - pattern: '$Q.select($$$)'
      - inside:
          stopBy: end
          any:
          - kind: arrow_function
          - kind: function_expression
          - kind: function_declaration
          - kind: method_definition
          - kind: program
          has:
            stopBy: end
            kind: variable_declarator
            pattern:
              context: 'const $Q = $V'
              selector: variable_declarator
            has:
              field: value
              stopBy: end
              pattern: '$C.from($T)'
  - any:
    - has:
        field: arguments
        kind: arguments
        regex: '^\(\s*\)$'
    - has:
        field: arguments
        kind: arguments
        has:
          any:
          - kind: string
          - kind: template_string
  - inside:
      kind: program
      stopBy: end
      has:
        kind: import_statement
        regex: 'from\s+[''\"](react-native|expo|expo-[a-z-]+|@react-navigation/[a-z-]+)[''\"]'
control:
  has:
    field: arguments
    kind: arguments
    has:
      any:
      - kind: string
        regex: '^[''\"][^*''\"]*\w[^*''\"]*[''\"]$'
      - kind: template_string
        regex: '^`[^*`$]*\w[^*`$]*`$'
min_engine: 0.39.0
---
