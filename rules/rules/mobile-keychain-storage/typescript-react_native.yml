id: mobile-keychain-storage.typescript-react_native.token-async
practice_id: mobile-keychain-storage
language: typescript
frameworks:
- react_native
kind: violation
rule:
  kind: call_expression
  all:
  - has:
      field: arguments
      kind: arguments
      regex: ^\(\s*["'`](?i:(access|refresh|id|auth|session)[_-]?token|jwt|credentials?|password)["'`]\s*,
  - any:
    - has:
        field: function
        kind: member_expression
        regex: ^AsyncStorage\s*\.\s*setItem$
    - all:
      - has:
          field: function
          kind: member_expression
          all:
          - has:
              field: object
              kind: identifier
              pattern: &id001
                context: ($S)
                selector: identifier
          - has:
              field: property
              kind: property_identifier
              regex: ^set$
      - inside:
          kind: program
          stopBy: end
          has:
            stopBy: end
            kind: variable_declarator
            all:
            - has:
                field: name
                kind: identifier
                pattern: *id001
            - has:
                field: value
                any:
                - kind: new_expression
                  has:
                    field: constructor
                    kind: identifier
                    regex: ^MMKV$
                - kind: call_expression
                  has:
                    field: function
                    kind: identifier
                    regex: ^createMMKV$
            - not:
                has:
                  stopBy: end
                  any:
                  - kind: property_identifier
                    regex: ^encryptionKey$
                  - kind: shorthand_property_identifier
                    regex: ^encryptionKey$
min_engine: 0.39.0
