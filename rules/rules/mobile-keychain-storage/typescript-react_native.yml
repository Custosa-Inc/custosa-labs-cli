# Tokens in plain mobile storage (T23 B56e). Written by scripts/gen_mobile_rules.py: don't edit.
# The practice is capped at needs_review: a violation fails, the rest is for a person.
id: mobile-keychain-storage.typescript-react_native.auth-storage-async
practice_id: mobile-keychain-storage
language: typescript
frameworks:
- react_native
kind: violation
rule:
  kind: pair
  all:
  - has:
      field: key
      any:
      - kind: property_identifier
        regex: ^storage$
      - kind: string
        regex: ^["'`]storage["'`]$
  - any:
    - has:
        field: value
        kind: identifier
        regex: ^AsyncStorage$
    - all:
      - has:
          field: value
          kind: identifier
          pattern: &id001
            context: ($S)
            selector: identifier
      - inside:
          kind: program
          stopBy: end
          has:
            stopBy: end
            kind: variable_declarator
            all:
            - has:
                field: name
                kind: identifier
                pattern: *id001
            - has:
                field: value
                any:
                - kind: new_expression
                  has:
                    field: constructor
                    kind: identifier
                    regex: ^MMKV$
                - kind: call_expression
                  has:
                    field: function
                    kind: identifier
                    regex: ^createMMKV$
            - not:
                has:
                  stopBy: end
                  any:
                  - kind: property_identifier
                    regex: ^encryptionKey$
                  - kind: shorthand_property_identifier
                    regex: ^encryptionKey$
  - inside:
      kind: object
      inside:
        kind: pair
        all:
        - has:
            field: key
            any:
            - kind: property_identifier
              regex: ^auth$
            - kind: string
              regex: ^["'`]auth["'`]$
        inside:
          kind: object
          inside:
            kind: arguments
            inside:
              kind: call_expression
              has:
                field: function
                any:
                - kind: identifier
                  regex: ^createClient$
                - kind: member_expression
                  regex: \.\s*createClient$
min_engine: 0.39.0
