id: staff-mfa-enforced.python-django.otp-admin
practice_id: staff-mfa-enforced
language: python
frameworks:
- django
kind: evidence
rule:
  any:
  - pattern: admin.site.__class__ = OTPAdminSite
  - pattern: OTPAdminSite($$$)
  - all:
    - kind: decorator
      regex: ^@otp_required(?-u:\b)
min_engine: 0.39.0
