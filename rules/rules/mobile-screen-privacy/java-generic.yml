# App-wide screen capture blocking and the app-switcher overlay (T23 B56e). Written by
# scripts/gen_mobile_rules.py: don't edit. Only the root component's capture and overlay are pieces (P1 ruling 3).
id: mobile-screen-privacy.java-generic.capture-main-activity
practice_id: mobile-screen-privacy
language: java
frameworks:
- generic
kind: evidence
rule:
  kind: method_invocation
  all:
  - any:
    - all:
      - has:
          field: name
          kind: identifier
          regex: ^(addFlags)$
      - has:
          field: arguments
          kind: argument_list
          regex: \bFLAG_SECURE\b
    - all:
      - has:
          field: name
          kind: identifier
          regex: ^(setFlags)$
      - has:
          field: arguments
          kind: argument_list
          regex: ^\(\s*([\w.]*\.)?FLAG_SECURE\s*,\s*([\w.]*\.)?FLAG_SECURE\s*\)$
    - all:
      - has:
          field: name
          kind: identifier
          regex: ^(setRecentsScreenshotEnabled)$
      - has:
          field: arguments
          kind: argument_list
          regex: ^\(\s*false\s*\)$
  - inside:
      stopBy: end
      kind: method_declaration
      has:
        field: name
        kind: identifier
        regex: ^onCreate$
      inside:
        stopBy: end
        kind: class_declaration
        has:
          field: name
          kind: identifier
          regex: ^MainActivity$
min_engine: 0.39.0
