          kind: block_mapping_pair
          has:
            field: key
            kind: flow_node
            regex: ^(headers)$
          inside:
            kind: block_mapping
            inside:
              kind: block_node
              inside:
                kind: block_mapping_pair
                inside:
                  kind: block_mapping
                  inside:
                    kind: block_node
                    inside:
                      kind: block_mapping_pair
                      has:
                        field: key
                        kind: flow_node
                        regex: ^(middlewares)$
                      inside:
