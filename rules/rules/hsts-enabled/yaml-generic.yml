# hsts-enabled (T23 B56b). Written by scripts/gen_hsts_rules.py: edit that script,
# never this file. The practice function reads the pieces by name: header-<form> and redirect-<form> (NAMING.md).

# header-traefik: a Traefik dynamic-config headers middleware (http.middlewares.<name>.headers) with stsSeconds of a
# year or more, in a Traefik config file (traefik.yml, traefik/dynamic.yml). A platform piece: it never passes, it
# holds for "confirm this app is served through Traefik".
id: hsts-enabled.yaml-generic.header-traefik
practice_id: hsts-enabled
language: yaml
frameworks:
- generic
kind: evidence
path_regex: ^((deploy|infra|ops|docker|k8s|kubernetes|configs?|traefik)/)*(traefik([-_]dynamic)?|traefik/(dynamic|middlewares?))\.ya?ml$
rule:
  kind: block_mapping_pair
  has:
    field: key
    kind: flow_node
    regex: ^(stsSeconds)$
  inside:
    kind: block_mapping
    inside:
      kind: block_node
      inside:
        kind: block_mapping_pair
        has:
          field: key
          kind: flow_node
          regex: ^(headers)$
        inside:
          kind: block_mapping
          inside:
            kind: block_node
            inside:
              kind: block_mapping_pair
              inside:
                kind: block_mapping
                inside:
                  kind: block_node
                  inside:
                    kind: block_mapping_pair
                    has:
                      field: key
                      kind: flow_node
                      regex: ^(middlewares)$
                    inside:
                      kind: block_mapping
                      inside:
                        kind: block_node
                        inside:
                          kind: block_mapping_pair
                          has:
                            field: key
                            kind: flow_node
                            regex: ^(http)$
                          inside:
                            kind: block_mapping
                            inside:
                              kind: block_node
                              inside:
                                kind: document
  regex: ^stsSeconds\s*:\s*['\"]?((3153[6-9]\d{3}|315[4-9]\d{4}|31[6-9]\d{5}|3[2-9]\d{6}|[4-9]\d{7}|[1-9]\d{8,}))['\"]?\s*$
min_engine: 0.45.3
