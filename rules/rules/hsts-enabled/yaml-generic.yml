# redirect-traefik: a Traefik entry point that redirects to https
# (entryPoints.<name>.http.redirections.entryPoint.scheme: https), in a Traefik config file (traefik.yml,
# traefik/dynamic.yml). A platform piece: it only holds.
id: hsts-enabled.yaml-generic.redirect-traefik
practice_id: hsts-enabled
language: yaml
frameworks:
- generic
kind: evidence
path_regex: ^((deploy|infra|ops|docker|k8s|kubernetes|configs?|traefik)/)*(traefik([-_]dynamic)?|traefik/(dynamic|middlewares?))\.ya?ml$
rule:
  kind: block_mapping_pair
  has:
    field: key
    kind: flow_node
    regex: ^(scheme)$
  regex: ^scheme\s*:\s*['\"]?(https)['\"]?\s*$
  inside:
    kind: block_mapping
    inside:
      kind: block_node
      inside:
        kind: block_mapping_pair
        has:
          field: key
          kind: flow_node
          regex: ^(entryPoint)$
        inside:
          kind: block_mapping
          inside:
            kind: block_node
            inside:
              kind: block_mapping_pair
              has:
                field: key
                kind: flow_node
                regex: ^(redirections)$
              inside:
                kind: block_mapping
                inside:
                  kind: block_node
                  inside:
                    kind: block_mapping_pair
                    has:
                      field: key
                      kind: flow_node
                      regex: ^(http)$
                    inside:
                      kind: block_mapping
                      inside:
                        kind: block_node
                        inside:
                          kind: block_mapping_pair
                          inside:
                            kind: block_mapping
                            inside:
                              kind: block_node
                              inside:
                                kind: block_mapping_pair
                                has:
                                  field: key
                                  kind: flow_node
                                  regex: ^(entryPoints)$
                                inside:
                                  kind: block_mapping
                                  inside:
                                    kind: block_node
                                    inside:
                                      kind: document
min_engine: 0.45.3
---
# header-ingress: hsts-max-age of a year or more in the data of a ConfigMap, in an ingress ConfigMap file such as
# ingress-nginx-config.yaml, with hsts not set false there. A platform piece: it only holds.
id: hsts-enabled.yaml-generic.header-ingress
practice_id: hsts-enabled
language: yaml
frameworks:
- generic
kind: evidence
path_regex: ^((deploy|infra|ops|docker|k8s|kubernetes|configs?|traefik)/)*(nginx-)?ingress(-nginx)?(-controller)?-(config(map)?|cm)\.ya?ml$
rule:
  kind: block_mapping_pair
  has:
    field: key
    kind: flow_node
    regex: ^(hsts-max-age)$
  inside:
    kind: block_mapping
    inside:
      kind: block_node
      inside:
        kind: block_mapping_pair
        has:
          field: key
          kind: flow_node
          regex: ^(data)$
        inside:
          kind: block_mapping
          inside:
            kind: block_node
            inside:
              kind: document
  all:
  - inside:
      stopBy: end
      kind: document
      regex: (?m)^kind\s*:\s*['\"]?ConfigMap['\"]?\s*$
  regex: ^hsts-max-age\s*:\s*['\"]?((3153[6-9]\d{3}|315[4-9]\d{4}|31[6-9]\d{5}|3[2-9]\d{6}|[4-9]\d{7}|[1-9]\d{8,}))['\"]?\s*$
  not:
    inside:
      kind: block_mapping
      has:
        kind: block_mapping_pair
        regex: ^hsts\s*:\s*['\"]?(false|False|FALSE)['\"]?\s*$
min_engine: 0.45.3
