# app-root: a Django manage.py's execute_from_command_line(...) call (the package.json and composer.json app roots are
# dependency-scanning-ci's app-root, judged here too). One app root each (B56c counts them).
id: hsts-enabled.python-generic.app-root
practice_id: hsts-enabled
language: python
frameworks:
- generic
kind: evidence
path_regex: (^|/)manage\.py$
rule:
  kind: call
  has:
    field: function
    any:
    - kind: identifier
      regex: ^execute_from_command_line$
    - kind: attribute
      regex: \.execute_from_command_line$
min_engine: 0.45.3
