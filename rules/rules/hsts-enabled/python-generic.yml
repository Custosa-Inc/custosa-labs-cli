# hsts-enabled (T23 B56b). Written by scripts/gen_hsts_rules.py: edit that script,
# never this file. The practice function reads the pieces by name: header-<form> and redirect-<form> (NAMING.md).

# header-django: SECURE_HSTS_SECONDS = an integer of at least 31536000 at module level in an allowlisted settings
# file, with SecurityMiddleware in a literal MIDDLEWARE list and a literal SECURE_PROXY_SSL_HEADER tuple in the same
# file. Evidence: the header piece.
id: hsts-enabled.python-generic.header-django
practice_id: hsts-enabled
language: python
frameworks:
- generic
kind: evidence
path_regex: ^(([^/]+/)*[^/]+/)?settings(\.py|/(__init__|base|common|prod|production)\.py)$
rule:
  kind: assignment
  has:
    field: left
    kind: identifier
    regex: ^(SECURE_HSTS_SECONDS)$
  inside:
    kind: expression_statement
    inside:
      kind: module
  all:
  - has:
      field: right
      kind: integer
      regex: ^(3153[6-9]\d{3}|315[4-9]\d{4}|31[6-9]\d{5}|3[2-9]\d{6}|[4-9]\d{7}|[1-9]\d{8,})$
  - inside:
      stopBy: end
      kind: module
      has:
        stopBy: end
        kind: assignment
        has:
          field: left
          kind: identifier
          regex: ^(MIDDLEWARE)$
        all:
        - has:
            field: right
            kind: list
            has:
              kind: string
              regex: ^['\"]django\.middleware\.security\.SecurityMiddleware['\"]$
        inside:
          kind: expression_statement
          inside:
            kind: module
  - inside:
      stopBy: end
      kind: module
      has:
        stopBy: end
        kind: assignment
        has:
          field: left
          kind: identifier
          regex: ^(SECURE_PROXY_SSL_HEADER)$
        all:
        - has:
            field: right
            kind: tuple
        inside:
          kind: expression_statement
          inside:
            kind: module
min_engine: 0.45.3
---
# redirect-django: SECURE_SSL_REDIRECT = True at module level in an allowlisted settings file, with the same
# middleware and proxy header, and SECURE_REDIRECT_EXEMPT unset or empty in that file. Evidence: the redirect piece.
id: hsts-enabled.python-generic.redirect-django
practice_id: hsts-enabled
language: python
frameworks:
- generic
kind: evidence
path_regex: ^(([^/]+/)*[^/]+/)?settings(\.py|/(__init__|base|common|prod|production)\.py)$
rule:
  kind: assignment
  has:
    field: left
    kind: identifier
    regex: ^(SECURE_SSL_REDIRECT)$
  inside:
    kind: expression_statement
    inside:
      kind: module
  all:
  - has:
      field: right
      kind: 'true'
  - inside:
      stopBy: end
      kind: module
      has:
        stopBy: end
        kind: assignment
        has:
          field: left
          kind: identifier
          regex: ^(MIDDLEWARE)$
        all:
        - has:
            field: right
            kind: list
            has:
              kind: string
              regex: ^['\"]django\.middleware\.security\.SecurityMiddleware['\"]$
        inside:
          kind: expression_statement
          inside:
            kind: module
  - inside:
      stopBy: end
      kind: module
      has:
        stopBy: end
        kind: assignment
        has:
          field: left
          kind: identifier
          regex: ^(SECURE_PROXY_SSL_HEADER)$
        all:
        - has:
            field: right
            kind: tuple
        inside:
          kind: expression_statement
          inside:
            kind: module
  - not:
      inside:
        stopBy: end
        kind: module
        has:
          stopBy: end
          kind: assignment
          has:
            field: left
            kind: identifier
            regex: ^(SECURE_REDIRECT_EXEMPT)$
          all:
          - not:
              has:
                field: right
                any:
                - kind: list
                  regex: ^\[\s*\]$
                - kind: tuple
                  regex: ^\(\s*\)$
min_engine: 0.45.3
---
# settings-assign: any plain assignment to SECURE_HSTS_SECONDS, SECURE_SSL_REDIRECT, SECURE_PROXY_SSL_HEADER,
# MIDDLEWARE or SECURE_REDIRECT_EXEMPT, in any .py file. Evidence the function holds on outside the allowlist or
# across two settings modules.
id: hsts-enabled.python-generic.settings-assign
practice_id: hsts-enabled
language: python
frameworks:
- generic
kind: evidence
rule:
  kind: assignment
  has:
    field: left
    kind: identifier
    regex: ^(SECURE_HSTS_SECONDS|SECURE_SSL_REDIRECT|SECURE_PROXY_SSL_HEADER|MIDDLEWARE|SECURE_REDIRECT_EXEMPT)$
min_engine: 0.45.3
