# unread-setting: one of the five names given a value that isn't a literal, or mutated (+=, append, remove, del, item
# or slice assignment), in any .py file. Evidence the function holds on.
id: hsts-enabled.python-generic.unread-setting
practice_id: hsts-enabled
language: python
frameworks:
- generic
kind: evidence
rule:
  any:
  - kind: assignment
    has:
      field: left
      kind: identifier
      regex: ^(SECURE_HSTS_SECONDS|SECURE_SSL_REDIRECT|SECURE_PROXY_SSL_HEADER|MIDDLEWARE|SECURE_REDIRECT_EXEMPT)$
    all:
    - has:
        field: right
        any:
        - kind: identifier
        - kind: call
        - kind: attribute
        - kind: subscript
        - kind: binary_operator
        - kind: boolean_operator
        - kind: conditional_expression
        - kind: list_comprehension
        - kind: parenthesized_expression
        - kind: list_splat
        - kind: lambda
        - kind: await
        - kind: string
          has:
            kind: interpolation
        - any:
          - kind: list
          - kind: tuple
          has:
            any:
            - kind: identifier
            - kind: call
            - kind: attribute
            - kind: subscript
            - kind: binary_operator
            - kind: boolean_operator
            - kind: conditional_expression
            - kind: list_comprehension
            - kind: parenthesized_expression
            - kind: list_splat
            - kind: lambda
            - kind: await
            - kind: string
              has:
                kind: interpolation
  - kind: augmented_assignment
    has:
      field: left
      kind: identifier
      regex: ^(SECURE_HSTS_SECONDS|SECURE_SSL_REDIRECT|SECURE_PROXY_SSL_HEADER|MIDDLEWARE|SECURE_REDIRECT_EXEMPT)$
  - kind: call
    has:
      field: function
      kind: attribute
      regex: ^(SECURE_HSTS_SECONDS|SECURE_SSL_REDIRECT|SECURE_PROXY_SSL_HEADER|MIDDLEWARE|SECURE_REDIRECT_EXEMPT)\.(append|insert|extend|remove|pop|clear)$
  - kind: delete_statement
    regex: ^del\s+(SECURE_HSTS_SECONDS|SECURE_SSL_REDIRECT|SECURE_PROXY_SSL_HEADER|MIDDLEWARE|SECURE_REDIRECT_EXEMPT)\b
  - kind: assignment
    has:
      field: left
      kind: subscript
      regex: ^(SECURE_HSTS_SECONDS|SECURE_SSL_REDIRECT|SECURE_PROXY_SSL_HEADER|MIDDLEWARE|SECURE_REDIRECT_EXEMPT)\s*\[
min_engine: 0.45.3
---
# test-import: an import of test code (a tests, test_* or conftest module or name, or importlib.import_module of one),
# in any .py file. Evidence the function holds on in a Django app, outside test paths.
id: hsts-enabled.python-generic.test-import
practice_id: hsts-enabled
language: python
frameworks:
- generic
kind: evidence
rule:
  any:
  - kind: import_statement
    has:
      field: name
      any:
      - kind: dotted_name
        regex: (^|\.)(tests?|test_[A-Za-z0-9_]*|conftest)(\.|$)
      - kind: aliased_import
        has:
          field: name
          kind: dotted_name
          regex: (^|\.)(tests?|test_[A-Za-z0-9_]*|conftest)(\.|$)
  - kind: import_from_statement
    any:
    - has:
        field: module_name
        kind: dotted_name
        regex: (^|\.)(tests?|test_[A-Za-z0-9_]*|conftest)(\.|$)
    - has:
        field: name
        any:
        - kind: dotted_name
          regex: ^(tests?|test_[A-Za-z0-9_]*|conftest)$
        - kind: aliased_import
          has:
            field: name
            kind: dotted_name
            regex: ^(tests?|test_[A-Za-z0-9_]*|conftest)$
  - kind: call
    all:
    - has:
        field: function
        kind: attribute
        regex: ^importlib\.import_module$
    - has:
        field: arguments
        kind: argument_list
        has:
          kind: string
          regex: ^['\"]([\w.]*\.)?(tests?|test_\w*|conftest)(\.[\w.]*)?['\"]$
min_engine: 0.45.3
