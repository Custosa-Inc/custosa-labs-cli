# header-talisman: Talisman(app, ...) at top level, app bound by the file's one app = Flask(__name__) with only
# app.config statements between, HSTS on with the default or a year or more. Evidence: the header piece.
id: hsts-enabled.python-generic.header-talisman
practice_id: hsts-enabled
language: python
frameworks:
- generic
kind: evidence
rule:
  kind: call
  has:
    field: function
    kind: identifier
    regex: ^Talisman$
  inside:
    any:
    - kind: expression_statement
      inside:
        kind: module
    - kind: assignment
      inside:
        kind: expression_statement
        inside:
          kind: module
  all:
  - inside:
      stopBy: end
      kind: module
      regex: (?s)(^|\n)app\s*=\s*Flask\(\s*__name__\s*\)[^\n]*\n(\s*(#[^\n]*|app\.config\[[^\n]*\]\s*=[^\n]*|app\.config\.from_\w+\([^\n]*\))?[ \t]*\n)*\s*(\w+\s*=\s*)?Talisman\(\s*app\b
      not:
        kind: module
        regex: (?s)\bFlask\(.*\bFlask\(
  - any:
    - not:
        has:
          field: arguments
          kind: argument_list
          has:
            kind: keyword_argument
            regex: ^strict_transport_security\s*=
    - has:
        field: arguments
        kind: argument_list
        has:
          kind: keyword_argument
          regex: ^strict_transport_security\s*=\s*(True)$
  - any:
    - not:
        has:
          field: arguments
          kind: argument_list
          has:
            kind: keyword_argument
            regex: ^strict_transport_security_max_age\s*=
    - has:
        field: arguments
        kind: argument_list
        has:
          kind: keyword_argument
          regex: ^strict_transport_security_max_age\s*=\s*((3153[6-9]\d{3}|315[4-9]\d{4}|31[6-9]\d{5}|3[2-9]\d{6}|[4-9]\d{7}|[1-9]\d{8,}))$
min_engine: 0.45.3
