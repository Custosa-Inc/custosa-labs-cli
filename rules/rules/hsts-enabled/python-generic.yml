# redirect-talisman: the same Talisman(app) with force_https default or True, and no @talisman(force_https=False)
# decorator in the file. Evidence: the redirect piece (voided by debug-or-testing).
id: hsts-enabled.python-generic.redirect-talisman
practice_id: hsts-enabled
language: python
frameworks:
- generic
kind: evidence
rule:
  kind: call
  has:
    field: function
    kind: identifier
    regex: ^Talisman$
  inside:
    any:
    - kind: expression_statement
      inside:
        kind: module
    - kind: assignment
      inside:
        kind: expression_statement
        inside:
          kind: module
  all:
  - inside:
      stopBy: end
      kind: module
      regex: (?s)(^|\n)app\s*=\s*Flask\(\s*__name__\s*\)[^\n]*\n(\s*(#[^\n]*|app\.config\[[^\n]*\]\s*=[^\n]*|app\.config\.from_\w+\([^\n]*\))?[ \t]*\n)*\s*(\w+\s*=\s*)?Talisman\(\s*app\b
      not:
        kind: module
        regex: (?s)\bFlask\(.*\bFlask\(
  - any:
    - not:
        has:
          field: arguments
          kind: argument_list
          has:
            kind: keyword_argument
            regex: ^force_https\s*=
    - has:
        field: arguments
        kind: argument_list
        has:
          kind: keyword_argument
          regex: ^force_https\s*=\s*(True)$
  - not:
      inside:
        stopBy: end
        kind: module
        regex: (?s)@talisman\([^)]*\b(force_https|strict_transport_security)\s*=\s*False\b
min_engine: 0.45.3
---
# debug-or-testing: DEBUG or TESTING set true or to a value that isn't a literal (a module or class name, app.config,
# app.config.update, app.debug or app.testing, app.run(debug=), FLASK_DEBUG), or a config load whose values can't be
# seen (from_envvar, from_file, from_prefixed_env, from_pyfile). Evidence the function reads to void redirect-talisman
# and hold.
id: hsts-enabled.python-generic.debug-or-testing
practice_id: hsts-enabled
language: python
frameworks:
- generic
kind: evidence
rule:
  any:
  - kind: assignment
    has:
      field: left
      kind: identifier
      regex: ^(DEBUG|TESTING)$
    all:
    - has:
        field: right
        any:
        - kind: 'true'
        - kind: identifier
        - kind: call
        - kind: attribute
        - kind: subscript
        - kind: binary_operator
        - kind: boolean_operator
        - kind: conditional_expression
        - kind: list_comprehension
        - kind: parenthesized_expression
        - kind: list_splat
        - kind: lambda
        - kind: await
        - kind: string
          has:
            kind: interpolation
  - kind: assignment
    all:
    - has:
        field: left
        any:
        - kind: subscript
          regex: ^\w+\.config\[\s*['\"](DEBUG|TESTING)['\"]\s*\]$
        - kind: attribute
          regex: ^\w+\.(debug|testing)$
        - kind: subscript
          regex: ^os\.environ\[\s*['\"]FLASK_DEBUG['\"]\s*\]$
    - not:
        has:
          field: right
          any:
          - kind: 'false'
          - kind: string
            regex: ^['\"](0|false|False)?['\"]$
  - kind: call
    all:
    - has:
        field: function
        kind: attribute
        regex: ^\w+\.(config\.update|run)$
    - has:
        field: arguments
        kind: argument_list
        has:
          kind: keyword_argument
          regex: ^(DEBUG|TESTING|debug)\s*=
          not:
            kind: keyword_argument
            regex: ^(DEBUG|TESTING|debug)\s*=\s*False$
  - kind: call
    has:
      field: function
      kind: attribute
      regex: ^\w+\.config\.from_(envvar|file|prefixed_env|pyfile)$
min_engine: 0.45.3
