# hsts-enabled (T23 B56b). Written by scripts/gen_hsts_rules.py: edit that script,
# never this file. The practice function reads the pieces by name: header-<form> and redirect-<form> (NAMING.md).

# header-vercel: a vercel.json headers entry with source /(.*) or /:path* and no has or missing, setting
# Strict-Transport-Security of a year or more. A platform piece: it never passes, it holds for "confirm this app is
# served through Vercel".
id: hsts-enabled.json-generic.header-vercel
practice_id: hsts-enabled
language: json
frameworks:
- generic
kind: evidence
path_regex: (^|/)vercel\.json$
rule:
  kind: object
  all:
  - inside:
      kind: array
      inside:
        kind: pair
        has:
          field: key
          kind: string
          regex: ^"(headers)"$
        inside:
          kind: object
          inside:
            kind: document
  - has:
      kind: pair
      all:
      - has:
          field: key
          kind: string
          regex: ^"(source)"$
      - has:
          field: value
          kind: string
          regex: ^"/(\(\.\*\)|:path\*)"$
  - not:
      has:
        kind: pair
        has:
          field: key
          kind: string
          regex: ^"(has|missing)"$
  - has:
      kind: pair
      all:
      - has:
          field: key
          kind: string
          regex: ^"(headers)"$
      - has:
          kind: array
          has:
            kind: object
            all:
            - has:
                kind: pair
                all:
                - has:
                    field: key
                    kind: string
                    regex: ^"(key)"$
                - has:
                    field: value
                    kind: string
                    regex: (?i)^['\"`]strict-transport-security['\"`]$
            - has:
                kind: pair
                all:
                - has:
                    field: key
                    kind: string
                    regex: ^"(value)"$
                - has:
                    field: value
                    kind: string
                    regex: ^['\"`]([^'\"`;]*;\s*)*max-age=(3153[6-9]\d{3}|315[4-9]\d{4}|31[6-9]\d{5}|3[2-9]\d{6}|[4-9]\d{7}|[1-9]\d{8,})\s*(;[^'\"`]*)?['\"`]$
min_engine: 0.45.3
---
# short-max-age: an HSTS age below a year, as a literal: helmet's maxAge, a Strict-Transport-Security value in a
# next.config entry, a header call or vercel.json; Rails ssl_options hsts: { expires: } in production.rb or
# application.rb; Django SECURE_HSTS_SECONDS in an allowlisted settings file; a Traefik headers middleware's
# stsSeconds; an ingress ConfigMap's hsts-max-age. Fail.
id: hsts-enabled.json-generic.short-max-age
practice_id: hsts-enabled
language: json
frameworks:
- generic
kind: violation
path_regex: (^|/)vercel\.json$
rule:
  kind: object
  all:
  - has:
      kind: pair
      all:
      - has:
          field: key
          kind: string
          regex: ^"(key)"$
      - has:
          field: value
          kind: string
          regex: (?i)^['\"`]strict-transport-security['\"`]$
  - has:
      kind: pair
      all:
      - has:
          field: key
          kind: string
          regex: ^"(value)"$
      - has:
          field: value
          kind: string
          regex: ^['\"`]([^'\"`;]*;\s*)*max-age=\d+\s*(;[^'\"`]*)?['\"`]$
  not:
    kind: object
    all:
    - has:
        kind: pair
        all:
        - has:
            field: key
            kind: string
            regex: ^"(key)"$
        - has:
            field: value
            kind: string
            regex: (?i)^['\"`]strict-transport-security['\"`]$
    - has:
        kind: pair
        all:
        - has:
            field: key
            kind: string
            regex: ^"(value)"$
        - has:
            field: value
            kind: string
            regex: ^['\"`]([^'\"`;]*;\s*)*max-age=(3153[6-9]\d{3}|315[4-9]\d{4}|31[6-9]\d{5}|3[2-9]\d{6}|[4-9]\d{7}|[1-9]\d{8,})\s*(;[^'\"`]*)?['\"`]$
min_engine: 0.45.3
