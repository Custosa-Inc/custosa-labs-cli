# next-export-script: a package.json script running next export: it voids the Next.js pieces like output: 'export'.
# Evidence the function reads.
id: hsts-enabled.json-generic.next-export-script
practice_id: hsts-enabled
language: json
frameworks:
- generic
kind: evidence
path_regex: (^|/)package\.json$
rule:
  kind: pair
  inside:
    kind: object
    inside:
      kind: pair
      has:
        field: key
        kind: string
        regex: ^"(scripts)"$
      inside:
        kind: object
        inside:
          kind: document
  all:
  - has:
      field: value
      kind: string
      regex: \bnext\s+export\b
min_engine: 0.45.3
