# short-max-age: an HSTS age below a year, as a literal: helmet's maxAge, a Strict-Transport-Security value in a
# next.config entry, a header call or vercel.json; Rails ssl_options hsts: { expires: } in production.rb or
# application.rb; Django SECURE_HSTS_SECONDS in an allowlisted settings file; a Traefik headers middleware's
# stsSeconds; an ingress ConfigMap's hsts-max-age. Fail.
id: hsts-enabled.javascript-generic.short-max-age
practice_id: hsts-enabled
language: javascript
frameworks:
- generic
kind: violation
rule:
  any:
  - kind: call_expression
    has:
      field: function
      any:
      - kind: identifier
        regex: ^helmet\.(strictTransportSecurity|hsts)$
      - kind: member_expression
        regex: ^helmet\.(strictTransportSecurity|hsts)$
    all:
    - has:
        field: arguments
        has:
          kind: object
          has:
            kind: pair
            all:
            - has:
                field: key
                any:
                - kind: property_identifier
                  regex: ^['"]?(maxAge)['"]?$
                - kind: string
                  regex: ^['"]?(maxAge)['"]?$
            - has:
                field: value
                kind: number
                regex: ^\d+$
                not:
                  kind: number
