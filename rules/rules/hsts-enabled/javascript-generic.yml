      field: name
      kind: identifier
      regex: ^middleware$
  - inside:
      kind: export_statement
      regex: ^export\s+default\b
  all:
  - has:
      field: body
      kind: statement_block
      regex: ^\{\s*if\s*\(\s*(\w+\.headers\.get\(\s*['\"]x-forwarded-proto['\"]\s*\)\s*!==?\s*['\"]https['\"]|\w+\.nextUrl\.protocol\s*!==?\s*['\"]https:['\"])\s*\)\s*(\{\s*return\s+NextResponse\.redirect\(\s*('https://[^'\n]*'|\"https://[^\"\n]*\"|`https://([^`$\n]|\$\{\s*([\w.]+|\w+\.headers\.get\(\s*['\"]host['\"]\s*\))\s*\})*`)(\s*\+\s*([\w.]+|\w+\.headers\.get\(\s*['\"]host['\"]\s*\)))*\s*(,\s*30[1278]\s*)?\)\s*;?\s*\}|return\s+NextResponse\.redirect\(\s*('https://[^'\n]*'|\"https://[^\"\n]*\"|`https://([^`$\n]|\$\{\s*([\w.]+|\w+\.headers\.get\(\s*['\"]host['\"]\s*\))\s*\})*`)(\s*\+\s*([\w.]+|\w+\.headers\.get\(\s*['\"]host['\"]\s*\)))*\s*(,\s*30[1278]\s*)?\)\s*;?)\s*return\s+NextResponse\.next\(\s*\)\s*;?\s*\}$
  - not:
      inside:
        stopBy: end
        kind: program
        has:
          kind: export_statement
          regex: (?s)\bconfig\b.*\bmatcher\b
