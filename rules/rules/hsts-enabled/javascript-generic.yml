# header-next-config: a next.config headers() entry with source /(.*) or /:path* and no has, missing or locale key,
# setting Strict-Transport-Security with max-age a year or more. Evidence: the header piece (voided by next-output).
id: hsts-enabled.javascript-generic.header-next-config
practice_id: hsts-enabled
language: javascript
frameworks:
- generic
kind: evidence
path_regex: (^|/)next\.config\.[cm]?[jt]s$
rule:
  kind: object
  all:
  - has:
      kind: pair
      all:
      - has:
          field: key
          any:
          - kind: property_identifier
            regex: ^['"]?(source)['"]?$
          - kind: string
            regex: ^['"]?(source)['"]?$
      - has:
          field: value
          any:
          - kind: string
          - kind: template_string
            not:
              has:
                kind: template_substitution
  - has:
      kind: pair
      all:
      - has:
          field: key
          any:
          - kind: property_identifier
            regex: ^['"]?(headers)['"]?$
          - kind: string
            regex: ^['"]?(headers)['"]?$
      - has:
          field: value
          kind: array
          has:
            kind: object
            all:
            - has:
                kind: pair
                all:
                - has:
                    field: key
                    any:
                    - kind: property_identifier
                      regex: ^['"]?(key)['"]?$
                    - kind: string
                      regex: ^['"]?(key)['"]?$
                - has:
                    field: value
                    any:
                    - kind: string
                      regex: (?i)^['\"`]strict-transport-security['\"`]$
                    - kind: template_string
                      not:
                        has:
                          kind: template_substitution
                      regex: (?i)^['\"`]strict-transport-security['\"`]$
            - has:
                kind: pair
                all:
                - has:
                    field: key
                    any:
                    - kind: property_identifier
                      regex: ^['"]?(value)['"]?$
                    - kind: string
                      regex: ^['"]?(value)['"]?$
                - has:
                    field: value
                    any:
                    - kind: string
                      regex: ^['\"`]([^'\"`;]*;\s*)*max-age=(3153[6-9]\d{3}|315[4-9]\d{4}|31[6-9]\d{5}|3[2-9]\d{6}|[4-9]\d{7}|[1-9]\d{8,})\s*(;[^'\"`]*)?['\"`]$
                    - kind: template_string
                      not:
                        has:
                          kind: template_substitution
                      regex: ^['\"`]([^'\"`;]*;\s*)*max-age=(3153[6-9]\d{3}|315[4-9]\d{4}|31[6-9]\d{5}|3[2-9]\d{6}|[4-9]\d{7}|[1-9]\d{8,})\s*(;[^'\"`]*)?['\"`]$
  - inside:
      stopBy: end
      any:
      - kind: method_definition
        has:
          field: name
          kind: property_identifier
          regex: ^headers$
      - kind: pair
        all:
        - has:
            field: key
            kind: property_identifier
            regex: ^headers$
        - has:
            field: value
            any:
            - kind: arrow_function
            - kind: function_expression
  - has:
      kind: pair
      all:
      - has:
          field: key
          any:
          - kind: property_identifier
            regex: ^['"]?(source)['"]?$
          - kind: string
            regex: ^['"]?(source)['"]?$
      - has:
          field: value
          any:
