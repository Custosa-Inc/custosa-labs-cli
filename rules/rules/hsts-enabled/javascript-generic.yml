                        regex: ^['"]?(maxAge)['"]?$
                  - has:
                      field: value
                      kind: number
                      regex: ^\d+$
                      not:
                        kind: number
                        regex: ^(3153[6-9]\d{3}|315[4-9]\d{4}|31[6-9]\d{5}|3[2-9]\d{6}|[4-9]\d{7}|[1-9]\d{8,})$
  - kind: object
    all:
    - has:
        kind: pair
        all:
        - has:
            field: key
            any:
            - kind: property_identifier
              regex: ^['"]?(key)['"]?$
            - kind: string
              regex: ^['"]?(key)['"]?$
        - has:
            field: value
            any:
            - kind: string
              regex: (?i)^['\"`]strict-transport-security['\"`]$
            - kind: template_string
              not:
                has:
                  kind: template_substitution
              regex: (?i)^['\"`]strict-transport-security['\"`]$
    - has:
        kind: pair
        all:
        - has:
            field: key
            any:
            - kind: property_identifier
              regex: ^['"]?(value)['"]?$
            - kind: string
              regex: ^['"]?(value)['"]?$
        - has:
            field: value
            any:
            - kind: string
              regex: ^['\"`]([^'\"`;]*;\s*)*max-age=\d+\s*(;[^'\"`]*)?['\"`]$
            - kind: template_string
              not:
                has:
                  kind: template_substitution
              regex: ^['\"`]([^'\"`;]*;\s*)*max-age=\d+\s*(;[^'\"`]*)?['\"`]$
    not:
      kind: object
      all:
      - has:
          kind: pair
          all:
          - has:
              field: key
