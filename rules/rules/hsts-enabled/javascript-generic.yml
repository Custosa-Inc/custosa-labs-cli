# app-server: a call that serves: in JS and TS createServer or createSecureServer (bare or a member), Bun.serve,
# Deno.serve, serve() from @hono/node-server; in Go, on any receiver: ListenAndServe, ListenAndServeTLS, Serve or
# ServeTLS (http., fasthttp., or a server value). Evidence the function counts, 0 for a redirect-only one.
id: hsts-enabled.javascript-generic.app-server
