# header-next-middleware: middleware.(ts|js) exporting a straight-line middleware function (no if, switch or
# conditional, one return) that sets Strict-Transport-Security of a year or more on the response it returns, in a file
# with no config.matcher. Evidence: the header piece, placed by the function.
id: hsts-enabled.javascript-generic.header-next-middleware
practice_id: hsts-enabled
language: javascript
frameworks:
- generic
kind: evidence
path_regex: (^|/)middleware\.[jt]s$
rule:
  kind: function_declaration
  inside:
    kind: export_statement
  any:
  - has:
      field: name
      kind: identifier
      regex: ^middleware$
  - inside:
      kind: export_statement
      regex: ^export\s+default\b
  all:
  - has:
      field: body
      kind: statement_block
      not:
        kind: statement_block
        regex: (?s)\breturn\b.*\breturn\b
  - not:
      has:
        stopBy: end
        any:
        - kind: if_statement
        - kind: switch_statement
        - kind: ternary_expression
  - has:
      stopBy: end
      kind: call_expression
      pattern: $R.headers.set($K, $V)
      has:
        field: arguments
        kind: arguments
        regex: ^\(\s*['\"`](?i:strict-transport-security)['\"`]\s*,\s*['\"`]([^'\"`;]*;\s*)*max-age=(3153[6-9]\d{3}|315[4-9]\d{4}|31[6-9]\d{5}|3[2-9]\d{6}|[4-9]\d{7}|[1-9]\d{8,})\s*(;[^'\"`]*)?['\"`]\s*\)$
  - has:
      field: body
      has:
        kind: return_statement
        pattern: return $R
  - not:
      inside:
        stopBy: end
        kind: program
        has:
          kind: export_statement
          regex: (?s)\bconfig\b.*\bmatcher\b
min_engine: 0.45.3
