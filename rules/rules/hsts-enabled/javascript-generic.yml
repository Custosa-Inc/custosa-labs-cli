# app-construction: a call that makes an app: in JS and TS express(), require('express')(), new Koa(), new Hono(), new
# Elysia(), fastify(), NestFactory.create, polka(), feathers(), createApp() from h3, connect() from connect; in Go
# gin.Default(), gin.New(), echo.New(), fiber.New(), chi.NewRouter(), mux.NewRouter(), http.NewServeMux(); in Java
# SpringApplication.run(...); in PHP Application::configure, new Illuminate\Foundation\Application,
# AppFactory::create() and each class extending a Kernel. Evidence the function counts.
id: hsts-enabled.javascript-generic.app-construction
practice_id: hsts-enabled
language: javascript
frameworks:
- generic
kind: evidence
rule:
  any:
  - kind: call_expression
    regex: ^(express|polka|feathers|[Ff]astify)\s*\(
    has:
      field: function
      kind: identifier
  - kind: call_expression
    regex: ^require\(\s*['\"]express['\"]\s*\)\s*\(
    has:
      field: function
      kind: call_expression
  - kind: new_expression
    has:
      field: constructor
      kind: identifier
      regex: ^(Koa|Hono|Elysia)$
  - kind: call_expression
    has:
      field: function
      kind: member_expression
      regex: ^NestFactory\.create$
  - kind: call_expression
    has:
      field: function
      kind: identifier
      regex: ^createApp$
    inside:
      stopBy: end
      kind: program
      regex: from\s+['\"]h3['\"]|require\(\s*['\"]h3['\"]\s*\)
  - kind: call_expression
    has:
      field: function
      kind: identifier
      regex: ^connect$
    inside:
      stopBy: end
      kind: program
      regex: (^|\n)(const|let|var)\s+connect\s*=\s*require\(\s*['\"]connect['\"]\s*\)|(^|\n)import\s+connect(\s*,\s*\{[^}]*\})?\s+from\s+['\"]connect['\"]
