# short-max-age: an HSTS age below a year, as a literal: helmet's maxAge, a Strict-Transport-Security value in a
# next.config entry, a header call or vercel.json; Rails ssl_options hsts: { expires: } in production.rb or
# application.rb; Django SECURE_HSTS_SECONDS in an allowlisted settings file; a Traefik headers middleware's
# stsSeconds; an ingress ConfigMap's hsts-max-age. Fail.
id: hsts-enabled.ruby-rails.short-max-age
practice_id: hsts-enabled
language: ruby
frameworks:
- rails
kind: violation
path_regex: (^|/)config/(environments/production|application)\.rb$
rule:
  kind: assignment
  regex: ^((Rails\.application\.)?config|Rails\.configuration)\.ssl_options\s*=
  has:
    field: right
    kind: hash
    has:
      kind: pair
      all:
      - has:
          field: key
          kind: hash_key_symbol
          regex: ^hsts$
      - has:
          field: value
          kind: hash
          has:
            kind: pair
            all:
            - has:
                field: key
                kind: hash_key_symbol
                regex: ^expires$
            - has:
                field: value
                any:
                - kind: call
                  regex: ^(\d+(\.(years?|days?|weeks?|months?|hours?|minutes?|seconds?))?)$
                - kind: integer
                  regex: ^(\d+(\.(years?|days?|weeks?|months?|hours?|minutes?|seconds?))?)$
  not:
    has:
      field: right
      kind: hash
      has:
        kind: pair
        all:
        - has:
            field: key
            kind: hash_key_symbol
            regex: ^hsts$
        - has:
            field: value
            kind: hash
            has:
              kind: pair
              all:
              - has:
                  field: key
                  kind: hash_key_symbol
                  regex: ^expires$
              - has:
                  field: value
                  any:
                  - kind: call
                    regex: ^(([1-9]\d*)\.years?|(36[5-9]|3[7-9]\d|[4-9]\d\d|[1-9]\d{3,})\.days?|(5[3-9]|[6-9]\d|[1-9]\d{2,})\.weeks?|(1[2-9]|[2-9]\d|[1-9]\d{2,})\.months?|(3153[6-9]\d{3}|315[4-9]\d{4}|31[6-9]\d{5}|3[2-9]\d{6}|[4-9]\d{7}|[1-9]\d{8,}))$
                  - kind: integer
                    regex: ^(([1-9]\d*)\.years?|(36[5-9]|3[7-9]\d|[4-9]\d\d|[1-9]\d{3,})\.days?|(5[3-9]|[6-9]\d|[1-9]\d{2,})\.weeks?|(1[2-9]|[2-9]\d|[1-9]\d{2,})\.months?|(3153[6-9]\d{3}|315[4-9]\d{4}|31[6-9]\d{5}|3[2-9]\d{6}|[4-9]\d{7}|[1-9]\d{8,}))$
