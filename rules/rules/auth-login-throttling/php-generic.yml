id: auth-login-throttling.php-generic.sign-in
practice_id: auth-login-throttling
language: php
frameworks:
- generic
kind: items
rule:
  all:
  - any:
    - kind: method_declaration
    - kind: function_definition
  - has:
      stopBy: end
      any:
      - kind: function_call_expression
        regex: ^(password_verify|\$\w+->(passwordVerify|checkPassword|verifyPassword)|AuthHash::passwordVerify|Auth::attempt|auth\(\)->attempt|Hash::check)
      - kind: member_call_expression
        regex: ^(password_verify|\$\w+->(passwordVerify|checkPassword|verifyPassword)|AuthHash::passwordVerify|Auth::attempt|auth\(\)->attempt|Hash::check)
      - kind: scoped_call_expression
        regex: ^(password_verify|\$\w+->(passwordVerify|checkPassword|verifyPassword)|AuthHash::passwordVerify|Auth::attempt|auth\(\)->attempt|Hash::check)
