id: auth-login-throttling.java-spring.spoofable-ip-key
practice_id: auth-login-throttling
language: java
frameworks:
- spring
kind: violation
rule:
  kind: method_declaration
  has:
    stopBy: end
    kind: string_literal
    regex: (?i)^"x-forwarded-for"$
  # the key is the first hop (index 0 of the split header, getFirst() or get(0)), whatever else the method holds; a
  # header only logged, a trusted-proxy valve and a right-side hop are no first-hop key
  any:
  # a split taken at index 0 directly, unless its separator is a string literal with no comma: a split on another
  # separator (the request path on "/") is no header split (T29-P3-C395 med 1), but a named separator (SEP, sep) is
  # read as the header split (T29-P3-C401 med 1). Also the first hop cut by substring(0, indexOf(",")) or taken by
  # findFirst on a stream of the comma split (T29-P3-C401 low 1)
  - kind: method_declaration
    regex: (?s)(\.split\(\s*(?:[^"\s)]|"[^"]*,)[^()]*(?:\([^()]*\)[^()]*)*\)\s*\[\s*0\s*\]|\.getFirst\(\)|\.get\(\s*0\s*\)|\.substring\(\s*0\s*,\s*\w+\.indexOf\(\s*(?:"[^"]*,|',')|\.split\(\s*(?:[^"\s)]|"[^"]*,)[^;]*\.findFirst\(\))
  # index 0 of a variable the method stores a header split in (String[] hops = xff.split(","); hops[0]), by its
  # declaration or a later assignment (hops = xff.split(SEP)), unless the separator is a string literal with no comma
  # (T29-P3-C401 med 1)
  - has:
      stopBy: end
      kind: array_access
      all:
      - has:
          field: index
          kind: decimal_integer_literal
          regex: ^0$
      - has:
          field: array
          kind: identifier
          pattern:
            context: int $HOPS = 0;
            selector: identifier
      - inside:
          stopBy: end
          kind: method_declaration
          has:
            stopBy: end
            any:
            - kind: variable_declarator
              all:
              - has:
                  field: name
                  kind: identifier
                  pattern:
                    context: int $HOPS = 0;
                    selector: identifier
              - has:
                  field: value
                  kind: method_invocation
                  regex: \.split\(\s*(?:[^"\s)]|"[^"]*,)
            - kind: assignment_expression
              all:
              - has:
                  field: left
                  kind: identifier
                  pattern:
                    context: int $HOPS = 0;
                    selector: identifier
              - has:
                  field: right
                  kind: method_invocation
                  regex: \.split\(\s*(?:[^"\s)]|"[^"]*,)
  # a first hop the class calls only as a log argument (log.warn(..., auditIp())) is no key: the key is
  # something else, such as the username (T29-P1-C340 med 4)
  not:
    all:
    - has:
        field: name
        pattern:
          context: $FIRST_HOP_FN();
          selector: identifier
    - inside:
        stopBy: end
        kind: class_declaration
        all:
        - has:
            stopBy: end
            kind: method_invocation
            has:
              field: name
              pattern:
                context: $FIRST_HOP_FN();
                selector: identifier
            inside:
              stopBy: end
              kind: method_invocation
              regex: ^(log|logger|LOG|LOGGER)\.(trace|debug|info|warn|warning|error)\(
        - not:
            has:
              stopBy: end
              kind: method_invocation
              has:
                field: name
                pattern:
                  context: $FIRST_HOP_FN();
                  selector: identifier
              not:
                inside:
                  stopBy: end
                  kind: method_invocation
                  regex: ^(log|logger|LOG|LOGGER)\.(trace|debug|info|warn|warning|error)\(
  inside:
    stopBy: end
    kind: class_declaration
    all:
    # the class limits or locks out sign-in: a limiter, throttle, attempt or lockout class, or one that counts failed
    # sign-ins or blocks a key; its name alone doesn't decide it
    - any:
      - has:
          field: name
          kind: identifier
          regex: (?i)(rate_?limit|throttl|limiter|attempt|lockout|brute)
      - has:
          stopBy: end
          kind: identifier
          regex: (?i)^(is_?blocked|is_?rate_?limited|login_?failed|on_?login_?failure|record_?failed\w*|try_?consume|lock_?out)$
    - any:
      - has:
          stopBy: end
          kind: string_literal
          regex: (?i)^"[^"]*/(auth|login|log-in|signin|sign-in|sign_in)(/|")
      - has:
          stopBy: end
          kind: identifier
          regex: (?i)^(login|sign_?in|authenticate)\w*$
min_engine: 0.39.0
