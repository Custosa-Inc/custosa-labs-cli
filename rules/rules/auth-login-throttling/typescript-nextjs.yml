id: auth-login-throttling.typescript-nextjs.sign-in
practice_id: auth-login-throttling
language: typescript
frameworks:
- nextjs
kind: items
rule:
  all:
  - any:
    - kind: function_declaration
    - kind: method_definition
    - kind: arrow_function
    - kind: function_expression
  - has:
      stopBy: end
      any:
      - kind: call_expression
        regex: ^(await\s+)?(\w+\.)*((bcrypt|bcryptjs|argon2)\.(compare|compareSync|verify)|verifyPassword|checkPassword|comparePassword|validatePassword)\(
      - kind: await_expression
        regex: ^(await\s+)?(\w+\.)*((bcrypt|bcryptjs|argon2)\.(compare|compareSync|verify)|verifyPassword|checkPassword|comparePassword|validatePassword)\(
      - all:
        - kind: call_expression
          regex: ^signIn\(\s*['\"]credentials['\"]
        - inside:
            stopBy: end
            any:
            - kind: program
            - kind: statement_block
            has:
              kind: expression_statement
              regex: ^['\"]use server['\"]
