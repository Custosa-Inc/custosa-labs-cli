    - kind: function_expression
  - has:
      stopBy: end
      kind: call_expression
      has:
        field: function
        kind: member_expression
        regex: \.auth\.signInWithPassword$
  # only the innermost function that makes the call (a wrapper and its arrow are one sign-in)
  - not:
      has:
        stopBy: end
        all:
        - any:
          - kind: function_declaration
          - kind: method_definition
          - kind: arrow_function
          - kind: function_expression
        - has:
            stopBy: end
            kind: call_expression
            has:
              field: function
