id: auth-login-throttling.javascript-express.spoofable-ip-key
practice_id: auth-login-throttling
language: javascript
frameworks:
- express
kind: violation
rule:
  all:
  - any:
    - all:
      - kind: pair
      - has:
          field: key
          kind: property_identifier
          regex: ^keyGenerator$
      - inside:
          stopBy: end
          kind: call_expression
          regex: ^(rateLimit|slowDown)\(
      - not:
          kind: pair
          regex: (?i)(\.pop\(\)|\.at\(\s*-1\s*\)|length\s*-\s*1|\.slice\(\s*-1)
    - all:
      - kind: call_expression
      - has:
          field: function
          kind: member_expression
          regex: (?i)^\w*(limit|throttl|brute)\w*\.(consume|limit|check|hit|penalty|get)$
      - not:
          kind: call_expression
          regex: (?i)(\.pop\(\)|\.at\(\s*-1\s*\)|length\s*-\s*1|\.slice\(\s*-1)
  - has:
      stopBy: end
      kind: string
      regex: (?i)^['\"]x-forwarded-for['\"]$
  - inside:
