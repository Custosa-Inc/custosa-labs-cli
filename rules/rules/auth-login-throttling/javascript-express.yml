      kind: program
      has:
        stopBy: end
        any:
        - kind: identifier
          regex: (?i)^\w*(log_?in|sign_?in|auth)\w*(limit|throttl)\w*$
        - kind: string
          regex: (?i)^['\"][^'\"]*/(auth|login|log-in|signin|sign-in|sign_in)\b
