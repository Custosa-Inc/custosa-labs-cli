id: auth-login-throttling.typescript-express.sign-in
practice_id: auth-login-throttling
language: typescript
frameworks:
- express
kind: items
rule:
  all:
  - any:
    - kind: function_declaration
    - kind: method_definition
    - kind: arrow_function
    - kind: function_expression
  - has:
      stopBy: end
      any:
      - kind: call_expression
        regex: ^(await\s+)?(\w+\.)*((bcrypt|bcryptjs|argon2)\.(compare|compareSync|verify)|verifyPassword|checkPassword|comparePassword|validatePassword)\(
      - kind: await_expression
