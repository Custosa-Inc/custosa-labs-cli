  # router or app uses in the file (the express-rate-limit README shape, T29-P1-C340 med 2)
  - inside:
      stopBy: end
      kind: call_expression
      regex: (?i)^(app|server|routes?|\w*router)\.(post|all)\(\s*['\"`][^'\"`]*/(login|log-in|signin|sign-in|sign_in|authenticate)/?['\"`]\s*,
      any:
      - has:
          field: arguments
          has:
            any:
            - kind: identifier
              regex: (?i)(rate_?limit|limiter|throttl|brute|slow_?down|captcha)
            - kind: member_expression
              regex: (?i)(rate_?limit|limiter|throttl|brute|slow_?down|captcha)
            - kind: call_expression
              regex: (?i)^[\w.]*(rate_?limit|limiter|throttl|brute|slow_?down|captcha)
            - kind: array
              has:
                any:
                - kind: identifier
                  regex: (?i)(rate_?limit|limiter|throttl|brute|slow_?down|captcha)
                - kind: member_expression
                  regex: (?i)(rate_?limit|limiter|throttl|brute|slow_?down|captcha)
                - kind: call_expression
                  regex: (?i)^[\w.]*(rate_?limit|limiter|throttl|brute|slow_?down|captcha)
      # a limiter the app uses, or this route's own router, with no path or a sign-in prefix (not /uploads)
      - all:
        - pattern: $R.$M($$$)
        - inside:
            kind: program
            stopBy: end
            has:
              stopBy: end
              all:
              - kind: call_expression
                regex: (?i)^\w+\.use\((\s*['\"`]/?((api|v\d+)/)*((api|v\d+|auth\w*|login|log-in|signin|sign-in|sign_in|authenticate|sessions?|accounts?|users?)/?)*['\"`]\s*,)?\s*[\w.]*(rate_?limit|limiter|throttl|brute|slow_?down)
              - any:
                - kind: call_expression
                  regex: ^(app|server)\.use\(
                - pattern: $R.use($$$)
  - follows:
      kind: decorator
      regex: ^@(Throttle|UseGuards\(\s*\w*Throttler\w*)
min_engine: 0.39.0
