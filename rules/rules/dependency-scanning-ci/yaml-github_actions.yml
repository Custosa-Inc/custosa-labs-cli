# scan-gradle: a step in a workflow that runs on every pull request (no branch or path filter), with no if: and
# continue-on-error absent or false, that runs osv-scanner, snyk test or trivy (exit code non-zero) naming a gradle
# lockfile or manifest and fails the job on high or critical findings. Evidence: the scan piece for gradle.
