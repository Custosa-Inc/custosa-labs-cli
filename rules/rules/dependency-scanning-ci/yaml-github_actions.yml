# names-scan-config: a step in a workflow that runs on every pull request (no branch or path filter), with no if: and
# continue-on-error absent or false, that runs osv-scanner, snyk test or trivy (exit code non-zero) naming a
# scan-config lockfile or manifest and fails the job on high or critical findings. Evidence: the scan piece for
# scan-config.
id: dependency-scanning-ci.yaml-github_actions.names-scan-config
practice_id: dependency-scanning-ci
language: yaml
frameworks:
- github_actions
kind: evidence
path_regex: ^\.github/workflows/[^/]+\.ya?ml$
rule:
  all:
  - any:
    - kind: block_mapping_pair
      has:
        field: key
        kind: flow_node
        regex: ^(run)$
      regex: (?s)\b(osv-scanner|snyk|trivy)\b.*\s['\"]?(--config|--ignorefile|--ignore-file|--ignore-policy|--policy-path)(=|['\"]?(\s|$))
    - kind: block_mapping_pair
      has:
        field: key
        kind: flow_node
        regex: ^(run)$
      regex: (\btrivy\b([^\n]*(\\|&&|\|\|?)[ \t\r]*\n)*[^\n]*\s['\"]?-c(=|['\"]?(\s|$))|(?s:^run\s*:\s*(?:[&!][^\s]*[ \t]+)*(?:>[-+0-9]*.*|[^\s|>#&!].*|)\btrivy\b.*\s['\"]?-c(=|['\"]?(\s|$))))
    - kind: block_mapping_pair
      has:
        field: key
        kind: flow_node
        regex: ^(run)$
      regex: (?s)\btrivy\b.*\s['\"]?(--ignore-unfixed|--vex)(=|['\"]?(\s|$))
    - all:
      - kind: block_mapping_pair
        has:
          field: key
          kind: flow_node
          regex: ^(run)$
        regex: \b(snyk|trivy)\b
      - inside:
          stopBy: end
          kind: document
          has:
            stopBy: end
            kind: block_mapping_pair
            regex: \b(TRIVY|SNYK)_[A-Z0-9_]*(CONFIG|CFG|IGNORE|POLICY|SEVERITY|SCANNERS|VULN_TYPE|PKG_TYPES|VEX)[A-Z0-9_]*\s*[:=]
  - inside:
      kind: block_mapping
      inside:
        kind: block_node
        inside:
          kind: block_sequence_item
          inside:
            kind: block_sequence
            inside:
              kind: block_node
              inside:
                kind: block_mapping_pair
                has:
                  field: key
                  kind: flow_node
                  regex: ^(steps)$
min_engine: 0.45.3
