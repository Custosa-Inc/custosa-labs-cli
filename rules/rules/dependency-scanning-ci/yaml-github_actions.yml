# ignores-lockfile: an install that ignores or rewrites the lockfile: a bare npm install, yarn without
# --frozen-lockfile or --immutable, pip install -r or . without --require-hashes, --no-frozen-lockfile,
# --package-lock=false, uv lock --upgrade, and bare bun install, uv sync, poetry install and bundle install. Fail.
id: dependency-scanning-ci.yaml-github_actions.ignores-lockfile
practice_id: dependency-scanning-ci
language: yaml
frameworks:
- github_actions
kind: violation
path_regex: ^\.github/workflows/[^/]+\.ya?ml$
rule:
  all:
  - any:
    - any:
      - all:
        - kind: block_mapping_pair
          has:
            field: key
            kind: flow_node
            regex: ^(run)$
