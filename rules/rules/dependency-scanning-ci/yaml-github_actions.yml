              kind: flow_node
              regex: ^(run)$
            regex: (^|\n|&&|;|\|\||run\s*:\s*[|>]?[-+]?\s*)\s*(npm\s+audit|pnpm\s+audit|yarn\s+npm\s+audit)\b
          - not:
              kind: block_mapping_pair
              regex: ^run\s*:\s*(?:[&!][^\s]*[ \t]+)*(>|[^\s|>#&!][^\n]*\n)
        - all:
