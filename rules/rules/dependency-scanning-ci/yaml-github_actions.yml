            regex: ^(run)$
          regex: (^|\n|&&|;|\|\||run\s*:\s*[|>]?[-+]?\s*)\s*pip3?\s+install\b[^\n]*(\s-r\s|\s-e\s+\.|\s\.(\s|$))
          all:
          - not:
              kind: block_mapping_pair
              regex: --require-hashes\b
        - not:
            kind: block_mapping_pair
            regex: ^run\s*:\s*(?:[&!][^\s]*[ \t]+)*(>|[^\s|>#&!][^\n]*\n)
      - all:
        - kind: block_mapping_pair
          has:
            field: key
            kind: flow_node
            regex: ^(run)$
          regex: (&&|;|\|\||^run\s*:\s*(?:[&!][^\s]*[ \t]+)*(>[^\n]*\n)?|\n[ \t\r]*\r?\n)\s*pip3?\s+install\b[^\n]*(\s-r\s|\s-e\s+\.|\s\.(\s|$))
          all:
