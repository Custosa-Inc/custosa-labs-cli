# osv-scanner-run: a step in a workflow that runs on every pull request (no branch or path filter), with no if: and
# continue-on-error absent or false, that runs osv-scanner, snyk test or trivy (exit code non-zero) naming a
# scanner-run lockfile or manifest and fails the job on high or critical findings. Evidence: the scan piece for
# scanner-run.
id: dependency-scanning-ci.yaml-github_actions.osv-scanner-run
practice_id: dependency-scanning-ci
language: yaml
frameworks:
- github_actions
kind: evidence
path_regex: ^\.github/workflows/[^/]+\.ya?ml$
rule:
  all:
  - kind: block_mapping_pair
    has:
      field: key
      kind: flow_node
      regex: ^(run)$
    regex: \bosv-scanner\b
  - inside:
      kind: block_mapping
      inside:
        kind: block_node
        inside:
          kind: block_sequence_item
          inside:
            kind: block_sequence
            inside:
              kind: block_node
              inside:
                kind: block_mapping_pair
                has:
                  field: key
                  kind: flow_node
                  regex: ^(steps)$
min_engine: 0.45.3
