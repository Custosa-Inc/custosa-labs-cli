# lockfile-pip: a CI run step that installs from the committed lockfile without updating it (uv sync --locked or
# --frozen, pip install --require-hashes -r, pipenv install --deploy, poetry install after poetry check --lock whose
# exit code nothing ignores). Evidence: the lockfile piece for pip.
id: dependency-scanning-ci.yaml-github_actions.lockfile-pip
practice_id: dependency-scanning-ci
language: yaml
frameworks:
- github_actions
kind: evidence
path_regex: ^\.github/workflows/[^/]+\.ya?ml$
rule:
  all:
  - any:
    - any:
      - all:
        - kind: block_mapping_pair
          has:
            field: key
            kind: flow_node
            regex: ^(run)$
          regex: (^|\n|&&|;|\|\||run\s*:\s*[|>]?[-+]?\s*)\s*(uv\s+sync\b[^\n]*--(locked|frozen)\b|pip3?\s+install\b[^\n]*--require-hashes\b[^\n]*\s-r\s|pip3?\s+install\b[^\n]*\s-r\s[^\n]*--require-hashes\b|pipenv\s+install\b[^\n]*--deploy\b)
        - not:
            kind: block_mapping_pair
            regex: ^run\s*:\s*(?:[&!][^\s]*[ \t]+)*(>|[^\s|>#&!][^\n]*\n)
      - all:
        - kind: block_mapping_pair
          has:
            field: key
            kind: flow_node
            regex: ^(run)$
          regex: (&&|;|\|\||^run\s*:\s*(?:[&!][^\s]*[ \t]+)*(>[^\n]*\n)?|\n[ \t\r]*\r?\n)\s*(uv\s+sync\b[^\n]*--(locked|frozen)\b|pip3?\s+install\b[^\n]*--require-hashes\b[^\n]*\s-r\s|pip3?\s+install\b[^\n]*\s-r\s[^\n]*--require-hashes\b|pipenv\s+install\b[^\n]*--deploy\b)
        - kind: block_mapping_pair
          regex: ^run\s*:\s*(?:[&!][^\s]*[ \t]+)*(>|[^\s|>#&!][^\n]*\n)
    - all:
      - kind: block_mapping_pair
        has:
          field: key
          kind: flow_node
          regex: ^(run)$
        regex: (?s)poetry\s+check\s+--lock\b[^\n|;&]*&&.*\bpoetry\s+install\b
        all:
        - not:
            kind: block_mapping_pair
            regex: poetry\s+check\s+--lock\b[^\n]*\|
        - not:
            kind: block_mapping_pair
            regex: \bset\s+\+e\b
    - all:
      - kind: block_mapping_pair
        has:
          field: key
          kind: flow_node
          regex: ^(run)$
        regex: (?s)poetry\s+check\s+--lock\b[^\n|;&]*(\n|;).*\bpoetry\s+install\b
        all:
        - not:
            kind: block_mapping_pair
            regex: poetry\s+check\s+--lock\b[^\n]*\|
        - not:
            kind: block_mapping_pair
            regex: \bset\s+\+e\b
      - not:
          any:
          - inside:
              stopBy: end
              kind: block_sequence_item
              inside:
                kind: block_sequence
                inside:
                  kind: block_node
                  inside:
                    kind: block_mapping_pair
                    has:
                      field: key
                      kind: flow_node
                      regex: ^(steps)$
              has:
                kind: block_node
                has:
                  kind: block_mapping
                  has:
                    kind: block_mapping_pair
                    has:
                      field: key
                      kind: flow_node
                      regex: ^(shell)$
          - inside:
              stopBy: end
              kind: document
              has:
                stopBy: end
                kind: block_mapping_pair
                has:
                  field: key
                  kind: flow_node
                  regex: ^(defaults)$
                regex: '\bshell\s*:'
  - inside:
      kind: block_mapping
      inside:
        kind: block_node
        inside:
          kind: block_sequence_item
          inside:
            kind: block_sequence
            inside:
              kind: block_node
              inside:
                kind: block_mapping_pair
                has:
                  field: key
                  kind: flow_node
                  regex: ^(steps)$
min_engine: 0.45.3
