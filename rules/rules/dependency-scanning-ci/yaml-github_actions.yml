# dependency-scanning-ci (T23 B56a). Written by scripts/gen_depscan_rules.py: edit
# that script, never this file. The practice function reads the pieces by name: lockfile-<eco>, scan-<eco> or
# scan-all, and update-bot-<eco> or update-bot-renovate (NAMING.md).
# The regexes are written for the inspector's Rust regex engine, where $ is the very end of the text. Don't run them in
# JS RegExp or Python re: some don't compile in Node, and some take seconds on a long folded run there (C221).

# lockfile-npm: a CI run step that installs from the committed lockfile without updating it (npm ci, pnpm install
# --frozen-lockfile, yarn install --frozen-lockfile or --immutable, bun install --frozen-lockfile). Evidence: the
# lockfile piece for npm.
id: dependency-scanning-ci.yaml-github_actions.lockfile-npm
practice_id: dependency-scanning-ci
language: yaml
frameworks:
- github_actions
kind: evidence
path_regex: ^\.github/workflows/[^/]+\.ya?ml$
rule:
  all:
  - any:
    - all:
      - kind: block_mapping_pair
        has:
          field: key
          kind: flow_node
          regex: ^(run)$
        regex: (^|\n|&&|;|\|\||run\s*:\s*[|>]?[-+]?\s*)\s*(npm\s+ci\b|pnpm\s+(install|i)\b[^\n]*--frozen-lockfile\b|yarn(\s+install)?\b[^\n]*--(frozen-lockfile|immutable)\b|bun\s+install\b[^\n]*--frozen-lockfile\b)
      - not:
          kind: block_mapping_pair
          regex: ^run\s*:\s*(?:[&!][^\s]*[ \t]+)*(>|[^\s|>#&!][^\n]*\n)
    - all:
      - kind: block_mapping_pair
        has:
          field: key
          kind: flow_node
          regex: ^(run)$
        regex: (&&|;|\|\||^run\s*:\s*(?:[&!][^\s]*[ \t]+)*(>[^\n]*\n)?|\n[ \t\r]*\r?\n)\s*(npm\s+ci\b|pnpm\s+(install|i)\b[^\n]*--frozen-lockfile\b|yarn(\s+install)?\b[^\n]*--(frozen-lockfile|immutable)\b|bun\s+install\b[^\n]*--frozen-lockfile\b)
      - kind: block_mapping_pair
        regex: ^run\s*:\s*(?:[&!][^\s]*[ \t]+)*(>|[^\s|>#&!][^\n]*\n)
  - inside:
      kind: block_mapping
      inside:
        kind: block_node
        inside:
          kind: block_sequence_item
          inside:
            kind: block_sequence
            inside:
              kind: block_node
              inside:
                kind: block_mapping_pair
                has:
                  field: key
                  kind: flow_node
                  regex: ^(steps)$
min_engine: 0.45.3
