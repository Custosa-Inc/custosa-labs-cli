# lockfile-bundler: a CI run step that installs from the committed lockfile without updating it (bundle install with
# BUNDLE_FROZEN or BUNDLE_DEPLOYMENT literal true or 1, or after bundle config set frozen or deployment true).
# Evidence: the lockfile piece for bundler.
id: dependency-scanning-ci.yaml-github_actions.lockfile-bundler
practice_id: dependency-scanning-ci
language: yaml
frameworks:
- github_actions
kind: evidence
path_regex: ^\.github/workflows/[^/]+\.ya?ml$
rule:
  all:
  - any:
    - all:
      - any:
        - all:
          - kind: block_mapping_pair
            has:
              field: key
              kind: flow_node
              regex: ^(run)$
            regex: (^|\n|&&|;|\|\||run\s*:\s*[|>]?[-+]?\s*)\s*bundle\s+install\b
          - not:
              kind: block_mapping_pair
              regex: ^run\s*:\s*(?:[&!][^\s]*[ \t]+)*(>|[^\s|>#&!][^\n]*\n)
        - all:
          - kind: block_mapping_pair
            has:
              field: key
              kind: flow_node
              regex: ^(run)$
            regex: (&&|;|\|\||^run\s*:\s*(?:[&!][^\s]*[ \t]+)*(>[^\n]*\n)?|\n[ \t\r]*\r?\n)\s*bundle\s+install\b
          - kind: block_mapping_pair
            regex: ^run\s*:\s*(?:[&!][^\s]*[ \t]+)*(>|[^\s|>#&!][^\n]*\n)
      - any:
        - inside:
            stopBy: end
            kind: block_sequence_item
            inside:
              kind: block_sequence
              inside:
                kind: block_node
                inside:
                  kind: block_mapping_pair
                  has:
                    field: key
                    kind: flow_node
                    regex: ^(steps)$
            has:
              kind: block_node
              has:
                kind: block_mapping
                has:
                  kind: block_mapping_pair
                  has:
                    field: key
                    kind: flow_node
                    regex: ^(env)$
                  regex: (?m)\bBUNDLE_(FROZEN|DEPLOYMENT)\s*:\s*['\"]?(true|1)['\"]?\s*$
        - inside:
            stopBy: end
            kind: block_mapping_pair
            inside:
              kind: block_mapping
              inside:
                kind: block_node
                inside:
                  kind: block_mapping_pair
                  has:
                    field: key
                    kind: flow_node
                    regex: ^(jobs)$
            has:
              kind: block_node
              has:
                kind: block_mapping
                has:
                  kind: block_mapping_pair
                  has:
                    field: key
                    kind: flow_node
                    regex: ^(env)$
                  regex: (?m)\bBUNDLE_(FROZEN|DEPLOYMENT)\s*:\s*['\"]?(true|1)['\"]?\s*$
        - inside:
            stopBy: end
            kind: document
            has:
              kind: block_node
              has:
                kind: block_mapping
                has:
                  kind: block_mapping_pair
                  has:
                    field: key
                    kind: flow_node
                    regex: ^(env)$
                  regex: (?m)\bBUNDLE_(FROZEN|DEPLOYMENT)\s*:\s*['\"]?(true|1)['\"]?\s*$
    - kind: block_mapping_pair
      has:
        field: key
        kind: flow_node
        regex: ^(run)$
      regex: (?s)\bbundle\s+config\s+(set\s+)?(--local\s+)?(frozen|deployment)\s+['\"]?true['\"]?.*\bbundle\s+install\b
  - inside:
      kind: block_mapping
      inside:
        kind: block_node
        inside:
          kind: block_sequence_item
          inside:
            kind: block_sequence
            inside:
              kind: block_node
              inside:
                kind: block_mapping_pair
                has:
                  field: key
                  kind: flow_node
                  regex: ^(steps)$
