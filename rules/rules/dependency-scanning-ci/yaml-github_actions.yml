        kind: flow_node
        regex: ^(run)$
      regex: (npm\s+(install|i)\b[^\n]*--package-lock=false|--no-frozen-lockfile\b|uv\s+lock\b[^\n]*--upgrade\b)
    - any:
      - all:
        - kind: block_mapping_pair
          has:
            field: key
            kind: flow_node
            regex: ^(run)$
          regex: (^|\n|&&|;|\|\||run\s*:\s*[|>]?[-+]?\s*)\s*yarn(\s+install)?(\s+--?[A-Za-z][\w-]*(=\S+)?)*\s*($|\n|&&|;|\|)
          all:
          - not:
              kind: block_mapping_pair
              regex: yarn(\s+install)?\b[^\n]*--(frozen-lockfile|immutable)\b
        - not:
            kind: block_mapping_pair
            regex: ^run\s*:\s*(?:[&!][^\s]*[ \t]+)*(>|[^\s|>#&!][^\n]*\n)
      - all:
        - kind: block_mapping_pair
          has:
            field: key
            kind: flow_node
            regex: ^(run)$
          regex: (&&|;|\|\||^run\s*:\s*(?:[&!][^\s]*[ \t]+)*(>[^\n]*\n)?|\n[ \t\r]*\r?\n)\s*yarn(\s+install)?(\s+--?[A-Za-z][\w-]*(=\S+)?)*\s*($|\n|&&|;|\|)
          all:
          - not:
              kind: block_mapping_pair
              regex: yarn(\s+install)?\b[^\n]*--(frozen-lockfile|immutable)\b
        - kind: block_mapping_pair
          regex: ^run\s*:\s*(?:[&!][^\s]*[ \t]+)*(>|[^\s|>#&!][^\n]*\n)
    - any:
      - all:
        - kind: block_mapping_pair
          has:
            field: key
