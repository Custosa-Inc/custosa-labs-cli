          all:
          - not:
              kind: block_mapping_pair
              regex: npm\s+(install|i)\b[^\n]*\s(-g|--global)\b
        - not:
            kind: block_mapping_pair
            regex: ^run\s*:\s*(?:[&!][^\s]*[ \t]+)*(>|[^\s|>#&!][^\n]*\n)
      - all:
        - kind: block_mapping_pair
          has:
            field: key
            kind: flow_node
            regex: ^(run)$
          regex: (&&|;|\|\||^run\s*:\s*(?:[&!][^\s]*[ \t]+)*(>[^\n]*\n)?|\n[ \t\r]*\r?\n)\s*npm\s+(install|i)(\s+--?[A-Za-z][\w-]*(=\S+)?)*\s*($|\n|&&|;|\|)
          all:
