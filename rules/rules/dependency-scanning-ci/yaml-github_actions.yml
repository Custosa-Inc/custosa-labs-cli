# scan-pip: a step in a workflow that runs on every pull request (no branch or path filter), with no if: and
# continue-on-error absent or false, that runs pip-audit, or osv-scanner, snyk test or trivy (exit code non-zero)
# naming a pip lockfile and fails the job on high or critical findings. Evidence: the scan piece for pip.
id: dependency-scanning-ci.yaml-github_actions.scan-pip
practice_id: dependency-scanning-ci
language: yaml
frameworks:
- github_actions
kind: evidence
path_regex: ^\.github/workflows/[^/]+\.ya?ml$
