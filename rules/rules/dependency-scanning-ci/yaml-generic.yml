# workspace-declared: a workspace root: a top-level workspaces key in a package.json, or a packages: list in a
# pnpm-workspace.yaml. Evidence for the one-app check (B56c).
id: dependency-scanning-ci.yaml-generic.workspace-declared
practice_id: dependency-scanning-ci
language: yaml
frameworks:
- generic
kind: evidence
path_regex: (^|/)pnpm-workspace\.yaml$
rule:
  kind: block_mapping_pair
  has:
    field: key
    kind: flow_node
    regex: ^(packages)$
  inside:
    kind: block_mapping
    inside:
      kind: block_node
      inside:
        kind: document
min_engine: 0.45.3
---
