# dependency-scanning-ci (T23 B56a). Written by scripts/gen_depscan_rules.py: edit
# that script, never this file. The practice function reads the pieces by name: lockfile-<eco>, scan-<eco> or
# scan-all, and update-bot-<eco> or update-bot-renovate (NAMING.md).
# The regexes are written for the inspector's Rust regex engine, where $ is the very end of the text. Don't run them in
# JS RegExp or Python re: some don't compile in Node, and some take seconds on a long folded run there (C221).

# update-bot-npm: a dependabot.yml (version: 2) updates entry for npm (package-ecosystem npm) that leaves version
# updates on (open-pull-requests-limit not 0). Evidence: the update-bot piece for npm.
id: dependency-scanning-ci.yaml-generic.update-bot-npm
practice_id: dependency-scanning-ci
language: yaml
frameworks:
- generic
kind: evidence
path_regex: ^\.github/dependabot\.ya?ml$
rule:
  kind: block_sequence_item
  inside:
    kind: block_sequence
    inside:
      kind: block_node
      inside:
        kind: block_mapping_pair
        has:
          field: key
          kind: flow_node
          regex: ^(updates)$
  all:
  - has:
      kind: block_node
      has:
        kind: block_mapping
        has:
          kind: block_mapping_pair
          has:
            field: key
            kind: flow_node
            regex: ^(package-ecosystem)$
          regex: ^package-ecosystem\s*:\s*['\"]?(npm)['\"]?\s*$
  - not:
      has:
        kind: block_node
        has:
          kind: block_mapping
          has:
            kind: block_mapping_pair
            has:
              field: key
              kind: flow_node
              regex: ^(open-pull-requests-limit)$
            regex: ^open-pull-requests-limit\s*:\s*['\"]?0['\"]?\s*$
  - inside:
      stopBy: end
      kind: document
      has:
        kind: block_node
        has:
          kind: block_mapping
          has:
            kind: block_mapping_pair
            has:
              field: key
              kind: flow_node
              regex: ^(version)$
            regex: ^version\s*:\s*['\"]?2['\"]?\s*$
min_engine: 0.45.3
---
