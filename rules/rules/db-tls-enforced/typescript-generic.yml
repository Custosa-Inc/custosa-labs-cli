# T29-P1-C6: the client's TLS mode taken from a value the check can't read: an ssl option whose value is not a
# literal (true, false, a string, a number or an object) or reads process.env, on the same clients as tls-off-option,
# a template whose sslmode is interpolated (whatever it starts with), or sslmode= ending a string joined with +
# (T29-P3-C65 low 1, T29-P1-C52). The practice reports unknown and asks (assistant_answer_needed), never a pass, while
# it is there. A bare connection string from the environment, with no TLS option beside it, is not this: the server
# side settles enforcement.
id: db-tls-enforced.typescript-generic.tls-from-env
practice_id: db-tls-enforced
language: typescript
frameworks:
- generic
kind: evidence
rule:
  any:
  - kind: template_string
    regex: '(?i)[?&]sslmode=\$\{'
  - any:
    - kind: string
      regex: '(?i)[?&]sslmode=["'']$'
    - kind: template_string
      regex: '(?i)[?&]sslmode=`$'
    inside:
      kind: binary_expression
  - kind: pair
    all:
    - has:
        field: key
        any:
        - kind: property_identifier
          regex: '^ssl$'
        - kind: string
          regex: '^["''`]ssl["''`]$'
    # an object is judged by its own keys (below): a CA or a certificate path read from the environment changes no mode
    # (T29 (t): the (k) key's twins B007 and B013 asked before). A choice that is off on every branch is tls-off-option.
    - has:
        field: value
        not:
          any:
          - kind: 'true'
          - kind: 'false'
          - kind: string
          - kind: number
          # an object with a spread may carry rejectUnauthorized: false that no rule sees, so it asks (P2 C148 med 1)
          - kind: object
            not:
              has:
                kind: spread_element
          - kind: ternary_expression
            all:
            - has: {field: consequence, any: [{kind: 'false'}, {kind: 'null'}, {kind: undefined}, {kind: identifier, regex: '^undefined$'}]}
            - has: {field: alternative, any: [{kind: 'false'}, {kind: 'null'}, {kind: undefined}, {kind: identifier, regex: '^undefined$'}]}
            - any:
              - has: {field: consequence, kind: 'false'}
              - has: {field: alternative, kind: 'false'}
    - inside:
        kind: object
        any:
        - inside:
            kind: arguments
            inside:
              any:
              - kind: new_expression
                has:
                  field: constructor
                  any:
                  - kind: identifier
                    regex: '^(Pool|Client)$'
                  - kind: member_expression
                    regex: '^pg\.(Pool|Client)$'
              - kind: call_expression
                has:
                  field: function
                  kind: identifier
                  regex: '^(postgres|createPool)$'
        - inside:
            kind: pair
            has:
              field: key
              kind: property_identifier
              regex: '^connection$'
  # T29 (t): a certificate check the code can't read, `ssl: { rejectUnauthorized: process.env.X !== "false" }`, on the
  # same clients (it was matched before through any process.env inside the ssl value, which also asked on a CA path)
  - kind: pair
    all:
    - has:
        field: key
        any:
        - kind: property_identifier
          regex: '^rejectUnauthorized$'
        - kind: string
          regex: '^["''`]rejectUnauthorized["''`]$'
    - has:
        field: value
        not:
          any:
          - kind: 'true'
          - kind: 'false'
    - inside:
        kind: object
        inside:
          kind: pair
          has:
            field: key
            any:
            - kind: property_identifier
              regex: '^ssl$'
            - kind: string
              regex: '^["''`]ssl["''`]$'
          inside:
            kind: object
            any:
            - inside:
                kind: arguments
                inside:
                  any:
                  - kind: new_expression
                    has:
                      field: constructor
                      any:
                      - kind: identifier
                        regex: '^(Pool|Client)$'
                      - kind: member_expression
                        regex: '^pg\.(Pool|Client)$'
                  - kind: call_expression
                    has:
                      field: function
                      kind: identifier
                      regex: '^(postgres|createPool)$'
            - inside:
                kind: pair
                has:
                  field: key
                  kind: property_identifier
                  regex: '^connection$'
  # T29 (t): a node-postgres Pool or Client given its host in code, with no ssl option and no connection string (the (k)
  # key's B014). node-postgres then takes the mode from PGSSLMODE, and with that unset it connects without TLS. The check
  # can't read the environment, so it asks. A bare connection string from the environment stays as it was: its URL or
  # the server side settles it. An object with a spread may carry ssl, so it is left alone.
  - kind: object
    all:
    - has:
        kind: pair
        has:
          field: key
          kind: property_identifier
          regex: '^host$'
    - not:
        has:
          kind: pair
          has:
            field: key
            any:
            - kind: property_identifier
              regex: '^(ssl|connectionString)$'
            - kind: string
              regex: '^["''`](ssl|connectionString)["''`]$'
    - not:
        has:
          kind: spread_element
    - inside:
        kind: arguments
        inside:
          kind: new_expression
          has:
            field: constructor
            any:
            - kind: identifier
              regex: '^(Pool|Client)$'
            - kind: member_expression
              regex: '^pg\.(Pool|Client)$'
min_engine: 0.39.0
