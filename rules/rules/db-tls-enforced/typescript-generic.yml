# T29 (t): certificate checks off in a Postgres client's ssl object, `ssl: { rejectUnauthorized: false }` (the (k) key's
# B008), on the same clients as tls-off-option. The practice asks for a client that verifies the server's certificate.
# node-postgres's connection string parser reads sslmode=require as verify-full unless uselibpqcompat is set, so in
# node this option is the plain way to turn the check off. A rejectUnauthorized the check can't read is tls-from-env.
id: db-tls-enforced.typescript-generic.tls-no-verify
practice_id: db-tls-enforced
language: typescript
frameworks:
- generic
kind: violation
rule:
  kind: pair
  all:
  - has:
      field: key
      any:
      - kind: property_identifier
        regex: '^rejectUnauthorized$'
      - kind: string
        regex: '^["''`]rejectUnauthorized["''`]$'
  - has:
      field: value
      kind: 'false'
  - inside:
      kind: object
      inside:
        kind: pair
        has:
          field: key
          any:
          - kind: property_identifier
            regex: '^ssl$'
          - kind: string
            regex: '^["''`]ssl["''`]$'
        inside:
          kind: object
          any:
          - inside:
              kind: arguments
              inside:
                any:
                - kind: new_expression
                  has:
                    field: constructor
                    any:
                    - kind: identifier
                      regex: '^(Pool|Client)$'
                    - kind: member_expression
                      regex: '^pg\.(Pool|Client)$'
                - kind: call_expression
                  has:
                    field: function
                    kind: identifier
                    regex: '^(postgres|createPool)$'
          - inside:
              kind: pair
              has:
                field: key
                kind: property_identifier
                regex: '^connection$'
min_engine: 0.39.0
