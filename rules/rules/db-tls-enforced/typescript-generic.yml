# T29 (T29-P1-C5 item 7, E-5): the client side of db-tls-enforced, which had no rule. The practice's "client-verified"
# mechanism: every connection string in the code uses sslmode=verify-full, or require where the platform enforces TLS.
# A Postgres connection string literal with sslmode disable, allow or prefer (a client that may connect in plain text).
id: db-tls-enforced.typescript-generic.tls-off-url
practice_id: db-tls-enforced
language: typescript
frameworks:
- generic
kind: violation
rule:
  any:
  - kind: string
    regex: '(?i)^["''`]postgres(ql)?(\+\w+)?://[^"''`]*[?&]sslmode=(disable|allow|prefer)\b'
  - kind: template_string
    regex: '(?i)^`postgres(ql)?(\+\w+)?://[^`]*[?&]sslmode=(disable|allow|prefer)\b'
  # T29 (t): a template or a joined string that adds the mode to a URL from elsewhere, `${process.env.DATABASE_URL}?sslmode=disable`
  # or DATABASE_URL + "?sslmode=disable" (the (k) key's B035)
  # anchored (P2 C148 med 2): the mode follows an interpolation in one URL-shaped run, or a joined string starts with
  # the query, so a guard's message, a replace or a warning that names the mode is not a client
  # (P2 C152 lows 1 and 2) a mysql or mariadb URL is not a Postgres client, and only a + joins: `=== "?sslmode=disable"`
  # is a guard
  # (P3 C218 low 1) url += "?sslmode=disable" joins too, and so does a string in one pair of parentheses that a + joins
  - kind: template_string
    regex: '(?i)\}[^\s"''`]*[?&]sslmode=(disable|allow|prefer)\b'
    not:
      kind: template_string
      regex: '(?i)^`(mysql|mariadb)(\+\w+)?://'
  - kind: string
    regex: '(?i)^["''][^\s"'']*[?&]sslmode=(disable|allow|prefer)\b'
    any:
    - inside:
        pattern: $L + $R
    - inside:
        pattern: $L += $R
    - inside:
        kind: parenthesized_expression
        inside:
          pattern: $L + $R
min_engine: 0.39.0
---
# ssl: false on a Postgres client's options: node-postgres (new Pool or new Client, pg.Pool), postgres.js (postgres(...)),
# or a knex or Drizzle connection object (the value of a connection key). Off everywhere else is left alone: a mail
# transport's ssl: false is not a database connection.
id: db-tls-enforced.typescript-generic.tls-off-option
practice_id: db-tls-enforced
language: typescript
frameworks:
- generic
kind: violation
rule:
  kind: pair
  all:
  - has:
      field: key
      any:
      - kind: property_identifier
        regex: '^ssl$'
      - kind: string
        regex: '^["''`]ssl["''`]$'
  - has:
      field: value
      any:
      - kind: 'false'
      # T29 (t): a choice where no branch turns TLS on and one turns it off, `ssl: prod ? undefined : false` (the (k)
      # key's B023): node-postgres then takes the mode from the URL or PGSSLMODE in one case and is off in the other
      - kind: ternary_expression
        all:
        - has: {field: consequence, any: [{kind: 'false'}, {kind: 'null'}, {kind: undefined}, {kind: identifier, regex: '^undefined$'}]}
        - has: {field: alternative, any: [{kind: 'false'}, {kind: 'null'}, {kind: undefined}, {kind: identifier, regex: '^undefined$'}]}
        - any:
          - has: {field: consequence, kind: 'false'}
          - has: {field: alternative, kind: 'false'}
  - inside:
      kind: object
      any:
      - inside:
          kind: arguments
          inside:
            any:
            - kind: new_expression
              has:
                field: constructor
                any:
                - kind: identifier
                  regex: '^(Pool|Client)$'
                - kind: member_expression
                  regex: '^pg\.(Pool|Client)$'
            - kind: call_expression
              has:
                field: function
                kind: identifier
                regex: '^(postgres|createPool)$'
      - inside:
          kind: pair
          has:
            field: key
            kind: property_identifier
            regex: '^connection$'
min_engine: 0.39.0
