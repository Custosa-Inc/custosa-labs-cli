# T29 (T29-P1-C5 item 7, E-5): the client side of db-tls-enforced, which had no rule. The practice's "client-verified"
# mechanism: every connection string in the code uses sslmode=verify-full, or require where the platform enforces TLS.
# A Postgres connection string literal (psycopg, SQLAlchemy, asyncpg) with sslmode disable, allow or prefer.
id: db-tls-enforced.python-generic.tls-off-url
practice_id: db-tls-enforced
language: python
frameworks:
- generic
kind: violation
rule:
  kind: string
  regex: '(?i)^[rbuf]*["'']{1,3}postgres(ql)?(\+\w+)?://[^"'']*[?&]sslmode=(disable|allow|prefer)\b'
min_engine: 0.39.0
---
# sslmode="disable" (or allow, prefer) as a keyword (psycopg and psycopg2 connect, or a SQLAlchemy connect_args), or
# ssl=False on asyncpg's connect or create_pool. ssl=False on any other call is left alone.
id: db-tls-enforced.python-generic.tls-off-option
practice_id: db-tls-enforced
language: python
frameworks:
- generic
kind: violation
rule:
  kind: keyword_argument
  any:
  - all:
    - has:
        field: name
        kind: identifier
        regex: '^sslmode$'
    - has:
        field: value
        kind: string
        regex: '(?i)^[rbu]*["''](disable|allow|prefer)["'']$'
  - all:
    - has:
        field: name
        kind: identifier
        regex: '^ssl$'
    - has:
        field: value
        kind: 'false'
    - inside:
        kind: argument_list
        inside:
          kind: call
          has:
            field: function
            kind: attribute
            regex: '^asyncpg\.(connect|create_pool)$'
min_engine: 0.39.0
---
# T29-P1-C6: the client's TLS mode taken from a value the check can't read: sslmode= whose value is not a plain string
# literal (an f-string, a name, an attribute or a call, os.environ and getenv included), ssl= on asyncpg's connect or
# create_pool whose value is not True, False or a string, a connection string whose sslmode is interpolated ({} or %,
# f-string or not), or sslmode= ending a string joined with + (T29-P3-C65 low 1, T29-P1-C52). The practice reports
# unknown and asks (assistant_answer_needed), never a pass, while it is there. A bare connection string from the
# environment is not this: the server side settles enforcement.
id: db-tls-enforced.python-generic.tls-from-env
practice_id: db-tls-enforced
language: python
frameworks:
- generic
kind: evidence
rule:
  any:
  - kind: string
    regex: '(?i)[?&]sslmode=(\{|%)'
  - kind: string
    regex: '(?i)[?&]sslmode=["'']{1,3}$'
    inside:
      kind: binary_operator
  - kind: keyword_argument
    all:
    - has:
        field: name
        kind: identifier
        regex: '^sslmode$'
    - has:
        field: value
        any:
        - not:
            kind: string
        - kind: string
          regex: '^[rbuRBU]*[fF]'
  - kind: keyword_argument
    all:
    - has:
        field: name
        kind: identifier
        regex: '^ssl$'
    - has:
        field: value
        not:
          any:
          - kind: 'true'
          - kind: 'false'
          - kind: string
    - inside:
        kind: argument_list
        inside:
          kind: call
          has:
            field: function
            kind: attribute
            regex: '^asyncpg\.(connect|create_pool)$'
min_engine: 0.39.0
