# Python request handlers (Odoo @http.route, Flask or FastAPI routes, Django views taking request) that skip the
# record rules, one item each: Odoo's sudo() or with_user(SUPERUSER_ID), Tryton's set_user(0) or check_access=False, a
# supabase-py client created with the service role or secret key, or the Firebase Admin SDK's firestore.client(). A
# plain connection (create_engine, psycopg.connect) is not elevated. The control is one of: every elevated query in
# the handler (sudo(), with_user(SUPERUSER_ID), the service-key client's table()) scoped to the caller (a domain on
# the caller's user or partner, an .eq on the owner column), at least one; a direct statement of the handler body,
# with nothing returned before it, comparing the record's owner field (never one the request sent: body, data, kw,
# request.json ...) with the caller (request.env.user, request.user, current_user, g.user), with no and/or, that
# raises or answers 403/404; or, for a route with no per-user record, a request header compared with a secret from the
# environment that refuses. A call named for ownership, an audit write naming the caller, or a lookup of the caller's
# own partner beside an unscoped read is never the control.
id: elevated-routes-check-ownership.python-generic.elevated-handler
practice_id: elevated-routes-check-ownership
language: python
frameworks: [generic]
kind: items
rule:
  all:
  - kind: function_definition
    any:
    - has:
        field: parameters
        kind: parameters
        regex: '^\(\s*request\b'
    - inside:
        kind: decorated_definition
        has:
          kind: decorator
          regex: '^@(http\.route|route|\w+\.(route|get|post|put|patch|delete|api_route))\('
  - has:
      stopBy: end
      any:
      - kind: call
        pattern: '$X.sudo($$$)'
      - kind: call
        pattern: '$X.with_user($$$)'
        regex: 'SUPERUSER_ID|\(\s*1\s*\)'
      - kind: call
        pattern: '$X.set_user(0)'
      - kind: keyword_argument
        regex: '^_?check_access\s*=\s*False$'
      - kind: call
        pattern: 'create_client($U, $K)'
        has:
          field: arguments
          kind: argument_list
          regex: '(?i)service_?role|secret_?key'
      - kind: call
        pattern: 'firestore.client($$$)'
        inside:
          kind: module
          stopBy: end
          has:
            stopBy: end
            any:
            - {kind: import_statement, regex: firebase_admin}
            - {kind: import_from_statement, regex: firebase_admin}
