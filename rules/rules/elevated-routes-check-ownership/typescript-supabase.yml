# Supabase Edge Function handlers (inline in Deno.serve) that use a client skipping row-level security, one item each:
# createClient with the service role or secret key read from Deno.env (matched by the key, never the variable's name),
# created in the handler or at the top of its file.
#
# The control is one of: every query of the elevated client in the handler (from, storage.from, a Firestore
# collection) filtered on the owner, user or tenant column against the caller kept from the session (getUser,
# getClaims, auth(), getServerSession, currentUser), at least one of them; or a direct, unbranched statement of the
# handler that compares the record's owner field (never one the request sent: body., req., params., input., data.)
# with that caller and refuses, with no && and nothing returned before it; or, for a route with no per-user record, a
# request header compared with a secret from the environment (never a public key name) or a Stripe signature check
# that throws to the caller. A call named for ownership is never read as one, and an owner id in an insert or an audit
# write is not a filter. An elevated client imported from another module is not seen (no dataflow); a plain connection
# (new Pool, new PrismaClient, a publishable-key client) is not elevated.
id: elevated-routes-check-ownership.typescript-supabase.elevated-handler
practice_id: elevated-routes-check-ownership
language: typescript
frameworks: [supabase]
kind: items
rule:
  all:
  - any:
    - {kind: arrow_function}
    - {kind: function_expression}
    inside:
      kind: arguments
      inside:
        kind: call_expression
        pattern: 'Deno.serve($$$)'
  - any:
    - has:
        stopBy: end
        any:
        - kind: call_expression
          pattern: 'createClient($U, $K, $$$)'
          has:
            field: arguments
            kind: arguments
            regex: '(?i)(service_?role|secret_?key|sb_secret_|SUPABASE_SECRET)'
        - kind: call_expression
          pattern: 'createClient($U, $K)'
          has:
            field: arguments
            kind: arguments
            regex: '(?i)(service_?role|secret_?key|sb_secret_|SUPABASE_SECRET)'
        - kind: call_expression
          any:
          - pattern: '$A.firestore()'
          - pattern: 'getFirestore($$$)'
          - pattern: '$A.auth()'
          - pattern: 'getAuth($$$)'
          inside:
            kind: program
            stopBy: end
            has:
              kind: import_statement
              regex: '[''"]firebase-admin(/[a-z-]+)?[''"]'
    - all:
      - has:
          stopBy: end
          any:
          - pattern: '$A.from($$$)'
          - pattern: '$A.storage.from($$$)'
          - pattern: '$A.rpc($$$)'
          - pattern: '$A.auth.admin.$F($$$)'
      - inside:
          kind: program
          stopBy: end
          has:
            kind: lexical_declaration
            has:
              kind: variable_declarator
              pattern:
                context: 'const $A = createClient($$$)'
                selector: variable_declarator
              has:
                field: value
                kind: call_expression
                has:
                  field: arguments
                  kind: arguments
                  regex: '(?i)(service_?role|secret_?key|sb_secret_|SUPABASE_SECRET)'
