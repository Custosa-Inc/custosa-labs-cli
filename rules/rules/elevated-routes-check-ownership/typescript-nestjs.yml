# NestJS controller methods under @Get, @Post, @Put, @Patch, @Delete or @All that use a client skipping row-level
# security, one item each (T23 B47). Elevated is createClient with the service role or secret key (matched by the key,
# never the variable's name), made in the method, at the top of its file, or kept on the class by a field or a
# constructor assignment in the same class. The route shape is authz-every-handler's.
#
# The control is one of: every query of the elevated client in the method (from, storage.from, rpc) filtered with
# .eq on the owner, user or tenant column against the caller read from the request (req.user, req.auth), at least
# one of them; or a direct statement of the method, with no return before it, that compares the owner field of a
# record the method read with an elevated query (const x = await ..., or const { x } = await ...) with that caller
# and throws; or, for a route with no per-user record, a direct statement that throws when a secret from the
# environment (never a public key name) is unset or differs from a request header (`!process.env.X || h !==
# process.env.X`, or `!timingSafeEqual(...)` of the two), the header read from a @Headers() parameter or from
# req.headers, req.header() or req.get() (T23-P1-C67). A guard says who may call, never which record, so it is never
# the control; a value from @Param(), @Body() or @Query() is never the caller, nor is an app decorator such as
# @CurrentUser() (T23-P1-C57). A client injected from another module is not seen (no dataflow): no item, and the
# practice's max_state keeps that from passing.
