id: ai-trace-redaction.javascript-generic.langfuse-client
practice_id: ai-trace-redaction
language: javascript
frameworks:
- generic
kind: items
rule:
  all:
  - kind: new_expression
  - has:
      field: constructor
      any:
      - kind: identifier
        regex: '^(Langfuse|LangfuseClient|CallbackHandler|LangfuseSpanProcessor|LangfuseExporter)$'
      - kind: member_expression
        regex: '\.(Langfuse|LangfuseClient|CallbackHandler|LangfuseSpanProcessor|LangfuseExporter)$'
control:
  has:
    field: arguments
    kind: arguments
    has:
      kind: object
      all:
      - has:
          any:
          - kind: pair
            all:
            - has:
                field: key
                kind: property_identifier
                regex: '^mask$'
            - has:
                field: value
                any:
                - kind: arrow_function
                - kind: function_expression
                - kind: identifier
                - kind: member_expression
                - kind: call_expression
                not:
                  any:
                  - pattern: '({ data }) => data'
                  - pattern: '($X1) => $X1'
                  - pattern: '$X2 => $X2'
                  - pattern: 'function ($X3) { return $X3; }'
          - kind: method_definition
            has:
              field: name
              kind: property_identifier
              regex: '^mask$'
          - kind: shorthand_property_identifier
            regex: '^mask$'
      - not:
          has:
            kind: spread_element
min_engine: 0.45.3
