id: ai-trace-redaction.javascript-generic.langsmith-client
practice_id: ai-trace-redaction
language: javascript
frameworks:
- generic
kind: items
rule:
  all:
  - kind: new_expression
  - has:
      field: constructor
      kind: identifier
      regex: '^Client$'
  - has:
      field: arguments
      kind: arguments
      has:
        kind: object
        has:
          kind: pair
          has:
            field: key
            kind: property_identifier
            regex: '^hide(Inputs|Outputs)$'
control:
  has:
    field: arguments
    kind: arguments
    has:
      kind: object
      all:
      - has:
          kind: pair
          all:
          - has:
              field: key
              kind: property_identifier
              regex: '^hideInputs$'
          - has:
              field: value
              any:
              - &id001
                kind: arrow_function
              - &id002
                kind: function_expression
              - &id003
                kind: identifier
              - &id004
                kind: member_expression
              - &id005
                kind: call_expression
              - kind: 'true'
              not:
                any:
                - &id006
                  pattern: '({ data }) => data'
                - &id007
                  pattern: '($X1) => $X1'
                - &id008
                  pattern: '$X2 => $X2'
                - &id009
                  pattern: 'function ($X3) { return $X3; }'
      - has:
          kind: pair
          all:
          - has:
              field: key
              kind: property_identifier
              regex: '^hideOutputs$'
          - has:
              field: value
              any:
              - *id001
              - *id002
              - *id003
              - *id004
              - *id005
              - kind: 'true'
              not:
                any:
                - *id006
                - *id007
                - *id008
                - *id009
min_engine: 0.45.3
