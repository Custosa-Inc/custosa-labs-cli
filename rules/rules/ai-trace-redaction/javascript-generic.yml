id: ai-trace-redaction.javascript-generic.ai-sdk-telemetry
practice_id: ai-trace-redaction
language: javascript
frameworks:
- generic
kind: items
rule:
  all:
  - kind: pair
  - has:
      field: key
      kind: property_identifier
      regex: '^experimental_telemetry$'
  - has:
      field: value
      kind: object
      has:
        kind: pair
        all:
        - has:
            field: key
            kind: property_identifier
            regex: '^isEnabled$'
        - not:
            has:
              field: value
              kind: 'false'
control:
  all:
  - has:
      field: value
      kind: object
      has:
        kind: pair
        all:
        - has:
            field: key
            kind: property_identifier
            regex: '^recordInputs$'
        - has:
            field: value
            kind: 'false'
  - has:
      field: value
      kind: object
      has:
        kind: pair
        all:
        - has:
            field: key
            kind: property_identifier
            regex: '^recordOutputs$'
        - has:
            field: value
            kind: 'false'
  - has:
      field: value
      kind: object
      not:
        has:
          kind: spread_element
min_engine: 0.45.3
