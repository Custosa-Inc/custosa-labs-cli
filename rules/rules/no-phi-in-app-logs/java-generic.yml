id: no-phi-in-app-logs.java-generic.patient-fields
practice_id: no-phi-in-app-logs
language: java
frameworks:
- generic
kind: violation
rule:
  all:
  - kind: method_invocation
  - regex: '^(log|LOG|logger|LOGGER|this\.logger|this\.log)\s*\.\s*(trace|debug|info|warn|error)\s*\('
  - has:
      field: arguments
      kind: argument_list
      has:
        stopBy: end
        any:
        - kind: method_invocation
          regex: '\.(getSsn|getSSN|getSocialSecurityNumber|getDob|getDOB|getDateOfBirth|getBirthDate|getBirthdate|getDiagnosis|getDiagnoses|getMrn|getMRN|getMedicalRecordNumber)\s*\(\s*\)$'
        - kind: method_invocation
          regex: '^(patient|currentPatient|patientEntity|patientDto)\.(getName|getFirstName|getLastName|getFullName|getGivenName|getFamilyName|getEmail|getPhone|getAddress|getNotes)\s*\(\s*\)$'
        - all:
          - kind: identifier
          - regex: '^(patient|patients|patientEntity|patientDto|patientRecord|currentPatient)$'
          - not:
              any:
              - inside:
                  kind: method_invocation
                  field: object
              - inside:
                  kind: field_access
min_engine: 0.45.3
