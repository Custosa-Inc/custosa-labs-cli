id: no-phi-in-app-logs.java-generic.credential
practice_id: no-phi-in-app-logs
language: java
frameworks:
- generic
kind: violation
rule:
  all:
  - kind: method_invocation
  - regex: '^(log|LOG|logger|LOGGER|this\.logger|this\.log)\s*\.\s*(trace|debug|info|warn|error)\s*\('
  - has:
      field: arguments
      kind: argument_list
      has:
        stopBy: end
        any:
        - kind: method_invocation
          regex: '\.(getPassword|getSecret|getClientSecret|getToken|getAccessToken|getRefreshToken|getApiKey|getPrivateKey|getEncryptionKey)\s*\(\s*\)$'
        - all:
          - kind: identifier
          - regex: '^(?i:password|passwd|secret|clientSecret|token|accessToken|refreshToken|apiKey|privateKey|encryptionKey|jdbcUrl|connectionString)$'
          - not:
              any:
              - inside:
                  kind: method_invocation
                  field: object
              - inside:
                  kind: field_access
              - inside:
                  kind: method_invocation
                  field: name
min_engine: 0.45.3
