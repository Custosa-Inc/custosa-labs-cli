    - any:
      - pattern: 'new Sequelize($$$)'
      - pattern: 'new DataSource($$$)'
      - pattern: 'createConnection($$$)'
      - pattern: 'TypeOrmModule.forRoot($$$)'
      - pattern: 'knex($$$)'
      - pattern: 'Knex($$$)'
    - has:
        stopBy: end
        kind: pair
