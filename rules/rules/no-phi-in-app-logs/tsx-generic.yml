id: no-phi-in-app-logs.tsx-generic.request-body
practice_id: no-phi-in-app-logs
language: tsx
frameworks:
- generic
kind: violation
rule:
  all:
  - kind: call_expression
  - has:
      field: function
      any:
      - kind: member_expression
        regex: '^(console|logger|log|LOG|Logger|pino|winston|globalLogger|this\.logger|this\.log|this\._logger|req\.log|request\.log|ctx\.log|fastify\.log|app\.log|server\.log)(\.child\([^)]*\))?\.(log|info|debug|warn|error|trace|fatal|verbose|silly)$'
      - kind: subscript_expression
        regex: '^console\[[''\x22](log|info|debug|warn|error|trace)[''\x22]\]$'
  - has:
      field: arguments
      kind: arguments
      has:
        stopBy: end
        all:
        - any:
          - kind: member_expression
            regex: '^(req|request|ctx\.request|ctx|event)\??\.(body|query|params|rawBody)$'
          - kind: member_expression
            regex: '^(req|request|ctx\.request|ctx)\??\.originalUrl$'
          - kind: identifier
            regex: '^originalUrl$'
          - kind: call_expression
            regex: '^(c\.req|ctx\.req|req|request)\??\.(json|text|formData|parseBody)\(\)$'
          - kind: await_expression
            regex: '^await\s+(c\.req|ctx\.req|req|request)\??\.(json|text|formData|parseBody)\(\)$'
        - not:
            inside:
              kind: member_expression
              field: object
        - not:
            inside:
              kind: arguments
              inside:
                kind: call_expression
                not:
                  has:
                    field: function
                    any:
                    - kind: member_expression
                      regex: '^(console|logger|log|LOG|Logger|pino|winston|globalLogger|this\.logger|this\.log|this\._logger|req\.log|request\.log|ctx\.log|fastify\.log|app\.log|server\.log)(\.child\([^)]*\))?\.(log|info|debug|warn|error|trace|fatal|verbose|silly)$|^JSON\.stringify$|^util\.inspect$'
                    - kind: identifier
                      regex: '^(String|inspect)$'
                    - kind: subscript_expression
                      regex: '^console\[[''\x22](log|info|debug|warn|error|trace)[''\x22]\]$'
min_engine: 0.45.3
