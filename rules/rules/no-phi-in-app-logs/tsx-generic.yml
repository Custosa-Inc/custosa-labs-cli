# Known limit (C391 low 3, T29-P1-C360): the patient field list is still a list. A related record other than user, profile
# or contact (patient.guardian) and a field read off a root that is no patient name (visit.patient_name) give no match
# (false passes). Any _email or _phone suffix off the patient fails, patient.clinic_email too (false fails only).
# Known limit (C398 low 1, T29-P1-C362): a suffix name that starts with is, has, should, can, notify, allow, enable,
# no or send (hasEmail, has_email, sendEmail) reads as a flag or method, so patient.notify_email gives no match
# (false passes). Known limit (C398 lows 2 and 3, C405): a field other than a contact read off a related record by
# attribute gives no match (patient.user.name, patient.contact.address) (false passes, as on the base). Read by key,
# a patient field fails (patient["user"]["name"]), and an id or a flag does not.
# Known limit (C394 low 2): a key read off an element counts as one value unless it is a nested-record key (data,
# contact, profile, details, info and the like), so patients[0]["payload"] gives no match, nor does a patient field
# two keys below a nested-record key (patients[0]["data"]["contact"]["email"]) (false passes).
# Known limit (T29-P1-C371): a field name off the patient counts when it holds a field word (name, email, phone, dob,
# ssn, address, mrn, diagnosis, insurance, notes) as a snake_case or camelCase word part, and is a flag or id when it
# starts with is, has, should or can or ends in _id, Id, _verified, _count or _at. So patient.clinic_name and
# patient.fileName fail (false fails), and patient.mrn_id and patient.insuranceId give no match (false passes).
# T29-P1-C376: the field word may be plural or end in a digit (patient.addresses, patient.address2), and a name
# that ends in _enabled, _opt_in, _status or _type (Enabled, OptIn, Status, Type) is a flag too. Other flag
# endings fail (patient.email_bounced, patient.notes_updated: false fails).
# T29-P1-C376 item 2: joined lowercase names from a fixed list (surname, firstname, lastname, middlename, fullname,
# nickname, givenname, familyname, forename, maidenname) and PascalCase names (HomeAddress, FirstName) are field names
# too. Other joined names (patient.homeaddress) give no match (false passes); a PascalCase flag (patient.HasEmail) fails.
# T29-P1-C376 item 2: a method or a further read on a field fails (patient.email.toLowerCase(),
# patient.homeAddress.slice(0, 10), patient.address.street), unless it is its length or size or only tests the value
# (startsWith, endsWith, includes, indexOf, lastIndexOf, search, localeCompare). In a callback passed to
# patients.map or flatMap (or patientRows, patientList, patientRecords), any read of a patient field name fails, and
# so does a callback that returns its parameter (patients.map((p) => p)). So patients.map((p) => clinic.name) fails
# (false fails); other methods (filter, find, forEach) and a callback held in a variable give no match (false passes).
# T29-P1-C381: a method on a field off this.patient fails too (this.patient.email.trim()). A hop of id, pk or uuid off a
# field is an id (patient.address.id stays ok), but an element's field still fails (patients[0].address.id, false fail,
# as on the base). In the callback a further read fails too, so patients.map((p) => clinic.address.street) fails.
id: no-phi-in-app-logs.tsx-generic.patient-fields
practice_id: no-phi-in-app-logs
language: tsx
frameworks:
- generic
kind: violation
rule:
  all:
  - kind: call_expression
  - has:
      field: function
      any:
      - kind: member_expression
        regex: '^(console|logger|log|LOG|Logger|pino|winston|globalLogger|this\.logger|this\.log|this\._logger|req\.log|request\.log|ctx\.log|fastify\.log|app\.log|server\.log)(\.child\([^)]*\))?\.(log|info|debug|warn|error|trace|fatal|verbose|silly)$'
      - kind: subscript_expression
        regex: '^console\[[''\x22](log|info|debug|warn|error|trace)[''\x22]\]$'
  - has:
      field: arguments
      kind: arguments
      has:
        stopBy: end
        all:
        - any:
          # T29-P1-C409: a message's recipient is a contact value. The names to, toNumber, toPhone and toAddress fail in a
          # log template, or beside a string argument, that names a message (email, mail, SMS, text, message, notification,
          # invite, reminder, OTP, WhatsApp): `[SMS] Sending to ${to}`, ("Sending SMS to", to), ("invite email sent", { to }).
          # recipient, recipients, recipientNumber and recipientPhone also fail beside a send or delivery verb
          # (`Delivered report to ${recipient}`). A to with no message word (a route, a date bound, a request target) stays ok.
          - all:
            - kind: identifier
            - regex: '^(to|toNumber|toPhone|toAddress)$'
            - inside:
                kind: template_substitution
                inside:
                  kind: template_string
                  regex: '(?i)\b(e-?mails?|mail|sms|texts?|messages?|notifications?|invites?|invitations?|reminders?|otps?|whatsapp)\b'
          - all:
            - kind: identifier
            - regex: '^(to|toNumber|toPhone|toAddress)$'
            - inside:
                stopBy: end
                kind: arguments
                has:
                  kind: string
                  regex: '(?i)\b(e-?mails?|mail|sms|texts?|messages?|notifications?|invites?|invitations?|reminders?|otps?|whatsapp)\b'
          - all:
            - kind: shorthand_property_identifier
            - regex: '^(to|toNumber|toPhone|toAddress)$'
            - inside:
                stopBy: end
                kind: arguments
                has:
                  kind: string
                  regex: '(?i)\b(e-?mails?|mail|sms|texts?|messages?|notifications?|invites?|invitations?|reminders?|otps?|whatsapp)\b'
          - all:
            - kind: identifier
            - regex: '^(recipient|recipients|recipientNumber|recipientPhone)$'
            - inside:
                kind: template_substitution
                inside:
                  kind: template_string
                  regex: '(?i)\b(e-?mails?|mail|sms|texts?|messages?|notifications?|invites?|invitations?|reminders?|otps?|whatsapp|send|sends|sending|sent|deliver|delivers|delivering|delivered|delivery)\b'
          - all:
            - kind: identifier
            - regex: '^(recipient|recipients|recipientNumber|recipientPhone)$'
            - inside:
                stopBy: end
                kind: arguments
                has:
                  kind: string
                  regex: '(?i)\b(e-?mails?|mail|sms|texts?|messages?|notifications?|invites?|invitations?|reminders?|otps?|whatsapp|send|sends|sending|sent|deliver|delivers|delivering|delivered|delivery)\b'
          - all:
            - kind: shorthand_property_identifier
            - regex: '^(recipient|recipients|recipientNumber|recipientPhone)$'
            - inside:
                stopBy: end
                kind: arguments
                has:
                  kind: string
                  regex: '(?i)\b(e-?mails?|mail|sms|texts?|messages?|notifications?|invites?|invitations?|reminders?|otps?|whatsapp|send|sends|sending|sent|deliver|delivers|delivering|delivered|delivery)\b'
          - all:
            - kind: member_expression
            - regex: '\.(ssn|SSN|socialSecurityNumber|social_security_number|dob|DOB|dateOfBirth|date_of_birth|birthDate|birth_date|diagnosis|diagnoses|mrn|MRN|medicalRecordNumber|medical_record_number|insuranceNumber|insurance_number|clinicalNotes|clinical_notes)$'
          # T29-P1-C388 (C428 lows 1 and 2): every patient-field root takes this. too (this.patient.name,
          # this.patient["email"], this.patients.map((p) => p.address.street)). The record whole off this
          # (this.patient, this.patients[0].name) goes through the walk-up below (T29-P1-C391).
          - all:
            - kind: member_expression
            - regex: '^(this\??\.)?((props|state)\??\.)?(patient|patientData|patientRecord|patientRow|currentPatient|selectedPatient)\??\.(name|firstName|lastName|first_name|last_name|fullName|full_name|email|phone|phoneNumber|phone_number|address|notes|firstName|lastName|fullName|emailAddress|phoneNumber|mobileNumber|dateOfBirth|birthDate|(?:patient|contact)_(?:name|first_name|last_name|full_name|address|dob)|(?:patient|contact)(?:Name|FirstName|LastName|FullName|Address|Dob)|[a-z][a-z0-9_]*_(?:email|email_address|phone|phone_number|mobile)|[a-z][A-Za-z0-9]*(?:Email|EmailAddress|Phone|PhoneNumber|Mobile)|(?:[a-z0-9]+_)*(?:names?|emails?|phones?|dobs?|ssns?|address(?:es)?|mrns?|diagnosis|diagnoses|insurances?|notes|(?:surname|firstname|lastname|middlename|fullname|nickname|givenname|familyname|forename|maidenname)s?)[0-9]*(?:_[a-z0-9]+)*|(?:[A-Za-z][a-z0-9]*(?:[A-Z][a-z0-9]*)*)?(?:Names?|Emails?|Phones?|Dobs?|DOBs?|Ssns?|SSNs?|Address(?:es)?|Mrns?|MRNs?|Diagnosis|Diagnoses|Insurances?|Notes|(?:Surname|Firstname|Lastname|Middlename|Fullname|Nickname|Givenname|Familyname|Forename|Maidenname)s?)[0-9]*(?:[A-Z][a-z0-9]*)*|(?:names?|emails?|phones?|dobs?|ssns?|address(?:es)?|mrns?|diagnosis|diagnoses|insurances?|notes|(?:surname|firstname|lastname|middlename|fullname|nickname|givenname|familyname|forename|maidenname)s?)[0-9]*(?:[A-Z][a-z0-9]*)+|user|profile|contact)$'
              not:
                kind: member_expression
                regex: '(^|[.''"(]\s*)((is|has|should|can|notify|allow|enable|no|send)([A-Z_][A-Za-z0-9_]*)?(Email|EmailAddress|Phone|PhoneNumber|Mobile|_email|_email_address|_phone|_phone_number|_mobile)|(is|has|should|can)[A-Z_][A-Za-z0-9_]*|[A-Za-z][A-Za-z0-9_]*(_id|Id|ID|_ids|Ids|IDs|_verified|Verified|_count|Count|_at|At|_enabled|Enabled|_opt_in|OptIn|_status|Status|_type|Type))([^A-Za-z0-9_]|$)'
          - all:
            - kind: identifier
            - regex: '^(patient|patients|patientData|patientRecord|patientRow|patientRows|currentPatient|selectedPatient)$'
            # C387 low 2: an element (patients[0]) is a patient too; the walk-up drops it when only a field
            # that is no patient field is read off it. A string key (patient["id"]) is still a field read.
            - not:
                any:
                - inside:
                    kind: member_expression
                    field: object
                - inside:
                    kind: subscript_expression
                    field: object
                    has:
                      field: index
                      kind: string
          # T29-P1-C391: the record whole off this is a patient too (this.patient, JSON.stringify(this.patient),
          # ...this.patient, this.patients[0], this.patientData). It takes the same walk-up as the bare name, so
          # this.patient.id, this.patients.length and mask(this.patient) stay ok. T29-P1-C392: every patient root may
          # sit under a props or state holder, with or without this (this.props.patient.name, state.patients[0].name,
          # console.log(this.state.patient)), and selectedPatient is a patient name like currentPatient. Other holders
          # (this.data.patient.name, this.store.patient) and a local alias of this.patient give no match (false passes).
          - all:
            - kind: member_expression
            - regex: '^(this\??\.((props|state)\??\.)?|(props|state)\??\.)(patient|patients|patientData|patientRecord|patientRow|patientRows|currentPatient|selectedPatient)$'
            - not:
                inside:
                  kind: subscript_expression
                  field: object
                  has:
                    field: index
                    kind: string
          # T29-P1-C376 (C416 low 5): a method or a further read on a patient field keeps its value
          # (patient.email.toLowerCase(), patient.homeAddress.slice(0, 10), patient.address.street). Its length does not.
          # T29-P1-C381 (C421 lows 1 and 2): off this.patient too (this.patient.email.trim()); a hop of id, pk or uuid makes
          # it an id (patient.address.id, patient.address.id.toString()).
          - kind: member_expression
            regex: '^(this\??\.)?((props|state)\??\.)?(patient|patientData|patientRecord|patientRow|currentPatient|selectedPatient|(patients|patientRows)(\??\.at\(\s*-?\w+\s*\)|(\?\.)?\[\s*-?\w+\s*\]))\??\.(name|firstName|lastName|first_name|last_name|fullName|full_name|email|phone|phoneNumber|phone_number|address|notes|firstName|lastName|fullName|emailAddress|phoneNumber|mobileNumber|dateOfBirth|birthDate|(?:patient|contact)_(?:name|first_name|last_name|full_name|address|dob)|(?:patient|contact)(?:Name|FirstName|LastName|FullName|Address|Dob)|[a-z][a-z0-9_]*_(?:email|email_address|phone|phone_number|mobile)|[a-z][A-Za-z0-9]*(?:Email|EmailAddress|Phone|PhoneNumber|Mobile)|(?:[a-z0-9]+_)*(?:names?|emails?|phones?|dobs?|ssns?|address(?:es)?|mrns?|diagnosis|diagnoses|insurances?|notes|(?:surname|firstname|lastname|middlename|fullname|nickname|givenname|familyname|forename|maidenname)s?)[0-9]*(?:_[a-z0-9]+)*|(?:[A-Za-z][a-z0-9]*(?:[A-Z][a-z0-9]*)*)?(?:Names?|Emails?|Phones?|Dobs?|DOBs?|Ssns?|SSNs?|Address(?:es)?|Mrns?|MRNs?|Diagnosis|Diagnoses|Insurances?|Notes|(?:Surname|Firstname|Lastname|Middlename|Fullname|Nickname|Givenname|Familyname|Forename|Maidenname)s?)[0-9]*(?:[A-Z][a-z0-9]*)*|(?:names?|emails?|phones?|dobs?|ssns?|address(?:es)?|mrns?|diagnosis|diagnoses|insurances?|notes|(?:surname|firstname|lastname|middlename|fullname|nickname|givenname|familyname|forename|maidenname)s?)[0-9]*(?:[A-Z][a-z0-9]*)+)(\??\.[A-Za-z_$][\w$]*)+$'
            not:
              any:
              - kind: member_expression
                regex: '\.(length|size)$'
              - kind: member_expression
                regex: '\??\.(id|Id|ID|pk|uuid|Uuid|UUID)(\??\.[A-Za-z_$][\w$]*(\([^()]*\))?)*$'
              - kind: member_expression
                regex: '(^|[.''"(]\s*)((is|has|should|can|notify|allow|enable|no|send)([A-Z_][A-Za-z0-9_]*)?(Email|EmailAddress|Phone|PhoneNumber|Mobile|_email|_email_address|_phone|_phone_number|_mobile)|(is|has|should|can)[A-Z_][A-Za-z0-9_]*|[A-Za-z][A-Za-z0-9_]*(_id|Id|ID|_ids|Ids|IDs|_verified|Verified|_count|Count|_at|At|_enabled|Enabled|_opt_in|OptIn|_status|Status|_type|Type))([^A-Za-z0-9_]|$)'
              - kind: member_expression
                inside:
                  kind: call_expression
                  field: function
          - kind: call_expression
            regex: '^(this\??\.)?((props|state)\??\.)?(patient|patientData|patientRecord|patientRow|currentPatient|selectedPatient|(patients|patientRows)(\??\.at\(\s*-?\w+\s*\)|(\?\.)?\[\s*-?\w+\s*\]))\??\.(name|firstName|lastName|first_name|last_name|fullName|full_name|email|phone|phoneNumber|phone_number|address|notes|firstName|lastName|fullName|emailAddress|phoneNumber|mobileNumber|dateOfBirth|birthDate|(?:patient|contact)_(?:name|first_name|last_name|full_name|address|dob)|(?:patient|contact)(?:Name|FirstName|LastName|FullName|Address|Dob)|[a-z][a-z0-9_]*_(?:email|email_address|phone|phone_number|mobile)|[a-z][A-Za-z0-9]*(?:Email|EmailAddress|Phone|PhoneNumber|Mobile)|(?:[a-z0-9]+_)*(?:names?|emails?|phones?|dobs?|ssns?|address(?:es)?|mrns?|diagnosis|diagnoses|insurances?|notes|(?:surname|firstname|lastname|middlename|fullname|nickname|givenname|familyname|forename|maidenname)s?)[0-9]*(?:_[a-z0-9]+)*|(?:[A-Za-z][a-z0-9]*(?:[A-Z][a-z0-9]*)*)?(?:Names?|Emails?|Phones?|Dobs?|DOBs?|Ssns?|SSNs?|Address(?:es)?|Mrns?|MRNs?|Diagnosis|Diagnoses|Insurances?|Notes|(?:Surname|Firstname|Lastname|Middlename|Fullname|Nickname|Givenname|Familyname|Forename|Maidenname)s?)[0-9]*(?:[A-Z][a-z0-9]*)*|(?:names?|emails?|phones?|dobs?|ssns?|address(?:es)?|mrns?|diagnosis|diagnoses|insurances?|notes|(?:surname|firstname|lastname|middlename|fullname|nickname|givenname|familyname|forename|maidenname)s?)[0-9]*(?:[A-Z][a-z0-9]*)+)(\??\.[A-Za-z_$][\w$]*(\([^()]*\))?)*\??\.[A-Za-z_$][\w$]*\([^()]*\)$'
            not:
              any:
              - kind: call_expression
                regex: '\.(startsWith|endsWith|includes|indexOf|lastIndexOf|search|localeCompare)\([^()]*\)$'
              - kind: call_expression
                regex: '\??\.(id|Id|ID|pk|uuid|Uuid|UUID)(\??\.[A-Za-z_$][\w$]*(\([^()]*\))?)*$'
              - kind: call_expression
                regex: '(^|[.''"(]\s*)((is|has|should|can|notify|allow|enable|no|send)([A-Z_][A-Za-z0-9_]*)?(Email|EmailAddress|Phone|PhoneNumber|Mobile|_email|_email_address|_phone|_phone_number|_mobile)|(is|has|should|can)[A-Z_][A-Za-z0-9_]*|[A-Za-z][A-Za-z0-9_]*(_id|Id|ID|_ids|Ids|IDs|_verified|Verified|_count|Count|_at|At|_enabled|Enabled|_opt_in|OptIn|_status|Status|_type|Type))([^A-Za-z0-9_]|$)'
          # T29-P1-C376 (C420 limit): a callback over the patients logs what it returns: a patient field read in it
          # (patients.map((p) => p.name), patients.map(({ name }) => name)) or the record itself (patients.map((p) => p)).
