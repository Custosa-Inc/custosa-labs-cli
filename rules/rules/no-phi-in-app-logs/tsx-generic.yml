id: no-phi-in-app-logs.tsx-generic.orm-query-log
practice_id: no-phi-in-app-logs
language: tsx
frameworks:
- generic
kind: violation
rule:
  any:
  - all:
    - pattern: 'new PrismaClient($$$)'
    - has:
        stopBy: end
        kind: pair
        all:
        - has:
            field: key
            kind: property_identifier
            regex: '^log$'
        - has:
            field: value
            kind: array
            any:
            - has:
                kind: string
                regex: '^[''"]query[''"]$'
            - has:
                kind: object
                has:
                  kind: pair
                  has:
                    field: value
                    kind: string
                    regex: '^[''"]query[''"]$'
  - all:
    - any:
      - pattern: 'new Sequelize($$$)'
      - pattern: 'new DataSource($$$)'
      - pattern: 'createConnection($$$)'
      - pattern: 'TypeOrmModule.forRoot($$$)'
      - pattern: 'knex($$$)'
      - pattern: 'Knex($$$)'
    - has:
        stopBy: end
        kind: pair
        any:
        - all:
          - has:
              field: key
              kind: property_identifier
              regex: '^(logging|debug)$'
          - has:
              field: value
              kind: 'true'
        - all:
          - has:
              field: key
              kind: property_identifier
              regex: '^logging$'
          - has:
              field: value
              kind: member_expression
              regex: '^console\.(log|info|debug)$'
        - all:
          - has:
              field: key
              kind: property_identifier
              regex: '^logging$'
          - has:
              field: value
              any:
              - kind: string
                regex: '^[''"](query|all)[''"]$'
              - kind: array
                has:
                  kind: string
                  regex: '^[''"](query|all)[''"]$'
min_engine: 0.45.3
