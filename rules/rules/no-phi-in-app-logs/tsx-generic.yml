- generic
kind: violation
rule:
  any:
  - all:
    - pattern: 'new PrismaClient($$$)'
    - has:
        stopBy: end
        kind: pair
        all:
        - has:
            field: key
            kind: property_identifier
            regex: '^log$'
        - has:
            field: value
            kind: array
            any:
            - has:
                kind: string
                regex: '^[''"]query[''"]$'
            - has:
                kind: object
                has:
                  kind: pair
                  has:
                    field: value
                    kind: string
                    regex: '^[''"]query[''"]$'
