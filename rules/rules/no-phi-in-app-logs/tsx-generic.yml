id: no-phi-in-app-logs.tsx-generic.debug-level
practice_id: no-phi-in-app-logs
language: tsx
frameworks:
- generic
kind: violation
rule:
  all:
  - kind: pair
  - has:
      field: key
      kind: property_identifier
      regex: '^level$'
  - has:
      field: value
      any:
      - kind: string
        regex: '^[''"](debug|trace|silly|verbose)[''"]$'
