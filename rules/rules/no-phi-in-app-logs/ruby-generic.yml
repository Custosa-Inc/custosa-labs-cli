id: no-phi-in-app-logs.ruby-generic.debug-level
practice_id: no-phi-in-app-logs
language: ruby
frameworks:
- generic
kind: violation
rule:
  all:
  - kind: assignment
  - has:
      field: left
      kind: call
      regex: '^(config|Rails\.logger|Rails\.application\.config|config\.logger)\s*\.\s*(log_level|level)$'
  - has:
      field: right
      any:
      - kind: simple_symbol
        regex: '^:debug$'
      - kind: scope_resolution
        regex: '^(::)?Logger::DEBUG$'
min_engine: 0.45.3
