id: no-phi-in-app-logs.ruby-generic.filter-parameters
practice_id: no-phi-in-app-logs
language: ruby
frameworks:
- generic
kind: evidence
rule:
  all:
  - kind: operator_assignment
  - has:
      field: left
      kind: call
      regex: '(?-u)^(config|Rails\.application\.config)\s*\.\s*filter_parameters$'
  - has:
      field: right
      kind: array
      has:
        any:
        - kind: simple_symbol
        - kind: string
min_engine: 0.45.3
