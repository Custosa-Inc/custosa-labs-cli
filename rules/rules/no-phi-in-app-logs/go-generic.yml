id: no-phi-in-app-logs.go-generic.debug-level
practice_id: no-phi-in-app-logs
language: go
frameworks:
- generic
kind: violation
rule:
  any:
  - all:
    - kind: call_expression
    - has:
        field: function
        kind: selector_expression
        regex: '^[A-Za-z_][A-Za-z0-9_.]*\.SetDefault$'
    - has:
        field: arguments
        kind: argument_list
        all:
        - has:
            kind: interpreted_string_literal
            regex: '^"(?i:log\.level|log_level|loglevel|logging\.level|log-level|level)"$'
        - has:
            kind: interpreted_string_literal
            regex: '^"(?i:debug|trace)"$'
  - all:
    - kind: call_expression
    - has:
        field: function
        kind: selector_expression
        regex: '^(logrus|log|logger|zerolog)\.(SetLevel|SetGlobalLevel)$'
    - has:
        field: arguments
        kind: argument_list
        has:
          kind: selector_expression
          regex: '\.(DebugLevel|TraceLevel|LevelDebug)$'
min_engine: 0.45.3
