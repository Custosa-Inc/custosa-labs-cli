id: no-phi-in-app-logs.go-generic.request-body
practice_id: no-phi-in-app-logs
language: go
frameworks:
- generic
kind: violation
rule:
  all:
  - kind: call_expression
  - has:
      field: function
      kind: selector_expression
      regex: '(^|\.)(log|logger|Logger|logrus|sugar|zap|slog|globalLogger|l)\.(Print|Printf|Println|Info|Infof|Infoln|Infow|Debug|Debugf|Debugln|Debugw|Warn|Warnf|Warnln|Warning|Warningf|Error|Errorf|Errorln|Trace|Tracef|Fatal|Fatalf)$'
  - has:
      field: arguments
      kind: argument_list
      has:
        stopBy: end
        all:
        - kind: selector_expression
        - regex: '^(r|req|request|c\.Request|ctx\.Request)\.(Body|Form|PostForm|MultipartForm|URL\.RawQuery)$'
        - not:
            inside:
              kind: selector_expression
              field: operand
        - not:
            inside:
              kind: argument_list
              inside:
                kind: call_expression
                not:
                  has:
                    field: function
                    any:
                    - kind: selector_expression
                      regex: '(^|\.)(log|logger|Logger|logrus|sugar|zap|slog|globalLogger|l)\.(Print|Printf|Println|Info|Infof|Infoln|Infow|Debug|Debugf|Debugln|Debugw|Warn|Warnf|Warnln|Warning|Warningf|Error|Errorf|Errorln|Trace|Tracef|Fatal|Fatalf)$|^fmt\.Sprint(f|ln)?$'
                    - kind: identifier
                      regex: '^string$'
min_engine: 0.45.3
