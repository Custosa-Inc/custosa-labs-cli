id: no-phi-in-app-logs.go-generic.orm-query-log
practice_id: no-phi-in-app-logs
language: go
frameworks:
- generic
kind: violation
rule:
  all:
  - any:
    - all:
      - kind: call_expression
      - regex: '\.Debug\(\)$'
      - inside:
          any:
          - kind: expression_list
            inside:
              kind: assignment_statement
          - kind: expression_list
            inside:
              kind: short_var_declaration
    - all:
      - kind: call_expression
      - regex: '\.Debug\(\)\s*\.\s*(Where|Find|First|Last|Take|Create|Save|Model|Table|Exec|Raw|Preload|Updates|Update|Delete|Select|Joins)\('
      - not:
          inside:
            kind: call_expression
            regex: '\.Debug\(\)\s*\.\s*(Where|Find|First|Last|Take|Create|Save|Model|Table|Exec|Raw|Preload|Updates|Update|Delete|Select|Joins)\('
    - pattern: logger.Default.LogMode(logger.Info)
  - not:
      inside:
        stopBy: end
        kind: if_statement
        has:
          field: condition
          any:
          - kind: binary_expression
            regex: (?i)debug
          - kind: call_expression
            regex: (?i)debug
          - kind: selector_expression
            regex: (?i)debug
          - kind: identifier
            regex: (?i)debug
min_engine: 0.45.3
