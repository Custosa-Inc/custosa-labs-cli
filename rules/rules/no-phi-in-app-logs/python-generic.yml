id: no-phi-in-app-logs.python-generic.debug-level
practice_id: no-phi-in-app-logs
language: python
frameworks:
- generic
kind: violation
rule:
  any:
  - all:
    - kind: pair
    - has:
        field: key
        kind: string
        regex: '^[''"]level[''"]$'
    - has:
        field: value
        any:
        - kind: string
          regex: '^[''"](DEBUG|debug|NOTSET)[''"]$'
        - kind: call
          regex: '^os\.(getenv|environ\.get)\(.*,\s*[''"](DEBUG|debug)[''"]\s*\)$'
    - inside:
        stopBy: end
        kind: assignment
        has:
          field: left
          kind: identifier
          regex: '^LOGGING$'
  - all:
    - kind: call
    - has:
        field: function
        kind: attribute
        regex: '^(logging\.basicConfig|logging\.getLogger\(\)\.setLevel|logger\.setLevel|LOGGER\.setLevel|root\.setLevel)$'
    - has:
        field: arguments
        kind: argument_list
        has:
          stopBy: end
          any:
          - kind: attribute
            regex: '^logging\.(DEBUG|NOTSET)$'
          - kind: string
            regex: '^[''"]DEBUG[''"]$'
min_engine: 0.45.3
