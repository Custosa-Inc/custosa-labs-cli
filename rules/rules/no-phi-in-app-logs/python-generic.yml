id: no-phi-in-app-logs.python-generic.request-body
practice_id: no-phi-in-app-logs
language: python
frameworks:
- generic
kind: violation
rule:
  all:
  - kind: call
  - has:
      field: function
      any:
      - kind: attribute
        regex: '^(logger|logging|log|_logger|_log|LOGGER|LOG|self\.logger|self\.log|self\._logger|current_app\.logger|app\.logger|logging\.getLogger\([^)]*\)|structlog\.(?:get_logger|getLogger)\([^)]*\))\.(debug|info|warning|warn|error|exception|critical|log|msg)$'
      - kind: identifier
        regex: '^print$'
  - has:
      field: arguments
      kind: argument_list
      has:
        stopBy: end
        all:
        - any:
          - kind: attribute
            regex: '^(request|req|self\.request)\.(body|data|POST|GET|json|form|args|values|query_params|FILES)$'
          - kind: call
            regex: '^(await\s+)?(request|req)\.(get_json|json|get_data|body)\('
          - kind: await
            regex: '^await\s+(request|req)\.(json|body|form)\('
        - not:
            any:
            - inside:
                kind: attribute
                field: object
            - inside:
                kind: subscript
                field: value
            - inside:
                kind: call
                field: function
        - not:
            inside:
              kind: argument_list
              inside:
                kind: call
                not:
                  has:
                    field: function
                    any:
                    - kind: attribute
                      regex: '^(logger|logging|log|_logger|_log|LOGGER|LOG|self\.logger|self\.log|self\._logger|current_app\.logger|app\.logger|logging\.getLogger\([^)]*\)|structlog\.(?:get_logger|getLogger)\([^)]*\))\.(debug|info|warning|warn|error|exception|critical|log|msg)$|^json\.dumps$|^pprint\.pformat$'
                    - kind: identifier
                      regex: '^(print|str|repr|dict)$'
min_engine: 0.45.3
---
# Known limit (C391 low 3, T29-P1-C360): the patient field list is still a list. A related record other than user, profile
# or contact (patient.guardian) and a field read off a root that is no patient name (visit.patient_name) give no match
# (false passes). Any _email or _phone suffix off the patient fails, patient.clinic_email too (false fails only).
# Known limit (C398 low 1, T29-P1-C362): a suffix name that starts with is, has, should, can, notify, allow, enable,
# no or send (hasEmail, has_email, sendEmail) reads as a flag or method, so patient.notify_email gives no match
# (false passes). Known limit (C398 lows 2 and 3, C405): a field other than a contact read off a related record by
# attribute gives no match (patient.user.name, patient.contact.address) (false passes, as on the base). Read by key
# or .get, a patient field fails (patient["user"]["name"], patient.get("user").get("name")), and an id or a flag does not.
# Known limit (C394 low 2): a key read off an element counts as one value unless it is a nested-record key (data,
# contact, profile, details, info and the like), so patients[0]["payload"] gives no match, nor does a patient field
# two keys below a nested-record key (patients[0]["data"]["contact"]["email"]) (false passes).
# Known limit (T29-P1-C371): a field name off the patient counts when it holds a field word (name, email, phone, dob,
# ssn, address, mrn, diagnosis, insurance, notes) as a snake_case or camelCase word part, and is a flag or id when it
# starts with is, has, should or can or ends in _id, Id, _verified, _count or _at. So patient.clinic_name and
# patient.fileName fail (false fails), and patient.mrn_id and patient.insuranceId give no match (false passes).
# T29-P1-C376: the field word may be plural or end in a digit (patient.addresses, patient.address2), and a name
# that ends in _enabled, _opt_in, _status or _type (Enabled, OptIn, Status, Type) is a flag too. Other flag
# endings fail (patient.email_bounced, patient.notes_updated: false fails).
# T29-P1-C376 item 2: joined lowercase names from a fixed list (surname, firstname, lastname, middlename, fullname,
# nickname, givenname, familyname, forename, maidenname) and PascalCase names (HomeAddress, FirstName) are field names
# too. Other joined names (patient.homeaddress) give no match (false passes); a PascalCase flag (patient.HasEmail) fails.
# T29-P1-C376 item 2: a method or a further read on a field fails (patient.email.lower(), patient.dob.isoformat(),
# patient.address.street, patient.dob.year), unless it only tests the value (startswith, endswith, the is* tests,
# count, find, index); getattr(patient, "name") fails. A field passed to a call other than a log call or one that
# keeps it (" ".join(patient.name.split()), mask(patient.email)) gives no match, as on the base (false passes there).
# T29-P1-C381: a hop of id, pk or uuid off a field is an id (patient.address.id, patient.name.pk stay ok), but an
# element's field still fails (patients[0].address.id, false fail, as on the base).
# Known limit (T29-P1-C371): a key read off the dumped record (patient.to_dict()["id"]) still fails (false fails only).
# T29-P1-C376: a field read off the dump by .get (patient.to_dict().get("ssn")) and the dump's .values() or
# .items() fail; .get("id") or a flag off the dump does not. list, tuple, sorted and set keep a field, as str does,
# so len(list(patient.addresses)) fails, as len(str(patient.name)) does (false fails).
id: no-phi-in-app-logs.python-generic.patient-fields
practice_id: no-phi-in-app-logs
language: python
frameworks:
- generic
kind: violation
rule:
  all:
  - kind: call
  - has:
      field: function
      any:
      - kind: attribute
        regex: '^(logger|logging|log|_logger|_log|LOGGER|LOG|self\.logger|self\.log|self\._logger|current_app\.logger|app\.logger|logging\.getLogger\([^)]*\)|structlog\.(?:get_logger|getLogger)\([^)]*\))\.(debug|info|warning|warn|error|exception|critical|log|msg)$'
      - kind: identifier
        regex: '^print$'
  - has:
      field: arguments
      kind: argument_list
      has:
        stopBy: end
        all:
        - any:
          # T29-P1-C409: a message's recipient is a contact value. The names to, to_number, to_phone and to_address fail
          # in an f-string, or beside a string argument, that names a message (email, mail, SMS, text, message,
          # notification, invite, reminder, OTP, WhatsApp): f"[SMS] Sending to {to}", ("Sending SMS to %s", to),
          # ("invite email sent", extra={"to": to}). recipient, recipients, recipient_number and recipient_phone also
          # fail beside a send or delivery verb. A to with no message word (a route, a date bound) stays ok.
          - all:
            - kind: identifier
            - regex: '^(to|to_number|to_phone|to_address)$'
            - inside:
                kind: interpolation
                inside:
                  kind: string
                  regex: '(?i)\b(e-?mails?|mail|sms|texts?|messages?|notifications?|invites?|invitations?|reminders?|otps?|whatsapp)\b'
          - all:
            - kind: identifier
            - regex: '^(to|to_number|to_phone|to_address)$'
            - inside:
                stopBy: end
                kind: argument_list
                has:
                  kind: string
                  regex: '(?i)\b(e-?mails?|mail|sms|texts?|messages?|notifications?|invites?|invitations?|reminders?|otps?|whatsapp)\b'
          - all:
            - kind: identifier
            - regex: '^(recipient|recipients|recipient_number|recipient_phone)$'
            - inside:
                kind: interpolation
                inside:
                  kind: string
                  regex: '(?i)\b(e-?mails?|mail|sms|texts?|messages?|notifications?|invites?|invitations?|reminders?|otps?|whatsapp|send|sends|sending|sent|deliver|delivers|delivering|delivered|delivery)\b'
          - all:
            - kind: identifier
            - regex: '^(recipient|recipients|recipient_number|recipient_phone)$'
            - inside:
                stopBy: end
                kind: argument_list
                has:
                  kind: string
                  regex: '(?i)\b(e-?mails?|mail|sms|texts?|messages?|notifications?|invites?|invitations?|reminders?|otps?|whatsapp|send|sends|sending|sent|deliver|delivers|delivering|delivered|delivery)\b'
          - kind: attribute
            regex: '\.(ssn|SSN|dob|date_of_birth|birth_date|birthdate|diagnosis|diagnoses|mrn|medical_record_number|insurance_number|clinical_notes)$'
          # T29-P1-C388: every patient-field root takes self. too (self.patient_data.name, self.patient["email"],
          # self.patients[0].name), not only self.patient. The record whole off self (self.patient, self.patients[0].name,
          # a comprehension over self.patients) goes through the walk-up below (T29-P1-C391).
          - kind: attribute
            regex: '^(self\.)?(patient|patient_data|patient_record|patient_row|current_patient|selected_patient)\.(name|first_name|last_name|full_name|email|phone|phone_number|address|notes|firstName|lastName|fullName|emailAddress|phoneNumber|mobileNumber|dateOfBirth|birthDate|(?:patient|contact)_(?:name|first_name|last_name|full_name|address|dob)|(?:patient|contact)(?:Name|FirstName|LastName|FullName|Address|Dob)|[a-z][a-z0-9_]*_(?:email|email_address|phone|phone_number|mobile)|[a-z][A-Za-z0-9]*(?:Email|EmailAddress|Phone|PhoneNumber|Mobile)|(?:[a-z0-9]+_)*(?:names?|emails?|phones?|dobs?|ssns?|address(?:es)?|mrns?|diagnosis|diagnoses|insurances?|notes|(?:surname|firstname|lastname|middlename|fullname|nickname|givenname|familyname|forename|maidenname)s?)[0-9]*(?:_[a-z0-9]+)*|(?:[A-Za-z][a-z0-9]*(?:[A-Z][a-z0-9]*)*)?(?:Names?|Emails?|Phones?|Dobs?|DOBs?|Ssns?|SSNs?|Address(?:es)?|Mrns?|MRNs?|Diagnosis|Diagnoses|Insurances?|Notes|(?:Surname|Firstname|Lastname|Middlename|Fullname|Nickname|Givenname|Familyname|Forename|Maidenname)s?)[0-9]*(?:[A-Z][a-z0-9]*)*|(?:names?|emails?|phones?|dobs?|ssns?|address(?:es)?|mrns?|diagnosis|diagnoses|insurances?|notes|(?:surname|firstname|lastname|middlename|fullname|nickname|givenname|familyname|forename|maidenname)s?)[0-9]*(?:[A-Z][a-z0-9]*)+|__dict__)$'
            not:
              kind: attribute
              regex: '(^|[.''"(]\s*)((is|has|should|can|notify|allow|enable|no|send)([A-Z_][A-Za-z0-9_]*)?(Email|EmailAddress|Phone|PhoneNumber|Mobile|_email|_email_address|_phone|_phone_number|_mobile)|(is|has|should|can)[A-Z_][A-Za-z0-9_]*|[A-Za-z][A-Za-z0-9_]*(_id|Id|ID|_ids|Ids|IDs|_verified|Verified|_count|Count|_at|At|_enabled|Enabled|_opt_in|OptIn|_status|Status|_type|Type))([^A-Za-z0-9_]|$)'
          - kind: subscript
            regex: '\[\s*[''"](ssn|dob|date_of_birth|birth_date|diagnosis|mrn|medical_record_number)[''"]\s*\]$'
          - kind: subscript
            regex: '^(self\.)?(patient|patient_data|patient_record|patient_row|current_patient|selected_patient)\[\s*[''"](name|first_name|last_name|full_name|email|phone|address|notes|firstName|lastName|fullName|emailAddress|phoneNumber|mobileNumber|dateOfBirth|birthDate|(?:patient|contact)_(?:name|first_name|last_name|full_name|address|dob)|(?:patient|contact)(?:Name|FirstName|LastName|FullName|Address|Dob)|[a-z][a-z0-9_]*_(?:email|email_address|phone|phone_number|mobile)|[a-z][A-Za-z0-9]*(?:Email|EmailAddress|Phone|PhoneNumber|Mobile)|(?:[a-z0-9]+_)*(?:names?|emails?|phones?|dobs?|ssns?|address(?:es)?|mrns?|diagnosis|diagnoses|insurances?|notes|(?:surname|firstname|lastname|middlename|fullname|nickname|givenname|familyname|forename|maidenname)s?)[0-9]*(?:_[a-z0-9]+)*|(?:[A-Za-z][a-z0-9]*(?:[A-Z][a-z0-9]*)*)?(?:Names?|Emails?|Phones?|Dobs?|DOBs?|Ssns?|SSNs?|Address(?:es)?|Mrns?|MRNs?|Diagnosis|Diagnoses|Insurances?|Notes|(?:Surname|Firstname|Lastname|Middlename|Fullname|Nickname|Givenname|Familyname|Forename|Maidenname)s?)[0-9]*(?:[A-Z][a-z0-9]*)*|(?:names?|emails?|phones?|dobs?|ssns?|address(?:es)?|mrns?|diagnosis|diagnoses|insurances?|notes|(?:surname|firstname|lastname|middlename|fullname|nickname|givenname|familyname|forename|maidenname)s?)[0-9]*(?:[A-Z][a-z0-9]*)+)[''"]\s*\]$'
            not:
              kind: subscript
              regex: '(^|[.''"(]\s*)((is|has|should|can|notify|allow|enable|no|send)([A-Z_][A-Za-z0-9_]*)?(Email|EmailAddress|Phone|PhoneNumber|Mobile|_email|_email_address|_phone|_phone_number|_mobile)|(is|has|should|can)[A-Z_][A-Za-z0-9_]*|[A-Za-z][A-Za-z0-9_]*(_id|Id|ID|_ids|Ids|IDs|_verified|Verified|_count|Count|_at|At|_enabled|Enabled|_opt_in|OptIn|_status|Status|_type|Type))([^A-Za-z0-9_]|$)'
          - all:
            - kind: identifier
            - regex: '^(patient|patients|patient_data|patient_record|patient_row|patient_rows|current_patient|selected_patient)$'
            # C387 low 2: an element (patients[0]) is a patient too; the walk-up drops it when only a field
            # that is no patient field is read off it. A string key (patient["id"]) is still a field read.
            - not:
                any:
                - inside:
                    kind: attribute
                - inside:
                    kind: subscript
                    field: value
                    has:
                      field: subscript
                      kind: string
                - inside:
                    kind: keyword_argument
                    field: name
          # T29-P1-C391: the record whole off self is a patient too (self.patient, self.patient_data, self.patients[0],
          # [p.name for p in self.patients]). It takes the same walk-up as the bare name, so self.patient.id,
          # len(self.patients), mask(self.patient) and [p.id for p in self.patients] stay ok. Other roots
          # (self.request.patient, cls.patient, a local alias of self.patient) give no match (false passes).
          # T29-P1-C392: selected_patient is a patient name like current_patient.
          - all:
            - kind: attribute
            - regex: '^self\.(patient|patients|patient_data|patient_record|patient_row|patient_rows|current_patient|selected_patient)$'
            - not:
                any:
                - inside:
                    kind: attribute
                - inside:
                    kind: subscript
                    field: value
                    has:
                      field: subscript
                      kind: string
          - all:
            - kind: attribute
            - regex: '\.(email|email_address|phone|phone_number|mobile|mobile_number)$'
            # C339 med 1: a business or config root excludes a contact only when no person record sits
            # between them; a contact read straight off a business object anywhere in the chain is excluded.
            - not:
                any:
                - all:
                  - kind: attribute
                    regex: '(?i)^(self\.)?(settings|\w*config|app\.config|current_app\.config|os\.environ|twilio\w*|mailer|transporter|clinic|practice|organization|org|tenant|company|facility|office|hospital|pharmacy)\.'
                  - not:
                      kind: attribute
                      # Known limit (C391 low 2): a person word inside a segment also takes business segments, so
                      # org.customer_support.email, org.account_settings.email and org.billing_account.phone fail (false
                      # fails only).
                      regex: '(?i)\??\.\w*(patients?|users?|members?|people|persons?|customers?|clients?|contacts?|profiles?|accounts?|owners?|guardians?|caregivers?|recipients?|employees?)\w*(\??\.|\[|!)'
                - kind: attribute
                  regex: '(?i)[.?](\w*config|settings|clinic|practice|organization|org|tenant|company|facility|office|hospital|pharmacy)\.(email|email_address|phone|phone_number|mobile|mobile_number)$'
          - all:
            - kind: identifier
            - regex: '^(email|email_address|emailAddress|phone|phone_number|phoneNumber|mobile|mobile_number|mobileNumber|[a-z][a-z0-9_]*_(email|phone|phone_number)|[a-z][A-Za-z0-9]*(Email|Phone|PhoneNumber)|user|users|current_user|currentUser|vitals|lab_values|labValues|lab_value_rows|labValueRows|lab_results|labResults|medications|prescriptions|allergies)$'
              not:
                kind: identifier
                regex: '(^|[.''"(]\s*)((is|has|should|can|notify|allow|enable|no|send)([A-Z_][A-Za-z0-9_]*)?(Email|EmailAddress|Phone|PhoneNumber|Mobile|_email|_email_address|_phone|_phone_number|_mobile)|(is|has|should|can)[A-Z_][A-Za-z0-9_]*|[A-Za-z][A-Za-z0-9_]*(_id|Id|ID|_ids|Ids|IDs|_verified|Verified|_count|Count|_at|At|_enabled|Enabled|_opt_in|OptIn|_status|Status|_type|Type))([^A-Za-z0-9_]|$)'
            - not:
                kind: identifier
                regex: '^(from|sender|support|admin|smtp|noreply|noReply|no_reply|replyTo|reply_to|company|system|default|test|sample|example|mask|masked|hash|hashed|redact|redacted|obfuscated|template|welcome|twilio|mailer|transporter|clinic|practice|organization|org|tenant|facility|office|hospital|pharmacy|is|has|should|can|notify|allow|enable)[A-Z_]'
            - not:
                any:
                - inside:
                    kind: attribute
                - inside:
                    kind: subscript
                    field: value
                - inside:
                    kind: keyword_argument
                    field: name
          - kind: call
            regex: '^[A-Za-z_][A-Za-z0-9_.]*\.get\(\s*[''"](vitals|lab_values|lab_results|medications|prescriptions|allergies|diagnosis|diagnoses|ssn|dob|date_of_birth)[''"]'
          # C391 low 3: a .get of a patient field off the patient (patient.get("name")) is a field read.
          - kind: call
            regex: '^(self\.)?(patient|patient_data|patient_record|patient_row|current_patient|selected_patient)\.get\(\s*[''"](name|first_name|last_name|full_name|email|email_address|phone|phone_number|mobile|mobile_number|address|notes|firstName|lastName|fullName|emailAddress|phoneNumber|mobileNumber|dateOfBirth|birthDate|(?:patient|contact)_(?:name|first_name|last_name|full_name|address|dob)|(?:patient|contact)(?:Name|FirstName|LastName|FullName|Address|Dob)|[a-z][a-z0-9_]*_(?:email|email_address|phone|phone_number|mobile)|[a-z][A-Za-z0-9]*(?:Email|EmailAddress|Phone|PhoneNumber|Mobile)|(?:[a-z0-9]+_)*(?:names?|emails?|phones?|dobs?|ssns?|address(?:es)?|mrns?|diagnosis|diagnoses|insurances?|notes|(?:surname|firstname|lastname|middlename|fullname|nickname|givenname|familyname|forename|maidenname)s?)[0-9]*(?:_[a-z0-9]+)*|(?:[A-Za-z][a-z0-9]*(?:[A-Z][a-z0-9]*)*)?(?:Names?|Emails?|Phones?|Dobs?|DOBs?|Ssns?|SSNs?|Address(?:es)?|Mrns?|MRNs?|Diagnosis|Diagnoses|Insurances?|Notes|(?:Surname|Firstname|Lastname|Middlename|Fullname|Nickname|Givenname|Familyname|Forename|Maidenname)s?)[0-9]*(?:[A-Z][a-z0-9]*)*|(?:names?|emails?|phones?|dobs?|ssns?|address(?:es)?|mrns?|diagnosis|diagnoses|insurances?|notes|(?:surname|firstname|lastname|middlename|fullname|nickname|givenname|familyname|forename|maidenname)s?)[0-9]*(?:[A-Z][a-z0-9]*)+)[''"]'
            not:
              kind: call
              regex: '(^|[.''"(]\s*)((is|has|should|can|notify|allow|enable|no|send)([A-Z_][A-Za-z0-9_]*)?(Email|EmailAddress|Phone|PhoneNumber|Mobile|_email|_email_address|_phone|_phone_number|_mobile)|(is|has|should|can)[A-Z_][A-Za-z0-9_]*|[A-Za-z][A-Za-z0-9_]*(_id|Id|ID|_ids|Ids|IDs|_verified|Verified|_count|Count|_at|At|_enabled|Enabled|_opt_in|OptIn|_status|Status|_type|Type))([^A-Za-z0-9_]|$)'
          # T29-P1-C376 (C416 low 5): a method or a further read on a patient field keeps its value (patient.email.lower(),
          # patient.dob.isoformat(), patient.address.street), and getattr(patient, "name") is a field read.
          # T29-P1-C381 (C421 low 2): a hop of id, pk or uuid makes it an id (patient.address.id, patient.name.pk).
          - kind: attribute
            regex: '^(self\.)?(patient|patient_data|patient_record|patient_row|current_patient|selected_patient|(patients|patient_rows)\[\s*-?\w+\s*\])\.(name|first_name|last_name|full_name|email|email_address|phone|phone_number|mobile|mobile_number|address|notes|firstName|lastName|fullName|emailAddress|phoneNumber|mobileNumber|dateOfBirth|birthDate|(?:patient|contact)_(?:name|first_name|last_name|full_name|address|dob)|(?:patient|contact)(?:Name|FirstName|LastName|FullName|Address|Dob)|[a-z][a-z0-9_]*_(?:email|email_address|phone|phone_number|mobile)|[a-z][A-Za-z0-9]*(?:Email|EmailAddress|Phone|PhoneNumber|Mobile)|(?:[a-z0-9]+_)*(?:names?|emails?|phones?|dobs?|ssns?|address(?:es)?|mrns?|diagnosis|diagnoses|insurances?|notes|(?:surname|firstname|lastname|middlename|fullname|nickname|givenname|familyname|forename|maidenname)s?)[0-9]*(?:_[a-z0-9]+)*|(?:[A-Za-z][a-z0-9]*(?:[A-Z][a-z0-9]*)*)?(?:Names?|Emails?|Phones?|Dobs?|DOBs?|Ssns?|SSNs?|Address(?:es)?|Mrns?|MRNs?|Diagnosis|Diagnoses|Insurances?|Notes|(?:Surname|Firstname|Lastname|Middlename|Fullname|Nickname|Givenname|Familyname|Forename|Maidenname)s?)[0-9]*(?:[A-Z][a-z0-9]*)*|(?:names?|emails?|phones?|dobs?|ssns?|address(?:es)?|mrns?|diagnosis|diagnoses|insurances?|notes|(?:surname|firstname|lastname|middlename|fullname|nickname|givenname|familyname|forename|maidenname)s?)[0-9]*(?:[A-Z][a-z0-9]*)+)(\.[A-Za-z_]\w*)+$'
            not:
              any:
              - kind: attribute
                regex: '(^|[.''"(]\s*)((is|has|should|can|notify|allow|enable|no|send)([A-Z_][A-Za-z0-9_]*)?(Email|EmailAddress|Phone|PhoneNumber|Mobile|_email|_email_address|_phone|_phone_number|_mobile)|(is|has|should|can)[A-Z_][A-Za-z0-9_]*|[A-Za-z][A-Za-z0-9_]*(_id|Id|ID|_ids|Ids|IDs|_verified|Verified|_count|Count|_at|At|_enabled|Enabled|_opt_in|OptIn|_status|Status|_type|Type))([^A-Za-z0-9_]|$)'
              - kind: attribute
                regex: '\.(id|pk|uuid)(\.[A-Za-z_]\w*(\([^()]*\))?)*$'
