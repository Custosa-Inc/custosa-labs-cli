id: no-phi-in-app-logs.python-generic.request-body
practice_id: no-phi-in-app-logs
language: python
frameworks:
- generic
kind: violation
rule:
  all:
  - kind: call
  - has:
      field: function
      any:
      - kind: attribute
        regex: '^(logger|logging|log|_logger|_log|LOGGER|LOG|self\.logger|self\.log|self\._logger|current_app\.logger|app\.logger|logging\.getLogger\([^)]*\)|structlog\.(?:get_logger|getLogger)\([^)]*\))\.(debug|info|warning|warn|error|exception|critical|log|msg)$'
      - kind: identifier
        regex: '^print$'
  - has:
      field: arguments
      kind: argument_list
      has:
        stopBy: end
        all:
        - any:
          - kind: attribute
            regex: '^(request|req|self\.request)\.(body|data|POST|GET|json|form|args|values|query_params|FILES)$'
          - kind: call
            regex: '^(await\s+)?(request|req)\.(get_json|json|get_data|body)\('
          - kind: await
            regex: '^await\s+(request|req)\.(json|body|form)\('
        - not:
            any:
            - inside:
                kind: attribute
                field: object
            - inside:
                kind: subscript
                field: value
            - inside:
                kind: call
                field: function
        - not:
            inside:
              kind: argument_list
              inside:
                kind: call
                not:
                  has:
                    field: function
                    any:
                    - kind: attribute
                      regex: '^(logger|logging|log|_logger|_log|LOGGER|LOG|self\.logger|self\.log|self\._logger|current_app\.logger|app\.logger|logging\.getLogger\([^)]*\)|structlog\.(?:get_logger|getLogger)\([^)]*\))\.(debug|info|warning|warn|error|exception|critical|log|msg)$|^json\.dumps$|^pprint\.pformat$'
                    - kind: identifier
                      regex: '^(print|str|repr|dict)$'
min_engine: 0.45.3
