id: no-phi-in-app-logs.php-generic.debug-level
practice_id: no-phi-in-app-logs
language: php
frameworks:
- generic
kind: violation
rule:
  any:
  - all:
    - kind: object_creation_expression
    - regex: '^new\s+\\?(Monolog\\Handler\\)?(StreamHandler|RotatingFileHandler|ErrorLogHandler|SyslogHandler)\s*\('
    - has:
        stopBy: end
        any:
        - kind: class_constant_access_expression
          regex: '^\\?(Monolog\\)?(Logger|Level)::(DEBUG|Debug)$'
  - all:
    - kind: array_element_initializer
    - has:
        kind: string
        regex: '^[''"]level[''"]$'
    - any:
      - has:
          kind: string
          regex: '^[''"]debug[''"]$'
      - has:
          kind: function_call_expression
          regex: '^env\s*\(\s*[''"]LOG_LEVEL[''"]\s*,\s*[''"]debug[''"]\s*\)$'
min_engine: 0.45.3
