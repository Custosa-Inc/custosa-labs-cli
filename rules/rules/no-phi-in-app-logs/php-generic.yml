id: no-phi-in-app-logs.php-generic.request-body
practice_id: no-phi-in-app-logs
language: php
frameworks:
- generic
kind: violation
rule:
  all:
  - any:
    - kind: function_call_expression
      regex: '^\\?(error_log|syslog)\s*\('
    - kind: member_call_expression
      regex: '^(\$(this->)?(logger|log|_logger|monolog|psrLogger)|[\\\w]+::getLogger\(\)|\$this->getLogger\(\)|\(new\s+\\?[\w\\]*Logger\(\)\))\s*->\s*(debug|info|notice|warning|error|critical|alert|emergency|log)\s*\('
    - kind: scoped_call_expression
      regex: '^\\?(Log|Logger|Illuminate\\Support\\Facades\\Log)::(debug|info|notice|warning|error|critical|alert|emergency|log)\s*\('
  - has:
      field: arguments
      kind: arguments
      has:
        stopBy: end
        all:
        - any:
          - kind: variable_name
            regex: '^\$_(POST|GET|REQUEST|COOKIE|FILES)$'
          - kind: member_call_expression
            regex: '^\$(request|req|this->request)\s*->\s*(getParsedBody|all|input|getContent|getQueryParams|post|query)\s*\(\s*\)$'
          - kind: function_call_expression
            regex: '^file_get_contents\s*\(\s*[''"]php://input[''"]\s*\)$'
        - not:
            inside:
              kind: subscript_expression
        - not:
            inside:
              kind: argument
              inside:
                kind: arguments
                inside:
                  any:
                  - kind: function_call_expression
                  - kind: member_call_expression
                  - kind: scoped_call_expression
                  not:
                    any:
                    - kind: function_call_expression
                      regex: '^\\?(error_log|syslog|print_r|var_export|json_encode|serialize|sprintf)\s*\('
                    - kind: member_call_expression
                      regex: '^(\$(this->)?(logger|log|_logger|monolog|psrLogger)|[\\\w]+::getLogger\(\)|\$this->getLogger\(\)|\(new\s+\\?[\w\\]*Logger\(\)\))\s*->\s*(debug|info|notice|warning|error|critical|alert|emergency|log)\s*\('
                    - kind: scoped_call_expression
                      regex: '^\\?(Log|Logger|Illuminate\\Support\\Facades\\Log)::(debug|info|notice|warning|error|critical|alert|emergency|log)\s*\('
min_engine: 0.45.3
