id: audit-actor-recorded.java-generic.pool-context
practice_id: audit-actor-recorded
language: java
frameworks:
- generic
kind: violation
rule:
  all:
  - kind: method_invocation
    regex: '\.(setConnectionInitSql|setInitSQL|setConnectionInitSqls|addDataSourceProperty)\s*\('
  - has:
      stopBy: end
      kind: string_literal
      regex: '(?i)(?:set_config\s*\(\s*''(?:app\.(?:user_id|current_user_id|current_user|user|actor|actor_id|uid|userid|account_id|current_account_id)|request\.jwt\.claims|request\.jwt\.claim\.sub|jwt\.claims)''|\bset\s+(?:local\s+|session\s+)?(?:app\.(?:user_id|current_user_id|current_user|user|actor|actor_id|uid|userid|account_id|current_account_id)|request\.jwt\.claims|request\.jwt\.claim\.sub|jwt\.claims)\s*(?:=|to)|-c\s*(?:app\.(?:user_id|current_user_id|current_user|user|actor|actor_id|uid|userid|account_id|current_account_id)|request\.jwt\.claims|request\.jwt\.claim\.sub|jwt\.claims)\s*=)'
min_engine: 0.45.3
---
id: audit-actor-recorded.java-generic.session-level-context
practice_id: audit-actor-recorded
language: java
frameworks:
- generic
kind: violation
rule:
  all:
  - kind: string_literal
    regex: '(?i)(?:set_config\s*\(\s*''(?:app\.(?:user_id|current_user_id|current_user|user|actor|actor_id|uid|userid|account_id|current_account_id)|request\.jwt\.claims|request\.jwt\.claim\.sub|jwt\.claims)''\s*,[\s\S]*,\s*false\s*\)|\bset\s+(?:session\s+)?(?:app\.(?:user_id|current_user_id|current_user|user|actor|actor_id|uid|userid|account_id|current_account_id)|request\.jwt\.claims|request\.jwt\.claim\.sub|jwt\.claims)\s*(?:=|to))'
  - inside:
      stopBy: end
      kind: method_invocation
      regex: '\.(execute|update|queryForObject|queryForList|query|createNativeQuery|executeUpdate|prepareStatement|executeQuery)\s*\('
min_engine: 0.45.3
