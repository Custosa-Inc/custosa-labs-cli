id: session-timeouts.typescript-generic.lifetime-within
practice_id: session-timeouts
language: typescript
frameworks:
- generic
kind: evidence
rule:
  any:
  - all:
    - kind: pair
      regex: ^expiresIn\s*:\s*(['\"`](([1-9][0-9]{0,2}|1[0-3][0-9][0-9]|14[0-3][0-9]|1440)\s*m(in(ute)?s?)?|([1-9]|1[0-9]|2[0-4])\s*h(ours?|rs?)?|1\s*d(ays?)?|([1-9][0-9]{0,3}|[1-7][0-9]{4}|8[0-5][0-9]{3}|86[0-3][0-9][0-9]|86400)\s*s(ec(ond)?s?)?)['\"`]|([1-9][0-9]{0,3}|[1-7][0-9]{4}|8[0-5][0-9]{3}|86[0-3][0-9][0-9]|86400|([1-9]|1[0-9]|2[0-4])\s*\*\s*60\s*\*\s*60|60\s*\*\s*60\s*\*\s*([1-9]|1[0-9]|2[0-4])|([1-9][0-9]?|[1-9][0-9][0-9]|1[0-3][0-9][0-9]|14[0-3][0-9]|1440)\s*\*\s*60))$
    - all:
      - inside:
          stopBy: end
          kind: call_expression
          regex: ^(jwt\.sign|sign|signJwt|signToken|jwt\.encode|(this\.)?[A-Za-z0-9_]*[jJ]wt[A-Za-z0-9_]*\.sign(Async)?)\(
      - inside:
          stopBy: end
          any:
          - kind: variable_declarator
            has:
              field: name
              kind: identifier
              regex: (?i)(session|access|refresh|login|sign_?in|auth|bearer)
          - kind: function_declaration
            has:
              field: name
              kind: identifier
              regex: (?i)(session|access|refresh|login|sign_?in|auth|bearer)
          - kind: method_definition
            has:
              field: name
              kind: property_identifier
              regex: (?i)(session|access|refresh|login|sign_?in|auth|bearer)
          - kind: pair
            has:
              field: key
              kind: property_identifier
              regex: (?i)(session|access|refresh|login|sign_?in|auth|bearer)
      - not:
          inside:
            stopBy: end
            any:
            - kind: variable_declarator
              has:
                field: name
                kind: identifier
                regex: (?i)(verif|reset|invite|confirm|magic|email|otp|download|share|unsubscribe|signed_?url|presign|upload)
            - kind: function_declaration
              has:
                field: name
                kind: identifier
                regex: (?i)(verif|reset|invite|confirm|magic|email|otp|download|share|unsubscribe|signed_?url|presign|upload)
            - kind: method_definition
              has:
                field: name
                kind: property_identifier
                regex: (?i)(verif|reset|invite|confirm|magic|email|otp|download|share|unsubscribe|signed_?url|presign|upload)
            - kind: pair
              has:
                field: key
                kind: property_identifier
                regex: (?i)(verif|reset|invite|confirm|magic|email|otp|download|share|unsubscribe|signed_?url|presign|upload)
  - all:
    - kind: pair
      regex: ^maxAge\s*:\s*([1-9][0-9]{0,3}|[1-7][0-9]{4}|8[0-5][0-9]{3}|86[0-3][0-9][0-9]|86400|([1-9]|1[0-9]|2[0-4])\s*\*\s*60\s*\*\s*60|60\s*\*\s*60\s*\*\s*([1-9]|1[0-9]|2[0-4])|([1-9][0-9]?|[1-9][0-9][0-9]|1[0-3][0-9][0-9]|14[0-3][0-9]|1440)\s*\*\s*60)$
    - all:
      - inside:
          stopBy: end
          kind: pair
          regex: '^session\s*:'
      - not:
          inside:
            stopBy: end
            kind: pair
            regex: '^cookies?\s*:'
  - all:
    - kind: pair
      regex: ^(maxAge|expires)\s*:\s*([1-9][0-9]{0,6}|[1-7][0-9]{7}|8[0-5][0-9]{6}|86[0-3][0-9]{5}|86400000|([1-9]|1[0-9]|2[0-4])\s*\*\s*60\s*\*\s*60\s*\*\s*1000|1000\s*\*\s*60\s*\*\s*60\s*\*\s*([1-9]|1[0-9]|2[0-4])|([1-9][0-9]?|[1-9][0-9][0-9]|1[0-3][0-9][0-9]|14[0-3][0-9]|1440)\s*\*\s*60\s*\*\s*1000)$
    - any:
      - inside:
          stopBy: end
          kind: pair
          regex: '^cookie\s*:'
      - inside:
          stopBy: end
          kind: call_expression
          regex: ^(res|response|reply)\.cookie\(|cookies\(\)\.set\(|\.cookies\.set\(
    - not:
        inside:
          stopBy: end
          kind: call_expression
          regex: ^(session|expressSession)\([\s\S]*rolling\s*:\s*true
min_engine: 0.39.0
