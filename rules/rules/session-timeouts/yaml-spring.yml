id: session-timeouts.yaml-spring.idle-within
practice_id: session-timeouts
language: yaml
frameworks:
- spring
kind: evidence
rule:
  any:
  - all:
    - kind: block_mapping_pair
      regex: ^timeout\s*:\s*(([1-9]|[1-5][0-9]|60)m|1h|[1-9][0-9]{0,2}s|[1-2][0-9]{3}s|3[0-5][0-9][0-9]s|3600s)$
    - inside:
        kind: block_mapping
        inside:
          kind: block_node
          inside:
            kind: block_mapping_pair
            regex: '^session\s*:'
  - kind: block_mapping_pair
    regex: ^((server\.(servlet|reactive)|spring)\.session\.|session\.)timeout\s*:\s*(([1-9]|[1-5][0-9]|60)m|1h|[1-9][0-9]{0,2}s|[1-2][0-9]{3}s|3[0-5][0-9][0-9]s|3600s)$
min_engine: 0.39.0
---
id: session-timeouts.yaml-spring.over-limit
practice_id: session-timeouts
language: yaml
frameworks:
- spring
kind: violation
rule:
  any:
  - all:
    - kind: block_mapping_pair
      regex: ^timeout\s*:\s*((6[1-9]|[7-9][0-9]|[0-9]{3,})m|([2-9]|[0-9]{2,})h|[0-9]+d)$
    - inside:
        kind: block_mapping
        inside:
          kind: block_node
          inside:
            kind: block_mapping_pair
            regex: '^session\s*:'
  - kind: block_mapping_pair
    regex: ^((server\.(servlet|reactive)|spring)\.session\.|session\.)timeout\s*:\s*((6[1-9]|[7-9][0-9]|[0-9]{3,})m|([2-9]|[0-9]{2,})h|[0-9]+d)$
min_engine: 0.39.0
