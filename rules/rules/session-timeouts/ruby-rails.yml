id: session-timeouts.ruby-rails.idle-within
practice_id: session-timeouts
language: ruby
frameworks:
- rails
kind: evidence
rule:
  any:
  - kind: assignment
    regex: ^config\.timeout_in\s*=\s*(([1-9]|[1-5][0-9]|60)\.minutes?|1\.hours?)$
  - kind: pair
    regex: ^(expire_after|timeout_in):\s*(([1-9]|[1-5][0-9]|60)\.minutes?|1\.hours?)$
min_engine: 0.39.0
---
id: session-timeouts.ruby-rails.over-limit
practice_id: session-timeouts
language: ruby
frameworks:
- rails
kind: violation
rule:
  any:
  - kind: assignment
    regex: ^config\.(timeout_in|remember_for)\s*=\s*([0-9]+\.(days?|weeks?|months?|years?)|(6[1-9]|[7-9][0-9]|[0-9]{3,})\.minutes?|([2-9]|[0-9]{2,})\.hours?)$
  - kind: pair
    regex: ^(expire_after|timeout_in):\s*([0-9]+\.(days?|weeks?|months?|years?)|(6[1-9]|[7-9][0-9]|[0-9]{3,})\.minutes?|([2-9]|[0-9]{2,})\.hours?)$
min_engine: 0.39.0
