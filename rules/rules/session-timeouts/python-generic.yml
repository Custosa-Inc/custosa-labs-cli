  - kind: assignment
    regex: ^SESSION_COOKIE_AGE\s*=\s*((8640[1-9]|864[1-9][0-9]|86[5-9][0-9]{2}|8[7-9][0-9]{3}|9[0-9]{4}|[1-9][0-9]{5,})|(60\s*\*\s*)?60\s*\*\s*24\s*\*\s*([2-9]|[0-9]{2,}))$
  - kind: assignment
    regex: PERMANENT_SESSION_LIFETIME(['\"]\])?\s*=\s*timedelta\((days\s*=\s*([2-9]|[0-9]{2,})|hours\s*=\s*(2[5-9]|[3-9][0-9]|[0-9]{3,})|weeks\s*=)
  - kind: pair
    regex: ^['\"](ACCESS_TOKEN_LIFETIME|REFRESH_TOKEN_LIFETIME)['\"]\s*:\s*timedelta\((days\s*=\s*([2-9]|[0-9]{2,})|hours\s*=\s*(2[5-9]|[3-9][0-9]|[0-9]{3,})|weeks\s*=)
min_engine: 0.39.0
