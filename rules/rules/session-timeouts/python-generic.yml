id: session-timeouts.python-generic.lifetime-within
practice_id: session-timeouts
language: python
frameworks:
- generic
kind: evidence
rule:
  any:
  - kind: assignment
    regex: ^SESSION_COOKIE_AGE\s*=\s*(([1-9][0-9]{0,3}|[1-7][0-9]{4}|8[0-5][0-9]{3}|86[0-3][0-9][0-9]|86400)|(60\s*\*\s*)?60\s*\*\s*([1-9]|1[0-9]|2[0-4]))$
  - kind: assignment
    regex: ^(app\.)?(config\[['\"])?PERMANENT_SESSION_LIFETIME(['\"]\])?\s*=\s*timedelta\((hours\s*=\s*([1-9]|1[0-9]|2[0-4])|minutes\s*=\s*([1-9][0-9]{0,2}|1[0-3][0-9][0-9]|14[0-3][0-9]|1440)|days\s*=\s*1)\)$
  - kind: pair
    regex: ^['\"](ACCESS_TOKEN_LIFETIME|REFRESH_TOKEN_LIFETIME)['\"]\s*:\s*timedelta\((hours\s*=\s*([1-9]|1[0-9]|2[0-4])|minutes\s*=\s*([1-9][0-9]{0,2}|1[0-3][0-9][0-9]|14[0-3][0-9]|1440)|days\s*=\s*1)\)$
min_engine: 0.39.0
