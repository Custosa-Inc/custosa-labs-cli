# vendor-flows-minimized (T23 B40 and B40b, design v3 2.6.3 and G9; the design notes are
# docs/b40-plan.md and docs/b40b-plan.md under products/developer-checks). Written by scripts/gen_vendor_rules.py:
# edit that script, never this file.
# Two evidence rules name vendor calls and links out for a person, and two violation rules fail a patient identifier
# in a third-party URL and a whole record sent to a third-party host. A third-party host is a written-out host with
# a dot that is not loopback, private or link-local, under an internal-only or reserved suffix (local, localhost,
# localdomain, internal, intranet, corp, lan, svc, test, example, invalid, home.arpa) or example.com/.org/.net. A
# host built at runtime is not seen, so the practice stays open there; comments and docstrings are never call
# arguments or joins. Test files are set aside by the practice function (vendors.in_test_file): rules can't see
# paths. Sentry and RUM initialisations are error-tracking-no-phi's rules, which this practice judges too (its YAML's
# evaluate.judges_rules_of, T27 F14): an error-tracking SDK at its defaults sends request data to its vendor.

# vendor-call: A fetch, axios, ky, got or node http(s) call (any receiver's get, post, put, patch, delete, head,
# options, request, create or extend) whose first argument names a third-party host (a string or template literal, a +
# join opening with one, or a const a module-level statement assigns one), or whose options object has url, baseURL,
# baseUrl or prefixUrl naming one; a call on a client a module-level const creates with such a base;
# navigator.sendBeacon to one; an XMLHttpRequest opened on one; new URL(path, base) resolved against one. Evidence.
