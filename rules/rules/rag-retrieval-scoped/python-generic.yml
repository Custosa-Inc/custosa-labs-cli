id: rag-retrieval-scoped.python-generic.vector-sql
practice_id: rag-retrieval-scoped
language: python
frameworks:
- generic
kind: evidence
rule:
  any:
  - all:
    - kind: string
      regex: '<=>|<->|<#>|<\+>|<~>|<%>'
    - regex: '(?i)embedding|vector|halfvec|sparsevec'
    - not:
        inside:
          kind: expression_statement
  - all:
    - kind: string
      regex: '(?is)\bselect\b.*\bfrom\b|\border\s+by\b'
    - regex: '<#>|<\+>|<~>|<%>'
    - not:
        inside:
          kind: expression_statement
  - all:
    - kind: string
      regex: '(?is)\bselect\b.*\bfrom\b|\border\s+by\b'
    - regex: '<->'
    - not:
        kind: string
        regex: '(?i)(ST_\w+\s*\([^<>;]*\)|\b(the_geom|geom\w*|geog\w*|geometry|geography)\b|::\s*geo(metry|graphy))\s*<->\s*(ST_\w+\s*\(|\b(the_geom|geom\w*|geog\w*)\b|''[^'']*''\s*::\s*geo(metry|graphy)|[$:?%]\w*\s*::\s*geo(metry|graphy))'
    - not:
        inside:
          kind: expression_statement
  - all:
    - kind: string
      regex: '(?is)\bselect\b.*\bfrom\b|\border\s+by\b'
    - regex: '(?s)<->.*<->'
    - not:
        inside:
          kind: expression_statement
  - all:
    - kind: string
      regex: '(?is)\bselect\b.*\bfrom\b|\border\s+by\b'
    - regex: '<=>'
    - regex: '(?is)\border\s+by\b|<=>[^,;]*\bas\s+\w|<=>\s*[^\s,;()]+(\s*::\s*\w+(\([\d,\s]+\))?)?\s*\)*\s*[<>]=?\s*[-\d.$:?%]|<=>\s*(''|\[|array\b|\w+\s*\(|[^\s,;)]*::)|(\]''|\)|::\s*\w+(\([\d,\s]+\))?)\s*<=>|\bselect\b[^;]*<=>[^;]*\bfrom\b'
    - not:
        inside:
          kind: expression_statement
min_engine: 0.45.3
