id: no-phi-in-ai-metadata.javascript-generic.caller-tools
practice_id: no-phi-in-ai-metadata
language: javascript
frameworks:
- generic
kind: violation
rule:
  all:
  - kind: pair
  - has:
      field: key
      kind: property_identifier
      regex: '^(tools|functions)$'
  - has:
