id: no-phi-in-ai-metadata.python-generic.caller-tools
practice_id: no-phi-in-ai-metadata
language: python
frameworks:
- generic
kind: violation
rule:
  all:
  - kind: keyword_argument
  - has:
      field: name
      kind: identifier
      regex: '^(tools|functions)$'
  - has:
      field: value
      any:
      - kind: subscript
        regex: '^(request\.json|request\.data|body|payload|data)\[\s*[''"](tools|functions)[''"]\s*\]$'
      - kind: attribute
        regex: '^(body|payload|request_body)\.(tools|functions)$'
  - inside:
      kind: argument_list
      inside:
        kind: call
        has:
          field: function
          kind: attribute
          regex: '\.(responses\.(create|stream|parse)|chat\.completions\.(create|stream|parse)|messages\.(create|stream))$'
min_engine: 0.45.3
