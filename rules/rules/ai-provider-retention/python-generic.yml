id: ai-provider-retention.python-generic.gemini-developer-api
practice_id: ai-provider-retention
language: python
frameworks:
- generic
kind: violation
rule:
  any:
  - all:
    - kind: call
    - has:
        field: function
        kind: attribute
        regex: '^genai\.configure$'
  - all:
    - kind: call
    - has:
        field: function
        kind: attribute
        regex: '^genai\.Client$'
    - not:
        has:
          field: arguments
          kind: argument_list
          has:
            kind: keyword_argument
            all:
            - has:
                field: name
                kind: identifier
                regex: '^vertexai$'
            - has:
                field: value
                kind: 'true'
  - kind: string
    regex: '^f?[''"]https://generativelanguage\.googleapis\.com/'
min_engine: 0.45.3
