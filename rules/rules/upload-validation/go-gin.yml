id: upload-validation.go-gin.handler
practice_id: upload-validation
language: go
frameworks:
- gin
kind: items
rule:
  all:
  - any:
    - kind: function_declaration
    - kind: method_declaration
    - kind: func_literal
  - has:
      stopBy:
        kind: func_literal
      any:
      - kind: call_expression
        regex: ^[A-Za-z0-9_.()]*\.(FormFile|MultipartForm|SaveUploadedFile)\(
control:
  any:
  - has:
      stopBy:
        any:
        - kind: function_declaration
        - kind: method_declaration
        - kind: func_literal
      kind: if_statement
      all:
      - has:
          field: condition
          any:
          - &id002
            all:
            - kind: selector_expression
            - has:
                field: field
                kind: field_identifier
                regex: ^(Infected|IsInfected|VirusFound|Malicious)$
            - has:
                field: operand
                any:
                - all: &id001
                  - kind: call_expression
                    regex: ^([A-Za-z0-9_$.>:-]*[0-9_$.>:-])?(?i:(clam|clamav|clamd|clamscan|virus|viruses|virustotal|antivirus|malware|antimalware|quahog|cloudmersive|scanii|metadefender|opswat))(\(|[A-Z0-9_$.>:-][A-Za-z0-9_$.>:-]*\()|^[A-Za-z0-9_$.>:-]*(Clam|ClamAV|Clamav|Clamd|Clamscan|CLAMAV|CLAMD|Virus|Viruses|VirusTotal|Antivirus|AntiVirus|Malware|AntiMalware|Quahog|Cloudmersive|Scanii|MetaDefender|Opswat|OPSWAT)(\(|[A-Z0-9_$.>:-][A-Za-z0-9_$.>:-]*\()|^([A-Za-z0-9_$.>:-]*[.>:])?(is_?[iI]nfected|instream|scan_stream)\(
                  - not:
                      kind: call_expression
                      regex: (?i)(queue|job|task|enqueue|delay|apply_async|publish|dispatch|schedule|enabled|configured|available|definition|signature|update|fresh|version|health|ping)
                - has:
                    stopBy: end
                    all: *id001
            - not:
                inside:
                  kind: unary_expression
          - has:
              stopBy: end
              any:
              - *id002
      - has:
          field: consequence
          any:
          - &id003
            kind: return_statement
          - has:
              stopBy: end
              any:
              - *id003
  - all:
    - has:
        stopBy:
          any:
          - kind: function_declaration
          - kind: method_declaration
          - kind: func_literal
        all:
        - kind: short_var_declaration
          any:
          - pattern:
              context: func f() { $V, $W := $E }
              selector: short_var_declaration
          - pattern:
              context: func f() { $V := $E }
              selector: short_var_declaration
        - has:
            stopBy: end
            any:
            - kind: call_expression
              regex: ^([A-Za-z0-9_$.>:-]*[0-9_$.>:-])?(?i:(clam|clamav|clamd|clamscan|virus|viruses|virustotal|antivirus|malware|antimalware|quahog|cloudmersive|scanii|metadefender|opswat))(\(|[A-Z0-9_$.>:-][A-Za-z0-9_$.>:-]*\()|^[A-Za-z0-9_$.>:-]*(Clam|ClamAV|Clamav|Clamd|Clamscan|CLAMAV|CLAMD|Virus|Viruses|VirusTotal|Antivirus|AntiVirus|Malware|AntiMalware|Quahog|Cloudmersive|Scanii|MetaDefender|Opswat|OPSWAT)(\(|[A-Z0-9_$.>:-][A-Za-z0-9_$.>:-]*\()|^([A-Za-z0-9_$.>:-]*[.>:])?(is_?[iI]nfected|instream|scan_stream)\(
        - not:
            has:
              stopBy: end
              any:
              - kind: call_expression
                regex: (?i)(queue|job|task|enqueue|delay|apply_async|publish|dispatch|schedule|enabled|configured|available|definition|signature|update|fresh|version|health|ping)
    - has:
        stopBy:
          any:
          - kind: function_declaration
          - kind: method_declaration
          - kind: func_literal
        kind: if_statement
        all:
        - has:
            field: condition
            any:
            - &id004
              all:
              - pattern:
                  context: func f() { if $V.$P {} }
                  selector: selector_expression
              - regex: ^[A-Za-z0-9_]+\.(Infected|IsInfected|VirusFound|Malicious)$
              - not:
                  inside:
                    kind: unary_expression
            - &id005
              all:
              - kind: binary_expression
              - regex: (?i)^[A-Za-z0-9_]+\.(status|verdict|result)\s*(!=\s*"(clean|ok|passed)"|==\s*"(infected|found|malicious|virus)")$
              - has:
                  field: left
                  has:
                    field: operand
                    kind: identifier
                    pattern:
                      context: func ($V T) f() {}
                      selector: identifier
            - has:
                stopBy: end
                any:
                - *id004
                - *id005
        - has:
            field: consequence
            any:
            - *id003
            - has:
                stopBy: end
                any:
                - *id003
  - has:
      stopBy:
        any:
        - kind: function_declaration
        - kind: method_declaration
        - kind: func_literal
      kind: if_statement
      all:
      - any:
        - pattern:
            context: func f() { if $V, $W := $E; $V { $$$B } }
            selector: if_statement
        - pattern:
            context: func f() { if $V := $E; $V { $$$B } }
            selector: if_statement
      - has:
          field: condition
          kind: identifier
          regex: ^(infected|isInfected|virusFound|found|malicious)$
      - has:
          field: initializer
          has:
            stopBy: end
            all:
            - kind: call_expression
              regex: ^([A-Za-z0-9_$.>:-]*[0-9_$.>:-])?(?i:(clam|clamav|clamd|clamscan|virus|viruses|virustotal|antivirus|malware|antimalware|quahog|cloudmersive|scanii|metadefender|opswat))(\(|[A-Z0-9_$.>:-][A-Za-z0-9_$.>:-]*\()|^[A-Za-z0-9_$.>:-]*(Clam|ClamAV|Clamav|Clamd|Clamscan|CLAMAV|CLAMD|Virus|Viruses|VirusTotal|Antivirus|AntiVirus|Malware|AntiMalware|Quahog|Cloudmersive|Scanii|MetaDefender|Opswat|OPSWAT)(\(|[A-Z0-9_$.>:-][A-Za-z0-9_$.>:-]*\()|^([A-Za-z0-9_$.>:-]*[.>:])?(is_?[iI]nfected|instream|scan_stream)\(
            - not:
                kind: call_expression
                regex: (?i)(queue|job|task|enqueue|delay|apply_async|publish|dispatch|schedule|enabled|configured|available|definition|signature|update|fresh|version|health|ping)
      - has:
          field: consequence
          any:
          - *id003
          - has:
              stopBy: end
              any:
              - *id003
