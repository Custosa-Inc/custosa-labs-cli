              - has:
                  field: left
                  pattern: $V.$P
            - has:
                stopBy: end
                any:
                - *id007
                - *id008
                - *id009
                - *id010
        - has:
            field: consequence
            any:
            - *id005
            - *id006
            - has:
                stopBy: end
                any:
                - *id005
                - *id006
