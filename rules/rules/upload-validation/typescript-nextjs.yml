id: upload-validation.typescript-nextjs.handler
practice_id: upload-validation
language: typescript
frameworks:
- nextjs
kind: items
rule:
  any:
  - all:
    - &id001
      any:
      - kind: function_declaration
      - kind: method_definition
      - kind: arrow_function
      - kind: function_expression
    - any:
      - has:
          field: parameters
          has:
            stopBy: end
            kind: identifier
            regex: ^(req|request)$
      - has:
          field: parameter
          kind: identifier
          regex: ^(req|request)$
    - has:
        stopBy: end
        any:
        - kind: member_expression
          regex: ^(req|request)\.files?$
        - kind: call_expression
          regex: ^(busboy|Busboy)\(
        - kind: new_expression
          regex: ^new\s+(busboy|Busboy)\(
  - all:
    - *id001
    - has:
        stopBy: end
        any:
        - kind: call_expression
          regex: \.formData\(\)$|^createSignedUploadUrl\(|\.storage\.from\([^)]*\)\.upload\(
        - kind: decorator
          regex: ^@UploadedFiles?\(
  - all:
    - *id001
    - has:
        field: parameters
        has:
          kind: required_parameter
          has:
            kind: type_annotation
            regex: ^:\s*FormData$
    - has:
        stopBy: end
        any:
        - kind: as_expression
          regex: \sas\s+File$
        - kind: binary_expression
          regex: \sinstanceof\s+File$
control:
  any:
  - has:
      stopBy:
        any:
        - kind: function_declaration
        - kind: method_definition
        - kind: arrow_function
        - kind: function_expression
      kind: if_statement
      all:
      - has:
          field: condition
          any:
          - &id004
            any:
            - all:
              - kind: member_expression
              - has:
                  field: property
                  kind: property_identifier
                  regex: ^(isInfected|is_infected|infected|hasVirus|hasViruses|virusFound|isMalicious|malicious)$
              - has:
                  field: object
                  any:
                  - &id003
                    all: &id002
