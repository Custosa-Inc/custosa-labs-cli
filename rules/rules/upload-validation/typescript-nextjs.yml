              - kind: call_expression
                regex: (?i)(queue|job|task|enqueue|delay|apply_async|publish|dispatch|schedule|enabled|configured|available|definition|signature|update|fresh|version|health|ping)
    - has:
        stopBy:
          any:
          - kind: function_declaration
          - kind: method_definition
          - kind: arrow_function
          - kind: function_expression
        kind: if_statement
        all:
        - has:
            field: condition
            any:
            - &id007
              all:
              - pattern: $V.$P
              - regex: ^[A-Za-z0-9_$]+\.(isInfected|is_infected|infected|hasVirus|hasViruses|virusFound|isMalicious|malicious)$
              - not:
                  inside:
                    kind: unary_expression
            - &id008
              all:
              - pattern: '!$V.$P'
              - regex: ^!\s*[A-Za-z0-9_$]+\.(isClean|is_clean|clean)$
