                        regex: (?i)(queue|job|task|enqueue|delay|apply_async|publish|dispatch|schedule|enabled|configured|available|definition|signature|update|fresh|version|health|ping)
                  - has:
                      stopBy: end
                      all: *id002
              - not:
                  inside:
                    kind: unary_expression
            - all:
              - kind: unary_expression
                regex: ^!
              - has:
                  kind: member_expression
                  all:
                  - has:
                      field: property
                      kind: property_identifier
                      regex: ^(isClean|is_clean|clean)$
                  - has:
                      field: object
                      any:
                      - *id003
                      - has:
                          stopBy: end
                          all: *id002
          - has:
              stopBy: end
              any:
              - *id004
      - has:
          field: consequence
          any:
          - &id005
            kind: return_statement
          - &id006
            kind: throw_statement
          - has:
              stopBy: end
              any:
              - *id005
              - *id006
  - all:
    - has:
        stopBy:
          any:
          - kind: function_declaration
