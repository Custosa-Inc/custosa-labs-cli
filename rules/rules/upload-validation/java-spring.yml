id: upload-validation.java-spring.handler
practice_id: upload-validation
language: java
frameworks:
- spring
kind: items
rule:
  all:
  - any:
    - kind: method_declaration
  - has:
      stopBy: end
      any:
      - kind: type_identifier
        regex: ^MultipartFile$
control:
  any:
  - has:
      stopBy:
        any:
        - kind: method_declaration
        - kind: lambda_expression
      kind: if_statement
      all:
      - has:
          field: condition
          any:
          - &id003
            any:
            - all:
              - kind: method_invocation
              - has:
                  field: name
                  kind: identifier
                  regex: ^(isInfected|hasVirus|hasViruses|isMalicious|virusFound)$
              - has:
                  field: object
                  any:
                  - &id002
                    all: &id001
                    - kind: method_invocation
                      regex: ^([A-Za-z0-9_$.>:-]*[0-9_$.>:-])?(?i:(clam|clamav|clamd|clamscan|virus|viruses|virustotal|antivirus|malware|antimalware|quahog|cloudmersive|scanii|metadefender|opswat))(\(|[A-Z0-9_$.>:-][A-Za-z0-9_$.>:-]*\()|^[A-Za-z0-9_$.>:-]*(Clam|ClamAV|Clamav|Clamd|Clamscan|CLAMAV|CLAMD|Virus|Viruses|VirusTotal|Antivirus|AntiVirus|Malware|AntiMalware|Quahog|Cloudmersive|Scanii|MetaDefender|Opswat|OPSWAT)(\(|[A-Z0-9_$.>:-][A-Za-z0-9_$.>:-]*\()|^([A-Za-z0-9_$.>:-]*[.>:])?(is_?[iI]nfected|instream|scan_stream)\(
                    - not:
                        kind: method_invocation
                        regex: (?i)(queue|job|task|enqueue|delay|apply_async|publish|dispatch|schedule|enabled|configured|available|definition|signature|update|fresh|version|health|ping)
                  - has:
                      stopBy: end
                      all: *id001
              - not:
                  inside:
                    kind: unary_expression
            - all:
              - kind: unary_expression
                regex: ^!
              - has:
                  kind: method_invocation
                  all:
                  - has:
                      field: name
                      kind: identifier
                      regex: ^(isClean|isOk)$
                  - has:
                      field: object
                      any:
                      - *id002
                      - has:
                          stopBy: end
                          all: *id001
          - has:
              stopBy: end
              any:
              - *id003
      - has:
          field: consequence
          any:
          - &id004
            kind: return_statement
          - &id005
            kind: throw_statement
          - has:
              stopBy: end
              any:
              - *id004
              - *id005
  - all:
    - has:
        stopBy:
          any:
          - kind: method_declaration
          - kind: lambda_expression
        all:
        - kind: local_variable_declaration
          pattern: $T $V = $E;
        - has:
            stopBy: end
            any:
            - kind: method_invocation
              regex: ^([A-Za-z0-9_$.>:-]*[0-9_$.>:-])?(?i:(clam|clamav|clamd|clamscan|virus|viruses|virustotal|antivirus|malware|antimalware|quahog|cloudmersive|scanii|metadefender|opswat))(\(|[A-Z0-9_$.>:-][A-Za-z0-9_$.>:-]*\()|^[A-Za-z0-9_$.>:-]*(Clam|ClamAV|Clamav|Clamd|Clamscan|CLAMAV|CLAMD|Virus|Viruses|VirusTotal|Antivirus|AntiVirus|Malware|AntiMalware|Quahog|Cloudmersive|Scanii|MetaDefender|Opswat|OPSWAT)(\(|[A-Z0-9_$.>:-][A-Za-z0-9_$.>:-]*\()|^([A-Za-z0-9_$.>:-]*[.>:])?(is_?[iI]nfected|instream|scan_stream)\(
        - not:
            has:
              stopBy: end
              any:
              - kind: method_invocation
                regex: (?i)(queue|job|task|enqueue|delay|apply_async|publish|dispatch|schedule|enabled|configured|available|definition|signature|update|fresh|version|health|ping)
    - has:
        stopBy:
          any:
          - kind: method_declaration
          - kind: lambda_expression
        kind: if_statement
        all:
        - has:
            field: condition
            any:
            - &id006
              all:
              - pattern: $V.$M()
              - regex: ^[A-Za-z0-9_]+\.(isInfected|hasVirus|hasViruses|isMalicious|virusFound)\(\)$
              - not:
                  inside:
                    kind: unary_expression
            - &id007
              all:
              - pattern: '!$V.$M()'
              - regex: ^!\s*[A-Za-z0-9_]+\.(isClean|isOk)\(\)$
            - &id008
              all:
              - kind: instanceof_expression
                regex: ^[A-Za-z0-9_]+\s+instanceof\s+[A-Za-z0-9_.]*(VirusFound|Infected)$
              - has:
                  field: left
                  kind: identifier
                  pattern:
                    context: $V.x();
                    selector: identifier
            - has:
                stopBy: end
                any:
                - *id006
                - *id007
                - *id008
        - has:
            field: consequence
            any:
            - *id004
            - *id005
            - has:
                stopBy: end
                any:
                - *id004
                - *id005
min_engine: 0.39.0
