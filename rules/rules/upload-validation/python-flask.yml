id: upload-validation.python-flask.handler
practice_id: upload-validation
language: python
frameworks:
- flask
kind: items
rule:
  all:
  - any:
    - kind: function_definition
  - has:
      stopBy: end
      any:
      - kind: attribute
        regex: ^request\.(FILES|files)$
      - kind: type
        regex: ^UploadFile$
control:
  any:
  - has:
      stopBy:
        any:
        - kind: function_definition
        - kind: lambda
      kind: if_statement
      all:
      - has:
          field: condition
          any:
          - &id003
            any:
            - all:
              - kind: attribute
              - has:
                  field: attribute
                  kind: identifier
                  regex: ^(is_infected|infected|has_virus|virus_found|is_malicious|malicious)$
              - has:
                  field: object
                  any:
                  - &id002
                    all: &id001
                    - kind: call
                      regex: ^([A-Za-z0-9_$.>:-]*[0-9_$.>:-])?(?i:(clam|clamav|clamd|clamscan|virus|viruses|virustotal|antivirus|malware|antimalware|quahog|cloudmersive|scanii|metadefender|opswat))(\(|[A-Z0-9_$.>:-][A-Za-z0-9_$.>:-]*\()|^[A-Za-z0-9_$.>:-]*(Clam|ClamAV|Clamav|Clamd|Clamscan|CLAMAV|CLAMD|Virus|Viruses|VirusTotal|Antivirus|AntiVirus|Malware|AntiMalware|Quahog|Cloudmersive|Scanii|MetaDefender|Opswat|OPSWAT)(\(|[A-Z0-9_$.>:-][A-Za-z0-9_$.>:-]*\()|^([A-Za-z0-9_$.>:-]*[.>:])?(is_?[iI]nfected|instream|scan_stream)\(
                    - not:
                        kind: call
                        regex: (?i)(queue|job|task|enqueue|delay|apply_async|publish|dispatch|schedule|enabled|configured|available|definition|signature|update|fresh|version|health|ping)
                  - has:
                      stopBy: end
                      all: *id001
              - not:
                  inside:
                    kind: not_operator
            - all:
              - kind: not_operator
              - has:
                  kind: attribute
                  all:
                  - has:
                      field: attribute
                      kind: identifier
                      regex: ^(is_clean|clean)$
                  - has:
                      field: object
                      any:
                      - *id002
                      - has:
                          stopBy: end
                          all: *id001
          - has:
              stopBy: end
              any:
              - *id003
      - has:
          field: consequence
          any:
          - &id004
            kind: return_statement
          - &id005
            kind: raise_statement
          - &id006
            kind: call
            regex: ^(flask\.)?abort\(
          - has:
              stopBy: end
              any:
              - *id004
              - *id005
              - *id006
  - all:
    - has:
        stopBy:
          any:
          - kind: function_definition
          - kind: lambda
        all:
        - kind: assignment
          all:
          - pattern: $V = $E
          - has:
              field: left
              kind: identifier
        - has:
            stopBy: end
            any:
            - kind: call
              regex: ^([A-Za-z0-9_$.>:-]*[0-9_$.>:-])?(?i:(clam|clamav|clamd|clamscan|virus|viruses|virustotal|antivirus|malware|antimalware|quahog|cloudmersive|scanii|metadefender|opswat))(\(|[A-Z0-9_$.>:-][A-Za-z0-9_$.>:-]*\()|^[A-Za-z0-9_$.>:-]*(Clam|ClamAV|Clamav|Clamd|Clamscan|CLAMAV|CLAMD|Virus|Viruses|VirusTotal|Antivirus|AntiVirus|Malware|AntiMalware|Quahog|Cloudmersive|Scanii|MetaDefender|Opswat|OPSWAT)(\(|[A-Z0-9_$.>:-][A-Za-z0-9_$.>:-]*\()|^([A-Za-z0-9_$.>:-]*[.>:])?(is_?[iI]nfected|instream|scan_stream)\(
        - not:
            has:
              stopBy: end
              any:
              - kind: call
                regex: (?i)(queue|job|task|enqueue|delay|apply_async|publish|dispatch|schedule|enabled|configured|available|definition|signature|update|fresh|version|health|ping)
    - has:
        stopBy:
          any:
          - kind: function_definition
          - kind: lambda
        kind: if_statement
        all:
        - has:
            field: condition
            any:
            - &id007
              all:
              - pattern: $V.$P
              - regex: ^[A-Za-z0-9_]+\.(is_infected|infected|has_virus|virus_found|is_malicious|malicious|viruses|threats)$
              - not:
                  inside:
                    kind: not_operator
            - &id008
              all:
              - kind: not_operator
              - regex: ^not\s+[A-Za-z0-9_]+\.(is_clean|clean)$
              - has:
                  pattern: $V.$P
            - &id009
              all:
              - kind: comparison_operator
              - regex: (?i)^[A-Za-z0-9_]+(\.(status|verdict|result)|\[['"]stream['"]\]\[0\])\s*(!=\s*['"](clean|ok|passed)['"]|==\s*['"](infected|found|malicious|virus)['"])$
              - has:
                  stopBy: end
                  kind: identifier
                  pattern:
                    context: $V.x
                    selector: identifier
            - has:
                stopBy: end
                any:
                - *id007
                - *id008
                - *id009
        - has:
            field: consequence
            any:
            - *id004
            - *id005
            - *id006
            - has:
                stopBy: end
                any:
                - *id004
                - *id005
                - *id006
min_engine: 0.39.0
