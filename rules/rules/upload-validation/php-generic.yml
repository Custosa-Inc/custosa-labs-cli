# Upload handlers: a method or function, or a closure outside any function (a route table entry such as
# "POST /api/patient/:pid/document" => function (...) {...}, or $app->post('/x', function (...) {...})), that reads
# an upload.
id: upload-validation.php-generic.handler
practice_id: upload-validation
language: php
frameworks:
- generic
kind: items
rule:
  all:
