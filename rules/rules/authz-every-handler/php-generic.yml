  - inside:
      stopBy: end
      kind: program
      has:
        stopBy: end
        kind: namespace_use_clause
        regex: ^\\?Symfony\\Component\\Routing\\(Attribute|Annotation)\\Route$
  - has:
      field: body
      kind: compound_statement
      has:
        stopBy: end
        any:
        - kind: function_call_expression
          has:
            field: function
            kind: name
            regex: '(?i)^(check|verify|ensure|require|assert|authori[sz]e|enforce|getCurrent|get_current|current)_?\w*(owner|access|permission|user|caller|principal|identity|polic(y|ies)|tenant|member|canView|can_view|client|patient|account|profile)\w*$'
        - kind: member_call_expression
          has:
