            regex: '(?i)^(check|verify|ensure|require|assert|authori[sz]e|enforce|getCurrent|get_current|current)_?\w*(owner|access|permission|user|caller|principal|identity|polic(y|ies)|tenant|member|canView|can_view|client|patient|account|profile)\w*$'
