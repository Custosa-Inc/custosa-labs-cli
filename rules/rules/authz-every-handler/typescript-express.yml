                - kind: member_expression
                  regex: ^(res|response|reply)(\.(json|send|status|sendStatus|end|set|header|type|redirect|cookie|clearCookie|render|format|location|vary|append|attachment|download|sendFile|links|code)\([^()]*\))*\.(json|send|status|sendStatus|end|set|header|type|redirect|cookie|clearCookie|render|format|location|vary|append|attachment|download|sendFile|links|code)$
