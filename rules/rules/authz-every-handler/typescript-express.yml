# Express routes with a route parameter (a record id from the path, in a path string or a path array), one item each,
# where the handler is an inline function. The control is the caller's identity read inside it (req.user, req.auth,
# the session's user, res.locals.user, getAuth(req)) or a Supabase user check. Middleware alone never counts (it says
# who may call, not which record). The same routes with the handler wrapped in a call (route-wrapped) or passed by
# name (route-named) are items too; see below.
id: authz-every-handler.typescript-express.route
practice_id: authz-every-handler
language: typescript
frameworks:
- express
kind: items
rule:
  kind: call_expression
  all:
  - has:
      field: function
      kind: member_expression
      has:
        field: property
        kind: property_identifier
        regex: ^(get|post|put|patch|delete|all)$
  - has:
      field: arguments
      kind: arguments
      all:
      - has:
          any:
          - kind: string
            regex: ^['"`]/[^'"`]*:[A-Za-z_]
          - kind: array
            has:
              kind: string
              regex: ^['"`]/[^'"`]*:[A-Za-z_]
      - has:
          any:
          - kind: arrow_function
          - kind: function_expression
control:
  has:
    field: arguments
    kind: arguments
    has:
      any:
      - kind: arrow_function
      - kind: function_expression
      has:
        stopBy: end
        any:
        - kind: member_expression
          regex: ^(req|request)\.(user|auth|session\.(user|userId|user_id|uid|passport))\b
          not:
            any:
            - inside:
                any:
                - kind: assignment_expression
                - kind: augmented_assignment_expression
                field: left
            - inside:
                kind: member_expression
                inside:
                  any:
                  - kind: assignment_expression
                  - kind: augmented_assignment_expression
                  field: left
        - kind: member_expression
          regex: ^res\.locals\.(user|auth|session|claims)\b
          not:
            any:
            - inside:
                any:
                - kind: assignment_expression
                - kind: augmented_assignment_expression
                field: left
            - inside:
                kind: member_expression
                inside:
                  any:
                  - kind: assignment_expression
                  - kind: augmented_assignment_expression
                  field: left
        - kind: call_expression
          pattern: getAuth($$$)
          has:
            field: arguments
            kind: arguments
            regex: ^\(\s*[^)\s]
          not:
            inside:
              kind: program
              stopBy: end
              has:
                kind: import_statement
                regex: '[''"]firebase-admin(/[a-z-]+)?[''"]'
        - pattern: $C.auth.getUser($$$)
      all:
      - any:
        - precedes:
            not:
              precedes:
                any:
                - kind: comment
                - not:
                    kind: comment
        - precedes:
            precedes:
              not:
                precedes:
                  any:
                  - kind: comment
                  - not:
                      kind: comment
min_engine: 0.39.0
