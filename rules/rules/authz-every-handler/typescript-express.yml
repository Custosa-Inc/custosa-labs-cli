---
# A route-input handler (no route parameter) that makes no call of its own beyond the publish, the response's own
# methods (res.json, res.status(...).send and the like; never res.locals), console or a logger, validation or JSON
# helpers, or a pure top-level function of this file (no call, new, indexing or member access in its body, and no
# import of the same name), and publishes request data (a request member, or a name the handler binds from one)
# through the local name of a project import (publish from '../pubsub', or its alias): the message goes to a project
# consumer that may tie it to the caller. It holds that handler's item for a person (needs_review). A name the
# handler shadows (a variable, parameter or function), a package import, a route with a parameter, or any other call
# in the handler (a data read or write of its own) holds nothing.
id: authz-every-handler.typescript-express.auth-unobserved-publish
practice_id: authz-every-handler
language: typescript
frameworks:
- express
kind: evidence
rule:
  kind: call_expression
  all:
  - not:
