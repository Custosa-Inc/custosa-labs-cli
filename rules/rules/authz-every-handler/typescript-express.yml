# A guard at the handler's top level checking that a request header differs from a secret from the
# environment (!== or !=, a name with SECRET, TOKEN or KEY) and returning or throwing when it does: a machine
# holding the secret called, not which user. It holds that handler's item for a person (needs_review). An
# equality test (=== or ==) with data returned inside is no guard: it holds nothing.
id: authz-every-handler.typescript-express.auth-unobserved-secret
practice_id: authz-every-handler
language: typescript
frameworks:
- express
kind: evidence
rule:
  kind: if_statement
  all:
  - not:
      inside:
        stopBy: end
        any:
        - kind: function_declaration
          inside:
            kind: statement_block
        - any:
          - kind: arrow_function
          - kind: function_expression
          inside:
            kind: variable_declarator
            inside:
              any:
              - kind: lexical_declaration
              - kind: variable_declaration
              inside:
                kind: statement_block
  - has:
      field: condition
      has:
        stopBy: end
        all:
        - any:
          - pattern: '$A !== $B'
          - pattern: '$A != $B'
        - has:
            stopBy: end
            any:
            - kind: member_expression
              regex: '\.headers\b'
            - kind: call_expression
              regex: '^(req|request)\.(get|header)\('
        - has:
            stopBy: end
            kind: member_expression
            regex: '^process\.env\.[A-Z0-9_]*(SECRET|TOKEN|KEY)[A-Z0-9_]*$'
  - has:
      field: consequence
      any:
      - kind: return_statement
      - kind: throw_statement
      - kind: statement_block
        has:
          any:
          - kind: return_statement
          - kind: throw_statement
  - inside:
      kind: statement_block
      inside:
        any:
        - kind: function_declaration
        - kind: arrow_function
        - kind: function_expression
        - kind: method_definition
min_engine: 0.39.0
