# A caller read through a project helper taking nothing or only the request or context
# (getAuthenticatedContext(), requireUser(req), getCurrentUser()): a resemblance of the control, never the
# control (getAuth and currentUser are judged by the control). On the handler it holds that handler's item
# for a person (needs_review). A member call (supabase.auth.getSession()) or a lookup taking an id is never one.
id: authz-every-handler.typescript-express.auth-unobserved-context
practice_id: authz-every-handler
language: typescript
frameworks:
- express
kind: evidence
rule:
  kind: call_expression
  all:
  - not:
      inside:
        stopBy: end
        any:
        - kind: function_declaration
          inside:
            kind: statement_block
        - any:
          - kind: arrow_function
          - kind: function_expression
          inside:
            kind: variable_declarator
            inside:
              any:
              - kind: lexical_declaration
              - kind: variable_declaration
              inside:
                kind: statement_block
  - has:
      field: function
      kind: identifier
      regex: '^(get|require|load|ensure|assert|verify)((Authenticated|Auth|Current|Session|Request|SignedIn|LoggedIn)(User|Session|Context|Ctx|Caller|Principal|Claims|Identity|Account)|(User|Session|Caller|Principal|Claims|Identity|Account))(Context|Info|Id|OrThrow)?$'
  - has:
      field: arguments
      kind: arguments
      regex: '^\(\s*(req|request|ctx|c)?\s*\)$'
min_engine: 0.39.0
