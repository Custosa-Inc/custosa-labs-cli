# never which record, so it is never the control; see the evidence below.
id: authz-every-handler.typescript-nestjs.route
practice_id: authz-every-handler
language: typescript
frameworks:
- nestjs
kind: items
rule:
  kind: method_definition
  all:
  - follows:
