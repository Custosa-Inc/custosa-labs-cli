                              - any:
                                - kind: decorator
                                - kind: comment
                                follows:
                                  any:
                                  - kind: decorator
                                    regex: ^@(Get|Post|Put|Patch|Delete|All)\b
                                  - any:
                                    - kind: decorator
                                    - kind: comment
                                    follows:
                                      any:
                                      - kind: decorator
                                        regex: ^@(Get|Post|Put|Patch|Delete|All)\b
                                      - any:
                                        - kind: decorator
                                        - kind: comment
                                        follows:
                                          any:
                                          - kind: decorator
                                            regex: ^@(Get|Post|Put|Patch|Delete|All)\b
                                          - any:
                                            - kind: decorator
                                            - kind: comment
                                            follows:
                                              any:
                                              - kind: decorator
                                                regex: ^@(Get|Post|Put|Patch|Delete|All)\b
                                              - any:
                                                - kind: decorator
                                                - kind: comment
                                                follows:
                                                  any:
                                                  - kind: decorator
                                                    regex: ^@(Get|Post|Put|Patch|Delete|All)\b
                                                  - any:
                                                    - kind: decorator
                                                    - kind: comment
                                                    follows:
                                                      kind: decorator
                                                      regex: ^@(Get|Post|Put|Patch|Delete|All)\b
  - has:
      field: parameters
      kind: formal_parameters
      has:
        kind: required_parameter
        has:
          kind: decorator
          regex: ^@Param\(
control:
  has:
    field: body
    kind: statement_block
    has:
      stopBy: end
      kind: member_expression
      regex: ^(req|request)\.(user|auth)\b
min_engine: 0.39.0
