# Spring controller methods mapped to a request (@GetMapping, @PostMapping, @PutMapping, @PatchMapping,
# @DeleteMapping, @RequestMapping) that take a @PathVariable (a record named by the path), one item each. The control
# is the caller read in the method: an @AuthenticationPrincipal or @CurrentSecurityContext parameter, a Principal or
# Authentication parameter, SecurityContextHolder in the body, or @PreAuthorize / @PostAuthorize naming the principal,
# the authentication, a parameter (#id) or hasPermission. A role rule (hasRole, a URL pattern) never counts.
id: authz-every-handler.kotlin-spring.mapping
practice_id: authz-every-handler
language: kotlin
frameworks:
- spring
kind: items
rule:
  kind: function_declaration
  all:
  - has:
      kind: modifiers
      has:
        kind: annotation
        regex: '^@(Get|Post|Put|Patch|Delete|Request)Mapping\b'
  - has:
      kind: function_value_parameters
      has:
        kind: parameter_modifiers
        has:
          kind: annotation
          regex: '^@PathVariable\b'
control:
  any:
  - has:
      kind: function_value_parameters
      any:
      - has:
          kind: parameter_modifiers
          has:
            kind: annotation
            regex: '^@(AuthenticationPrincipal|CurrentSecurityContext)\b'
      - has:
          kind: parameter
          has:
            kind: user_type
            regex: '^(Principal|Authentication|JwtAuthenticationToken|OAuth2AuthenticationToken)\??$'
  - has:
      kind: function_body
      has:
        stopBy: end
        kind: simple_identifier
        regex: '^SecurityContextHolder$'
  - has:
      kind: modifiers
      has:
        kind: annotation
        regex: '^@(PreAuthorize|PostAuthorize)\(.*(principal|authentication|hasPermission|#)'
min_engine: 0.39.0
