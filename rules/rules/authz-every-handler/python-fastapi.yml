# FastAPI path operations whose path takes a parameter (a record id), one item each (the function under the
# decorator). The control is the signed-in user as a dependency: a Depends or Security parameter, or a route
# dependencies entry, whose provider names the user, principal, claims or auth (never the bare OAuth2 scheme, which
# only reads the token string, and never a provider named optional, which lets anonymous callers through), or
# request.state.user. A dependency set on the router or app is not seen.
id: authz-every-handler.python-fastapi.route
practice_id: authz-every-handler
language: python
frameworks:
- fastapi
kind: items
rule:
  kind: function_definition
  inside:
    kind: decorated_definition
    has:
      kind: decorator
      regex: '^@\w+\.(get|post|put|patch|delete|api_route)\(\s*f?[''\"][^''\"]*\{'
control:
  any:
  - has:
      stopBy: end
      kind: call
      regex: '^(Depends|Security)\(\s*[\w.]*(?i:user|principal|claims|auth|identity|current)'
      not:
        kind: call
        regex: '(?i)scheme|optional|maybe|try_'
  - has:
      stopBy: end
      kind: attribute
      regex: '^request\.state\.(user|claims|principal)\b'
  - inside:
      kind: decorated_definition
      has:
        kind: decorator
        has:
          stopBy: end
          kind: call
          regex: '^(Depends|Security)\(\s*[\w.]*(?i:user|principal|claims|auth|identity|current)'
          not:
            kind: call
            regex: '(?i)scheme|optional|maybe|try_'
min_engine: 0.39.0
---
# T29 (T29-P1-C5, synthesis item 8): a path operation that rules.route would fail, guarded by a project helper this
# file can't see into: a Depends or Security whose provider names access, an owner, a permission, a policy, a tenant,
# a member or can_ (Depends(verify_patient_access)), a call in its body by a name that checks the caller's right to
# the record (python-flask.auth-unobserved-helper's names), or such a decorator. It holds the operation's item for a
# person (needs_review), never a pass. The bare OAuth2 scheme and an optional provider never match.
id: authz-every-handler.python-fastapi.auth-unobserved-helper
practice_id: authz-every-handler
language: python
frameworks:
- fastapi
kind: evidence
rule:
  kind: function_definition
  all:
  - inside:
      kind: decorated_definition
      has:
        kind: decorator
        regex: '^@\w+\.(get|post|put|patch|delete|api_route)\(\s*f?[''\"][^''\"]*\{'
  - any:
    - has:
        stopBy: end
        kind: call
        regex: '^(Depends|Security)\(\s*[\w.]*(?i:access|owner|permission|polic|tenant|member|can_)'
        not:
          kind: call
          regex: '(?i)scheme|optional|maybe|try_'
    - inside:
        kind: decorated_definition
        has:
          kind: decorator
          has:
            stopBy: end
            kind: call
            regex: '^(Depends|Security)\(\s*[\w.]*(?i:access|owner|permission|polic|tenant|member|can_)'
            not:
              kind: call
              regex: '(?i)scheme|optional|maybe|try_'
    - has:
        stopBy: end
        kind: call
        has:
          field: function
          any:
          - kind: identifier
            regex: '(?i)^(check|verify|ensure|require|assert|authori[sz]e|enforce|get_current|load_current)_\w*(owner|access|permission|user|caller|principal|identity|polic(y|ies)|tenant|member|can_(view|read|edit|update|delete))\w*$'
          - kind: attribute
            regex: '(?i)\.(check|verify|ensure|require|assert|authori[sz]e|enforce|get_current|load_current)_\w*(owner|access|permission|user|caller|principal|identity|polic(y|ies)|tenant|member|can_(view|read|edit|update|delete))\w*$'
    - inside:
        kind: decorated_definition
        has:
          kind: decorator
          regex: '(?i)^@[\w.]*(owner|object_permission|access|authori[sz]|polic)\w*'
min_engine: 0.39.0
