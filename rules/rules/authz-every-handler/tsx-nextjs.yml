# A route handler taking no parameters at all (export async function GET()) that loads the signed-in user and
# touches stored data: one item each, with the same control (the user load plus a user-scoped query ends it
# controlled). One that loads no user is no item here.
# The control: at the handler's top level, before any data access, a const declaration whose value is the user load
# itself, optionally awaited (auth(), getServerSession(), supabase.auth.getUser(); never a bare createClient()),
# and then either an if testing its absence (!s, !s.user, s == null, !s || ...) whose consequence returns, throws,
# redirects or calls notFound as a direct statement, or the binding in a filter argument of a data call (a where:
# in its arguments, or .eq/.match/.filter/.where on a chain starting at a data call), with every data read in the
# handler scoped by it. That use must be a plain dereference (s.user.id, user.id, or the bare destructured name):
# never through an optional chain or optional index (also behind parentheses, as, satisfies or !), nor inside a
# ternary, &&, ||, ?? or an array such as OR: [...], nor as an argument to a call or new inside the filter value.
# The load must be among the first four statements, with no data access before it. The same may sit in a
# whole-body try, the handler's first statement, whose catch returns or throws and makes no data access.
