        kind: program
        has:
          kind: export_statement
          regex: ^export\s+default\s+\w+\s*;?$
          has:
            kind: identifier
            pattern:
              context: $N()
              selector: identifier
  - kind: function_declaration
    regex: ^async\b
    all:
    - has:
        field: name
        kind: identifier
        pattern:
          context: $N()
          selector: identifier
    - inside:
