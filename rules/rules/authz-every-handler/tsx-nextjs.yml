# Next.js entry points that act on a record named by the caller, one item each: a route handler (GET, POST, PUT,
# PATCH, DELETE) taking the route's params, a Server Action that reads or writes the database, and a pages/api handler
# reading req.query. The control is the signed-in user loaded inside it (auth(), getServerSession, getUser, a verified
# token, Clerk's getAuth(req) but never a bare getAuth() or firebase-admin's) or a Supabase client running as the
# caller, outside any branch. Whether the record check follows is dataflow (needs_review). Wrapped exports (export
# const GET = withAuth(...)) and handlers defined in another file are left out.
id: authz-every-handler.tsx-nextjs.route
practice_id: authz-every-handler
language: tsx
frameworks:
- nextjs
kind: items
rule:
  any:
  - kind: function_declaration
    all:
    - has:
        field: name
        kind: identifier
        regex: '^(GET|POST|PUT|PATCH|DELETE)$'
    - has:
        field: parameters
        kind: formal_parameters
        regex: ','
    - inside:
        kind: export_statement
  - kind: variable_declarator
    all:
    - has:
        field: name
        kind: identifier
        regex: '^(GET|POST|PUT|PATCH|DELETE)$'
    - has:
        field: value
        kind: arrow_function
        has:
          field: parameters
          kind: formal_parameters
          regex: ','
    - inside:
        kind: lexical_declaration
        inside:
          kind: export_statement
control:
  has:
    stopBy:
      any:
      - kind: function_declaration
        inside:
          kind: statement_block
      - any:
        - kind: arrow_function
        - kind: function_expression
        inside:
          kind: variable_declarator
          inside:
            any:
            - kind: lexical_declaration
            - kind: variable_declaration
            inside:
              kind: statement_block
    any:
    - any:
      - pattern: auth()
      - pattern: 'getServerSession($$$)'
      - pattern: 'getToken($$$)'
      - pattern: currentUser()
      - pattern: '$C.auth.getUser($$$)'
      - pattern: '$C.auth.getClaims($$$)'
      - pattern: 'validateRequest($$$)'
      - pattern: 'getIronSession($$$)'
      - pattern: 'getKindeServerSession($$$)'
      - pattern: '$A.api.getSession($$$)'
      - pattern: '$A.verifyIdToken($$$)'
      - pattern: '$A.verifySessionCookie($$$)'
      - pattern: 'jwtVerify($$$)'
      - pattern: 'jwt.verify($$$)'
      - kind: call_expression
        pattern: 'getAuth($$$)'
        has:
          field: arguments
          kind: arguments
          regex: '^\(\s*[^)\s]'
        not:
          inside:
            kind: program
            stopBy: end
            has:
              kind: import_statement
              regex: '[''"]firebase-admin(/[a-z-]+)?[''"]'
    - any:
      - pattern: 'createServerClient($$$)'
      - pattern: 'createRouteHandlerClient($$$)'
      - pattern: 'createServerActionClient($$$)'
      - pattern: 'createServerComponentClient($$$)'
      - pattern: 'createPagesServerClient($$$)'
      - pattern: createClient()
    not:
      inside:
        stopBy:
          any:
          - kind: arrow_function
          - kind: function_expression
          - kind: function_declaration
          - kind: method_definition
        any:
        - kind: else_clause
        - kind: switch_case
        - kind: catch_clause
        - kind: for_statement
        - kind: for_in_statement
        - kind: while_statement
        - kind: do_statement
        - any:
          - kind: statement_block
          - kind: expression_statement
          - kind: return_statement
          inside:
            kind: if_statement
            field: consequence
        - kind: ternary_expression
min_engine: 0.39.0
