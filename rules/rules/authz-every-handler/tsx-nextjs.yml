# A route handler taking only the request (GET(request), POST(req)), one item each, when it touches stored
# data (a database or storage call, as for a Server Action) or loads the signed-in user: the record comes
# from the body, the query string or a header instead of the path. Same control as the two-parameter route.
# A handler with neither (a health check, a CSP report sink) is not an item.
