# T29 (T29-P1-C456, authz slice 7): a list route (as list-route) whose query is scoped, as a direct statement, by a
# where on a value that a project helper returns: $client = $this->getClient(), then ->where('client_id', $client->id).
# The helper's name reads as the caller (get, current, resolve or load, then Client, User, Patient, Clinician, Account,
# Profile, Tenant, Organisation and the like), but what it returns is out of view here, so it holds the item for a
# person (needs_review), never a pass. As auth-unobserved-helper does for record routes.
