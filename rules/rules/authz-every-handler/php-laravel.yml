# T29 (T29-P1-C456, authz slice 7, group C): a Laravel list route, one item each: a public method of a class extending
# a Controller that takes no record (no parameter rules.route counts, so the two never both match) and returns many
# rows of a model whose name reads as patient data (Patient, Client, Appointment, Encounter, Note, Record, Invoice,
# TherapySession, LabResult and the like, never the Session facade). The rows: a chain from Model:: ending in get(),
# all(), paginate(), simplePaginate() or cursorPaginate(), or that chain on a variable assigned from Model:: as a
# direct statement of the body. The control is a query scoped by the caller: a where (whereX, whereBelongsTo) whose
# value is the caller (auth()->id(), auth()->user()->x, Auth::id(), Auth::user(), $request->user(), request()->user(),
# or $user / $authUser / $currentUser / $me when the body assigns it from one of those as a direct statement), or a
# named scope helper (forUser, ownedBy, visibleTo, accessibleBy, forTenant, forClinic, forOrganisation, forClient,
# forPatient, mine and the like). A where inside an if, a ternary or a closure (->when(...), whereHas(...)) is not read,
# so it never counts; nor does a role check (isPractitioner(), hasRole()). A negated or null where (whereNot
# and the rest of whereNot..., whereKeyNot, whereNull, whereDoesntHave..., whereJsonDoesnt...) lists other people's
# rows, so it is never the caller scope (P2 C552 low, authz slice 8; C553 low, slice 9); the same holds for
# auth-unobserved-list. T29 (T29-P1-C465, F3 and F4, authz slice 10): the scope must sit on a chain that returns
# rows (ending in get(), all(), paginate(), simplePaginate() or cursorPaginate()), not in an argument of it, or on
# the variable that chain starts from (a direct statement $q = Model::where(...), $q->where(...) or
# $q = $q->where(...)). And every rows chain of the method must be scoped so: a where on another model's query
# ($c = Clinician::where('user_id', auth()->id())->first(); return Patient::all();), or on a separate count() beside
# an unscoped get(), is no control. T29 (T29-P1-C470, P2 C583 L2): a plain reassignment of the list variable from a
# model with no caller where ($q = Patient::query()), nested in an if, else, loop, switch or try, undoes the scope.
# T29 (T29-P1-C467, P2 C574 F5, lows round 1): an orWhere (orWhereX) that doesn't
# name the caller widens the scope to other people's rows, so it undoes the control: on the rows chain, in a closure
# on it (->when(..., fn ($q) => $q->orWhere(...))), or in a statement on the list variable (at any depth, in an if or
# a loop too: T29-P1-C470, P2 C587 L4). One inside a where(...) or
# whereNot(...) group closure stays inside the caller's scope and is fine. T29 (T29-P1-C470, P2 C583 L1): a direct
# statement of a try body reads as a direct statement of the body, for the rows variable, the scoping statement, the
# $user assignment and the helper evidence; a catch or finally block stays nested, so a plain reassignment there
# undoes the scope. And since statement order isn't read, a list variable assigned from a model both with the caller
# where and without it ($q = Patient::where(...caller...); $q = Patient::query(); return $q->get();) is no control,
# in either order. T29 (P2 C591 N1, lows round 3): a reassignment in a branch whose own chain keeps the caller where
# ($q = Patient::onlyTrashed()->where(...caller...) in an if) rescopes it, as in a loop. T29 (P2 C591 N3): only an
# orWhere rooted on the list variable widens it, not another builder's orWhere that names it in an argument, and an
# orWhere in a whereHas, orWhereHas, whereDoesntHave or orWhereDoesntHave closure stays inside that group. Rooted on
# the list variable means on its own chain, on the chain assigned to it, or in a when, unless or tap closure on either
# (P2 C594), where the closure's builder is the list query.
# T29 (P3 C593, lows round 4): a reassignment in a branch from a ternary with an arm from a model that has no caller
# where on its own chain ($q = $x ? Patient::where(...caller...) : Patient::onlyTrashed()) undoes the scope too. In a
# when, unless or tap closure, only an orWhere whose chain starts at that closure's parameter widens (P2 C595 N4).
# Known limits: a caller where inside an argument
# (whereIn('id', Note::where(...caller...)->pluck('patient_id'))) is no control (a false hold), and a try nested in
# another try or a branch is not read as direct. No control: the item holds for a person (authz-every-handler fails on code
# reading are holds, evaluate.CODE_READ_HOLDS), never a fail alone, never a pass.
