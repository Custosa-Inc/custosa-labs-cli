# Laravel controller methods named by a route that take a record (route model binding: a parameter typed with a
# model class, nullable too (?Patient, Patient|null), never Request, a FormRequest or an injected service, repository
# or the like; or an $id, $xId, $x_id or
# uuid parameter, untyped, int or string), one item each, on a public method of a class extending a Controller. The
# routes file isn't read here, so the method is the item and its own line is the line. The control is the caller
# read in the method: auth()->user() or ->id() (through a guard too), Auth::user() or ::id() (with or without a leading
# backslash, or as \Illuminate\Support\Facades\Auth), $request->user(), request()->user(),
# $this->authorize(...), a Gate check (Gate, \Gate or the full facade name) or a ->can() / ->cannot() call, or
# $this->authorizeResource(...) anywhere in the
# class (a policy on every resource method). Route middleware ('auth', 'auth:sanctum') says who may call, not which
# record, so it never counts. No control: the practice asks for it (assistant_answer_needed), never a pass, unless
# auth-unobserved-helper holds the item.
id: authz-every-handler.php-laravel.route
practice_id: authz-every-handler
language: php
frameworks:
- laravel
kind: items
rule:
  kind: method_declaration
  all:
  - has:
      kind: visibility_modifier
      regex: ^public$
  - has:
      field: name
      kind: name
      not:
        kind: name
        regex: ^__(construct|destruct|call|get|set|toString)$
  - inside:
      kind: declaration_list
      inside:
        kind: class_declaration
        has:
          kind: base_clause
          regex: Controller$
  - has:
      field: parameters
      kind: formal_parameters
      has:
        kind: simple_parameter
        any:
        - has:
            field: type
            kind: named_type
            regex: ^\\?([A-Za-z_]\w*\\)*[A-Z]\w*$
            not:
              kind: named_type
              regex: (Request|Service|Repository|Manager|Interface|Contract|Factory|Client|Gateway|Handler|Action|Helper|Builder|Collection|Carbon|UploadedFile|Closure|Container|Application|Logger|Mailer|Dispatcher|Validator|Session|Store)$
        - has:
            field: type
            kind: optional_type
            has:
              kind: named_type
              regex: ^\\?([A-Za-z_]\w*\\)*[A-Z]\w*$
              not:
                kind: named_type
                regex: (Request|Service|Repository|Manager|Interface|Contract|Factory|Client|Gateway|Handler|Action|Helper|Builder|Collection|Carbon|UploadedFile|Closure|Container|Application|Logger|Mailer|Dispatcher|Validator|Session|Store)$
        - has:
            field: type
            kind: union_type
            regex: ^(null\s*\|\s*)?\\?([A-Za-z_]\w*\\)*[A-Z]\w*(\s*\|\s*null)?$
            not:
              kind: union_type
              regex: (Request|Service|Repository|Manager|Interface|Contract|Factory|Client|Gateway|Handler|Action|Helper|Builder|Collection|Carbon|UploadedFile|Closure|Container|Application|Logger|Mailer|Dispatcher|Validator|Session|Store)(\s*\|\s*null)?$
        - all:
          - has:
              field: name
              kind: variable_name
              regex: ^\$(id|uuid|\w+Id|\w+_id|\w+Uuid|\w+_uuid)$
          - not:
              has:
                field: type
                any:
                - kind: named_type
                - kind: intersection_type
                - kind: union_type
                  has:
                    kind: named_type
control:
  any:
  - has:
      field: body
      kind: compound_statement
      has:
        stopBy: end
        any:
        - kind: member_call_expression
          regex: ^(auth\([^)]*\)(\s*->\s*guard\([^)]*\))?|request\(\)|\$request|\$req|\\?(Illuminate\\Support\\Facades\\)?Auth::guard\([^)]*\))\s*->\s*(user|id)\s*\(
        - kind: scoped_call_expression
