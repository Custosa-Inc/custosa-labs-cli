# Flask views whose route takes a parameter (a record id), one item each (the function under the decorator). The
# control is the caller read inside it: Flask-Login's current_user, g.user, flask_jwt_extended's get_jwt_identity() or
# get_jwt(), or the user id from the session. login_required or jwt_required alone says the caller is signed in, never
# which record, so it doesn't count.
id: authz-every-handler.python-flask.route
practice_id: authz-every-handler
language: python
frameworks:
- flask
kind: items
rule:
  kind: function_definition
  inside:
    kind: decorated_definition
    has:
      kind: decorator
      regex: '^@\w+\.(route|get|post|put|patch|delete)\(\s*[''\"][^''\"]*<'
control:
  has:
    stopBy: end
    any:
    - kind: identifier
      regex: '^current_user$'
    - kind: attribute
      regex: '^g\.(user|current_user|user_id)\b'
    - pattern: get_jwt_identity()
    - pattern: get_jwt()
    - kind: subscript
      regex: '^session\[\s*[''\"](user|user_id|uid|_user_id|account_id)[''\"]'
    - kind: call
      regex: '^session\.get\(\s*[''\"](user|user_id|uid|_user_id|account_id)[''\"]'
min_engine: 0.39.0
---
# T29 (T29-P1-C5, synthesis item 8): a view that rules.route would fail, guarded by a project helper this file can't
# see into: a call in its body by a name that checks the caller's right to the record (check_patient_access(pid),
# ensure_note_owner(nid), get_current_user(); a verb such as check, verify, ensure, require, assert, authorize or
# enforce joined to owner, access, permission, user, caller, principal, identity, policy, tenant, member or can_view),
# or a decorator naming ownership, object permission, access, authorization or a policy (@owner_required). It holds
# the view's item for a person (needs_review), never a pass. login_required and jwt_required say signed in only, so
# they never match.
id: authz-every-handler.python-flask.auth-unobserved-helper
practice_id: authz-every-handler
language: python
frameworks:
- flask
kind: evidence
rule:
  kind: function_definition
  all:
  - inside:
      kind: decorated_definition
      has:
        kind: decorator
        regex: '^@\w+\.(route|get|post|put|patch|delete)\(\s*[''\"][^''\"]*<'
  - any:
    - has:
        stopBy: end
        kind: call
        has:
          field: function
          any:
          - kind: identifier
            regex: '(?i)^(check|verify|ensure|require|assert|authori[sz]e|enforce|get_current|load_current)_\w*(owner|access|permission|user|caller|principal|identity|polic(y|ies)|tenant|member|can_(view|read|edit|update|delete))\w*$'
          - kind: attribute
            regex: '(?i)\.(check|verify|ensure|require|assert|authori[sz]e|enforce|get_current|load_current)_\w*(owner|access|permission|user|caller|principal|identity|polic(y|ies)|tenant|member|can_(view|read|edit|update|delete))\w*$'
    - inside:
        kind: decorated_definition
        has:
          kind: decorator
          regex: '(?i)^@[\w.]*(owner|object_permission|access|authori[sz]|polic)\w*'
min_engine: 0.39.0
