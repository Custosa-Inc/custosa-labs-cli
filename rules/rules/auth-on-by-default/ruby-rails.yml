id: auth-on-by-default.ruby-rails.skip-auth-app
practice_id: auth-on-by-default
language: ruby
frameworks:
- rails
kind: violation
rule:
  kind: call
  all:
  - has:
      field: method
      kind: identifier
      regex: ^skip_before_action$
  - has:
      field: arguments
      regex: ^\(?\s*:authenticate_\w+!?
      kind: argument_list
  - not:
      has:
        field: arguments
        kind: argument_list
        regex: '\b(only|if|unless)\s*:'
  - inside:
      stopBy: end
      kind: class
      has:
        field: name
        kind: constant
        regex: ^ApplicationController$
min_engine: 0.39.0
