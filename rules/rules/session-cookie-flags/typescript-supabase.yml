kind: evidence
rule:
  any:
  - kind: call_expression
    regex: (?i)\.(setHeader|set|header|append)\(\s*['\"]cache-control['\"]\s*,\s*['\"][^'\"]*no-store
  - kind: pair
    regex: (?i)^['\"]cache-control['\"]\s*:\s*['\"][^'\"]*no-store
