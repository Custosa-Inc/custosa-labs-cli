id: session-cookie-flags.typescript-supabase.cookie-set
practice_id: session-cookie-flags
language: typescript
frameworks:
- supabase
kind: items
rule:
  any:
  - all:
    - kind: call_expression
    - has:
        field: function
        kind: member_expression
        any:
        - kind: member_expression
          regex: ^(res|response|reply|ctx|c)\.(cookie|setCookie)$
        - kind: member_expression
          regex: (cookies\(\)|\.cookies|cookieStore|cookieJar)\.set$
    # T29-P1-C295 cause 3: the incoming request's cookies (Next.js middleware) reach no browser. T29-P1-C310 item 11:
    # only when request or req is a parameter of a function around the call and no block between redeclares it; an
    # all, so the call binds the name first
    - not:
        all:
        - has:
            field: function
            kind: member_expression
            regex: ^(req|request)\.cookies\.set$
            has:
              field: object
              kind: member_expression
              has:
                field: object
                kind: identifier
                pattern:
                  context: const $RQ = 0
                  selector: identifier
        - inside:
            stopBy: end
            any:
            - kind: function_declaration
            - kind: arrow_function
            - kind: function_expression
            - kind: method_definition
            has:
              field: parameters
              has:
                stopBy: end
                kind: identifier
                pattern:
                  context: const $RQ = 0
                  selector: identifier
        - not:
            inside:
              stopBy: end
              kind: statement_block
              has:
                any:
                - kind: lexical_declaration
                - kind: variable_declaration
                has:
                  kind: variable_declarator
                  has:
                    field: name
                    kind: identifier
                    pattern:
                      context: const $RQ = 0
                      selector: identifier
    - not:
        has:
          field: arguments
          kind: arguments
          regex: ^\(\s*['\"`](theme|locale|lang|language|i18n\w*|consent|cookie_?consent\w*|tz|timezone|currency|sidebar\w*|ui[-_]\w*|pref\w*|_ga\w*|NEXT_LOCALE|color[-_]?scheme)['\"`]
  - all:
    - kind: call_expression
      regex: ^(session|expressSession|cookieSession)\(
    - has:
        field: arguments
        kind: arguments
        regex: cookie
control:
  any:
  - all:
    - has:
        field: arguments
        kind: arguments
        regex: (?i)['\"]?(cookie_?)?http_?only['\"]?\s*(=>|:|=)\s*(true|True)\b
    - has:
        field: arguments
        kind: arguments
        regex: (?i)['\"]?(cookie_?)?secure['\"]?\s*(=>|:|=)\s*(true|True|process\.env\.NODE_ENV\s*===?\s*['\"]production['\"]|!\s*\w*[dD]ev\w*|\w*[pP]roduction\w*|env\(['\"]SESSION_SECURE_COOKIE)
    - has:
        field: arguments
        kind: arguments
        regex: (?i)['\"]?(cookie_?)?same_?site['\"]?\s*(=>|:|=)\s*['\"]?(lax|strict)['\"]?
  - all:
    - kind: call_expression
      regex: ^(session|expressSession|cookieSession)\(
    - has:
        field: arguments
        kind: arguments
        regex: (?i)secure\s*:\s*(true|process\.env)
    - has:
        field: arguments
        kind: arguments
        regex: (?i)['\"]?(cookie_?)?same_?site['\"]?\s*(=>|:|=)\s*['\"]?(lax|strict)['\"]?
    - not:
        has:
          field: arguments
          kind: arguments
          regex: (?i)httpOnly\s*:\s*false
min_engine: 0.39.0
---
id: session-cookie-flags.typescript-supabase.flag-off
practice_id: session-cookie-flags
language: typescript
frameworks:
- supabase
kind: violation
rule:
  all:
  - kind: pair
    regex: (?i)^(httpOnly|secure)\s*:\s*false$|^sameSite\s*:\s*['\"]none['\"]$
min_engine: 0.39.0
