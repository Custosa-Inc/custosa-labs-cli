id: password-encoder-slow-hash.php-generic.plain-compare
practice_id: password-encoder-slow-hash
language: php
frameworks: [generic]
kind: violation
rule:
  all:
    - any:
        - pattern: {context: "<?php $A == $B;", selector: binary_expression}
        - pattern: {context: "<?php $A === $B;", selector: binary_expression}
        - pattern: {context: "<?php $A != $B;", selector: binary_expression}
        - pattern: {context: "<?php $A !== $B;", selector: binary_expression}
    - has:
        field: left
        any:
          - kind: variable_name
            has:
              kind: name
              regex: '(?i)^(pass|pwd|passwd|password|passphrase|(new|plain|raw|input|given|supplied)_?pass(word)?)$'
          - kind: subscript_expression
            has:
              kind: string
              has:
                kind: string_content
                regex: '(?i)^(pass|pwd|passwd|password)$'
          - kind: member_access_expression
            has:
              field: name
              kind: name
              regex: '(?i)^(pass|pwd|passwd|password)$'
    - has:
        field: right
        any:
          - kind: variable_name
            has:
              kind: name
              regex: '(?i)^(pass|pwd|passwd|password|passphrase|(new|plain|raw|input|given|supplied)_?pass(word)?)$'
          - kind: subscript_expression
            has:
              kind: string
              has:
                kind: string_content
                regex: '(?i)^(pass|pwd|passwd|password)$'
          - kind: member_access_expression
            has:
              field: name
              kind: name
              regex: '(?i)^(pass|pwd|passwd|password)$'
min_engine: 0.39.0
