id: password-encoder-slow-hash.ruby-rails.plain-compare
practice_id: password-encoder-slow-hash
language: ruby
frameworks: [rails]
kind: violation
rule:
  all:
    - kind: binary
    - regex: '^\S+\s*(==|!=)\s*\S+$'
    - has:
        field: left
        any:
          - kind: identifier
            regex: '(?i)^(pass|pwd|passwd|password|passphrase)$'
          - kind: call
            has:
              field: method
              kind: identifier
              regex: '(?i)^(pass|pwd|passwd|password|passphrase)$'
          - kind: element_reference
            has:
              kind: simple_symbol
              regex: '(?i)^:(pass|pwd|passwd|password)$'
    - has:
        field: right
        any:
          - kind: identifier
            regex: '(?i)^(pass|pwd|passwd|password|passphrase)$'
          - kind: call
            has:
              field: method
              kind: identifier
              regex: '(?i)^(pass|pwd|passwd|password|passphrase)$'
          - kind: element_reference
            has:
              kind: simple_symbol
              regex: '(?i)^:(pass|pwd|passwd|password)$'
min_engine: 0.39.0
