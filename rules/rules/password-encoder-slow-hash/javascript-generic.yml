id: password-encoder-slow-hash.javascript-generic.plain-compare
practice_id: password-encoder-slow-hash
language: javascript
frameworks: [generic]
kind: violation
rule:
  all:
    - any:
        - pattern: $A === $B
        - pattern: $A == $B
        - pattern: $A !== $B
        - pattern: $A != $B
    - has:
        field: left
        any:
          - kind: identifier
            regex: '(?i)^(pass|pwd|passwd|password|passphrase|(new|plain|raw|input|given|supplied)_?pass(word)?)$'
          - all:
              - kind: member_expression
              - has:
                  field: property
                  kind: property_identifier
                  regex: '(?i)^(pass|pwd|passwd|password|passphrase|[a-z_]*_password)$'
    - has:
        field: right
        any:
          - kind: identifier
            regex: '(?i)^(pass|pwd|passwd|password|passphrase|(new|plain|raw|input|given|supplied)_?pass(word)?)$'
          - all:
              - kind: member_expression
              - has:
                  field: property
                  kind: property_identifier
                  regex: '(?i)^(pass|pwd|passwd|password|passphrase|[a-z_]*_password)$'
    - any:
        - has:
            field: left
            kind: member_expression
        - has:
            field: right
            kind: member_expression
min_engine: 0.39.0
