id: password-encoder-slow-hash.php-laravel.hash-facade
practice_id: password-encoder-slow-hash
language: php
frameworks: [laravel]
kind: evidence
rule:
  all:
    - any:
        - pattern: {context: "<?php Hash::make($$$);", selector: scoped_call_expression}
        - pattern: {context: "<?php Hash::check($$$);", selector: scoped_call_expression}
        - pattern: {context: "<?php bcrypt($$$);", selector: function_call_expression}
    - not:
        has:
          field: arguments
          stopBy: end
          kind: array_element_initializer
          regex: '^[''"](rounds|cost)[''"]\s*=>\s*[0-9]$'
min_engine: 0.39.0
